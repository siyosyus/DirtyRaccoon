<!DOCTYPE html>
<html lang="tr">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
        }

        #gameContainer {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #87CEEB 0%, #98D8E8 100%);
        }

        #instructions {
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 14px;
        }

        #instructions span {
            display: inline-block;
            margin: 0 10px;
            padding: 5px 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
        }

        /* Sanal Joystick - Dokunmatik Kontrol */
        #virtualJoystick {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 150px;
            height: 150px;
            display: none;
            z-index: 10000;
        }

        #virtualJoystick.show {
            display: block;
        }

        .joystick-base {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 3px solid rgba(255,255,255,0.3);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .joystick-stick {
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(100,150,255,0.5);
            border: 3px solid rgba(255,255,255,0.7);
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.1s ease-out;
        }

        /* Etkileşim Butonu */
        #mobileActions {
            position: fixed;
            bottom: 40px;
            right: 30px;
            display: none;
            z-index: 10000;
        }

        #mobileActions.show {
            display: block;
        }

        .action-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid rgba(255,255,255,0.7);
            background: rgba(100,255,100,0.5);
            color: white;
            font-size: 32px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            transition: all 0.1s;
        }

        .action-btn:active {
            background: rgba(150,255,150,0.8);
            transform: scale(0.9);
            box-shadow: 0 3px 10px rgba(0,0,0,0.4);
        }

        /* Responsive Canvas - Letterbox Mode (Industry Best Practice) */
        @media (max-width: 900px) {
            body {
                overflow: hidden;
                /* Gökyüzü gradient - letterbox barları oyunla birleşir */
                background: linear-gradient(to bottom, #87CEEB 0%, #98D8E8 100%);
                margin: 0;
                padding: 0;
            }

            #gameContainer {
                border-radius: 0;
                box-shadow: none;
                background: transparent;
                width: 100vw;
                height: 100vh;
                position: fixed;
                top: 0;
                left: 0;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            canvas {
                /* Letterbox: Aspect ratio korunur, içerik hiç kesilmez */
                width: 100% !important;
                height: 100% !important;
                max-width: 100vw !important;
                max-height: 100vh !important;
                object-fit: contain;
            }

            #instructions {
                display: none;
            }
        }
    </style>
</head>

        function isMobileDevice() {
            return (typeof window.orientation !== "undefined") ||
                   (navigator.userAgent.indexOf('IEMobile') !== -1) ||
                   /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||

        const mobileActions = document.getElementById('mobileActions');
        const joystickStick = document.getElementById('joystickStick');

        if (isMobileDevice()) {
            virtualJoystick.classList.add('show');
            mobileActions.classList.add('show');

            document.body.style.overflow = 'hidden';
            document.body.style.position = 'fixed';
            document.body.style.width = '100%';
            document.body.style.height = '100%';
        }

        // Sanal Joystick Touch Handler
        function handleJoystickTouch(e) {
            e.preventDefault();

            const touch = e.touches[0];
            if (!touch) return;

            const rect = virtualJoystick.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            // Touch pozisyonunu merkeze göre hesapla
            let deltaX = touch.clientX - centerX;
            let deltaY = touch.clientY - centerY;

            // Maksimum yarıçapı sınırla (joystick tabanının yarıçapı)
            const maxRadius = 40;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }

            // Joystick stick'i hareket ettir
            joystickStick.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;

            // Tuş basımlarını simüle et (eşik değeri ile)
            const threshold = 15;

            keys['w'] = deltaY < -threshold;
            keys['s'] = deltaY > threshold;
            keys['a'] = deltaX < -threshold;
            keys['d'] = deltaX > threshold;
        }

        function resetJoystick() {
            joystickStick.style.transform = 'translate(-50%, -50%)';
            keys['w'] = false;
            keys['s'] = false;
            keys['a'] = false;
            keys['d'] = false;
        }

        // Joystick event listener'ları
        virtualJoystick.addEventListener('touchstart', (e) => {
            joystickActive = true;
            handleJoystickTouch(e);
        }, { passive: false });

        virtualJoystick.addEventListener('touchmove', (e) => {
            if (joystickActive) {
                handleJoystickTouch(e);
            }
        }, { passive: false });

        virtualJoystick.addEventListener('touchend', (e) => {
            e.preventDefault();
            joystickActive = false;
            resetJoystick();
        }, { passive: false });

        virtualJoystick.addEventListener('touchcancel', (e) => {
            joystickActive = false;
            resetJoystick();
        }, { passive: false });

        // Aksiyon butonları (Zıplama ve Etkileşim)
        function handleActionTouchStart(e) {
            e.preventDefault();
            e.stopPropagation();
            const key = e.currentTarget.getAttribute('data-key');
            if (key) {
                keys[key] = true;
                // E tuşu için etkileşim kontrolü
                if (key === 'e') {
                    if (typeof checkInteraction === 'function') {
                        checkInteraction();
                    }
                }
            }
        }

        function handleActionTouchEnd(e) {
            e.preventDefault();
            e.stopPropagation();
            const key = e.currentTarget.getAttribute('data-key');
            if (key) {
                keys[key] = false;
            }

        // Aksiyon butonlarına event listener ekle

            btn.addEventListener('mouseup', handleActionTouchEnd);

        let lastBuildingX = null;

        // Bina pozisyonlarını hesapla (sprite'lar yüklendikten sonra)
        function calculateBuildingPositions() {
            if (caffeNeroX !== null && dockX !== null && lastBuildingX !== null) return; // Zaten hesaplandı
            const smallBuildings = [
                'smallCandyShop', 'smallBar', 'smallFlorist', 'smallElectronicsShop',
                'smallGunShop', 'smallJewelleryShop', 'smallIceCreamShop', 'smallBank'
            ];
            
            const largeBuildings = [
                'largeBank', 'largeBar', 'largeCandyShop', 'largeElectronicsShop',
                'largeFlorist', 'largeGroceryShop', 'largeGunShop', 'largeIceCreamShop',
                'largeJewelleryShop', 'normalBlue', 'normalGreen', 'normalRed',
                'normalPurple', 'normalPink', 'normalLightBlue', 'blankShopBlack',
                'blankShopBlue', 'blankShopBrown', 'blankShopPurple', 'blankShopRed',
                'blankShopYellow', 'blankShopYellow2', 'blankShop2D', 'mutedBlue',
                'mutedBrown', 'mutedGrayscale', 'mutedGreen', 'mutedPurple'
            ];
            
            let currentX = 50;
            const minSpacing = 20;
            let smallIndex = 0;
            let largeIndex = 0;
            
            let caffeNeroFound = false;
            let largeBuildingsAfterCaffeNero = 0; // Caffè Nero'dan sonraki büyük bina sayacı
            
            for (let i = 0; i < 30; i++) {
                const patternPos = i % 3;
                let spriteKey;
                
                if (patternPos === 0 || patternPos === 1) {
                    spriteKey = smallBuildings[smallIndex % smallBuildings.length];
                    smallIndex++;
                } else {
                    spriteKey = largeBuildings[largeIndex % largeBuildings.length];
                    
                    // İlk largeBar binasını bul (Caffè Nero)
                    if (!caffeNeroFound && spriteKey === 'largeBar') {
                        const buildingSprite = sprites.buildings[spriteKey];
                        const buildingWidth = (buildingSprite && buildingSprite.complete) ? buildingSprite.width : 180;
                        caffeNeroX = currentX;
                        caffeNeroWidth = buildingWidth;
                        caffeNeroFound = true;
                    }
                    
                    // Caffè Nero bulunduktan sonra, 2. büyük binadan sonra iskeleyi yerleştir
                    if (caffeNeroFound && spriteKey !== 'largeBar') {
                        largeBuildingsAfterCaffeNero++;
                        if (largeBuildingsAfterCaffeNero === 2) {
                            // 2. büyük bina bulundu, bu binadan sonra iskele olacak
                            const buildingSprite = sprites.buildings[spriteKey];
                            const buildingWidth = (buildingSprite && buildingSprite.complete) ? buildingSprite.width : 180;
                            dockX = currentX + buildingWidth + minSpacing;
                        }
                    }
                    
                    largeIndex++;
                }
                
                const buildingSprite = sprites.buildings[spriteKey];
                const buildingWidth = (buildingSprite && buildingSprite.complete) ? buildingSprite.width : 180;
                currentX += buildingWidth + minSpacing;
            }
        }


        // Dialog system
        let dialog = {
            isOpen: false,
            text: '',
            answers: [],
            currentObject: null,
            isHedgehogDialog: false, // Kirpi konuşması mı?
            step: 0 // Otel diyalogu için adım sayacı
        };


        // Check if player is near an interactive object
        function checkInteraction() {
            if (dialog.isOpen) {

            const playerCenterX = player.x + player.width / 2;

            // Check Caffè Nero binası etkileşimi (öncelikli)

            if (caffeNeroX === null && game.sceneState === 'gameplay') {
                calculateBuildingPositions();

            // Check Caffè Nero binası etkileşimi (E tuşu ile)

                    // Bina başlangıç ve bitiş pozisyonu kontrolü
                    const buildingStartX = caffeNeroX;
                    const buildingEndX = caffeNeroX + caffeNeroWidth;
                    const isNearBuilding = (playerCenterX >= buildingStartX - 100 && playerCenterX <= buildingEndX + 100);
                    const playerOnGround = player.y + player.height >= buildingY - 10;
                    
                    // Eğer oyuncu binanın yakınındaysa ve E tuşuna basıldıysa diyalog aç
                    // Not: E tuşu kontrolü keydown event handler'da yapılıyor, burada sadece pozisyon kontrolü
                    if (isNearBuilding && playerOnGround && (keys['e'] || keys['E'])) {
                        openCaffeNeroDialog();
                return;
                    }

            // Check İskele etkileşimi (E tuşu ile)
            // İskele pozisyonunu hesapla (eğer henüz hesaplanmadıysa)
            if (dockX === null && game.sceneState === 'gameplay') {
                calculateBuildingPositions();
            }
            
            if (dockX !== null && game.sceneState === 'gameplay') {
                // Eğer diyalog daha önce açıldıysa tekrar açma
                if (game.dockDialogShown) {
                    return;
                }

                // İskele merkezi ve pozisyonu
                const dockCenterX = dockX + dockWidth / 2;
                const dockY = GROUND_LEVEL; // Ground level
                
                // İskele başlangıcı ve bitişi kontrolü
                const dockStartX = dockX;
                const dockEndX = dockX + dockWidth;
                
                // Rakun iskelenin önünde veya üzerinde mi? (daha geniş kontrol)
                const isNearDock = (playerCenterX >= dockStartX - 150 && playerCenterX <= dockEndX + 150);
                const playerOnGround = player.y + player.height >= dockY - 10;
                
                // Eğer oyuncu iskelenin yakınındaysa ve E tuşuna basıldıysa diyalog aç
                if (isNearDock && playerOnGround && (keys['e'] || keys['E'])) {
                    openDockDialog();
                    return;
                }
            }

            // Otel etkileşimi (onIsland sahnesi)
            if (game.sceneState === 'onIsland' && !game.innEntered) {
                const islandXWorld = canvas.width / 2;
                
                // Evlerin sırası: home1, home2, home1, home2, hotel, home1
                // Hotel pozisyonunu hesapla (5. sırada)
                let hotelWorldX = islandXWorld - 400; // İlk ev pozisyonu (drawOnIsland ile aynı)
                const houseSpacing = 40; // Evler arası boşluk (azaltıldı)
                
                // İlk 4 evin genişliklerini topla (home1, home2, home1, home2) - 1.35x scale ile
                const houseScale = 1.35; // Evlerin boyut çarpanı
                if (sprites.island.home1 && sprites.island.home1.complete && 
                    sprites.island.home2 && sprites.island.home2.complete) {
                    const home1Width = sprites.island.home1.width * houseScale;
                    const home2Width = sprites.island.home2.width * houseScale;
                    // 2 tane home1 + 2 tane home2 + 3 boşluk (evler arası)
                    hotelWorldX += (home1Width + houseSpacing) + (home2Width + houseSpacing) + 
                                    (home1Width + houseSpacing) + (home2Width + houseSpacing);
                } else {
                    // Fallback: Eğer sprite'lar yüklenmediyse tahmin et
                    hotelWorldX += (100 * houseScale + houseSpacing) * 4; // Her ev için 100px genişlik varsay (scale ile)
                }
                
                // Hotel genişliği (1.35x scale ile)
                let hotelWidth = 96 * houseScale; // Varsayılan
                if (sprites.island.hotel && sprites.island.hotel.complete) {
                    hotelWidth = sprites.island.hotel.width * houseScale;
                }
                
                const hotelCenterX = hotelWorldX + hotelWidth / 2;
                const distanceToHotel = Math.abs(playerCenterX - hotelCenterX);
                
                // Rakun otelin önünde mi ve E tuşuna basıldı mı?
                if (distanceToHotel < 100 && playerCenterX >= hotelWorldX - 20 && playerCenterX <= hotelWorldX + hotelWidth + 20) {
                    // Diyalog aç
                    openHotelDialog();
                    return;
                }
            }
            
            // İskele etkileşimi (onIsland sahnesi) - Ada'dan geri dönüş
            if (game.sceneState === 'onIsland' && game.innEntered) {
                // onIsland sahnesindeki iskele pozisyonunu hesapla
                const islandXWorld = canvas.width / 2;
                const houseStartX = islandXWorld - 400;
                const houseSpacing = 40;
                const houseScale = 1.35;
                
                // Tüm evlerin toplam genişliğini hesapla
                const housesPattern = [
                    { sprite: sprites.island.home1, name: 'home1' },
                    { sprite: sprites.island.home2, name: 'home2' },
                    { sprite: sprites.island.home1, name: 'home1' },
                    { sprite: sprites.island.home2, name: 'home2' },
                    { sprite: sprites.island.hotel, name: 'hotel' },
                    { sprite: sprites.island.home1, name: 'home1' }
                ];
                
                let totalHousesWidth = 0;
                for (let i = 0; i < housesPattern.length; i++) {
                    const house = housesPattern[i];
                    if (house.sprite && house.sprite.complete) {
                        const houseWidth = house.sprite.width * houseScale;
                        totalHousesWidth += houseWidth;
                        if (i < housesPattern.length - 1) {
                            totalHousesWidth += houseSpacing;
                        }
                    }
                }
                
                const lastHouseRight = houseStartX + totalHousesWidth;
                const islandDockX = lastHouseRight + 100; // İskele başlangıcı
                const islandDockWidth = 180;
                const islandDockY = GROUND_LEVEL;
                
                // İskele başlangıcı ve bitişi kontrolü
                const dockStartX = islandDockX;
                const dockEndX = islandDockX + islandDockWidth;
                
                // Rakun iskelenin önünde veya üzerinde mi? (daha geniş kontrol)
                const isNearDock = (playerCenterX >= dockStartX - 150 && playerCenterX <= dockEndX + 150);
                const playerOnGround = player.y + player.height >= islandDockY - 10;
                
                // Eğer oyuncu iskelenin yakınındaysa ve E tuşuna basıldıysa diyalog aç
                if (isNearDock && playerOnGround && (keys['e'] || keys['E'])) {
                    openIslandDockDialog();
                    return;
                }
            }

            // Araba etkileşimi (returningHome sahnesi)
            if (game.sceneState === 'returningHome' && !game.carEntered) {
                // İskele pozisyonu hesapla (drawReturningHome ile aynı mantık)
                const returningDockX = 0;
                const returningDockWidth = 180;
                const dockStartX = returningDockX + returningDockWidth + 135; // İskele başlangıcı (15px sola kaydırıldı)
                const dockWidth = 180;
                
                // Sağdan 2. bacağın x koordinatını hesapla (yol başlangıcı)
                const poleCount = 6;
                const poleSpacing = dockWidth / (poleCount - 1);
                const rightSecondPoleX = dockStartX + (4 * poleSpacing); // Sağdan 2. baca (index 4)
                
                // Evlerin pozisyonunu hesapla
                const housesPattern = [
                    { sprite: sprites.island.home1, name: 'home1' },
                    { sprite: sprites.island.home2, name: 'home2' },
                    { sprite: sprites.island.home1, name: 'home1' },
                    { sprite: sprites.island.home2, name: 'home2' },
                    { sprite: sprites.island.hotel, name: 'hotel' },
                    { sprite: sprites.island.home1, name: 'home1' }
                ];
                const houseStartX = rightSecondPoleX + 50 + 100; // İskelenin sonundan 150px sonra
                const houseSpacing = 40;
                const houseScale = 1.35;
                
                // Hotel pozisyonunu bul (5. sırada - index 4)
                let hotelWorldX = null;
                let hotelWidth = 96 * houseScale; // Varsayılan
                let currentHouseX = houseStartX;
                for (let i = 0; i < housesPattern.length; i++) {
                    const house = housesPattern[i];
                    if (house.sprite && house.sprite.complete) {
                        const houseWidth = house.sprite.width * houseScale;
                        
                        // Hotel pozisyonunu kaydet (5. ev - index 4)
                        if (i === 4 && house.name === 'hotel') {
                            hotelWorldX = currentHouseX;
                            hotelWidth = houseWidth;
                    break;
                }
                        
                        // Bir sonraki ev pozisyonu
                        currentHouseX += houseWidth + houseSpacing;
                    }

                // Eğer hotel pozisyonu hesaplanamadıysa, fallback kullan
                if (hotelWorldX === null) {
                    hotelWorldX = houseStartX;
                    // İlk 4 evin genişliklerini topla
                    if (sprites.island.home1 && sprites.island.home1.complete && 
                        sprites.island.home2 && sprites.island.home2.complete) {
                        const home1Width = sprites.island.home1.width * houseScale;
                        const home2Width = sprites.island.home2.width * houseScale;
                        hotelWorldX += (home1Width + houseSpacing) + (home2Width + houseSpacing) + 
                                        (home1Width + houseSpacing) + (home2Width + houseSpacing);
                    }
                }
                
                // homeX = hotel pozisyonu (oyuncunun evi)
                if (hotelWorldX !== null) {
                    homeX = hotelWorldX; // Hotel oyuncunun evi
                }
                
                // Araba pozisyonunu hesapla (hotel önünde)
                if (carX === null && hotelWorldX !== null) {
                    carX = hotelWorldX + (hotelWidth / 2) - 80; // Arabanın genişliği 160px, merkezden 80px sola
                }
                
                // Eğer carX veya homeX hala null ise, etkileşim yapma
                if (carX === null || homeX === null) {
                    return;
                }
                
                const playerCenterX = player.x + player.width / 2;
                const carCenterX = carX + 80; // Arabanın merkezi (160px genişlik için 80px)
                const distanceToCar = Math.abs(playerCenterX - carCenterX);
                
                // Karakterler eve (hotel) vardı mı kontrol et
                const distanceToHome = Math.abs(playerCenterX - homeX);
                const isNearCar = distanceToCar < 120;
                const isAtHome = distanceToHome < 150;
                const playerOnGround = player.y + player.height >= GROUND_LEVEL - 10;
                
                // Eğer oyuncu eve vardıysa ve arabaya yakınsa ve E tuşuna basıldıysa
                if (isAtHome && isNearCar && playerOnGround && (keys['e'] || keys['E'])) {
                    openCarDialog();
                    return;
                }

            // Datça Hotel etkileşimi (datca sahnesi)
            if (game.sceneState === 'datca' && !game.datcaHotelEntered) {
                const datcaXWorld = canvas.width / 2;

                let hotelX = houseStartX;
                hotelX += 150 * houseScale + houseSpacing; // home1
                hotelX += 196 * houseScale + houseSpacing; // home2
                hotelX += 150 * houseScale + houseSpacing; // home1
                hotelX += 196 * houseScale + houseSpacing; // home2

                const hotelWidth = 204 * houseScale;
                const hotelCenterX = hotelX + hotelWidth / 2;
                const distanceToHotel = Math.abs(playerCenterX - hotelCenterX);

                // Rakun hotel'e yakınsa diyalog aç
                if (distanceToHotel < 150 && playerCenterX >= hotelX - 50 && playerCenterX <= hotelX + hotelWidth + 50) {
                    openDatcaHotelDialog();
                    return;
                }
            }

            // Datça Son Ev etkileşimi (datca sahnesi - rakı balık yeri)
            if (game.sceneState === 'datca' && game.datcaHotelEntered && !game.datcaLastHouseEntered) {
                const datcaXWorld = canvas.width / 2;
                const houseStartX = datcaXWorld - 400;
                const houseSpacing = 40;
                const houseScale = 1.35;

                // Son evin pozisyonunu hesapla (11. ev - son home2)
                let lastHouseX = houseStartX;
                lastHouseX += 150 * houseScale + houseSpacing; // home1
                lastHouseX += 196 * houseScale + houseSpacing; // home2
                lastHouseX += 150 * houseScale + houseSpacing; // home1
                lastHouseX += 196 * houseScale + houseSpacing; // home2
                lastHouseX += 204 * houseScale + houseSpacing; // hotel
                lastHouseX += 150 * houseScale + houseSpacing; // home1
                lastHouseX += 196 * houseScale + houseSpacing; // home2
                lastHouseX += 150 * houseScale + houseSpacing; // home1
                lastHouseX += 196 * houseScale + houseSpacing; // home2
                lastHouseX += 150 * houseScale + houseSpacing; // home1
                // Son ev: home2

                const lastHouseWidth = 196 * houseScale;
                const lastHouseCenterX = lastHouseX + lastHouseWidth / 2;
                const distanceToLastHouse = Math.abs(playerCenterX - lastHouseCenterX);

                // Rakun son eve yakınsa diyalog aç
                if (distanceToLastHouse < 150 && playerCenterX >= lastHouseX - 50 && playerCenterX <= lastHouseX + lastHouseWidth + 50) {
                    openDatcaLastHouseDialog();
                    return;
                }
            }

            // Kirpi etkileşimi E tuşu ile kaldırıldı - sadece opening sahnesinde otomatik açılıyor
            // (E tuşu ile kirpi'ye yaklaşınca diyalog açılmıyor)
        }

        function openHotelDialog() {

        // Metin sarma yardımcı fonksiyonu
        function wrapText(text, maxWidth, font) {
            const words = text.split(' ');
            const lines = [];
            let currentLine = words[0];

            ctx.font = font;
            
            for (let i = 1; i < words.length; i++) {
                const word = words[i];
                const width = ctx.measureText(currentLine + ' ' + word).width;
                if (width < maxWidth) {
                    currentLine += ' ' + word;
                } else {
                    lines.push(currentLine);
                    currentLine = word;
                }
            }
            lines.push(currentLine);
            return lines;
        }

        // Add mouse click for answers and start button

            if (displayAspect > canvasAspect) {

                renderWidth = renderHeight * canvasAspect;
                offsetX = (displayWidth - renderWidth) / 2;
                offsetY = 0;

                // Üst/altta letterbox

                renderHeight = renderWidth / canvasAspect;
                offsetX = 0;
                offsetY = (displayHeight - renderHeight) / 2;

        // Touch event desteği - Mobil cihazlar için (tüm canvas tıklamalarına)
        function handleCanvasTouch(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();

            // Touch koordinatlarını al (ilk touch point)
            const touch = e.touches[0] || e.changedTouches[0];
            if (!touch) return;

            // object-fit: contain - Letterbox mode (aspect ratio korunur)
            const canvasWidth = canvas.width; // 800
            const canvasHeight = canvas.height; // 600
            const canvasAspect = canvasWidth / canvasHeight; // 4:3

            const displayWidth = rect.width;
            const displayHeight = rect.height;
            const displayAspect = displayWidth / displayHeight;

            let renderWidth, renderHeight, offsetX, offsetY;

            // Letterbox hesaplaması
            if (displayAspect > canvasAspect) {
                // Ekran daha geniş - yanlarda letterbox
                renderHeight = displayHeight;
                renderWidth = renderHeight * canvasAspect;
                offsetX = (displayWidth - renderWidth) / 2;
                offsetY = 0;
            } else {
                // Ekran daha dar - üst/altta letterbox
                renderWidth = displayWidth;
                renderHeight = renderWidth / canvasAspect;
                offsetX = 0;
                offsetY = (displayHeight - renderHeight) / 2;
            }

            // Touch pozisyonunu letterbox offset'i ile düzelt
            const touchX = touch.clientX - rect.left - offsetX;
            const touchY = touch.clientY - rect.top - offsetY;

            // Canvas koordinatlarına çevir
            const mouseX = (touchX / renderWidth) * canvasWidth;
            const mouseY = (touchY / renderHeight) * canvasHeight;

            // DEBUG: Koordinatları konsola yazdır

                letterbox: { offsetX, offsetY, renderWidth, renderHeight },
                adjusted: { touchX, touchY },

            });

            // Check start button (intro screen)
            if (game.state === 'intro' && game.startButton) {

                    mouseY > btn.y && mouseY < btn.y + btn.height) {

            // Check dialog answers

            const maxTextWidth = dialogWidth - (textPadding * 2);

        // Update player
        function updatePlayer() {
            // Datça sahnesinde arabaya doğru yürüme kontrolü
            if (game.sceneState === 'datca' && game.datcaCharactersMovingToCar && game.playerTargetX !== null && !game.datcaCharactersInCar) {
                const distanceToTarget = Math.abs(player.x - game.playerTargetX);

                if (distanceToTarget > 5) {
                    // Hedefe doğru yürü
                    if (player.x < game.playerTargetX) {
                        player.velocityX = player.speed;
                        player.facingDirection = 1; // Sağa bakıyor
                    } else {
                        player.velocityX = -player.speed;
                        player.facingDirection = -1; // Sola bakıyor
                    }
                    // Arabaya varma kontrolü game loop'ta yapılıyor
                } else {
                    // Hedefe ulaşıldı, dur
                    player.x = game.playerTargetX;
                    player.velocityX = 0;
                    // Arabaya varma kontrolü game loop'ta yapılıyor
                }
                
                // Jumping ve gravity kontrolleri devam edecek ama normal hareket kontrolü atlanacak
                // (Aşağıdaki else bloğu atlanır, ama jumping/gravity devam eder)
            } else {
                // Normal hareket kontrolü
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                    player.facingDirection = -1; // Sola bakıyor
                player.velocityX = -player.speed;
            } else if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                    player.facingDirection = 1; // Sağa bakıyor
                player.velocityX = player.speed;
            } else {
                player.velocityX *= game.friction;
                }
            }

            // Jumping
            if ((keys[' '] || keys['ArrowUp'] || keys['w'] || keys['W']) && player.isOnGround) {
                player.velocityY = -player.jumpPower;
                player.isOnGround = false;
            }

            // Apply gravity
            player.velocityY += game.gravity;

                        hedgehog.x += hedgehog.speed;
