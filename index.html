                ctx.moveTo(carScreenX + radius, carScreenY);
                ctx.lineTo(carScreenX + carWidth - radius, carScreenY);
                ctx.quadraticCurveTo(carScreenX + carWidth, carScreenY, carScreenX + carWidth, carScreenY + radius);
                ctx.lineTo(carScreenX + carWidth, carScreenY + carHeight - radius);
                ctx.quadraticCurveTo(carScreenX + carWidth, carScreenY + carHeight, carScreenX + carWidth - radius, carScreenY + carHeight);
                ctx.lineTo(carScreenX + radius, carScreenY + carHeight);
                ctx.quadraticCurveTo(carScreenX, carScreenY + carHeight, carScreenX, carScreenY + carHeight - radius);
                ctx.lineTo(carScreenX, carScreenY + radius);
                ctx.quadraticCurveTo(carScreenX, carScreenY, carScreenX + radius, carScreenY);
                ctx.closePath();
                ctx.fill();
                
                // Araba gölgesi (alt kısım)
                ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
                ctx.fillRect(carScreenX + 3, carScreenY + carHeight - 3, carWidth - 6, 6);
                
                // Araba üst highlight (parlaklık efekti)
                const highlightGradient = ctx.createLinearGradient(carScreenX, carScreenY, carScreenX, carScreenY + 15);
                highlightGradient.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
                highlightGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = highlightGradient;
                ctx.fillRect(carScreenX, carScreenY, carWidth, 15);
                
                // Ön cam (sol - mavi gradient)
                const windowGradient = ctx.createLinearGradient(carScreenX + 20, carScreenY + 10, carScreenX + 20, carScreenY + 28);
                windowGradient.addColorStop(0, '#B8E6FF');
                windowGradient.addColorStop(1, '#7FB8D9');
                ctx.fillStyle = windowGradient;
                ctx.fillRect(carScreenX + 20, carScreenY + 10, 38, 22);
                
                // Arka cam (sağ - mavi gradient)
                ctx.fillStyle = windowGradient;
                ctx.fillRect(carScreenX + 102, carScreenY + 10, 38, 22);
                
                // Cam çerçeveleri (koyu gri, kalın)
                ctx.strokeStyle = '#333333';
                ctx.lineWidth = 3;
                ctx.strokeRect(carScreenX + 20, carScreenY + 10, 38, 22);
                ctx.strokeRect(carScreenX + 102, carScreenY + 10, 38, 22);
                
                // Cam içinde çapraz çizgi (cam yansıması)
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(carScreenX + 25, carScreenY + 15);
                ctx.lineTo(carScreenX + 52, carScreenY + 28);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(carScreenX + 107, carScreenY + 15);
                ctx.lineTo(carScreenX + 134, carScreenY + 28);
                ctx.stroke();
                
                // Araba kapı çizgisi (orta - ince)
                ctx.strokeStyle = '#D0D0D0';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(carScreenX + 80, carScreenY + 10);
                ctx.lineTo(carScreenX + 80, carScreenY + carHeight - 5);
                ctx.stroke();
                
                // Ön farlar (beyaz, yuvarlak)
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.arc(carScreenX + 12, carScreenY + 18, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#CCCCCC';
                ctx.lineWidth = 1;
                ctx.stroke();
                
                // Arka lambalar (kırmızı)
                ctx.fillStyle = '#CC0000';
                ctx.beginPath();
                ctx.arc(carScreenX + carWidth - 12, carScreenY + 18, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#990000';
                ctx.lineWidth = 1;
                ctx.stroke();
                
                // Modern alaşım jantlar (ön)
                ctx.fillStyle = '#2C2C2C';
                ctx.beginPath();
                ctx.arc(carScreenX + 38, carScreenY + carHeight + 5, 16, 0, Math.PI * 2);
                ctx.fill();
                // Jant merkezi (gri, yıldız deseni)
                ctx.fillStyle = '#5A5A5A';
                ctx.beginPath();
                ctx.arc(carScreenX + 38, carScreenY + carHeight + 5, 10, 0, Math.PI * 2);
                ctx.fill();
                // Jant çubukları (5 adet)
                ctx.fillStyle = '#777777';
                for (let i = 0; i < 5; i++) {
                    const angle = (i * Math.PI * 2 / 5) - Math.PI / 2;
                    const x1 = carScreenX + 38 + Math.cos(angle) * 8;
                    const y1 = carScreenY + carHeight + 5 + Math.sin(angle) * 8;
                    const x2 = carScreenX + 38 + Math.cos(angle) * 13;
                    const y2 = carScreenY + carHeight + 5 + Math.sin(angle) * 13;
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#777777';
                    ctx.stroke();
                }
                // Jant merkez noktası
                ctx.fillStyle = '#999999';
                ctx.beginPath();
                ctx.arc(carScreenX + 38, carScreenY + carHeight + 5, 3, 0, Math.PI * 2);
                ctx.fill();
                
                // Modern alaşım jantlar (arka)
                ctx.fillStyle = '#2C2C2C';
                ctx.beginPath();
                ctx.arc(carScreenX + 122, carScreenY + carHeight + 5, 16, 0, Math.PI * 2);
                ctx.fill();
                // Jant merkezi (gri, yıldız deseni)
                ctx.fillStyle = '#5A5A5A';
                ctx.beginPath();
                ctx.arc(carScreenX + 122, carScreenY + carHeight + 5, 10, 0, Math.PI * 2);
                ctx.fill();
                // Jant çubukları (5 adet)
                ctx.fillStyle = '#777777';
                for (let i = 0; i < 5; i++) {
                    const angle = (i * Math.PI * 2 / 5) - Math.PI / 2;
                    const x1 = carScreenX + 122 + Math.cos(angle) * 8;
                    const y1 = carScreenY + carHeight + 5 + Math.sin(angle) * 8;
                    const x2 = carScreenX + 122 + Math.cos(angle) * 13;
                    const y2 = carScreenY + carHeight + 5 + Math.sin(angle) * 13;
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#777777';
                    ctx.stroke();
                }
                // Jant merkez noktası
                ctx.fillStyle = '#999999';
                ctx.beginPath();
                ctx.arc(carScreenX + 122, carScreenY + carHeight + 5, 3, 0, Math.PI * 2);
                ctx.fill();
                
                // Araba kenarlığı (ince, yumuşak)
                ctx.strokeStyle = '#E0E0E0';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(carScreenX + radius, carScreenY);
                ctx.lineTo(carScreenX + carWidth - radius, carScreenY);
                ctx.quadraticCurveTo(carScreenX + carWidth, carScreenY, carScreenX + carWidth, carScreenY + radius);
                ctx.lineTo(carScreenX + carWidth, carScreenY + carHeight - radius);
                ctx.quadraticCurveTo(carScreenX + carWidth, carScreenY + carHeight, carScreenX + carWidth - radius, carScreenY + carHeight);
                ctx.lineTo(carScreenX + radius, carScreenY + carHeight);
                ctx.quadraticCurveTo(carScreenX, carScreenY + carHeight, carScreenX, carScreenY + carHeight - radius);
                ctx.lineTo(carScreenX, carScreenY + radius);
                ctx.quadraticCurveTo(carScreenX, carScreenY, carScreenX + radius, carScreenY);
                ctx.closePath();
                ctx.stroke();
                
                // Araba alt gölge (derinlik)
                ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                ctx.fillRect(carScreenX, carScreenY + carHeight + 10, carWidth, 4);
                
                // "E" etkileşim sembolü (eğer oyuncu arabaya yakınsa) - checkInteraction ile aynı mantık
                if (!dialog.isOpen && !game.carEntered) {
                    // carX ve homeX hesaplaması (drawReturningHome ile aynı mantık)
                    const returningDockX = 0;
                    const returningDockWidth = 180;
                    const dockStartX = returningDockX + returningDockWidth + 135;
                    const dockWidth = 180;
                    const poleCount = 6;
                    const poleSpacing = dockWidth / (poleCount - 1);
                    const rightSecondPoleX = dockStartX + (4 * poleSpacing);
                    const houseStartX = rightSecondPoleX + 50 + 100;
                    const houseSpacing = 40;
                    const houseScale = 1.35;
                    
                    const housesPattern = [
                        { sprite: sprites.island.home1, name: 'home1' },
                        { sprite: sprites.island.home2, name: 'home2' },
                        { sprite: sprites.island.home1, name: 'home1' },
                        { sprite: sprites.island.home2, name: 'home2' },
                        { sprite: sprites.island.hotel, name: 'hotel' },
                        { sprite: sprites.island.home1, name: 'home1' }
                    ];
                    
                    // Hotel pozisyonunu bul
                    let hotelWorldXLocal = null;
                    let hotelWidthLocal = 96 * houseScale;
                    let currentHouseX = houseStartX;
                    for (let i = 0; i < housesPattern.length; i++) {
                        const house = housesPattern[i];
                        if (house.sprite && house.sprite.complete) {
                            const houseWidth = house.sprite.width * houseScale;
                            if (i === 4 && house.name === 'hotel') {
                                hotelWorldXLocal = currentHouseX;
                                hotelWidthLocal = houseWidth;
                                break;
                            }
                            currentHouseX += houseWidth + houseSpacing;
                        }
                    }
                    
                    // Eğer hotel bulunamadıysa fallback
                    if (hotelWorldXLocal === null && sprites.island.home1 && sprites.island.home1.complete && 
                        sprites.island.home2 && sprites.island.home2.complete) {
                        const home1Width = sprites.island.home1.width * houseScale;
                        const home2Width = sprites.island.home2.width * houseScale;
                        hotelWorldXLocal = houseStartX + (home1Width + houseSpacing) + (home2Width + houseSpacing) + 
                                          (home1Width + houseSpacing) + (home2Width + houseSpacing);
                    }
                    
                    // Araba pozisyonunu hesapla
                    let carXLocal = null;
                    if (hotelWorldXLocal !== null) {
                        carXLocal = hotelWorldXLocal + (hotelWidthLocal / 2) - 80;
                    }
                    
                    if (hotelWorldXLocal !== null && carXLocal !== null) {
                        const playerCenterX = player.x + player.width / 2;
                        const carCenterX = carXLocal + 80;
                        const distanceToCar = Math.abs(playerCenterX - carCenterX);
                        const distanceToHome = Math.abs(playerCenterX - hotelWorldXLocal);
                        const isNearCar = distanceToCar < 120;
                        const isAtHome = distanceToHome < 150;
                        const playerOnGround = player.y + player.height >= GROUND_LEVEL - 10;
                        
                        if (isAtHome && isNearCar && playerOnGround) {
                            // Hotel yüksekliğini hesapla
                            const houseScale = 1.35;
                            let hotelHeight = 96 * houseScale;
                            if (sprites.island.hotel && sprites.island.hotel.complete) {
                                hotelHeight = sprites.island.hotel.height * houseScale;
                            }
                            
                            // Hotel'in ekran pozisyonunu hesapla
                            const hotelScreenY = GROUND_LEVEL - camera.y - hotelHeight + 15; // Hotel'in üst kenarı (verticalOffset = 15)
                            
                            // "E" sembolünü evin yüksekliğinde +20px'de göster
                            const eSymbolY = hotelScreenY - 20; // Evin üstünde 20px yukarıda
                            const eSymbolX = carCenterX - camera.x; // Arabanın merkezi hizasında

                    ctx.fillStyle = 'white';
                    ctx.strokeStyle = 'black';
                    ctx.lineWidth = 3;
                    ctx.font = 'bold 20px Arial';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.strokeText('E', eSymbolX, eSymbolY);
                            ctx.fillText('E', eSymbolX, eSymbolY);
                            ctx.textAlign = 'left';
                            ctx.textBaseline = 'alphabetic';
                        }
                    }
                }
            }
        }

        // Draw island scene (Ada sahnesi)
        function drawIsland() {
            // Deniz - tüm ekranı kaplayan
            ctx.fillStyle = '#4169E1'; // Deniz mavisi
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Deniz dalga efekti
            ctx.strokeStyle = '#5B9BD5';
            ctx.lineWidth = 2;
            const waveCount = Math.floor(canvas.height / 15);
            for (let i = 0; i < waveCount; i++) {
                const waveY = i * 15;
                ctx.beginPath();
                ctx.moveTo(0, waveY);
                for (let x = 0; x < canvas.width; x += 30) {
                    ctx.lineTo(x, waveY + Math.sin(x / 20) * 4);
                }
                ctx.stroke();
            }
            
            // İskele (sol alt köşe)
            const dockX = 2;
            const dockY = canvas.height - 50;
            const dockWidth = 120;
            const dockHeight = 25;
            
            // İskele platformu (su üstünde)
            ctx.fillStyle = '#8B4513'; // Kahverengi ahşap
            ctx.fillRect(dockX, dockY, dockWidth, dockHeight);
            
            // İskele kenarlığı
            ctx.strokeStyle = '#654321';
            ctx.lineWidth = 2;
            ctx.strokeRect(dockX, dockY, dockWidth, dockHeight);
            
            // İskele kazıkları (dikey çubuklar)
            ctx.fillStyle = '#654321';
            const poleCount = 4;
            for (let i = 0; i < poleCount; i++) {
                const poleX = dockX + (i * dockWidth / (poleCount - 1));
                const poleY = dockY + dockHeight;
                ctx.fillRect(poleX - 3, poleY, 6, 40);
            }
            
            // Ada - sağ üst köşede
            const islandX = canvas.width - 210; // Sağ tarafa yakın
            const islandY = 150; // Üst tarafa yakın
            const islandRadius = 200; // Ada yarıçapı

            
            // Ada ana gövdesi (yuvarlak, yeşil)
            ctx.fillStyle = '#228B22'; // Orman yeşili
            ctx.beginPath();
            ctx.ellipse(islandX, islandY, islandRadius, islandRadius * 0.6, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Ada kenar çizgisi
            ctx.strokeStyle = '#1F7A1F';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(islandX, islandY, islandRadius, islandRadius * 0.6, 0, 0, Math.PI * 2);
            ctx.stroke();
            
            // Ada iç detayları (kumsal şeridi)
            ctx.fillStyle = '#F4A460'; // Kum rengi
            ctx.beginPath();
            ctx.ellipse(islandX, islandY + islandRadius * 0.3, islandRadius * 0.75, islandRadius * 0.15, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Ada üzerinde ağaçlar (basit çizim) - sabit pozisyonlar
            const treePositions = [
                { x: -120, y: -40 },
                { x: -60, y: -60 },
                { x: 0, y: -50 },
                { x: 60, y: -55 },
                { x: 120, y: -45 }
            ];
            
            for (let i = 0; i < treePositions.length; i++) {
                const treeX = islandX + treePositions[i].x;
                const treeY = islandY + treePositions[i].y;
                
                // Ağaç gövdesi
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(treeX - 8, treeY, 16, 40);
                
                // Ağaç yaprakları (yuvarlak)
                ctx.fillStyle = '#2D5016';
                ctx.beginPath();
                ctx.arc(treeX, treeY - 10, 25, 0, Math.PI * 2);
                ctx.fill();
                
                // Ağaç yaprakları highlight
                ctx.fillStyle = '#3A6B1F';
                ctx.beginPath();
                ctx.arc(treeX - 8, treeY - 15, 15, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Ada üzerinde ev (sağ üst, ada'nın sağ tarafında)
            const houseX = islandX - 40;
            const houseY = islandY + 50;
            
            // Ev gövdesi
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(houseX - 20, houseY, 40, 30);
            
            // Ev çatısı (kırmızı)
            ctx.fillStyle = '#CC0000';
            ctx.beginPath();
            ctx.moveTo(houseX - 30, houseY);
            ctx.lineTo(houseX, houseY - 20);
            ctx.lineTo(houseX + 30, houseY);
            ctx.closePath();
            ctx.fill();
            
            // Ev kapısı
            ctx.fillStyle = '#654321';
            ctx.fillRect(houseX - 5, houseY + 15, 10, 15);
            
            // Ev penceresi
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(houseX - 18, houseY + 5, 8, 8);
            ctx.fillRect(houseX + 10, houseY + 5, 8, 8);
            
            // İkinci ev (ada üzerinde)
            const house2X = islandX + 40;
            const house2Y = islandY + 50;
            
            // İkinci ev gövdesi
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(house2X - 20, house2Y, 40, 30);
            
            // İkinci ev çatısı (kırmızı)
            ctx.fillStyle = '#CC0000';
            ctx.beginPath();
            ctx.moveTo(house2X - 30, house2Y);
            ctx.lineTo(house2X, house2Y - 20);
            ctx.lineTo(house2X + 30, house2Y);
            ctx.closePath();
            ctx.fill();
            
            // İkinci ev kapısı
            ctx.fillStyle = '#654321';
            ctx.fillRect(house2X - 5, house2Y + 15, 10, 15);
            
            // İkinci ev penceresi
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(house2X - 18, house2Y + 5, 8, 8);
            ctx.fillRect(house2X + 10, house2Y + 5, 8, 8);
            
            // Tekne çiz
            drawBoat();
        }
