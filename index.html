<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rakun ve Kirpi - Platformer Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        #gameContainer {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #87CEEB 0%, #98D8E8 100%);
        }

        #instructions {
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 14px;
        }

        #instructions span {
            display: inline-block;
            margin: 0 10px;
            padding: 5px 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="instructions">
            <span>W,A,S,D Hareket</span>
            <span>SPACE Zıpla</span>
            <span>E Etkileşim</span>
        </div>
    </div>

    <script>

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Load sprites

                walk: [],

                frameDelay: 0,
                frameSpeed: 4

                frameSpeed: 20,  // Daha yavaş animasyon için artırıldı (8'den 16'ya)
                idleFrameCount: 2,  // idle.png sprite sheet'teki frame sayısı (4'e değiştirildi)
                moveFrameCount: 6   // move.png sprite sheet'teki frame sayısı
            }
        };

        // Load Raccoon idle sprites (11 frames)
        for (let i = 1; i <= 11; i++) {
            const img = new Image();
            const frameNum = String(i * 2 - 1).padStart(4, '0');
            img.src = `raccoon/idle/${frameNum}.png`;
            sprites.raccoon.idle.push(img);
        }

        // Load Raccoon walk sprites (11 frames)
        for (let i = 1; i <= 11; i++) {
            const img = new Image();
            const frameNum = String(i * 2 - 1).padStart(4, '0');
            img.src = `raccoon/walk/walk${frameNum}.png`;
            sprites.raccoon.walk.push(img);
        }

        raccoonJump.src = 'raccoon/jump/jump0001.png';
        sprites.raccoon.jump.push(raccoonJump);

        const hedgehogIdle = new Image();

        sprites.hedgehog.idle.push(hedgehogIdle);

        // Load Hedgehog move animation (sprite sheet)

        sprites.hedgehog.move.push(hedgehogMove);

        sprites.buildings.smallBank.src = 'buildings/Themed shops/Small/Bank.png';

        sprites.buildings.smallJewelleryShop.src = 'buildings/Themed shops/Small/Jewellery shop.png';
        
        // Sprite yükleme hatalarını yakala
        Object.keys(sprites.buildings).forEach(key => {
            sprites.buildings[key].onerror = function() {
                console.error(`Bina sprite yüklenemedi: ${key}`);
            };
        });

        // Animation update
        function updateAnimation(sprite) {
            sprite.frameDelay++;
            if (sprite.frameDelay >= sprite.frameSpeed) {
                sprite.frameDelay = 0;
                sprite.currentFrame++;
                if (sprite.currentFrame >= sprite.idle.length) {
                    sprite.currentFrame = 0;
                }
            }
        }

        // Hedgehog animation update (sprite sheet kullanıyor)
        function updateHedgehogAnimation() {
            sprites.hedgehog.frameDelay++;
            if (sprites.hedgehog.frameDelay >= sprites.hedgehog.frameSpeed) {
                sprites.hedgehog.frameDelay = 0;
                sprites.hedgehog.currentFrame++;
                if (sprites.hedgehog.currentFrame >= sprites.hedgehog.idleFrameCount) {
                    sprites.hedgehog.currentFrame = 0;
                }
            }
        }

        // Input handling
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === 'e' || e.key === 'E') {
                checkInteraction();
            }
        });
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        // Game state
        const game = {
            gravity: 0.6,
            friction: 0.8,
            mapWidth: 5500,  // Çok geniş harita (15 soru için)
            state: 'intro',  // 'intro', 'verification', 'playing', 'finished'
            startButton: null,  // Başlat butonu referansı
            backButton: null,   // Ana menü butonu referansı
            sceneState: 'opening',  // 'opening', 'gameplay' - oyun içi sahne durumu
            openingDialogShown: false  // Açılış dialogu gösterildi mi?
        };

        // Verification quiz (giriş doğrulama sorusu)
        const verificationQuiz = {
            question: 'Ilk kahvemizi nereden içtik?',
            answers: ['Starbucks', 'Caffè Nero', 'EspressoLab'],
            correctAnswer: 1,  // Index 1 = 'Caffè Nero'
            errorMessage: ''   // Hata mesajı
        };

        // State değiştirme fonksiyonu
        function changeGameState(newState) {
            // Dialogları kapat
            if (dialog.isOpen) {
                closeDialog();
            }

            // State'i değiştir
            game.state = newState;
            
            // Buton referanslarını temizle
            if (newState === 'playing') {
                game.startButton = null;
                game.sceneState = 'opening';  // Açılış sahnesinden başla
                game.openingDialogShown = false;  // Dialog henüz gösterilmedi
            } else if (newState === 'intro') {
                game.backButton = null;
            } else if (newState === 'verification') {
                game.startButton = null;
                verificationQuiz.errorMessage = '';  // Hata mesajını temizle
            }

            // HTML instructions div'ini göster/gizle
            const instructionsDiv = document.getElementById('instructions');
            if (instructionsDiv) {
                if (newState === 'intro') {
                    instructionsDiv.style.display = 'block';
                } else {
                    instructionsDiv.style.display = 'none';
                }
            }

            // Canvas'ı hemen temizle (eski içeriği hemen kaldır)
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // NOT: Yeni ekranı ÇİZME - game loop bir sonraki frame'de çizecek
        }

        // Camera system
        const camera = {
            x: 0,
            y: 0
        };

        // Player (Rakun - Kız arkadaş)
        const player = {
            x: 100,
            y: 450,  // Zemin seviyesinde başlat
            width: 100,  // Daha büyük
            height: 100,
            velocityX: 0,
            velocityY: 0,
            speed: 5,
            jumpPower: 13,
            isOnGround: true,  // Başlangıçta zeminde
            animationState: 'idle' // idle, walk, jump
        };

        // NPC Kirpi (Erkek arkadaş - Yardımcı)
        const hedgehog = {
            x: 300,
            y: 510,  // Zemin seviyesi (550 - 40 = 510, collision box alt kenarı zemine değecek)
            width: 80,  // Sprite boyutu (10px arttırıldı)
            height: 40,
            spriteYOffset: 15,  // Sprite'ı aşağı kaydır (yarıya indirildi)
            spriteHeightExtension: 15,  // Sprite yüksekliğini artır (yarıya indirildi)
            type: 'helper',
            speed: 3.75,  // Yürüme hızı
            isMoving: false,  // Hareket ediyor mu?
            targetX: null,  // Hedef X pozisyonu
            showSpeechBubble: false,  // Diyalog baloncuğu gösterilsin mi?
            waitingForPlayer: false,  // Rakunun hareket etmesini bekliyor mu? (ekran pozisyonunda)
            screenTargetX: null  // Ekran pozisyon hedefi (rakun durduğunda)
        };
        
        // Caffè Nero binasının pozisyonu (başlangıçta hesaplanacak)
        let caffeNeroX = null;
        let caffeNeroWidth = null;
        
        // Bina pozisyonlarını hesapla (sprite'lar yüklendikten sonra)
        function calculateBuildingPositions() {
            if (caffeNeroX !== null) return; // Zaten hesaplandı
            const smallBuildings = [
                'smallCandyShop', 'smallBar', 'smallFlorist', 'smallElectronicsShop',
                'smallGunShop', 'smallJewelleryShop', 'smallIceCreamShop', 'smallBank'
            ];
            
            const largeBuildings = [
                'largeBank', 'largeBar', 'largeCandyShop', 'largeElectronicsShop',
                'largeFlorist', 'largeGroceryShop', 'largeGunShop', 'largeIceCreamShop',
                'largeJewelleryShop', 'normalBlue', 'normalGreen', 'normalRed',
                'normalPurple', 'normalPink', 'normalLightBlue', 'blankShopBlack',
                'blankShopBlue', 'blankShopBrown', 'blankShopPurple', 'blankShopRed',
                'blankShopYellow', 'blankShopYellow2', 'blankShop2D', 'mutedBlue',
                'mutedBrown', 'mutedGrayscale', 'mutedGreen', 'mutedPurple'
            ];
            
            let currentX = 50;
            const minSpacing = 20;
            let smallIndex = 0;
            let largeIndex = 0;
            
            for (let i = 0; i < 30; i++) {
                const patternPos = i % 3;
                let spriteKey;
                
                if (patternPos === 0 || patternPos === 1) {
                    spriteKey = smallBuildings[smallIndex % smallBuildings.length];
                    smallIndex++;
                } else {
                    spriteKey = largeBuildings[largeIndex % largeBuildings.length];
                    
                    // İlk largeBar binasını bul
                    if (caffeNeroX === null && spriteKey === 'largeBar') {
                        const buildingSprite = sprites.buildings[spriteKey];
                        const buildingWidth = (buildingSprite && buildingSprite.complete) ? buildingSprite.width : 180;
                        caffeNeroX = currentX;
                        caffeNeroWidth = buildingWidth;
                    }
                    
                    largeIndex++;
                }
                
                const buildingSprite = sprites.buildings[spriteKey];
                const buildingWidth = (buildingSprite && buildingSprite.complete) ? buildingSprite.width : 180;
                currentX += buildingWidth + minSpacing;
            }
        }

        // Platforms (genişletilmiş harita - 15 soru için)
        const platforms = [
            // Ground - Çok uzun zemin
            { x: 0, y: 550, width: 5500, height: 50, color: '#228B22' },

            { x: 3850, y: 440, width: 180, height: 20, color: '#8B4513' },

            { x: 4850, y: 450, width: 180, height: 20, color: '#8B4513' },
            { x: 5100, y: 400, width: 200, height: 20, color: '#8B4513' }
        ];

        // Interactive objects (quiz kutular) - 15 soru - Harita boyunca dağıtılmış
        const interactiveObjects = [
            // Bölüm 1 (Test soruları - gerçek soruları sonra ekleyeceğiz)
            { x: 700, y: 400, width: 40, height: 40, color: '#FFD700', type: 'quiz',
              question: 'Test Soru 1: İlk buluştuğumuz yer?',
              answers: ['Park', 'Kafe', 'Okul'], correctAnswer: 1, isAnswered: false },

              answers: ['İstanbul', 'Ankara', 'İzmir'], correctAnswer: 0, isAnswered: false },

            // Bölüm 3

            { x: 2750, y: 370, width: 40, height: 40, color: '#FFD700', type: 'quiz',

            // Bölüm 4

              question: 'Test Soru 10: Sana ilk hediyem?',
              answers: ['Çiçek', 'Kitap', 'Kolye'], correctAnswer: 2, isAnswered: false },

            { x: 3550, y: 310, width: 40, height: 40, color: '#FFD700', type: 'quiz',
              question: 'Test Soru 11: En sevdiğim mevsim?',
              answers: ['İlkbahar', 'Yaz', 'Sonbahar'], correctAnswer: 1, isAnswered: false },

            { x: 3750, y: 390, width: 40, height: 40, color: '#FFD700', type: 'quiz',
              question: 'Test Soru 12: Tatilde en çok nereyi sevdim?',

            // Bölüm 5 - Final
            { x: 4200, y: 340, width: 40, height: 40, color: '#FFD700', type: 'quiz',
              question: 'Test Soru 13: İlk tanıştığımızda saçların nasıldı?',
              answers: ['Kısa', 'Uzun', 'Orta'], correctAnswer: 1, isAnswered: false },

            { x: 4500, y: 330, width: 40, height: 40, color: '#FFD700', type: 'quiz',
              question: 'Test Soru 14: En sevdiğim hayvan?',
              answers: ['Kedi', 'Köpek', 'Kuş'], correctAnswer: 0, isAnswered: false },

            { x: 4950, y: 400, width: 40, height: 40, color: '#FFD700', type: 'quiz',
              question: 'Test Soru 15: Seni en çok ne mutlu eder?',
              answers: ['Hediyeler', 'Vakit geçirmek', 'Sürprizler'], correctAnswer: 1, isAnswered: false }
        ];

        // Dialog system
        let dialog = {
            isOpen: false,
            text: '',
            answers: [],
            currentObject: null,
            isHedgehogDialog: false // Kirpi konuşması mı?
        };

        // Game progress
        function getProgress() {
            const answered = interactiveObjects.filter(obj => obj.isAnswered).length;
            const total = interactiveObjects.length;
            return { answered, total };
        }

        // Check if player is near an interactive object
        function checkInteraction() {
            if (dialog.isOpen) {
                return;
            }

            // Check Kirpi (hedgehog) interaction - merkez noktalarını kullan
            const playerCenterX = player.x + player.width / 2;
            const playerCenterY = player.y + player.height / 2;
            const hedgehogCenterX = hedgehog.x + hedgehog.width / 2;
            const hedgehogCenterY = hedgehog.y + hedgehog.height / 2;

            const distanceX = Math.abs(playerCenterX - hedgehogCenterX);
            const distanceY = Math.abs(playerCenterY - hedgehogCenterY);

            if (distanceX < 80 && distanceY < 80) {
                openHedgehogDialog();
                return;
            }

            // Check quiz objects
            for (let obj of interactiveObjects) {
                if (!obj.isAnswered &&
                    Math.abs(player.x - obj.x) < 60 &&
                    Math.abs(player.y - obj.y) < 60) {
                    openDialog(obj);
                    break;
                }
            }
        }

        // Open hedgehog dialog (helper messages)
        function openHedgehogDialog() {
            dialog.isOpen = true;
            dialog.isHedgehogDialog = true;
            dialog.text = 'Merhaba canım! 🦔 Altın rengi kutulara yaklaş ve E tuşuna bas. Sana özel sorular hazırladım!';
            dialog.answers = ['Teşekkürler! 💕'];
            dialog.currentObject = null;
        }

        // Open dialog
        function openDialog(obj) {
            dialog.isOpen = true;
            dialog.isHedgehogDialog = false;
            dialog.text = obj.question;
            dialog.answers = obj.answers;
            dialog.currentObject = obj;
        }

        // Close dialog
        function closeDialog() {
            dialog.isOpen = false;
            dialog.isHedgehogDialog = false;
            dialog.text = '';
            dialog.answers = [];
            dialog.currentObject = null;
        }

        // Metin sarma yardımcı fonksiyonu
        function wrapText(text, maxWidth, font) {
            const words = text.split(' ');
            const lines = [];
            let currentLine = words[0];

            ctx.font = font;
            
            for (let i = 1; i < words.length; i++) {
                const word = words[i];
                const width = ctx.measureText(currentLine + ' ' + word).width;
                if (width < maxWidth) {
                    currentLine += ' ' + word;
                } else {
                    lines.push(currentLine);
                    currentLine = word;
                }
            }
            lines.push(currentLine);
            return lines;
        }

        // Handle answer click
        function handleAnswer(answerIndex) {
            // Kirpi diyaloğu ise sadece kapat
            if (dialog.isHedgehogDialog) {
                closeDialog();

                // Açılış dialogu kapandıysa, gameplay'e geç ve kirpi Caffè Nero'ya gitsin
                if (game.sceneState === 'opening') {
                    game.sceneState = 'gameplay';
                    
                    // Baloncuğu kapat (yeni gameplay başlıyor)
                    hedgehog.showSpeechBubble = false;
                    
                    // Caffè Nero pozisyonunu hesapla (eğer henüz hesaplanmadıysa)
                    if (caffeNeroX === null) {
                        calculateBuildingPositions();
                    }
                    
                    // Kirpi Caffè Nero binasına doğru yürüsün
                    if (caffeNeroX !== null && caffeNeroWidth !== null) {
                        // Binanın önüne git (bina merkezinden biraz önce)
                        hedgehog.targetX = caffeNeroX + (caffeNeroWidth / 2) - hedgehog.width - 30;
                        hedgehog.isMoving = true;
                        console.log('Hedgehog target set:', hedgehog.targetX, 'CaffeNeroX:', caffeNeroX);
                    } else {
                        console.log('CaffeNeroX is null, cannot set target. Will retry in updateHedgehog.');
                    }
                    
                    // İlk frame'de baloncuk gösterilmesini engelle (kirpi önce hedefe gitmeli)
                    // Not: updateHedgehog içinde rakun duruyorsa kontrol edilecek
                }
                return;
            }

            // Quiz sorusu ise cevap kontrol et
            if (!dialog.currentObject) return;

            if (answerIndex === dialog.currentObject.correctAnswer) {
                dialog.currentObject.isAnswered = true;
                dialog.currentObject.color = '#00FF00'; // Green for correct
                alert('Doğru cevap! 💚');
            } else {
                alert('Tekrar dene! 💛');
            }
            closeDialog();
        }

        // Add mouse click for answers and start button
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Check start button (intro screen)
            if (game.state === 'intro' && game.startButton) {
                const btn = game.startButton;
                if (mouseX > btn.x && mouseX < btn.x + btn.width &&
                    mouseY > btn.y && mouseY < btn.y + btn.height) {
                    changeGameState('verification');  // Önce doğrulama sorusu
                    return;
                }
            }

            // Check verification quiz answers
            if (game.state === 'verification') {
                const answerBoxY = 350;
                const answerHeight = 50;
                const answerSpacing = 60;

                verificationQuiz.answers.forEach((answer, index) => {
                    const y = answerBoxY + index * answerSpacing;
                    if (mouseX > 250 && mouseX < 550 && mouseY > y && mouseY < y + answerHeight) {
                        if (index === verificationQuiz.correctAnswer) {
                            // Doğru cevap - oyuna geç
                            verificationQuiz.errorMessage = '';
                            changeGameState('playing');
                        } else {
                            // Yanlış cevap - hata mesajını göster
                            verificationQuiz.errorMessage = 'Püh senin kalıbına!!';
                        }
                    }
                });
                return;
            }

            // Check back button (playing screen) - Ana menü butonu
            if (game.state === 'playing' && game.backButton) {
                const btn = game.backButton;
                // Daire şeklinde buton için merkez noktası ve yarıçap kontrolü
                const centerX = btn.x + btn.width / 2;
                const centerY = btn.y + btn.height / 2;
                const radius = btn.width / 2;
                const distance = Math.sqrt(Math.pow(mouseX - centerX, 2) + Math.pow(mouseY - centerY, 2));

                if (distance <= radius) {
                    changeGameState('intro');
                    return;
                }
            }

            // Check dialog answers
            if (!dialog.isOpen) return;

            // Dialog box pozisyonları (drawDialog ile aynı hesaplamalar)
            const dialogX = 150;
            const dialogY = 200;
            const dialogWidth = 500;
            const textPadding = 40;
            const maxTextWidth = dialogWidth - (textPadding * 2);
            const lineHeight = 28;
            
            // Metinleri sarmala (tıklama kontrolü için)
            ctx.font = 'bold 20px Arial';
            const textLines = wrapText(dialog.text, maxTextWidth, 'bold 20px Arial');
            let text2Lines = [];
            if (dialog.text2) {
                text2Lines = wrapText(dialog.text2, maxTextWidth, 'bold 20px Arial');
            }
            
            const textHeight = textLines.length * lineHeight;
            const text2Height = text2Lines.length * lineHeight;
            const textGap = text2Lines.length > 0 ? 15 : 0;
            const totalTextHeight = textHeight + text2Height + textGap;
            
            const answerHeight = 40;
            const answerSpacing = 50;
            const answerAreaHeight = dialog.answers.length * answerSpacing;
            
            const dialogHeight = Math.max(300, totalTextHeight + answerAreaHeight + 100);
            const dialogBoxY = dialogY + (300 - dialogHeight) / 2;
            
            let currentY = dialogBoxY + 50;
            currentY += textHeight + textGap;
            if (text2Lines.length > 0) {
                currentY += text2Height + 20;
            }

            // Check if clicked on an answer
            dialog.answers.forEach((answer, index) => {
                const answerY = currentY + index * answerSpacing;
                const answerX = dialogX + 50;
                const answerWidth = dialogWidth - 100;
                
                if (mouseX > answerX && mouseX < answerX + answerWidth && 
                    mouseY > answerY && mouseY < answerY + answerHeight) {
                    handleAnswer(index);
                }
            });
        });

        // Update player
        function updatePlayer() {
            // Horizontal movement
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                player.velocityX = -player.speed;
            } else if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                player.velocityX = player.speed;
            } else {
                player.velocityX *= game.friction;
            }

            // Jumping
            if ((keys[' '] || keys['ArrowUp'] || keys['w'] || keys['W']) && player.isOnGround) {
                player.velocityY = -player.jumpPower;
                player.isOnGround = false;
            }

            // Apply gravity
            player.velocityY += game.gravity;

            // Update position
            player.x += player.velocityX;
            player.y += player.velocityY;

            // Keep player in bounds (harita sınırları içinde)
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > game.mapWidth) player.x = game.mapWidth - player.width;

            // Platform collision
            player.isOnGround = false;
            platforms.forEach(platform => {
                if (player.x + player.width > platform.x &&
                    player.x < platform.x + platform.width &&
                    player.y + player.height > platform.y &&
                    player.y + player.height < platform.y + platform.height + 10 &&
                    player.velocityY >= 0) {

                    player.y = platform.y - player.height;
                    player.velocityY = 0;
                    player.isOnGround = true;
                }
            });
        }

        // Update camera (kamera oyuncuyu takip eder)
        function updateCamera() {
            // Kamera oyuncunun etrafında ortalanır
            camera.x = player.x - canvas.width / 2 + player.width / 2;

            // Kamera sınırları (harita dışına çıkmasın)
            if (camera.x < 0) camera.x = 0;
            if (camera.x > game.mapWidth - canvas.width) {
                camera.x = game.mapWidth - canvas.width;
            }

            // Y ekseninde kamera sabit (istersek yukarı-aşağı da takip edebilir)
            camera.y = 0;
        }

        // Update hedgehog (kirpi hareketi ve açılış sahnesi)
        function updateHedgehog() {
            // Gameplay sahnesi: Kirpi Caffè Nero binasına doğru yürür
            if (game.sceneState === 'gameplay') {
                // Rakunun hareket etmediğini kontrol et
                const playerIsStationary = Math.abs(player.velocityX) < 0.5;
                
                // Eğer rakunun hareket etmesini bekliyorsa ve rakun hareket etti, ekran hedefini iptal et
                if (hedgehog.waitingForPlayer && !playerIsStationary) {
                    hedgehog.waitingForPlayer = false;
                    hedgehog.screenTargetX = null;
                    hedgehog.showSpeechBubble = false;
                    console.log('Player started moving, resuming Caffè Nero target');
                }
                
                // Eğer ekran hedefinde bekliyorsa, ekran hedefinde kal
                if (hedgehog.waitingForPlayer && hedgehog.screenTargetX !== null) {
                    // Ekran pozisyonunu her frame güncelle (kamera hareket edebilir)
                    const targetScreenX = canvas.width * 0.7;
                    const targetWorldX = camera.x + targetScreenX;
                    hedgehog.screenTargetX = targetWorldX; // Hedefi güncelle
                    
                    const distanceToScreenTarget = Math.abs(hedgehog.x - targetWorldX);
                    console.log('Waiting for player - current:', hedgehog.x, 'target:', targetWorldX, 'distance:', distanceToScreenTarget);
                    
                    if (distanceToScreenTarget > 10) {
                        // Ekran hedefine doğru hareket et
                        hedgehog.isMoving = true;
                        if (hedgehog.x < targetWorldX) {
                            hedgehog.x += hedgehog.speed;
                        } else {
                            hedgehog.x -= hedgehog.speed;
                        }
                        console.log('Moving to screen target:', hedgehog.x);
                    } else {
                        // Ekran hedefinde dur
                        hedgehog.isMoving = false;
                        hedgehog.showSpeechBubble = true;
                        console.log('Reached screen target, showing bubble');
                    }
                    return;
                }
                
                // Eğer hedef yoksa ve Caffè Nero pozisyonu biliniyorsa, hedefi ayarla (öncelik)
                if (hedgehog.targetX === null && caffeNeroX !== null && caffeNeroWidth !== null && !hedgehog.showSpeechBubble && !hedgehog.waitingForPlayer) {
                    hedgehog.targetX = caffeNeroX + (caffeNeroWidth / 2) - hedgehog.width - 30;
                    hedgehog.isMoving = true;
                    hedgehog.showSpeechBubble = false; // Henüz baloncuk gösterme
                    console.log('Hedgehog target set in updateHedgehog:', hedgehog.targetX);
                }
                
                // Caffè Nero binasına gitme mantığı (öncelikli - eğer hedef varsa)
                if (hedgehog.targetX !== null && hedgehog.isMoving && !hedgehog.showSpeechBubble) {
                    const hedgehogCenterX = hedgehog.x + hedgehog.width / 2;
                    const targetCenterX = hedgehog.targetX + hedgehog.width / 2;
                    const distance = Math.abs(hedgehogCenterX - targetCenterX);
                    
                    // Rakun hareket etmiyorsa ve kirpi ekrandan çıkacaksa, dur ve ekranda görünür bir noktaya gel
                    if (playerIsStationary) {
                        const hedgehogScreenX = hedgehog.x - camera.x;
                        const hedgehogIsVisible = hedgehogScreenX >= 0 && hedgehogScreenX <= canvas.width - hedgehog.width;
                        
                        // Gelecekteki pozisyonu kontrol et
                        let nextX = hedgehog.x;
                        if (hedgehog.x < hedgehog.targetX) {
                            nextX = hedgehog.x + hedgehog.speed;
                        } else {
                            nextX = hedgehog.x - hedgehog.speed;
                        }
                        const nextScreenX = nextX - camera.x;
                        const willBeVisible = nextScreenX >= 0 && nextScreenX <= canvas.width - hedgehog.width;
                        
                        // Eğer kirpi ekrandan çıkacaksa veya çıkmışsa, dur ve ekranda görünür bir noktaya gel
                        // Basit kontrol: gelecekteki pozisyon ekranın %80'inden sağda mı? Veya ekrandan çıkacak mı?
                        const threshold = canvas.width * 0.8; // %80 eşiği
                        const willBePastThreshold = nextScreenX > threshold || nextScreenX + hedgehog.width > canvas.width;
                        
                        if (willBePastThreshold) {
                            // Ekranın %70'lik kısmına gel
                            const targetScreenX = canvas.width * 0.7;
                            const targetWorldX = camera.x + targetScreenX;
                            
                            // Ekran hedefini kaydet
                            hedgehog.screenTargetX = targetWorldX;
                            hedgehog.waitingForPlayer = true;
                            
                            const distanceToTarget = Math.abs(hedgehog.x - targetWorldX);
                            console.log('Hedgehog check - current:', hedgehog.x, 'target:', targetWorldX, 'distance:', distanceToTarget, 'camera.x:', camera.x);
                            
                            if (distanceToTarget > 10) {
                                // Hedefe doğru hareket et
                                hedgehog.isMoving = true;
                                // Caffè Nero hedefini geçici olarak iptal et
                                hedgehog.targetX = null;
                                
                                if (hedgehog.x < targetWorldX) {
                                    hedgehog.x += hedgehog.speed;
                                } else {
                                    hedgehog.x -= hedgehog.speed;
                                }
                                
                                // Eğer hedefe yaklaşıldıysa, dur ve baloncuk göster
                                const newDistance = Math.abs(hedgehog.x - targetWorldX);
                                if (newDistance <= 10) {
                                    hedgehog.isMoving = false;
                                    hedgehog.showSpeechBubble = true;
                                    console.log('Hedgehog reached screen position, showing bubble');
                                } else {
                                    console.log('Hedgehog moving to screen position 70%:', hedgehog.x, targetWorldX);
                                }
                            } else {
                                // Hedefe ulaşıldı, dur ve baloncuk göster
                                hedgehog.isMoving = false;
                                hedgehog.showSpeechBubble = true;
                                hedgehog.targetX = null; // Caffè Nero hedefini iptal et
                                console.log('Hedgehog reached screen position, showing bubble');
                            }
                            return;
                        }
                        // Eğer ekranda görünürse ve ekrandan çıkmayacaksa, Caffè Nero'ya gitmeye devam et
                    }
                    
                    // Hedefe ulaşıldı mı?
                    if (distance < 10) {
                        hedgehog.isMoving = false;
                        hedgehog.showSpeechBubble = true; // Diyalog baloncuğunu göster
                    } else {
                        // Hedefe doğru hareket et
                        if (hedgehog.x < hedgehog.targetX) {
                            hedgehog.x += hedgehog.speed;
                        } else {
                            hedgehog.x -= hedgehog.speed;
                        }
                    }
                    return;
                }
                
                // Eğer Caffè Nero hedefi yoksa veya tamamlandıysa ve rakun duruyorsa, ekranda görünür bir noktaya gel
                // Bu sadece Caffè Nero hedefi olmadığında çalışmalı (henüz hedef verilmemişse)
                if (playerIsStationary && hedgehog.targetX === null && hedgehog.showSpeechBubble === false) {
                    const hedgehogScreenX = hedgehog.x - camera.x;
                    const hedgehogIsVisible = hedgehogScreenX >= 0 && hedgehogScreenX <= canvas.width - hedgehog.width;
                    
                    // Kirpi ekranda görünür mü ve uygun pozisyonda mı?
                    if (!hedgehogIsVisible || hedgehogScreenX > canvas.width * 0.7) {
                        // Ekranın %70'lik kısmına gel
                        const targetScreenX = canvas.width * 0.7;
                        const targetWorldX = camera.x + targetScreenX;
                        
                        if (Math.abs(hedgehog.x - targetWorldX) > 10) {
                            // Hedefe doğru hareket et
                            hedgehog.isMoving = true;
                            if (hedgehog.x < targetWorldX) {
                                hedgehog.x += hedgehog.speed;
                            } else {
                                hedgehog.x -= hedgehog.speed;
                            }
                        } else {
                            // Hedefe ulaşıldı, dur ve baloncuk göster
                            hedgehog.isMoving = false;
                            hedgehog.showSpeechBubble = true;
                        }
                    } else {
                        // Ekranda görünür ve uygun pozisyonda, dur ve baloncuk göster
                        hedgehog.isMoving = false;
                        hedgehog.showSpeechBubble = true;
                    }
                    return;
                }
                
                // Eğer buraya geldiyse, başka bir şey yapılmasına gerek yok
                return;
            }
            
            // Açılış sahnesi: Kirpi otomatik olarak rakun'a doğru yürür
            if (game.sceneState === 'opening') {
                // Merkez noktalarını hesapla
                const playerCenterX = player.x + player.width / 2;
                const hedgehogCenterX = hedgehog.x + hedgehog.width / 2;
                
                // Etkileşim mesafesi (checkInteraction ile aynı)
                const interactionDistance = 80;
                
                // Mevcut mesafeyi kontrol et
                const currentDistance = Math.abs(playerCenterX - hedgehogCenterX);
                
                // Eğer etkileşim mesafesindeyse, dur ve dialog aç
                if (currentDistance <= interactionDistance) {
                    hedgehog.isMoving = false;
                    
                    // Dialog henüz gösterilmediyse, otomatik aç
                    if (!game.openingDialogShown && !dialog.isOpen) {
                        game.openingDialogShown = true;
                        openOpeningDialog();
                    }
                    return; // Hareket etme
                }
                
                // Kirpi rakunun hangi tarafında?
                // Eğer kirpi rakunun sağındaysa, rakunun sağına yaklaş
                // Eğer kirpi rakunun solundaysa, rakunun soluna yaklaş
                const targetDistance = interactionDistance - 10; // Etkileşim mesafesinden biraz önce dur
                
                if (hedgehogCenterX > playerCenterX) {
                    // Kirpi sağda, rakunun sağına yaklaş
                    // Hedef: rakun merkezinin sağında targetDistance kadar uzakta
                    hedgehog.targetX = playerCenterX + targetDistance - hedgehog.width / 2;
                } else {
                    // Kirpi solda, rakunun soluna yaklaş
                    // Hedef: rakun merkezinin solunda targetDistance kadar uzakta
                    hedgehog.targetX = playerCenterX - targetDistance - hedgehog.width / 2;
                }
                
                hedgehog.isMoving = true;

                // Hedefe doğru hareket et
                if (Math.abs(hedgehog.x - hedgehog.targetX) > 3) {
                    if (hedgehog.x < hedgehog.targetX) {
                        hedgehog.x += hedgehog.speed;
                    } else {
                        hedgehog.x -= hedgehog.speed;
                    }
                } else {
                    // Hedefe ulaştı, dur (ama dialog kontrolü yukarıda yapılıyor)
                    hedgehog.isMoving = false;
                }
            }
        }

        // Opening dialog (açılış sahnesi dialogu)

            dialog.isOpen = true;
            dialog.isHedgehogDialog = true;
            dialog.text = 'Rakun merhaba! Bugün 5 Kasım 2023. Şimdi seninle zamanda yolculuğa çıkıyoruz!';
            dialog.text2 = 'Biraz hafızanı tazeleyelim. Hazır olduğunu düşünüyorum!';

        // Draw player (Sprite-based Raccoon) - Kamera offset ile
        function drawPlayer() {
            const screenX = player.x - camera.x;
            const screenY = player.y - camera.y;

            // Determine which animation to use
            let currentAnim = sprites.raccoon.idle;
            if (!player.isOnGround) {
                currentAnim = sprites.raccoon.jump;
            } else if (Math.abs(player.velocityX) > 0.5) {
                currentAnim = sprites.raccoon.walk;
            }

            // Get current frame
            const frame = currentAnim[sprites.raccoon.currentFrame % currentAnim.length];

            // Sprite offset - Ayakların zemine değmesi için sprite'ı aşağı kaydır
            const spriteYOffset = 30; // Sprite'ı 30 piksel aşağı çiz
            const spriteHeightExtension = 30; // Sprite yüksekliğini artır

            // Draw sprite if loaded
            if (frame && frame.complete) {
                // Sprite'ı aşağı kaydırarak çiz (collision box aynı yerde kalır)
                ctx.drawImage(
                    frame,
                    screenX,
                    screenY + spriteYOffset,
                    player.width,
                    player.height + spriteHeightExtension
                );
            } else {
                // Fallback rectangle while loading
                ctx.fillStyle = '#D2691E';
                ctx.fillRect(screenX, screenY, player.width, player.height);
            }

            // Debug: Collision box'ı göster (test için)
            // ctx.strokeStyle = 'red';
            // ctx.strokeRect(screenX, screenY, player.width, player.height);
        }

        // Draw hedgehog (Sprite-based) - Kamera offset ile
        function drawHedgehog() {
            const screenX = hedgehog.x - camera.x;
            const screenY = hedgehog.y - camera.y;

            // Idle sprite sheet kullan
            const spriteSheet = sprites.hedgehog.idle[0];
            if (spriteSheet && spriteSheet.complete) {
                // Sprite sheet'teki bir frame boyutu (yatay dizilmiş)
                const frameCount = sprites.hedgehog.idleFrameCount;
                const frameWidth = spriteSheet.width / frameCount;
                const frameHeight = spriteSheet.height;
                const currentFrame = Math.floor(sprites.hedgehog.currentFrame) % frameCount;

                // Sprite'ın aspect ratio'sunu koru ve collision box içine sığdır
                const spriteAspectRatio = frameWidth / frameHeight;
                const maxWidth = hedgehog.width;
                const maxHeight = hedgehog.height + hedgehog.spriteHeightExtension;
                
                // Sprite'ı collision box'a sığdır (aspect ratio korunarak)
                let drawWidth = maxWidth;
                let drawHeight = drawWidth / spriteAspectRatio;
                
                if (drawHeight > maxHeight) {
                    drawHeight = maxHeight;
                    drawWidth = drawHeight * spriteAspectRatio;
                }

                // Sprite'ı collision box'ın merkezine hizala (taşma olmasın)
                const drawX = screenX + (hedgehog.width - drawWidth) / 2;
                const drawY = screenY + hedgehog.spriteYOffset + (maxHeight - drawHeight) / 2;

                // Frame'i sprite sheet'ten çıkar ve çiz (collision box içinde, taşma olmadan)
                ctx.drawImage(
                    spriteSheet,
                    currentFrame * frameWidth, 0,  // Source x, y
                    frameWidth, frameHeight,        // Source width, height
                    drawX,                          // Dest x (merkeze hizalı)
                    drawY,                          // Dest y (merkeze hizalı)
                    drawWidth,                      // Dest width (collision box içinde)
                    drawHeight                      // Dest height (collision box içinde)
                );
            } else {
                // Fallback - sprite yüklenene kadar dikdörtgen
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(screenX, screenY, hedgehog.width, hedgehog.height);
            }

            // Debug: Collision box'ı göster (test için)
            // ctx.strokeStyle = 'blue';
            // ctx.strokeRect(screenX, screenY, hedgehog.width, hedgehog.height);

            // Diyalog baloncuğu çiz (gameplay sahnesinde ve gösterilmesi gerekiyorsa)
            if (game.sceneState === 'gameplay' && hedgehog.showSpeechBubble) {
                const bubbleX = screenX + hedgehog.width / 2;
                const bubbleY = screenY - 50; // Kirpi'nin kafasının üstünde
                const bubbleWidth = 180;
                const bubbleHeight = 50;
                const bubbleRadius = 10;
                const text = "Bir kahve mi içsek acaba?";
                
                ctx.save();
                
                // Baloncuğu çiz (yuvarlatılmış dikdörtgen)
                ctx.fillStyle = '#FFFFFF';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                
                // Baloncuk gövdesi
                ctx.beginPath();
                ctx.roundRect(bubbleX - bubbleWidth / 2, bubbleY - bubbleHeight, bubbleWidth, bubbleHeight, bubbleRadius);
                ctx.fill();
                ctx.stroke();
                
                // Baloncuk ucunu çiz (kirpi'nin kafasına işaret eden)
                ctx.beginPath();
                ctx.moveTo(bubbleX - 15, bubbleY);
                ctx.lineTo(bubbleX, bubbleY - 10);
                ctx.lineTo(bubbleX + 15, bubbleY);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                
                // Metin çiz
                ctx.fillStyle = '#000000';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, bubbleX, bubbleY - bubbleHeight / 2);
                
                ctx.restore();
            }

            // Show "E" prompt if player is near - merkez bazlı kontrol
            const playerCenterX = player.x + player.width / 2;
            const playerCenterY = player.y + player.height / 2;
            const hedgehogCenterX = hedgehog.x + hedgehog.width / 2;
            const hedgehogCenterY = hedgehog.y + hedgehog.height / 2;

            const distanceX = Math.abs(playerCenterX - hedgehogCenterX);
            const distanceY = Math.abs(playerCenterY - hedgehogCenterY);

            if (distanceX < 80 && distanceY < 80 && !hedgehog.showSpeechBubble) {
                ctx.fillStyle = 'white';
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 3;
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.strokeText('E', screenX + hedgehog.width/2, screenY - 10);
                ctx.fillText('E', screenX + hedgehog.width/2, screenY - 10);
            }
        }

        // Draw clouds (bulutlar) - Arka plan - Paralax efekti
        function drawClouds() {
            // Bulutları gökyüzünde dağıt (paralax efekti için yavaş hareket)
            const cloudPositions = [
                { x: 100, y: 80, speed: 0.02 },
                { x: 400, y: 120, speed: 0.03 },
                { x: 700, y: 60, speed: 0.015 },
                { x: 50, y: 150, speed: 0.025 },
                { x: 500, y: 100, speed: 0.02 },
                { x: 750, y: 140, speed: 0.03 }
            ];
            
            sprites.clouds.forEach((cloud, index) => {
                if (!cloud.complete || cloud.width === 0) return;
                
                const posIndex = index % cloudPositions.length;
                const pos = cloudPositions[posIndex];
                
                // Paralax efekti: Bulutlar kameradan yavaş hareket eder
                const parallaxX = pos.x - (camera.x * pos.speed);
                
                // Bulut ekranın dışına çıktıysa tekrarla
                let drawX = parallaxX % (canvas.width + cloud.width * 2);
                if (drawX < -cloud.width) {
                    drawX += canvas.width + cloud.width * 2;
                }
                
                ctx.drawImage(cloud, drawX, pos.y, cloud.width, cloud.height);
            });
        }

        // Draw road (yol) - Kaldırım zemin
        function drawRoad() {
            // Zemin seviyesi (platform y: 550 - karakterler bu seviyede duruyor)
            const groundLevel = 550;

            const screenY = groundLevel - camera.y;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(-camera.x, screenY + roadHeight - 2, game.mapWidth, 2);
        }

        // Draw buildings (binalar) - Yeni sprite yapısı
        function drawBuildings() {
            // Zemin seviyesi (platform y: 550)
            const groundLevel = 550;
            
            // Bina kategorileri
            const smallBuildings = [
                'smallCandyShop', 'smallBar', 'smallFlorist', 'smallElectronicsShop',
                'smallGunShop', 'smallJewelleryShop', 'smallIceCreamShop', 'smallBank'
            ];
            
            const largeBuildings = [
                'largeBank', 'largeBar', 'largeCandyShop', 'largeElectronicsShop',
                'largeFlorist', 'largeGroceryShop', 'largeGunShop', 'largeIceCreamShop',
                'largeJewelleryShop', 'normalBlue', 'normalGreen', 'normalRed',
                'normalPurple', 'normalPink', 'normalLightBlue', 'blankShopBlack',
                'blankShopBlue', 'blankShopBrown', 'blankShopPurple', 'blankShopRed',
                'blankShopYellow', 'blankShopYellow2', 'blankShop2D', 'mutedBlue',
                'mutedBrown', 'mutedGrayscale', 'mutedGreen', 'mutedPurple'
            ];
            
            // Pattern: 2 küçük, 1 büyük, 2 küçük, 1 büyük...
            let buildings = [];
            let currentX = 50;
            const minSpacing = 20; // Minimum binalar arası boşluk
            
            let smallIndex = 0;
            let largeIndex = 0;
            
            // 30 bina için pattern oluştur
            let firstLargeDrinkShopIndex = -1; // İlk büyük içecek satan binanın indeksi
            
            for (let i = 0; i < 30; i++) {
                const patternPos = i % 3; // 0, 1, 2 (2 küçük, 1 büyük)
                
                let spriteKey;
                let isLargeDrinkShop = false;
                
                if (patternPos === 0 || patternPos === 1) {
                    // İki küçük bina
                    spriteKey = smallBuildings[smallIndex % smallBuildings.length];
                    smallIndex++;
                } else {
                    // Bir büyük bina
                    spriteKey = largeBuildings[largeIndex % largeBuildings.length];
                    
                    // İlk büyük içecek satan bina (largeBar) bulunca işaretle
                    if (firstLargeDrinkShopIndex === -1 && spriteKey === 'largeBar') {
                        firstLargeDrinkShopIndex = i;
                        isLargeDrinkShop = true;
                    }
                    
                    largeIndex++;
                }
                
                // Bina sprite'ının genişliğini kontrol et
                const buildingSprite = sprites.buildings[spriteKey];
                const buildingWidth = (buildingSprite && buildingSprite.complete) ? buildingSprite.width : 180;
                
                buildings.push({ 
                    x: currentX, 
                    spriteKey: spriteKey,
                    isCaffeNero: isLargeDrinkShop // Caffè Nero işareti
                });
                
                // Caffè Nero binasının pozisyonunu kaydet (sprite yüklendiyse ve henüz set edilmediyse)
                if (isLargeDrinkShop && caffeNeroX === null) {
                    const buildingSprite = sprites.buildings[spriteKey];
                    if (buildingSprite && buildingSprite.complete && buildingSprite.width > 0) {
                        caffeNeroX = currentX;
                        caffeNeroWidth = buildingSprite.width;
                    }
                }
                
                // Bir sonraki binanın X pozisyonu: mevcut bina genişliği + minimum boşluk
                currentX += buildingWidth + minSpacing;
            }
            
            // Binaları çizmek için önce genişliklerini hesapla (sprite yüklenmiş olsa bile kontrol için)
            const buildingsToDraw = [];
            buildings.forEach(building => {
                const buildingSprite = sprites.buildings[building.spriteKey];
                
                // Sprite yüklenene kadar bekle
                if (!buildingSprite || !buildingSprite.complete || buildingSprite.width === 0) {
                    return; // Sprite henüz yüklenmedi, atla
                }
                
                const screenX = building.x - camera.x;
                const buildingWidth = buildingSprite.width;
                const buildingHeight = buildingSprite.height;
                const buildingTop = groundLevel - buildingHeight;
                const screenY = buildingTop - camera.y;
                
                // Sadece ekranda görünen binaları çiz
                if (screenX + buildingWidth > 0 && screenX < canvas.width) {
                    buildingsToDraw.push({
                        sprite: buildingSprite,
                        screenX: screenX,
                        screenY: screenY,
                        width: buildingWidth,
                        height: buildingHeight,
                        isCaffeNero: building.isCaffeNero || false // Caffè Nero işareti
                    });
                }
            });
            
            // Binaları çiz - z-order: X pozisyonuna göre (perspektif efekti)
            // Solda olanlar arkada, sağda olanlar önde çizilmeli
            buildingsToDraw.sort((a, b) => {
                // X pozisyonuna göre sırala (soldaki önce - arkada çizilir)
                return a.screenX - b.screenX;
            });
            
            buildingsToDraw.forEach(building => {
                // Hafif gölge efekti (binaların altına)
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.fillRect(building.screenX + 3, building.screenY + building.height, building.width - 2, 5);
                
                // Bina sprite'ını çiz
                ctx.drawImage(building.sprite, building.screenX, building.screenY, building.width, building.height);
                
                // Caffè Nero yazısını çiz (tente üzerine)
                if (building.isCaffeNero) {
                    // Tente genellikle binanın üst 1/4'lük kısmında, yaklaşık olarak
                    const tentHeight = building.height * 0.25; // Tente yüksekliği (binanın %25'i)
                    const tentY = building.screenY; // Tente en üstte
                    
                    // Metin stilleri
                    ctx.save();
                    ctx.font = 'bold 32px Arial'; // Yazı boyutu artırıldı (24'ten 32'ye)
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    // Beyaz outline efekti için
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 5;
                    ctx.lineJoin = 'round';
                    
                    // Metin rengi (mavi)
                    ctx.fillStyle = '#0066CC';
                    
                    // Metin pozisyonu (tentenin ortası, biraz aşağıya kaydırıldı)
                    const textX = building.screenX + building.width / 2;
                    const textY = tentY + tentHeight / 2 + 8; // 8 piksel aşağıya kaydırıldı
                    
                    // Outline çiz
                    ctx.strokeText('Caffè Nero', textX, textY);
                    // Metin çiz
                    ctx.fillText('Caffè Nero', textX, textY);
                    
                    ctx.restore();
                }
            });
        }

        // Draw dialog
        function drawDialog() {
            if (!dialog.isOpen) return;

            // Darken background
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dialog box boyutları
            const dialogX = 150;
            const dialogY = 200;
            const dialogWidth = 500;
            const textPadding = 40;
            const maxTextWidth = dialogWidth - (textPadding * 2);
            const lineHeight = 28;
            
            // Metinleri sarmala
            ctx.font = 'bold 20px Arial';
            const textLines = wrapText(dialog.text, maxTextWidth, 'bold 20px Arial');
            let text2Lines = [];
            if (dialog.text2) {
                text2Lines = wrapText(dialog.text2, maxTextWidth, 'bold 20px Arial');
            }
            
            // Toplam metin yüksekliğini hesapla
            const textHeight = textLines.length * lineHeight;
            const text2Height = text2Lines.length * lineHeight;
            const textGap = text2Lines.length > 0 ? 15 : 0;
            const totalTextHeight = textHeight + text2Height + textGap;
            
            // Cevaplar için alan
            const answerHeight = 40;
            const answerSpacing = 50;
            const answerAreaHeight = dialog.answers.length * answerSpacing;
            
            // Dialog box yüksekliği dinamik olarak ayarla
            const dialogHeight = Math.max(300, totalTextHeight + answerAreaHeight + 100);
            const dialogBoxY = dialogY + (300 - dialogHeight) / 2; // Merkeze hizala veya minimum yükseklik

            // Dialog box
            ctx.fillStyle = 'white';
            ctx.roundRect(dialogX, dialogBoxY, dialogWidth, dialogHeight, 10);
            ctx.fill();
            
            // Gölge efekti için border
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.lineWidth = 2;
            ctx.roundRect(dialogX, dialogBoxY, dialogWidth, dialogHeight, 10);
            ctx.stroke();

            // Metin başlangıç pozisyonu
            let currentY = dialogBoxY + 50;
            
            // Question text (dialog.text)
            ctx.fillStyle = 'black';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'left';
            textLines.forEach((line, index) => {
                ctx.fillText(line, dialogX + textPadding, currentY + (index * lineHeight));
            });
            currentY += textHeight + textGap;
            
            // Question text2 (dialog.text2) - varsa
            if (text2Lines.length > 0) {
                ctx.font = 'bold 18px Arial';
                text2Lines.forEach((line, index) => {
                    ctx.fillText(line, dialogX + textPadding, currentY + (index * lineHeight));
                });
                currentY += text2Height + 20;
            }

            // Answers
            ctx.font = '16px Arial';
            dialog.answers.forEach((answer, index) => {
                const answerY = currentY + index * answerSpacing;

                // Answer box hover efekti için (basit)
                ctx.fillStyle = '#f0f0f0';
                ctx.fillRect(dialogX + 50, answerY, dialogWidth - 100, answerHeight);

                // Answer border
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.strokeRect(dialogX + 50, answerY, dialogWidth - 100, answerHeight);

                // Answer text
                ctx.fillStyle = 'black';
                ctx.fillText(`${index + 1}. ${answer}`, dialogX + 70, answerY + 25);
            });

            ctx.textAlign = 'left';
        }

        // Draw HUD (Ana menü butonu - kamera ile hareket etmez)
        function drawHUD() {
            // Sadece playing state'inde HUD çiz
            if (game.state !== 'playing') {

            // Ana menü butonu (sağ üst köşe) - kamera offset'siz, sabit pozisyon

        // Create spotlight clip regions (sadece ışık bölgelerinde çizim yapılsın)
        function createSpotlightClip() {
            const lightTopY = 0;
            const topWidth = 40;
            const bottomWidth = 140;

            // Rakun spotlight bölgesi
            const raccoonScreenX = player.x - camera.x + player.width / 2;
            const raccoonScreenY = player.y - camera.y + player.height / 2;
            const raccoonBottomY = raccoonScreenY + 100;

            ctx.beginPath();
            ctx.moveTo(raccoonScreenX - topWidth/2, lightTopY);
            ctx.lineTo(raccoonScreenX + topWidth/2, lightTopY);
            ctx.lineTo(raccoonScreenX + bottomWidth/2, raccoonBottomY);
            ctx.lineTo(raccoonScreenX - bottomWidth/2, raccoonBottomY);
            ctx.closePath();

            // Kirpi spotlight bölgesi
            const hedgehogScreenX = hedgehog.x - camera.x + hedgehog.width / 2;
            const hedgehogScreenY = hedgehog.y - camera.y + hedgehog.height / 2;
            const hedgehogBottomY = hedgehogScreenY + 100;

            ctx.moveTo(hedgehogScreenX - topWidth/2, lightTopY);
            ctx.lineTo(hedgehogScreenX + topWidth/2, lightTopY);
            ctx.lineTo(hedgehogScreenX + bottomWidth/2, hedgehogBottomY);
            ctx.lineTo(hedgehogScreenX - bottomWidth/2, hedgehogBottomY);
            ctx.closePath();

            // Clip uygula
            ctx.clip();
        }

        // Draw spotlight beams (ışık hüzmelerini çiz)
        function drawSpotlightBeams() {
            const lightTopY = 0;
            const topWidth = 40;
            const bottomWidth = 140;

            // Rakun için ışık hüzmesi
            const raccoonScreenX = player.x - camera.x + player.width / 2;
            const raccoonScreenY = player.y - camera.y + player.height / 2;
            const raccoonBottomY = raccoonScreenY + 100;

            const raccoonGradient = ctx.createLinearGradient(
                raccoonScreenX, lightTopY,
                raccoonScreenX, raccoonBottomY
            );
            raccoonGradient.addColorStop(0, 'rgba(200, 220, 255, 0.15)');
            raccoonGradient.addColorStop(0.5, 'rgba(200, 220, 255, 0.2)');
            raccoonGradient.addColorStop(1, 'rgba(200, 220, 255, 0.25)');

            ctx.fillStyle = raccoonGradient;
            ctx.beginPath();
            ctx.moveTo(raccoonScreenX - topWidth/2, lightTopY);
            ctx.lineTo(raccoonScreenX + topWidth/2, lightTopY);
            ctx.lineTo(raccoonScreenX + bottomWidth/2, raccoonBottomY);
            ctx.lineTo(raccoonScreenX - bottomWidth/2, raccoonBottomY);
            ctx.closePath();
            ctx.fill();

            // Kirpi için ışık hüzmesi
            const hedgehogScreenX = hedgehog.x - camera.x + hedgehog.width / 2;
            const hedgehogScreenY = hedgehog.y - camera.y + hedgehog.height / 2;
            const hedgehogBottomY = hedgehogScreenY + 100;

            const hedgehogGradient = ctx.createLinearGradient(
                hedgehogScreenX, lightTopY,
                hedgehogScreenX, hedgehogBottomY
            );
            hedgehogGradient.addColorStop(0, 'rgba(200, 220, 255, 0.15)');
            hedgehogGradient.addColorStop(0.5, 'rgba(200, 220, 255, 0.2)');
            hedgehogGradient.addColorStop(1, 'rgba(200, 220, 255, 0.25)');

            ctx.fillStyle = hedgehogGradient;
            ctx.beginPath();
            ctx.moveTo(hedgehogScreenX - topWidth/2, lightTopY);
            ctx.lineTo(hedgehogScreenX + topWidth/2, lightTopY);
            ctx.lineTo(hedgehogScreenX + bottomWidth/2, hedgehogBottomY);
            ctx.lineTo(hedgehogScreenX - bottomWidth/2, hedgehogBottomY);
            ctx.closePath();
            ctx.fill();
        }

            }

            // Reset text alignment
            ctx.textAlign = 'left';
        }

        // Helper for rounded rectangles
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
            };
        }

        // Game loop
        function gameLoop() {
            // Canvas'ı TAMAMEN temizle
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (game.state === 'intro') {
                // Intro screen - SADECE intro state'inde
                drawIntroScreen();
            } else if (game.state === 'verification') {
                // Verification screen - doğrulama sorusu
                drawVerificationScreen();
            } else if (game.state === 'playing') {
                // Playing screen - SADECE playing state'inde

                // Update
                // Açılış sahnesinde oyuncu hareket edemez
                if (!dialog.isOpen && game.sceneState === 'gameplay') {
                    updatePlayer();
                }
                updateHedgehog();  // Kirpi hareketi (açılış sahnesi)
                updateCamera();  // Kamerayı her zaman güncelle
                updateAnimation(sprites.raccoon);  // Rakun animasyonu güncelle
                updateHedgehogAnimation();  // Kirpi animasyonu güncelle

                // Draw - Scene state'e göre farklı çizim
                if (game.sceneState === 'opening') {
                    // Açılış sahnesi: Siyah ekran + spotlight efekti
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // Spotlight clip bölgelerini ayarla ve içine çiz
                    ctx.save();
                    createSpotlightClip();

                    // Clip bölgesi içinde: Işık hüzmeleri ve karakterleri çiz
                    drawSpotlightBeams();
                    drawHedgehog();
                    drawPlayer();

                    ctx.restore();
                } else {
                    // Gameplay: Normal oyun ekranı
                    // Arka plan (gökyüzü gradient - daha zengin)
                    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                    gradient.addColorStop(0, '#B0E0E6');      // Açık mavi (üst)
                    gradient.addColorStop(0.6, '#87CEEB');    // Gökyüzü mavisi
                    gradient.addColorStop(1, '#E0F6FF');      // Çok açık mavi (alt - zemin üstü)
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // Oyun elemanlarını çiz (sıralama önemli - arkadan öne)
                    drawRoad();            // Yol en arkada (pavement)
                    drawBuildings();       // Binalar yolun üstünde
                    // drawPlatforms();        // Platformlar geçici olarak gizli
                    // drawInteractiveObjects(); // Quiz kutuları geçici olarak gizli
                    drawHedgehog();         // Kirpi karakteri
                    drawPlayer();           // Rakun karakteri (en önde)
                }

                drawHUD();       // HUD en üstte (kamera ile hareket etmez)
                drawDialog();    // Dialog en üstte olmalı
            }

            // Continue loop
            requestAnimationFrame(gameLoop);
        }

        // Start game
        gameLoop();
    </script>
</body>
</html>
