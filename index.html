                            const signWidth = 120; // Genişlik azaltıldı
                            const signHeight = 42; // Yükseklik artırıldı (iki satır için)
                            const poleHeight = 25; // Tabela direği yüksekliği
                            
                            ctx.save();
                            // Pixel-art için image smoothing'i kapat
                            ctx.imageSmoothingEnabled = false;
                            
                            // Tabela direği (otelin çatısına bağlı)
                            ctx.fillStyle = '#8B4513'; // Kahverengi
                            ctx.fillRect(signScreenX - 4, signScreenY + signHeight - 1, 8, poleHeight);
                            // Direk gölgesi
                            ctx.fillStyle = '#654321';
                            ctx.fillRect(signScreenX - 3, signScreenY + signHeight, 6, poleHeight);
                            
                            // Tabela arka planı (ahşap görünümlü)
                            // Ana arka plan - açık kahverengi
                            ctx.fillStyle = '#D2691E';
                            ctx.fillRect(signScreenX - signWidth / 2, signScreenY, signWidth, signHeight);
                            
                            // Ahşap dokusu - dikey çizgiler
                            ctx.fillStyle = '#CD853F';
                            for (let i = 0; i < signWidth; i += 4) {
                                ctx.fillRect(signScreenX - signWidth / 2 + i, signScreenY, 1, signHeight);
                            }
                            
                            // Tabela kenarları (kalın çerçeve)
                            ctx.fillStyle = '#8B4513'; // Koyu kahverengi çerçeve
                            ctx.fillRect(signScreenX - signWidth / 2, signScreenY, signWidth, 3); // Üst
                            ctx.fillRect(signScreenX - signWidth / 2, signScreenY + signHeight - 3, signWidth, 3); // Alt
                            ctx.fillRect(signScreenX - signWidth / 2, signScreenY, 3, signHeight); // Sol
                            ctx.fillRect(signScreenX + signWidth / 2 - 3, signScreenY, 3, signHeight); // Sağ
                            
                            // Tabela gölgesi (derinlik için)
                            ctx.fillStyle = '#654321';
                            ctx.fillRect(signScreenX - signWidth / 2 + 2, signScreenY + 2, signWidth - 4, signHeight - 4);
                            
                            // Tabela metni (pixel-art stili - iki satır)
                            ctx.fillStyle = '#FFFFFF';
                            ctx.strokeStyle = '#000000';
                            ctx.lineWidth = 1;
                            ctx.font = 'bold 12px "Courier New", monospace'; // Pixel-art için monospace font
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            
                            // İlk satır: "Triada Hotel" (üst satır)
                            const line1Y = signScreenY + signHeight / 2 - 7;
                            ctx.fillStyle = '#000000';
                            ctx.fillText('Triada Hotel', signScreenX + 1, line1Y + 1);
                            ctx.fillStyle = '#FFFFFF';
                            ctx.fillText('Triada Hotel', signScreenX, line1Y);
                            
                            // İkinci satır: "Büyükada" (alt satır)
                            const line2Y = signScreenY + signHeight / 2 + 7;
                            ctx.fillStyle = '#000000';
                            ctx.fillText('Büyükada', signScreenX + 1, line2Y + 1);
                            ctx.fillStyle = '#FFFFFF';
                            ctx.fillText('Büyükada', signScreenX, line2Y);
                            
                            ctx.restore();
                            
                            // "E" etkileşim sembolü (sadece etkileşim mümkünken göster)
                            if (!game.innEntered) {
                                const playerCenterX = player.x + player.width / 2;
                                const houseCenterX = currentHouseX + houseWidth / 2;
                                const distanceToHouse = Math.abs(playerCenterX - houseCenterX);
                                
                                if (distanceToHouse < 100 && playerCenterX >= currentHouseX - 20 && playerCenterX <= currentHouseX + houseWidth + 20) {
                                    // "E" sembolü çiz
                                    ctx.save();
                                    ctx.fillStyle = '#FFFFFF';
                                    ctx.strokeStyle = '#000000';
                                    ctx.lineWidth = 2;
                                    ctx.font = 'bold 20px Arial';
                                    ctx.textAlign = 'center';
                                    ctx.strokeText('E', screenX + houseWidth / 2, screenY - 30);
                                    ctx.fillText('E', screenX + houseWidth / 2, screenY - 30);
                                    ctx.restore();
                                }
                            }
                        }
                    }
                    
                    // Bir sonraki ev pozisyonu (büyütülmüş genişlik kullan)
                    currentHouseX += houseWidth + houseSpacing;
                }
            }
            
            // Saklanmış dekorasyonları çiz (bir kez hesaplanmış, sabit)
            if (game.islandDecorations && game.islandDecorations.length > 0) {
                for (let i = 0; i < game.islandDecorations.length; i++) {
                    const decoration = game.islandDecorations[i];
                    
                    // Sprite'ın yüklenmiş ve hata durumunda olmadığını kontrol et
                    if (decoration.sprite && decoration.sprite.complete && decoration.sprite.naturalWidth > 0) {
                        // Dünya koordinatını ekran koordinatına çevir
                        // Not: worldX zaten 1 piksel sola kaydırılmış olarak kaydedilmiş
                        const decorationScreenX = decoration.worldX - camera.x;
                        const decorationScreenY = decoration.worldY - decoration.sprite.height; // Zemine oturt
                        
                        // Ekranda görünüyor mu kontrol et
                        if (decorationScreenX + decoration.sprite.width > 0 && decorationScreenX < canvas.width) {
                            ctx.drawImage(
                                decoration.sprite,
                                decorationScreenX, decorationScreenY
                            );
                        }
                    }
                }
            }
            
            // Son evden sonra iskele ve tekne çiz (ilk sahne gibi)
            // Not: islandDockX, islandDockWidth, groundLevel, waterLevel ve deniz zaten yukarıda tanımlandı/çizildi
            const dockPlatformHeight = 25; // İskele platformu kalınlığı
            const dockPlatformY = waterLevel - dockPlatformHeight - 5; // İskele platformu su üstünde
            const dockPoleHeight = 60; // İskele kazığı yüksekliği
            
            const dockScreenX = islandDockX - camera.x;
            const dockScreenY = dockPlatformY - camera.y;
            
            // İskele çiz (ekranda görünüyorsa) - deniz üzerinde
            if (dockScreenX + islandDockWidth > 0 && dockScreenX < canvas.width) {
                // İskele kazıkları (dikey çubuklar) - ilk üç bacak çizilmiyor
                ctx.fillStyle = '#654321';
                const poleCount = 6;
                for (let i = 0; i < poleCount; i++) {
                    if (i < 3) continue; // İlk üç bacak çizilmiyor
                    const poleX = dockScreenX + (i * islandDockWidth / (poleCount - 1));
                    const poleScreenY = dockScreenY + dockPlatformHeight;
                    ctx.fillRect(poleX - 4, poleScreenY, 8, dockPoleHeight);
                }
                
                // İskele platformu (ahşap)
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(dockScreenX, dockScreenY, islandDockWidth, dockPlatformHeight);
                
                // İskele platformu üst çizgisi
                ctx.strokeStyle = '#654321';
                ctx.lineWidth = 2;
                ctx.strokeRect(dockScreenX, dockScreenY, islandDockWidth, dockPlatformHeight);
                
                // Tekne (iskeleye bağlı)
                const dockEndX = dockScreenX + islandDockWidth;
                const dockEndY = dockScreenY + dockPlatformHeight / 2;
                const boatDistance = 90;
                const boatX = dockEndX + boatDistance - 63;
                const boatY = dockEndY - 30;
                const boatWidth = 120;
                const boatHeight = 50;
                
                // Tekne gövdesi (yarım oval)
                ctx.fillStyle = '#654321';
                ctx.beginPath();
                ctx.ellipse(boatX + boatWidth / 2, boatY + boatHeight, boatWidth / 2, boatHeight / 2, 0, 0, Math.PI, false);
                ctx.fill();
                
                // Tekne gövdesi üst kenarlığı
                ctx.strokeStyle = '#4A3728';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.ellipse(boatX + boatWidth / 2, boatY + boatHeight, boatWidth / 2, boatHeight / 2, 0, 0, Math.PI, false);
                ctx.stroke();
                
                // Tekne iç kısmı
                ctx.fillStyle = '#8B4513';
                ctx.beginPath();
                ctx.ellipse(boatX + boatWidth / 2, boatY + boatHeight - 2, boatWidth / 2 - 3, boatHeight / 2 - 3, 0, 0, Math.PI, false);
                ctx.fill();
                
                // Tekne iç kenarlığı
                ctx.strokeStyle = '#6B5439';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(boatX + boatWidth / 2, boatY + boatHeight - 2, boatWidth / 2 - 3, boatHeight / 2 - 3, 0, 0, Math.PI, false);
                ctx.stroke();
                
                // İskele üzerinde halat bağlantı noktası
                const ropeAnchorX = dockEndX - 5;
                const ropeAnchorY = dockEndY;
                
                ctx.fillStyle = '#4A3728';
                ctx.beginPath();
                ctx.arc(ropeAnchorX, ropeAnchorY, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#2F1F14';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                ctx.fillStyle = '#6B5439';
                ctx.beginPath();
                ctx.arc(ropeAnchorX, ropeAnchorY, 5, 0, Math.PI * 2);
                ctx.fill();
                
                // Tekne üzerinde halat bağlantı noktası
                const boatCenterX = boatX + boatWidth / 2;
                const boatCenterY = boatY + boatHeight;
                const boatRopeX = boatX + 15;
                const boatRopeY = boatCenterY - 2;
                
                ctx.fillStyle = '#4A3728';
                ctx.beginPath();
                ctx.arc(boatRopeX, boatRopeY, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#2F1F14';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                ctx.fillStyle = '#6B5439';
                ctx.beginPath();
                ctx.arc(boatRopeX, boatRopeY, 4, 0, Math.PI * 2);
                ctx.fill();
                
                // Halat
                ctx.strokeStyle = '#8B7355';
                ctx.lineWidth = 8;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(ropeAnchorX, ropeAnchorY);
                ctx.lineTo(boatRopeX, boatRopeY);
                ctx.stroke();
                
                // Halat gölgesi
                ctx.strokeStyle = '#6B5B45';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(ropeAnchorX + 1, ropeAnchorY + 1);
                ctx.lineTo(boatRopeX + 1, boatRopeY + 1);
                ctx.stroke();
                
                // Halat highlight
                ctx.strokeStyle = '#AB9B85';
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(ropeAnchorX - 1, ropeAnchorY - 1);
                ctx.lineTo(boatRopeX - 1, boatRopeY - 1);
                ctx.stroke();
                
                // Tekne gölgesi
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.beginPath();
                ctx.ellipse(boatX + boatWidth / 2, boatY + boatHeight + 5, boatWidth / 2, boatHeight / 2 - 5, 0, 0, Math.PI, false);
                ctx.fill();
                
                // Tekne bayrağı (tekneye bitişik)
                ctx.fillStyle = '#FF0000';
                ctx.fillRect(boatX + boatWidth - 10, boatY - 15, 8, 15);
                
                // Bayrak detayı
                ctx.strokeStyle = '#8B0000';
                ctx.lineWidth = 1;
                ctx.strokeRect(boatX + boatWidth - 10, boatY - 15, 8, 15);
            }
            
            // Karakterleri çiz (ada üzerinde)
            drawHedgehog();
            drawPlayer();
        }

            // Tekne rotası hesaplama (kıvrımlı bezier curve)
        function getBoatPosition(progress) {
            // Ada pozisyonu (sağ üst köşe - drawIsland ile aynı)
            const islandX = canvas.width - 210; // drawIsland ile eşleştir
            const islandY = 150; // drawIsland ile eşleştir
            
            // İskele başlangıç pozisyonu (sol alt - iskelenin sonu)
            const dockX = 2;
            const dockY = canvas.height - 50;
            const dockWidth = 120;
            const startX = dockX + dockWidth + 3; // İskele sonundan biraz önce
            const startY = dockY - 30; // İskele seviyesinin biraz üstü
            
            // Ada hedef pozisyonu (adanin ortasubda, en alt kisim)
            const endX = islandX;
            const endY = islandY + 110;
            
            // Kontrol noktaları (kıvrımlı rota için - daha uzun ve kıvrımlı)
            // İlk bölüm: İskeleden aşağı ve sağa
            const cp1X = 150;
            const cp1Y = canvas.height - 40; // Aşağı doğru
            
            const cp2X = 250;
            const cp2Y = canvas.height - 30; // Sağa doğru
            
            const cp3X = 400;
            const cp3Y = canvas.height - 25; // Daha sağa, ada'nın altına doğru
            
            // İkinci bölüm: Ada'nın altından geçerek
            const cp4X = 550;
            const cp4Y = canvas.height - 30; // Ada'nın altına, ortaya doğru
            
            const cp5X = 650;
            const cp5Y = canvas.height - 50; // Daha sağa, yukarı kıvrılma başlangıcı
            
            const cp6X = islandX - 80;
            const cp6Y = canvas.height - 100; // Ada'nın sol tarafına, yukarı
            
            // Üçüncü bölüm: Ada'ya yukarıdan yaklaşma
            const cp7X = islandX - 40;
            const cp7Y = islandY + 150; // Ada'nın ortasına, alt kısmına doğru
            
            // Bezier curve ile kıvrımlı rota (3 bezier curve birleştiriyoruz)
            let t = progress;
            let x, y;
            
            if (t < 0.33) {
                // İlk bölüm: İskeleden sağa doğru
                t = t / 0.33;
                const t1 = 1 - t;
                x = startX * t1 * t1 * t1 + 
                    cp1X * 3 * t1 * t1 * t + 
                    cp2X * 3 * t1 * t * t + 
                    cp3X * t * t * t;
                y = startY * t1 * t1 * t1 + 
                    cp1Y * 3 * t1 * t1 * t + 
                    cp2Y * 3 * t1 * t * t + 
                    cp3Y * t * t * t;
            } else if (t < 0.66) {
                // İkinci bölüm: Sağa, ada'nın altına
                t = (t - 0.33) / 0.33;
                const t1 = 1 - t;
                x = cp3X * t1 * t1 * t1 + 
                    cp4X * 3 * t1 * t1 * t + 
                    cp5X * 3 * t1 * t * t + 
                    cp6X * t * t * t;
                y = cp3Y * t1 * t1 * t1 + 
                    cp4Y * 3 * t1 * t1 * t + 
                    cp5Y * 3 * t1 * t * t + 
                    cp6Y * t * t * t;
            } else {
                // Üçüncü bölüm: Ada'ya yukarıdan yaklaşma, ortasına alt kısım
                t = (t - 0.66) / 0.34;
                const t1 = 1 - t;
                // Ara kontrol noktası (ada'nın sol tarafından ortasına geçiş)
                const cp8X = islandX - 20;
                const cp8Y = islandY + 80;
                
                x = cp6X * t1 * t1 * t1 + 
                    cp7X * 3 * t1 * t1 * t + 
                    cp8X * 3 * t1 * t * t + 
                    endX * t * t * t;
                y = cp6Y * t1 * t1 * t1 + 
                    cp7Y * 3 * t1 * t1 * t + 
                    cp8Y * 3 * t1 * t * t + 
                    endY * t * t * t;
            }
            
            return { x, y };
        }

        // Tekne güncelleme (rotada hareket)
        function updateBoat() {
            // Sadece island sahnesinde çalış
            if (game.sceneState !== 'island') return;
            
            if (!boat.isMoving) return;
            
            boat.routeProgress += boat.speed;
            
            if (boat.routeProgress >= 1) {
                boat.routeProgress = 1;
                boat.isMoving = false; // Rotanın sonuna ulaştı
                
                // Tekne adaya ulaştı, yeni sahneye geç
                game.sceneState = 'onIsland';
                initializeOnIslandScene();
                return; // Geçiş yapıldı, daha fazla güncelleme yapma
            }
            
            // Teknenin pozisyonunu hesapla
            const pos = getBoatPosition(boat.routeProgress);
            boat.x = pos.x;
            boat.y = pos.y;
            
            // Teknenin açısını hesapla (hareket yönüne göre)
            const nextProgress = Math.min(1, boat.routeProgress + 0.01);
            const nextPos = getBoatPosition(nextProgress);
            boat.angle = Math.atan2(nextPos.y - boat.y, nextPos.x - boat.x);
        }

        // Tekne çizme
        function drawBoat() {
            if (game.sceneState !== 'island') return;
            
            updateBoat();
            
            ctx.save();
            
            // Tekneyi pozisyona ve açıya göre çiz
            ctx.translate(boat.x, boat.y);
            ctx.rotate(boat.angle);
            
            // Tekne gövdesi (kahverengi)
            ctx.fillStyle = '#654321';
            ctx.beginPath();
            ctx.ellipse(0, 0, boat.width / 2, boat.height / 2, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Tekne kenarlığı
            ctx.strokeStyle = '#4A3728';
                ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(0, 0, boat.width / 2, boat.height / 2, 0, 0, Math.PI * 2);
            ctx.stroke();
            
            // Tekne direği
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(-2, -boat.height / 2 - 15, 4, 15);
            
            // Tekne bayrağı
            ctx.fillStyle = '#FF0000';
            ctx.beginPath();
            ctx.moveTo(2, -boat.height / 2 - 15);
            ctx.lineTo(2, -boat.height / 2 - 5);
            ctx.lineTo(15, -boat.height / 2 - 10);
            ctx.closePath();
            ctx.fill();
            
            // Tekne içi detay
            ctx.fillStyle = '#8B4513';
            ctx.beginPath();
            ctx.ellipse(0, 0, boat.width / 2 - 5, boat.height / 2 - 5, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }

        // Draw road (yol) - Kaldırım zemin
        function drawRoad() {
            // Zemin seviyesi
            const groundLevel = GROUND_LEVEL;
            const roadHeight = 70;
            // Kaldırımın üst yüzeyi groundLevel'da, aşağıya doğru çiziliyor
            const screenY = groundLevel - camera.y;
            
            // Basit düz gri kaldırım çiz (aşağıya doğru)
            ctx.fillStyle = '#C0C0C0'; // Açık gri kaldırım
            ctx.fillRect(-camera.x, screenY, game.mapWidth, roadHeight);
            
            // Üst kısmına hafif bir gölge/kenarlık ekle (derinlik için)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(-camera.x, screenY, game.mapWidth, 2);
            
            // Alt kısmına da hafif bir gölge ekle
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(-camera.x, screenY + roadHeight - 2, game.mapWidth, 2);
        }

        // Draw buildings (binalar) - Yeni sprite yapısı
        function drawBuildings() {
            // Zemin seviyesi
            const groundLevel = GROUND_LEVEL;
            
            // Bina kategorileri
            const smallBuildings = [
                'smallCandyShop', 'smallBar', 'smallFlorist', 'smallElectronicsShop',
                'smallGunShop', 'smallJewelleryShop', 'smallIceCreamShop', 'smallBank'
            ];
            
            const largeBuildings = [
                'largeBank', 'largeBar', 'largeCandyShop', 'largeElectronicsShop',
                'largeFlorist', 'largeGroceryShop', 'largeGunShop', 'largeIceCreamShop',
                'largeJewelleryShop', 'normalBlue', 'normalGreen', 'normalRed',
                'normalPurple', 'normalPink', 'normalLightBlue', 'blankShopBlack',
                'blankShopBlue', 'blankShopBrown', 'blankShopPurple', 'blankShopRed',
                'blankShopYellow', 'blankShopYellow2', 'blankShop2D', 'mutedBlue',
                'mutedBrown', 'mutedGrayscale', 'mutedGreen', 'mutedPurple'
            ];
            
            // Pattern: 2 küçük, 1 büyük, 2 küçük, 1 büyük...
            let buildings = [];
            let currentX = 50;
            const minSpacing = 20; // Minimum binalar arası boşluk
            
            let smallIndex = 0;
            let largeIndex = 0;
            
            // Binaları iskele pozisyonuna kadar çiz (iskele varsa)
            // İskele pozisyonu hesaplanmışsa, binaları iskele önünde bitir
            let maxBuildings = 30; // Varsayılan 30 bina
            if (dockX !== null) {
                // İskele pozisyonuna kadar kaç bina çizileceğini hesapla
                // İskele pozisyonundan önce durmalı
                let tempX = 50;
                let tempSmallIndex = 0;
                let tempLargeIndex = 0;
                let buildingCount = 0;
                
                for (let i = 0; i < 30; i++) {
                    const patternPos = i % 3;
                    let spriteKey;
                    
                    if (patternPos === 0 || patternPos === 1) {
                        spriteKey = smallBuildings[tempSmallIndex % smallBuildings.length];
                        tempSmallIndex++;
                    } else {
                        spriteKey = largeBuildings[tempLargeIndex % largeBuildings.length];
                        tempLargeIndex++;
                    }
                    
                    const buildingSprite = sprites.buildings[spriteKey];
                    const buildingWidth = (buildingSprite && buildingSprite.complete) ? buildingSprite.width : 180;
                    
                    // Bu bina iskele pozisyonundan önce mi?
                    if (tempX + buildingWidth <= dockX - 20) { // 20px boşluk bırak
                        buildingCount++;
                        tempX += buildingWidth + minSpacing;
                    } else {
                        // İskele pozisyonuna ulaşıldı, dur
                        break;
                    }
                }
                maxBuildings = buildingCount;
            }
            
            let firstLargeDrinkShopIndex = -1; // İlk büyük içecek satan binanın indeksi
            
            for (let i = 0; i < maxBuildings; i++) {
                const patternPos = i % 3; // 0, 1, 2 (2 küçük, 1 büyük)
                
                let spriteKey;
                let isLargeDrinkShop = false;
                
                if (patternPos === 0 || patternPos === 1) {
                    // İki küçük bina
                    spriteKey = smallBuildings[smallIndex % smallBuildings.length];
                    smallIndex++;
                } else {
                    // Bir büyük bina
                    spriteKey = largeBuildings[largeIndex % largeBuildings.length];
                    
                    // İlk büyük içecek satan bina (largeBar) bulunca işaretle
                    if (firstLargeDrinkShopIndex === -1 && spriteKey === 'largeBar') {
                        firstLargeDrinkShopIndex = i;
                        isLargeDrinkShop = true;
                    }
                    
                    largeIndex++;
                }
                
                // Bina sprite'ının genişliğini kontrol et
                const buildingSprite = sprites.buildings[spriteKey];
                const buildingWidth = (buildingSprite && buildingSprite.complete) ? buildingSprite.width : 180;
                
                buildings.push({ 
                    x: currentX, 
                    spriteKey: spriteKey,
                    isCaffeNero: isLargeDrinkShop // Caffè Nero işareti
                });
                
                // Caffè Nero binasının pozisyonunu kaydet (sprite yüklendiyse ve henüz set edilmediyse)
                if (isLargeDrinkShop && caffeNeroX === null) {
                    const buildingSprite = sprites.buildings[spriteKey];
                    if (buildingSprite && buildingSprite.complete && buildingSprite.width > 0) {
                        caffeNeroX = currentX;
                        caffeNeroWidth = buildingSprite.width;
                    }
                }
                
                // Bir sonraki binanın X pozisyonu: mevcut bina genişliği + minimum boşluk
                currentX += buildingWidth + minSpacing;
                
                // Son binanın pozisyonunu kaydet (karakter sınırı için)
                lastBuildingX = currentX - minSpacing; // Bina sonu
                lastBuildingWidth = buildingWidth;
            }
            
            // Binaları çizmek için önce genişliklerini hesapla (sprite yüklenmiş olsa bile kontrol için)
            const buildingsToDraw = [];
            buildings.forEach(building => {
                const buildingSprite = sprites.buildings[building.spriteKey];
                
                // Sprite yüklenene kadar bekle
                if (!buildingSprite || !buildingSprite.complete || buildingSprite.width === 0) {
                    return; // Sprite henüz yüklenmedi, atla
                }
                
                const screenX = building.x - camera.x;
                const buildingWidth = buildingSprite.width;
                const buildingHeight = buildingSprite.height;
                const buildingTop = groundLevel - buildingHeight;
                const screenY = buildingTop - camera.y;
                
                // Sadece ekranda görünen binaları çiz
                if (screenX + buildingWidth > 0 && screenX < canvas.width) {
                    buildingsToDraw.push({
                        sprite: buildingSprite,
                        screenX: screenX,
                        screenY: screenY,
                        width: buildingWidth,
                        height: buildingHeight,
                        isCaffeNero: building.isCaffeNero || false // Caffè Nero işareti
                    });
                }
            });
            
            // Binaları çiz - z-order: X pozisyonuna göre (perspektif efekti)
            // Solda olanlar arkada, sağda olanlar önde çizilmeli
            buildingsToDraw.sort((a, b) => {
                // X pozisyonuna göre sırala (soldaki önce - arkada çizilir)
                return a.screenX - b.screenX;
            });
            
            buildingsToDraw.forEach(building => {
                // Hafif gölge efekti (binaların altına)
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.fillRect(building.screenX + 3, building.screenY + building.height, building.width - 2, 5);
                
                // Bina sprite'ını çiz
                ctx.drawImage(building.sprite, building.screenX, building.screenY, building.width, building.height);
                
                // Caffè Nero yazısını çiz (tente üzerine)
                if (building.isCaffeNero) {
                    // Tente genellikle binanın üst 1/4'lük kısmında, yaklaşık olarak
                    const tentHeight = building.height * 0.25; // Tente yüksekliği (binanın %25'i)
                    const tentY = building.screenY; // Tente en üstte
                    
                    // Metin stilleri
                    ctx.save();
                    ctx.font = 'bold 32px Arial'; // Yazı boyutu artırıldı (24'ten 32'ye)
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    // Beyaz outline efekti için
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 5;
                    ctx.lineJoin = 'round';
                    
                    // Metin rengi (mavi)
                    ctx.fillStyle = '#0066CC';
                    
                    // Metin pozisyonu (tentenin ortası, biraz aşağıya kaydırıldı)
                    const textX = building.screenX + building.width / 2;
                    const textY = tentY + tentHeight / 2 + 8; // 8 piksel aşağıya kaydırıldı
                    
                    // Outline çiz
                    ctx.strokeText('Caffè Nero', textX, textY);
                    // Metin çiz
                    ctx.fillText('Caffè Nero', textX, textY);
                    
                    ctx.restore();
                }
            });

            // Show "E" prompt for Caffè Nero building if player is near
            if (caffeNeroX !== null && caffeNeroWidth !== null && game.sceneState === 'gameplay' && !dialog.isOpen) {
                const playerCenterX = player.x + player.width / 2;
                const buildingCenterX = caffeNeroX + caffeNeroWidth / 2;
                const distanceX = Math.abs(playerCenterX - buildingCenterX);
                
                if (distanceX < 100 && player.y + player.height >= groundLevel - 10) {
                    const buildingScreenX = caffeNeroX + caffeNeroWidth / 2 - camera.x;
                    const buildingScreenY = groundLevel - camera.y - 120; // Binanın üstünde, görünür pozisyon

                    ctx.fillStyle = 'white';
                    ctx.strokeStyle = 'black';
                    ctx.lineWidth = 3;
                    ctx.font = 'bold 20px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.strokeText('E', buildingScreenX, buildingScreenY);
                    ctx.fillText('E', buildingScreenX, buildingScreenY);
                    ctx.textAlign = 'left'; // Reset
                    ctx.textBaseline = 'alphabetic'; // Reset
                }
            }
        }

        // Draw dialog
        function drawDialog() {
            if (!dialog.isOpen) return;

            // Darken background
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dialog box boyutları
            const dialogX = 150;
            const dialogY = 200;
            const dialogWidth = 500;
            const textPadding = 40;
            const maxTextWidth = dialogWidth - (textPadding * 2);
            const lineHeight = 28;
            
            // Metinleri sarmala
            ctx.font = 'bold 20px Arial';
            const textLines = wrapText(dialog.text, maxTextWidth, 'bold 20px Arial');
            let text2Lines = [];
            if (dialog.text2) {
                text2Lines = wrapText(dialog.text2, maxTextWidth, 'bold 20px Arial');
            }
            
            // Toplam metin yüksekliğini hesapla
            const textHeight = textLines.length * lineHeight;
            const text2Height = text2Lines.length * lineHeight;
            const textGap = text2Lines.length > 0 ? 15 : 0;
            const totalTextHeight = textHeight + text2Height + textGap;
            
            // Cevaplar için alan (dinamik hesaplama)
            const drawAnswerHeight = 40;
            const drawAnswerBoxWidth = dialogWidth - 100;
            const drawAnswerTextWidth = drawAnswerBoxWidth - 40;
            ctx.font = '16px Arial';
            let drawTotalAnswerHeight = 0;
            dialog.answers.forEach((answer, index) => {
                const answerText = answer;
                const answerLines = wrapText(answerText, drawAnswerTextWidth, '16px Arial');
                const answerBoxHeight = Math.max(drawAnswerHeight, answerLines.length * 22 + 16);
                drawTotalAnswerHeight += answerBoxHeight + 10; // 10px boşluk
            });
            const answerAreaHeight = drawTotalAnswerHeight;
            
            // Dialog box yüksekliği dinamik olarak ayarla
            const dialogHeight = Math.max(300, totalTextHeight + answerAreaHeight + 100);
            const dialogBoxY = dialogY + (300 - dialogHeight) / 2; // Merkeze hizala veya minimum yükseklik

            // Dialog box
            ctx.fillStyle = 'white';
            ctx.roundRect(dialogX, dialogBoxY, dialogWidth, dialogHeight, 10);
            ctx.fill();

            // Gölge efekti için border
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.lineWidth = 2;
            ctx.roundRect(dialogX, dialogBoxY, dialogWidth, dialogHeight, 10);
            ctx.stroke();

            // Metin başlangıç pozisyonu
            let currentY = dialogBoxY + 50;
            
            // Question text (dialog.text)
            ctx.fillStyle = 'black';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'left';
            textLines.forEach((line, index) => {
                ctx.fillText(line, dialogX + textPadding, currentY + (index * lineHeight));
            });
            currentY += textHeight + textGap;
            
            // Question text2 (dialog.text2) - varsa
            if (text2Lines.length > 0) {
                ctx.font = 'bold 18px Arial';
                text2Lines.forEach((line, index) => {
                    ctx.fillText(line, dialogX + textPadding, currentY + (index * lineHeight));
                });
                currentY += text2Height + 20;
            }

            // Answers
            ctx.font = '16px Arial';
            const renderAnswerBoxWidth = dialogWidth - 100;
            const renderAnswerTextWidth = renderAnswerBoxWidth - 40; // Padding için
            let renderAnswerOffsetY = 0;
            
            dialog.answers.forEach((answer, index) => {
                const answerY = currentY + renderAnswerOffsetY;
                
                // Cevap metnini sarmala
                const answerText = answer;
                const answerLines = wrapText(answerText, renderAnswerTextWidth, '16px Arial');
                const renderAnswerHeight = 40;
                const answerBoxHeight = Math.max(renderAnswerHeight, answerLines.length * 22 + 16); // Dinamik yükseklik
                
                // Answer box hover efekti için (basit)
                ctx.fillStyle = '#f0f0f0';
                ctx.fillRect(dialogX + 50, answerY, renderAnswerBoxWidth, answerBoxHeight);

                // Answer border
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.strokeRect(dialogX + 50, answerY, renderAnswerBoxWidth, answerBoxHeight);

                // Answer text (çok satırlı)
                ctx.fillStyle = 'black';
                answerLines.forEach((line, lineIndex) => {
                    ctx.fillText(line, dialogX + 70, answerY + 20 + (lineIndex * 22));
                });
                
                // Sonraki cevap için Y pozisyonunu güncelle
                renderAnswerOffsetY += answerBoxHeight + 10; // 10px boşluk
            });

            ctx.textAlign = 'left';
        }

        // Draw HUD (Ana menü butonu - kamera ile hareket etmez)
        function drawHUD() {
            // Sadece playing state'inde HUD çiz
            if (game.state !== 'playing') {
                return;
            }

            // Ana menü butonu (sağ üst köşe) - kamera offset'siz, sabit pozisyon
            const buttonX = canvas.width - 60;
            const buttonY = 10;
            const buttonSize = 50;

            // Button background (daire)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.beginPath();
            ctx.arc(buttonX + buttonSize/2, buttonY + buttonSize/2, buttonSize/2, 0, Math.PI * 2);
            ctx.fill();

            // Button border (altın renk)
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(buttonX + buttonSize/2, buttonY + buttonSize/2, buttonSize/2, 0, Math.PI * 2);
            ctx.stroke();

            // Ev ikonu
            ctx.fillStyle = 'white';
            ctx.font = '28px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🏠', buttonX + buttonSize/2, buttonY + buttonSize/2);

            // Buton pozisyonunu kaydet (tıklama kontrolü için)
            game.backButton = { x: buttonX, y: buttonY, width: buttonSize, height: buttonSize };

            // Reset text alignment
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
        }

        // Create spotlight clip regions (sadece ışık bölgelerinde çizim yapılsın)
        function createSpotlightClip() {
            const lightTopY = 0;
            const topWidth = 40;
            const bottomWidth = 140;

            // Rakun spotlight bölgesi
            const raccoonScreenX = player.x - camera.x + player.width / 2;
            const raccoonScreenY = player.y - camera.y + player.height / 2;
            const raccoonBottomY = raccoonScreenY + 100;

            ctx.beginPath();
            ctx.moveTo(raccoonScreenX - topWidth/2, lightTopY);
            ctx.lineTo(raccoonScreenX + topWidth/2, lightTopY);
            ctx.lineTo(raccoonScreenX + bottomWidth/2, raccoonBottomY);
            ctx.lineTo(raccoonScreenX - bottomWidth/2, raccoonBottomY);
            ctx.closePath();

            // Kirpi spotlight bölgesi
            const hedgehogScreenX = hedgehog.x - camera.x + hedgehog.width / 2;
            const hedgehogScreenY = hedgehog.y - camera.y + hedgehog.height / 2;
            const hedgehogBottomY = hedgehogScreenY + 100;

            ctx.moveTo(hedgehogScreenX - topWidth/2, lightTopY);
            ctx.lineTo(hedgehogScreenX + topWidth/2, lightTopY);
            ctx.lineTo(hedgehogScreenX + bottomWidth/2, hedgehogBottomY);
            ctx.lineTo(hedgehogScreenX - bottomWidth/2, hedgehogBottomY);
            ctx.closePath();

            // Clip uygula
            ctx.clip();
        }

        // Draw spotlight beams (ışık hüzmelerini çiz)
        function drawSpotlightBeams() {
            const lightTopY = 0;
            const topWidth = 40;
            const bottomWidth = 140;

            // Rakun için ışık hüzmesi
            const raccoonScreenX = player.x - camera.x + player.width / 2;
            const raccoonScreenY = player.y - camera.y + player.height / 2;
            const raccoonBottomY = raccoonScreenY + 100;

            const raccoonGradient = ctx.createLinearGradient(
                raccoonScreenX, lightTopY,
                raccoonScreenX, raccoonBottomY
            );
            raccoonGradient.addColorStop(0, 'rgba(200, 220, 255, 0.15)');
            raccoonGradient.addColorStop(0.5, 'rgba(200, 220, 255, 0.2)');
            raccoonGradient.addColorStop(1, 'rgba(200, 220, 255, 0.25)');

            ctx.fillStyle = raccoonGradient;
            ctx.beginPath();
            ctx.moveTo(raccoonScreenX - topWidth/2, lightTopY);
            ctx.lineTo(raccoonScreenX + topWidth/2, lightTopY);
            ctx.lineTo(raccoonScreenX + bottomWidth/2, raccoonBottomY);
            ctx.lineTo(raccoonScreenX - bottomWidth/2, raccoonBottomY);
            ctx.closePath();
            ctx.fill();

            // Kirpi için ışık hüzmesi
            const hedgehogScreenX = hedgehog.x - camera.x + hedgehog.width / 2;
            const hedgehogScreenY = hedgehog.y - camera.y + hedgehog.height / 2;
            const hedgehogBottomY = hedgehogScreenY + 100;

            const hedgehogGradient = ctx.createLinearGradient(
                hedgehogScreenX, lightTopY,
                hedgehogScreenX, hedgehogBottomY
            );
            hedgehogGradient.addColorStop(0, 'rgba(200, 220, 255, 0.15)');
            hedgehogGradient.addColorStop(0.5, 'rgba(200, 220, 255, 0.2)');
            hedgehogGradient.addColorStop(1, 'rgba(200, 220, 255, 0.25)');

            ctx.fillStyle = hedgehogGradient;
            ctx.beginPath();
            ctx.moveTo(hedgehogScreenX - topWidth/2, lightTopY);
            ctx.lineTo(hedgehogScreenX + topWidth/2, lightTopY);
            ctx.lineTo(hedgehogScreenX + bottomWidth/2, hedgehogBottomY);
            ctx.lineTo(hedgehogScreenX - bottomWidth/2, hedgehogBottomY);
            ctx.closePath();
            ctx.fill();
        }

        // Draw intro screen
        function drawIntroScreen() {
            // Sadece intro state'inde intro ekranını çiz
            if (game.state !== 'intro') {
                return;
            }

            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0bd6a6');
            gradient.addColorStop(1, '#052b22');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Title
            ctx.fillStyle = 'white';
            ctx.strokeStyle = '#14100e';
            ctx.lineWidth = 4;
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.strokeText('Fakat Rakun, bu derin bi Tutku!', canvas.width/2, 100);
            ctx.fillText('Fakat Rakun, bu derin bi Tutku!', canvas.width/2, 100);

            // Characters
            ctx.font = '80px Arial';
            ctx.fillText('🦝', canvas.width/2 - 80, 200);
            ctx.fillText('🦔', canvas.width/2 + 80, 200);

            // Description - çok satırlı
            ctx.font = '16px Arial';
            ctx.fillStyle = 'white';
            const lineHeight = 22;
            let startY = 320;

            ctx.fillText("Kirpi uzun zaman karanlıkta yürüdü. Hayat yorucuydu, her gün ağırdı,", canvas.width/2, startY);
            ctx.fillText("kimse yoktu yanında. Sonra Rakun geldi...Ve her şey değişti.", canvas.width/2, startY + lineHeight);
            ctx.fillText("Rakun, Kirpi'ye dünyayı yeniden sevmeyi öğretti.", canvas.width/2, startY + lineHeight * 2);
            ctx.fillText("Şimdi birlikte yaşadıkları maceraların, güldükleri anların ve", canvas.width/2, startY + lineHeight * 3);
            ctx.fillText("birbirlerine verdikleri mutluluğun hikayesini keşfet!", canvas.width/2, startY + lineHeight * 4);

            // Start button - SADECE intro state'inde çiz ve kaydet
            if (game.state === 'intro') {
                const buttonX = canvas.width/2 - 100;
                const buttonY = 460;
                const buttonWidth = 200;
                const buttonHeight = 50;

                // Button background
                ctx.fillStyle = '#401507';
                ctx.roundRect(buttonX, buttonY, buttonWidth, buttonHeight, 10);
                ctx.fill();

                // Button border (glow effect)
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 3;
                ctx.roundRect(buttonX, buttonY, buttonWidth, buttonHeight, 10);
                ctx.stroke();

                // Button text
                ctx.fillStyle = 'white';
                ctx.font = 'bold 24px Arial';
                ctx.fillText('BAŞLAT', canvas.width/2, buttonY + 33);

                // Store button position for click detection
                game.startButton = { x: buttonX, y: buttonY, width: buttonWidth, height: buttonHeight };
            } else {
                // Intro state'inde değilse start butonunu temizle
                game.startButton = null;
            }
        }

        // Draw verification screen (doğrulama quiz ekranı)
        function drawVerificationScreen() {
            if (game.state !== 'verification') {
                return;
            }

            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0bd6a6');
            gradient.addColorStop(1, '#052b22');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Title
            ctx.fillStyle = 'white';
            ctx.strokeStyle = '#14100e';
            ctx.lineWidth = 3;
            ctx.font = 'bold 22px Arial';
            ctx.textAlign = 'center';
            ctx.strokeText('Öyle bedava oyun oynamak yok. Sen de biraz efor göster..', canvas.width/2, 150);
            ctx.fillText('Öyle bedava oyun oynamak yok. Sen de biraz efor göster..', canvas.width/2, 150);

            // Question
            ctx.font = 'bold 48px Arial';
            ctx.fillStyle = 'white';
            ctx.fillText(verificationQuiz.question, canvas.width/2, 250);

            // Answer options
            const answerBoxY = 350;
            const answerHeight = 50;
            const answerSpacing = 60;

            verificationQuiz.answers.forEach((answer, index) => {
                const y = answerBoxY + index * answerSpacing;

                // Answer box background
                ctx.fillStyle = '#401507';
                ctx.beginPath();
                ctx.roundRect(250, y, 300, answerHeight, 10);
                ctx.fill();

                // Answer border
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.roundRect(250, y, 300, answerHeight, 10);
                ctx.stroke();

                // Answer text
                ctx.fillStyle = 'white';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(answer, canvas.width/2, y + answerHeight/2);
            });

            // Reset text alignment
            ctx.textAlign = 'center';
            ctx.textBaseline = 'alphabetic';

            // Error message (yanlış cevap uyarısı)
            if (verificationQuiz.errorMessage) {
                ctx.fillStyle = '#FF0000';
                ctx.strokeStyle = '#8B0000';
                ctx.lineWidth = 2;
                ctx.font = 'bold 28px Arial';
                ctx.strokeText(verificationQuiz.errorMessage, canvas.width/2, 560);
                ctx.fillText(verificationQuiz.errorMessage, canvas.width/2, 560);
            }

            // Reset text alignment
            ctx.textAlign = 'left';
        }

        // Helper for rounded rectangles
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
            };
        }

        // Game loop
        function gameLoop() {
            // Canvas'ı TAMAMEN temizle
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (game.state === 'intro') {
                // Intro screen - SADECE intro state'inde
                drawIntroScreen();
            } else if (game.state === 'verification') {
                // Verification screen - doğrulama sorusu
                drawVerificationScreen();
            } else if (game.state === 'playing') {
                // Playing screen - SADECE playing state'inde

                // Update
                // Açılış sahnesinde oyuncu hareket edemez
                if (!dialog.isOpen && (game.sceneState === 'gameplay' || game.sceneState === 'onIsland')) {
                    updatePlayer();
                    if (game.sceneState === 'gameplay') {
                        checkInteraction();  // Caffè Nero kontrolü (otomatik açılması için)
                    }
                    
                    // Rakun-İskele collision kontrolü (debug)
                    if (dockX !== null) {
                        // Rakun collision box
                        const raccoonLeft = player.x;
                        const raccoonRight = player.x + player.width;
                        const raccoonTop = player.y;
                        const raccoonBottom = player.y + player.height;
                        
                        // İskele collision box
                        const dockLeft = dockX;
                        const dockRight = dockX + dockWidth;
                        const dockTop = 500; // İskele platform üstü (tahmini)
                        const dockBottom = 575; // Ground level + 25 (iskele platform yüksekliği)
                        
                        // Collision kontrolü: AABB (Axis-Aligned Bounding Box)
                        const isColliding = !(raccoonRight < dockLeft || 
                                           raccoonLeft > dockRight || 
                                           raccoonBottom < dockTop || 
                                           raccoonTop > dockBottom);
                        
                        // İskele merkezinden mesafe kontrolü
                        const playerCenterX = player.x + player.width / 2;
                        const dockCenterX = dockX + dockWidth / 2;
                        const distanceX = Math.abs(playerCenterX - dockCenterX);
                        
                    }
                }
                updateHedgehog();  // Kirpi hareketi (açılış sahnesi)
                updateCamera();  // Kamerayı her zaman güncelle
                updateAnimation(sprites.raccoon);  // Rakun animasyonu güncelle
                updateHedgehogAnimation();  // Kirpi animasyonu güncelle

                // Draw - Scene state'e göre farklı çizim
                if (game.sceneState === 'opening') {
                    // Açılış sahnesi: Siyah ekran + spotlight efekti
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Spotlight clip bölgelerini ayarla ve içine çiz
                ctx.save();
                createSpotlightClip();

                // Clip bölgesi içinde: Işık hüzmeleri ve karakterleri çiz
                drawSpotlightBeams();
                drawHedgehog();
                drawPlayer();

                ctx.restore();
                } else if (game.sceneState === 'island') {
                    // Ada sahnesi: Deniz ve ada (tekne hareket ederken)
                    drawIsland();
                    // Karakterler ada sahnesinde görünmeyebilir veya tekne üzerinde olabilir
                    // Şimdilik sadece ada çiziyoruz
                } else if (game.sceneState === 'onIsland') {
                    // Ada üzerinde oyun sahnesi (karakterler adaya indikten sonra)
                    drawOnIsland();
                } else {
                    // Gameplay: Normal oyun ekranı
                    // Arka plan (gökyüzü gradient - daha zengin)
                    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                    gradient.addColorStop(0, '#B0E0E6');      // Açık mavi (üst)
                    gradient.addColorStop(0.6, '#87CEEB');    // Gökyüzü mavisi
                    gradient.addColorStop(1, '#E0F6FF');      // Çok açık mavi (alt - zemin üstü)
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // Oyun elemanlarını çiz (sıralama önemli - arkadan öne)
                    drawRoad();            // Yol en arkada (pavement)
                    drawBuildings();       // Binalar yolun üstünde (Caffè Nero "E" göstergesi içerir)
                    drawDock();            // İskele ve tekneler (binalardan sonra)
                    drawHedgehog();         // Kirpi karakteri
                    drawPlayer();           // Rakun karakteri (en önde)
                }

                drawHUD();       // HUD en üstte (kamera ile hareket etmez)
                drawDialog();    // Dialog en üstte olmalı
            }

            // Continue loop
            requestAnimationFrame(gameLoop);
        }

        // Start game
        // TEST: Direkt onIsland sahnesinden başla
        if (game.sceneState === 'onIsland') {
            initializeOnIslandScene();
        } else if (game.sceneState === 'island') {
            initializeBoat();
        }
        gameLoop();
    </script>
