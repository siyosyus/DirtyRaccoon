        // Istanbul-Datça rota pozisyonu hesaplama (3 satırlı, smooth geçişlerle)
        function getRoadTripPosition(progress) {
            // Istanbul tabelasının bitiş pozisyonu
            const istanbulTableX = 20;
            const tabelaWidth = 140;
            const istanbulTableRight = istanbulTableX + tabelaWidth; // Tabelanın sağ kenarı
            
            // Istanbul başlangıç pozisyonu (tabelanın bittiği pixelden +5 pixel sonra)
            const startX = istanbulTableRight + 5; // 20 + 140 + 5 = 165
            const startY = 80;
            
            // Datça tabelasının başlangıç pozisyonu
            const datcaTableX = canvas.width - 160;
            
            // Araba genişliği
            const carHalfWidth = roadTripCar.width / 2; // 160 / 2 = 80
            
            // Yol bitiş pozisyonu (Datça tabelasının başladığı yerden 10px önce)
            // Ancak arabanın merkezi bu noktada durduğunda, arabanın yarısı yolun dışına taşmamalı
            // Bu yüzden yolun gerçek bitiş çizgisi = endX + carHalfWidth olacak şekilde ayarlıyoruz
            const roadEndX = datcaTableX - 10; // (canvas.width - 160) - 10 = canvas.width - 170
            const endX = roadEndX - carHalfWidth; // Araba merkezinin durması gereken yer
            const endY = canvas.height - 100;
            
            // 3 satır için hesaplama
            // Satır 1: Sol -> Sağ (tamamen)
            // Geçiş 1: Sağ üst -> Sağ orta (smooth curve)
            // Satır 2: Sağ -> Sol (tamamen)
            // Geçiş 2: Sol orta -> Sol alt (smooth curve)
            // Satır 3: Sol -> Sağ (tamamen, Datça'ya)
            
            const totalWidth = endX - startX; // Toplam yol genişliği
            const rowSpacing = (endY - startY) / 2; // İki satır arası mesafe
            const row1Y = startY;
            const row2Y = startY + rowSpacing;
            const row3Y = endY;
            
            // Geçiş bölümlerinin uzunluğu (progress payı)
            const transitionProgress = 0.05; // Her geçiş %5 progress alır
            const rowProgress = (1 - transitionProgress * 2) / 3; // Her satır için progress
            
            let t = progress;
            let x, y;
            
            if (t < rowProgress) {
                // Satır 1: Sol -> Sağ (tamamen)
                t = t / rowProgress;
                x = startX + (totalWidth * t);
                y = row1Y;
            } else if (t < rowProgress + transitionProgress) {
                // Geçiş 1: Sağ üst -> Sağ orta (smooth curve aşağı)
                t = (t - rowProgress) / transitionProgress;
                // Bezier curve ile smooth geçiş (X+ ekseninde uzatılmış)
                const p1X = endX;
                const p1Y = row1Y;
                const cpX = endX + 100; // Sağa doğru daha fazla uzatılmış (smooth görünüm için)
                const cpY = (row1Y + row2Y) / 2; // Orta nokta
                const p2X = endX;
                const p2Y = row2Y;
                x = p1X * (1-t) * (1-t) + cpX * 2 * (1-t) * t + p2X * t * t;
                y = p1Y * (1-t) * (1-t) + cpY * 2 * (1-t) * t + p2Y * t * t;
            } else if (t < rowProgress * 2 + transitionProgress) {
                // Satır 2: Sağ -> Sol (tamamen)
                t = (t - rowProgress - transitionProgress) / rowProgress;
                x = endX - (totalWidth * t);
                y = row2Y;
            } else if (t < rowProgress * 2 + transitionProgress * 2) {
                // Geçiş 2: Sol orta -> Sol alt (smooth curve aşağı)
                t = (t - rowProgress * 2 - transitionProgress) / transitionProgress;
                // Bezier curve ile smooth geçiş
                const p1X = startX;
                const p1Y = row2Y;
                const cpX = startX - 30; // Sola doğru hafif kıvrım (smooth görünüm)
                const cpY = (row2Y + row3Y) / 2; // Orta nokta
                const p2X = startX;
                const p2Y = row3Y;
                x = p1X * (1-t) * (1-t) + cpX * 2 * (1-t) * t + p2X * t * t;
                y = p1Y * (1-t) * (1-t) + cpY * 2 * (1-t) * t + p2Y * t * t;
            } else {
                // Satır 3: Sol -> Sağ (tamamen, Datça'ya)
                t = (t - rowProgress * 2 - transitionProgress * 2) / rowProgress;
                x = startX + (totalWidth * t);
                y = row3Y;
            }
            
            return { x, y };
        }
        
        // Yol segmentlerini hesapla (TÜM YOL baştan çizilecek - snake game değil)
        function getRoadPathSegments() {
            const segments = [];
            
            // Geçiş bölümlerinde daha fazla segment kullan (smooth görünüm için)
            const baseSegmentCount = 400; // Temel segment sayısı
            const transitionMultiplier = 5; // Geçiş bölümlerinde 5 kat daha fazla segment
            
            // TÜM yolu hesapla (0'dan 1'e kadar - araba ilerlemesi önemli değil)
            const transitionProgress = 0.05; // Her geçiş %5 progress alır
            const rowProgress = (1 - transitionProgress * 2) / 3; // Her satır için progress
            
            // Progress aralıklarını tanımla
            const row1End = rowProgress;
            const transition1End = rowProgress + transitionProgress;
            const row2End = rowProgress * 2 + transitionProgress;
            const transition2End = rowProgress * 2 + transitionProgress * 2;
            const row3End = 1;
            
            // Her bölüm için uygun sayıda segment hesapla
            let currentProgress = 0;
            const totalSegments = Math.ceil(
                (row1End * baseSegmentCount) + 
                ((transition1End - row1End) * baseSegmentCount * transitionMultiplier) +
                ((row2End - transition1End) * baseSegmentCount) +
                ((transition2End - row2End) * baseSegmentCount * transitionMultiplier) +
                ((row3End - transition2End) * baseSegmentCount)
            );
            
            // Segment sayısını normalize et
            for (let i = 0; i <= totalSegments; i++) {
                const progress = i / totalSegments;
                const pos = getRoadTripPosition(progress);
                segments.push(pos);
            }
            
            return segments;
        }
        
        // Istanbul-Datça arabası güncelleme
        function updateRoadTripCar() {
            if (game.sceneState !== 'istanbulDatca') return;
            if (!roadTripCar.isMoving) return;

                // Datça'ya ulaşıldı, Datça sahnesine geç
                game.sceneState = 'datca';
                initializeDatcaScene();
                return;
            }
            
            // Rotadan pozisyonu al
            const pos = getRoadTripPosition(roadTripCar.routeProgress);
            roadTripCar.x = pos.x;
            roadTripCar.y = pos.y;
            
            // Arabanın açısını hesapla (hareket yönüne göre)
            const nextProgress = Math.min(1, roadTripCar.routeProgress + 0.01);
            const nextPos = getRoadTripPosition(nextProgress);
            roadTripCar.angle = Math.atan2(nextPos.y - roadTripCar.y, nextPos.x - roadTripCar.x);
        }
        
        // Datça-Istanbul rota pozisyonu hesaplama (ters yön, 3 satırlı, smooth geçişlerle)
        function getRoadTripPositionReverse(progress) {

            // Istanbul bitiş pozisyonu (tabelanın bittiği pixelden +5 pixel sonra)
            // İstanbul-Datça ile aynı mantık: startX ile aynı hesaplama
            const roadStartX = istanbulTableRight + 5; // 20 + 140 + 5 = 165
            const endX = roadStartX + carHalfWidth; // Araba merkezinin bitiş yeri
            const endY = 80;
            
            // 3 satır için hesaplama (TERS YÖN - İstanbul->Datça'nın tam tersi)
            // Satır 1: Sağ -> Sol (tamamen) [İstanbul->Datça'nın Satır 3'ünün tersi]
            // Geçiş 1: Sol alt -> Sol orta (smooth curve yukarı) [İstanbul->Datça'nın Geçiş 2'nin tersi]
            // Satır 2: Sol -> Sağ (tamamen) [İstanbul->Datça'nın Satır 2'nin tersi]
            // Geçiş 2: Sağ orta -> Sağ üst (smooth curve yukarı) [İstanbul->Datça'nın Geçiş 1'in tersi]
            // Satır 3: Sağ -> Sol (tamamen, Istanbul'a) [İstanbul->Datça'nın Satır 1'in tersi]
            
            const totalWidth = startX - endX; // Toplam yol genişliği (ters yön)
            const rowSpacing = (startY - endY) / 2; // İki satır arası mesafe
            const row1Y = startY;
            const row2Y = startY - rowSpacing;
            const row3Y = endY;
            
            // Geçiş bölümlerinin uzunluğu (progress payı)
            const transitionProgress = 0.05; // Her geçiş %5 progress alır
            const rowProgress = (1 - transitionProgress * 2) / 3; // Her satır için progress
            
            let t = progress;
            let x, y;
            
            if (t < rowProgress) {
                // Satır 1: Sağ -> Sol (tamamen) - İstanbul->Datça'nın Satır 3'ünün tersi
                t = t / rowProgress;
                x = startX - (totalWidth * t);
                y = row1Y;
            } else if (t < rowProgress + transitionProgress) {
                // Geçiş 1: Sol alt -> Sol orta (smooth curve yukarı) - İstanbul->Datça'nın Geçiş 2'nin tersi
                t = (t - rowProgress) / transitionProgress;
                // Bezier curve ile smooth geçiş (X- ekseninde uzatılmış - İstanbul->Datça ile aynı mantık)
                const p1X = endX;
                const p1Y = row1Y;
                const cpX = endX - 30; // Sola doğru hafif kıvrım (İstanbul->Datça'nın startX - 30 ile simetrik)
                const cpY = (row1Y + row2Y) / 2; // Orta nokta
                const p2X = endX;
                const p2Y = row2Y;
                x = p1X * (1-t) * (1-t) + cpX * 2 * (1-t) * t + p2X * t * t;
                y = p1Y * (1-t) * (1-t) + cpY * 2 * (1-t) * t + p2Y * t * t;
            } else if (t < rowProgress * 2 + transitionProgress) {
                // Satır 2: Sol -> Sağ (tamamen) - İstanbul->Datça'nın Satır 2'nin tersi
                t = (t - rowProgress - transitionProgress) / rowProgress;
                x = endX + (totalWidth * t);
                y = row2Y;
            } else if (t < rowProgress * 2 + transitionProgress * 2) {
                // Geçiş 2: Sağ orta -> Sağ üst (smooth curve yukarı) - İstanbul->Datça'nın Geçiş 1'in tersi
                t = (t - rowProgress * 2 - transitionProgress) / transitionProgress;
                // Bezier curve ile smooth geçiş (X+ ekseninde uzatılmış - İstanbul->Datça ile aynı mantık)
                const p1X = startX;
                const p1Y = row2Y;
                const cpX = startX + 100; // Sağa doğru daha fazla uzatılmış (İstanbul->Datça'nın endX + 100 ile simetrik)
                const cpY = (row2Y + row3Y) / 2; // Orta nokta
                const p2X = startX;
                const p2Y = row3Y;
                x = p1X * (1-t) * (1-t) + cpX * 2 * (1-t) * t + p2X * t * t;
                y = p1Y * (1-t) * (1-t) + cpY * 2 * (1-t) * t + p2Y * t * t;
            } else {
                // Satır 3: Sağ -> Sol (tamamen, Istanbul'a) - İstanbul->Datça'nın Satır 1'in tersi
                t = (t - rowProgress * 2 - transitionProgress * 2) / rowProgress;
                x = startX - (totalWidth * t);
                y = row3Y;
            }
            
            return { x, y };
        }
        
        // Ters yön yol segmentlerini hesapla (Datça -> Istanbul)
        function getRoadPathSegmentsReverse() {

                boat.x = pos.x;

                // Teknenin açısını hesapla (hareket yönüne göre)
                const nextProgress = Math.min(1, boat.routeProgress + 0.01);
                const nextPos = getBoatPosition(nextProgress);
                boat.angle = Math.atan2(nextPos.y - boat.y, nextPos.x - boat.x);

            if (game.sceneState === 'islandReturn') {
                if (!boat.isMoving) return;
                
                boat.routeProgress += boat.speed;
                
                if (boat.routeProgress >= 1) {
                    boat.routeProgress = 1;
                    boat.isMoving = false;
                    
                    // Tekne iskeleye ulaştı, eve dönüş sahnesine geç

                    smallIndex++;
                } else {
                    // Bir büyük bina
                    spriteKey = largeBuildings[largeIndex % largeBuildings.length];
                    
                    // İlk büyük içecek satan bina (largeBar) bulunca işaretle
                    if (firstLargeDrinkShopIndex === -1 && spriteKey === 'largeBar') {
                        firstLargeDrinkShopIndex = i;
                        isLargeDrinkShop = true;
                    }
                    
                    largeIndex++;
                }
                
                // Bina sprite'ının genişliğini kontrol et
                const buildingSprite = sprites.buildings[spriteKey];
                const buildingWidth = (buildingSprite && buildingSprite.complete) ? buildingSprite.width : 180;
                
                buildings.push({ 
                    x: currentX, 
                    spriteKey: spriteKey,
                    isCaffeNero: isLargeDrinkShop // Caffè Nero işareti
                });
                
                // Caffè Nero binasının pozisyonunu kaydet (sprite yüklendiyse ve henüz set edilmediyse)
                if (isLargeDrinkShop && caffeNeroX === null) {
                    const buildingSprite = sprites.buildings[spriteKey];
                    if (buildingSprite && buildingSprite.complete && buildingSprite.width > 0) {
                        caffeNeroX = currentX;
                        caffeNeroWidth = buildingSprite.width;
                    }
                }
                
                // Bir sonraki binanın X pozisyonu: mevcut bina genişliği + minimum boşluk
                currentX += buildingWidth + minSpacing;
                
                // Son binanın pozisyonunu kaydet (karakter sınırı için)
                lastBuildingX = currentX - minSpacing; // Bina sonu
                lastBuildingWidth = buildingWidth;
            }
            
            // Binaları çizmek için önce genişliklerini hesapla (sprite yüklenmiş olsa bile kontrol için)
            const buildingsToDraw = [];
            buildings.forEach(building => {
                const buildingSprite = sprites.buildings[building.spriteKey];
                
                // Sprite yüklenene kadar bekle
                if (!buildingSprite || !buildingSprite.complete || buildingSprite.width === 0) {
                    return; // Sprite henüz yüklenmedi, atla
                }
                
                const screenX = building.x - camera.x;
                const buildingWidth = buildingSprite.width;
                const buildingHeight = buildingSprite.height;
                const buildingTop = groundLevel - buildingHeight;
                const screenY = buildingTop - camera.y;
                
                // Sadece ekranda görünen binaları çiz
                if (screenX + buildingWidth > 0 && screenX < canvas.width) {
                    buildingsToDraw.push({
                        sprite: buildingSprite,
                        screenX: screenX,
                        screenY: screenY,
                        width: buildingWidth,
                        height: buildingHeight,
                        isCaffeNero: building.isCaffeNero || false // Caffè Nero işareti
                    });
                }
            });
            
            // Binaları çiz - z-order: X pozisyonuna göre (perspektif efekti)
            // Solda olanlar arkada, sağda olanlar önde çizilmeli
            buildingsToDraw.sort((a, b) => {
                // X pozisyonuna göre sırala (soldaki önce - arkada çizilir)
                return a.screenX - b.screenX;
            });
            
            buildingsToDraw.forEach(building => {
                // Hafif gölge efekti (binaların altına)
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.fillRect(building.screenX + 3, building.screenY + building.height, building.width - 2, 5);
                
                // Bina sprite'ını çiz
                ctx.drawImage(building.sprite, building.screenX, building.screenY, building.width, building.height);
                
                // Caffè Nero yazısını çiz (tente üzerine)
                if (building.isCaffeNero) {
                    // Tente genellikle binanın üst 1/4'lük kısmında, yaklaşık olarak
                    const tentHeight = building.height * 0.25; // Tente yüksekliği (binanın %25'i)
                    const tentY = building.screenY; // Tente en üstte
                    
                    // Metin stilleri
                    ctx.save();
                    ctx.font = 'bold 32px Arial'; // Yazı boyutu artırıldı (24'ten 32'ye)
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    // Beyaz outline efekti için
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 5;
                    ctx.lineJoin = 'round';
                    
                    // Metin rengi (mavi)
                    ctx.fillStyle = '#0066CC';
                    
                    // Metin pozisyonu (tentenin ortası, biraz aşağıya kaydırıldı)
                    const textX = building.screenX + building.width / 2;
                    const textY = tentY + tentHeight / 2 + 8; // 8 piksel aşağıya kaydırıldı
                    
                    // Outline çiz
                    ctx.strokeText('Caffè Nero', textX, textY);
                    // Metin çiz
                    ctx.fillText('Caffè Nero', textX, textY);
                    
                    ctx.restore();
                }
            });

            // Show "E" prompt for Caffè Nero building if player is near
            if (caffeNeroX !== null && caffeNeroWidth !== null && game.sceneState === 'gameplay' && !dialog.isOpen && !game.caffeNeroDialogShown) {
                const playerCenterX = player.x + player.width / 2;
                const buildingY = GROUND_LEVEL; // Ground level
                const buildingStartX = caffeNeroX;
                const buildingEndX = caffeNeroX + caffeNeroWidth;
                
                // checkInteraction() ile aynı geniş kontrol alanı kullan
                const isNearBuilding = (playerCenterX >= buildingStartX - 100 && playerCenterX <= buildingEndX + 100);
                const playerOnGround = player.y + player.height >= buildingY - 10;
                
                if (isNearBuilding && playerOnGround) {
                    // Caffè Nero binasının sprite'ını al ve yüksekliğini hesapla
                    const caffeNeroSprite = sprites.buildings.largeBar;
                    const buildingHeight = (caffeNeroSprite && caffeNeroSprite.complete) ? caffeNeroSprite.height : 120;
                    
                    const buildingScreenX = caffeNeroX + caffeNeroWidth / 2 - camera.x;
                    // Binanın üst kenarından 10 pixel yukarıda: groundLevel - buildingHeight - 10
                    const buildingScreenY = groundLevel - buildingHeight - 10 - camera.y;

                    ctx.fillStyle = 'white';
                    ctx.strokeStyle = 'black';
                    ctx.lineWidth = 3;
                    ctx.font = 'bold 20px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.strokeText('E', buildingScreenX, buildingScreenY);
                    ctx.fillText('E', buildingScreenX, buildingScreenY);
                    ctx.textAlign = 'left'; // Reset
                    ctx.textBaseline = 'alphabetic'; // Reset
                }
            }
        }

        // Draw dialog
        function drawDialog() {
            if (!dialog.isOpen) return;

            // Darken background
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dialog box boyutları
            const dialogX = 150;
            const dialogY = 200;
            const dialogWidth = 500;
            const textPadding = 40;
            const maxTextWidth = dialogWidth - (textPadding * 2);
            const lineHeight = 28;
            
            // Metinleri sarmala
            ctx.font = 'bold 20px Arial';
            const textLines = wrapText(dialog.text, maxTextWidth, 'bold 20px Arial');
            let text2Lines = [];
            if (dialog.text2) {
                text2Lines = wrapText(dialog.text2, maxTextWidth, 'bold 20px Arial');
            }
            
            // Toplam metin yüksekliğini hesapla
            const textHeight = textLines.length * lineHeight;
            const text2Height = text2Lines.length * lineHeight;
            const textGap = text2Lines.length > 0 ? 15 : 0;
            const totalTextHeight = textHeight + text2Height + textGap;
            
            // Cevaplar için alan (dinamik hesaplama)
            const drawAnswerHeight = 40;
            const drawAnswerBoxWidth = dialogWidth - 100;
            const drawAnswerTextWidth = drawAnswerBoxWidth - 40;
            ctx.font = '16px Arial';
            let drawTotalAnswerHeight = 0;
            dialog.answers.forEach((answer, index) => {
                const answerText = answer;
                const answerLines = wrapText(answerText, drawAnswerTextWidth, '16px Arial');
                const answerBoxHeight = Math.max(drawAnswerHeight, answerLines.length * 22 + 16);
                drawTotalAnswerHeight += answerBoxHeight + 10; // 10px boşluk
            });
            const answerAreaHeight = drawTotalAnswerHeight;
            
            // Dialog box yüksekliği dinamik olarak ayarla
            const dialogHeight = Math.max(300, totalTextHeight + answerAreaHeight + 100);
            const dialogBoxY = dialogY + (300 - dialogHeight) / 2; // Merkeze hizala veya minimum yükseklik

            // Dialog box
            ctx.fillStyle = 'white';
            ctx.roundRect(dialogX, dialogBoxY, dialogWidth, dialogHeight, 10);
            ctx.fill();

            // Gölge efekti için border
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.lineWidth = 2;
            ctx.roundRect(dialogX, dialogBoxY, dialogWidth, dialogHeight, 10);
            ctx.stroke();

            // Metin başlangıç pozisyonu
            let currentY = dialogBoxY + 50;
            
            // Question text (dialog.text)
            ctx.fillStyle = 'black';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'left';
            textLines.forEach((line, index) => {
                ctx.fillText(line, dialogX + textPadding, currentY + (index * lineHeight));
            });
            currentY += textHeight + textGap;
            
            // Question text2 (dialog.text2) - varsa
            if (text2Lines.length > 0) {
                ctx.font = 'bold 18px Arial';
                text2Lines.forEach((line, index) => {
                    ctx.fillText(line, dialogX + textPadding, currentY + (index * lineHeight));
                });
                currentY += text2Height + 20;
            }

            // Answers
            ctx.font = '16px Arial';
            const renderAnswerBoxWidth = dialogWidth - 100;
            const renderAnswerTextWidth = renderAnswerBoxWidth - 40; // Padding için
            let renderAnswerOffsetY = 0;
            
            dialog.answers.forEach((answer, index) => {
                const answerY = currentY + renderAnswerOffsetY;
                
                // Cevap metnini sarmala
                const answerText = answer;
                const answerLines = wrapText(answerText, renderAnswerTextWidth, '16px Arial');
                const renderAnswerHeight = 40;
                const answerBoxHeight = Math.max(renderAnswerHeight, answerLines.length * 22 + 16); // Dinamik yükseklik
                
                // Answer box hover efekti için (basit)
                ctx.fillStyle = '#f0f0f0';
                ctx.fillRect(dialogX + 50, answerY, renderAnswerBoxWidth, answerBoxHeight);

                // Answer border
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.strokeRect(dialogX + 50, answerY, renderAnswerBoxWidth, answerBoxHeight);

                // Answer text (çok satırlı)
                ctx.fillStyle = 'black';
                answerLines.forEach((line, lineIndex) => {
                    ctx.fillText(line, dialogX + 70, answerY + 20 + (lineIndex * 22));
                });
                
                // Sonraki cevap için Y pozisyonunu güncelle
                renderAnswerOffsetY += answerBoxHeight + 10; // 10px boşluk
            });

            ctx.textAlign = 'left';
        }

        // Create spotlight clip regions (sadece ışık bölgelerinde çizim yapılsın)
        function createSpotlightClip() {
            const lightTopY = 0;
            const topWidth = 40;
            const bottomWidth = 140;

            // Rakun spotlight bölgesi
            const raccoonScreenX = player.x - camera.x + player.width / 2;
            const raccoonScreenY = player.y - camera.y + player.height / 2;
            const raccoonBottomY = raccoonScreenY + 100;

            ctx.beginPath();
            ctx.moveTo(raccoonScreenX - topWidth/2, lightTopY);
            ctx.lineTo(raccoonScreenX + topWidth/2, lightTopY);
            ctx.lineTo(raccoonScreenX + bottomWidth/2, raccoonBottomY);
            ctx.lineTo(raccoonScreenX - bottomWidth/2, raccoonBottomY);
            ctx.closePath();

            // Kirpi spotlight bölgesi
            const hedgehogScreenX = hedgehog.x - camera.x + hedgehog.width / 2;
            const hedgehogScreenY = hedgehog.y - camera.y + hedgehog.height / 2;
            const hedgehogBottomY = hedgehogScreenY + 100;

            ctx.moveTo(hedgehogScreenX - topWidth/2, lightTopY);
            ctx.lineTo(hedgehogScreenX + topWidth/2, lightTopY);
            ctx.lineTo(hedgehogScreenX + bottomWidth/2, hedgehogBottomY);
            ctx.lineTo(hedgehogScreenX - bottomWidth/2, hedgehogBottomY);
            ctx.closePath();

            // Clip uygula
            ctx.clip();
        }

        function drawSpotlightBeams() {
            const lightTopY = 0;

            const raccoonGradient = ctx.createLinearGradient(
                raccoonScreenX, lightTopY,

            );

            raccoonGradient.addColorStop(0.5, 'rgba(200, 220, 255, 0.2)');
            raccoonGradient.addColorStop(1, 'rgba(200, 220, 255, 0.25)');

            ctx.fillStyle = raccoonGradient;
            ctx.beginPath();
            ctx.moveTo(raccoonScreenX - topWidth/2, lightTopY);
            ctx.lineTo(raccoonScreenX + topWidth/2, lightTopY);
            ctx.lineTo(raccoonScreenX + bottomWidth/2, raccoonBottomY);
            ctx.lineTo(raccoonScreenX - bottomWidth/2, raccoonBottomY);
            ctx.closePath();
            ctx.fill();

            // Kirpi için ışık hüzmesi

            const hedgehogBottomY = hedgehogScreenY + 100;

            const hedgehogGradient = ctx.createLinearGradient(
                hedgehogScreenX, lightTopY,

            hedgehogGradient.addColorStop(0.5, 'rgba(200, 220, 255, 0.2)');
            hedgehogGradient.addColorStop(1, 'rgba(200, 220, 255, 0.25)');

            ctx.fillStyle = hedgehogGradient;

            ctx.moveTo(hedgehogScreenX - topWidth/2, lightTopY);

            ctx.lineTo(hedgehogScreenX + bottomWidth/2, hedgehogBottomY);

        // Helper for rounded rectangles
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
            };
        }

        // Game loop
        function gameLoop() {
            // Canvas'ı TAMAMEN temizle
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (game.state === 'intro') {
                // Intro screen - SADECE intro state'inde
                drawIntroScreen();
            } else if (game.state === 'verification') {
                // Verification screen - doğrulama sorusu
                drawVerificationScreen();
            } else if (game.state === 'playing') {
                // Playing screen - SADECE playing state'inde


                // Update
                // Açılış sahnesinde oyuncu hareket edemez
                // Datça sahnesinde karakterler arabadayken updatePlayer çağrılmasın
                if (!dialog.isOpen && (game.sceneState === 'gameplay' || game.sceneState === 'onIsland' || game.sceneState === 'returningHome' || (game.sceneState === 'datca' && !game.datcaCharactersInCar))) {
                    updatePlayer();
                    // checkInteraction() artık sadece E tuşuna basıldığında çağrılıyor
                    
                    // Rakun-İskele collision kontrolü (debug)
                    if (dockX !== null) {
                        // Rakun collision box
                        const raccoonLeft = player.x;
                        const raccoonRight = player.x + player.width;
                        const raccoonTop = player.y;
                        const raccoonBottom = player.y + player.height;
                        
                        // İskele collision box
                        const dockLeft = dockX;
                        const dockRight = dockX + dockWidth;
                        const dockTop = 500; // İskele platform üstü (tahmini)
                        const dockBottom = 575; // Ground level + 25 (iskele platform yüksekliği)
                        
                        // Collision kontrolü: AABB (Axis-Aligned Bounding Box)
                        const isColliding = !(raccoonRight < dockLeft || 
                                           raccoonLeft > dockRight || 
                                           raccoonBottom < dockTop || 
                                           raccoonTop > dockBottom);
                        
                        // İskele merkezinden mesafe kontrolü
                        const playerCenterX = player.x + player.width / 2;
                        const dockCenterX = dockX + dockWidth / 2;
                        const distanceX = Math.abs(playerCenterX - dockCenterX);
                        
                    }
                }
                // Datça sahnesinde karakterler arabadayken updateHedgehog çağrılmasın
                if (!(game.sceneState === 'datca' && game.datcaCharactersInCar)) {
                updateHedgehog();  // Kirpi hareketi (açılış sahnesi)
                }
                updateCamera();  // Kamerayı her zaman güncelle
                updateAnimation(sprites.raccoon);  // Rakun animasyonu güncelle
                updateHedgehogAnimation();  // Kirpi animasyonu güncelle
                updateCar();  // Araba hareketi (returningHome sahnesi)
                updateRoadTripCar();  // Istanbul-Datça arabası hareketi
                updateDatcaIstanbulCar();  // Datça-Istanbul arabası hareketi
                updateDatcaCar();  // Datça sahnesi arabası hareketi

                // Datça sahnesinde kirpinin otele ulaşmasını kontrol et
                if (game.sceneState === 'datca' && game.datcaHedgehogMovingToHotel && !game.datcaHedgehogReachedHotel) {
                    // Kirpi hedefe ulaştı mı?
                    if (hedgehog.targetX !== null && Math.abs(hedgehog.x - hedgehog.targetX) < 5) {
                        hedgehog.isMoving = false;
                        hedgehog.targetX = null;
                        game.datcaHedgehogMovingToHotel = false;
                        game.datcaHedgehogReachedHotel = true;

                        // Konuşma balonunu göster
                        hedgehog.showSpeechBubble = true;
                        hedgehog.speechText = 'Check-in yapalım da yemeğe gidelim yahu. Kurt gibi açım!!';
                        hedgehog.speechBubbleTimer = 300; // 5 saniye (60 fps * 5)
                    }
                }

                // Datça sahnesinde kirpinin son eve ulaşmasını kontrol et
                if (game.sceneState === 'datca' && game.datcaHedgehogMovingToLastHouse && !game.datcaHedgehogReachedLastHouse) {
                    // Kirpi hedefe ulaştı mı?
                    if (hedgehog.targetX !== null && Math.abs(hedgehog.x - hedgehog.targetX) < 5) {
                        hedgehog.isMoving = false;
                        hedgehog.targetX = null;
                        game.datcaHedgehogMovingToLastHouse = false;
                        game.datcaHedgehogReachedLastHouse = true;
                    }
                }

                // Datça sahnesinde karakterlerin arabaya ulaşmasını kontrol et
                if (game.sceneState === 'datca' && game.datcaCharactersMovingToCar) {
                    const playerReached = game.playerTargetX !== null && Math.abs(player.x - game.playerTargetX) < 50;
                    const hedgehogReached = hedgehog.targetX !== null && Math.abs(hedgehog.x - hedgehog.targetX) < 50;

                    if (playerReached && hedgehogReached) {
                        // Her iki karakter de arabaya ulaştı
                        player.velocityX = 0;
                        hedgehog.isMoving = false;
                        game.datcaCharactersMovingToCar = false;
                        game.playerTargetX = null;
                        hedgehog.targetX = null;

                        // Karakterler arabaya bin (görünmez ol)
                        game.datcaCharactersInCar = true;

                        // Araba ekrandan çıkmaya başlasın
                        game.datcaCarDrivingAway = true;
                    }
                }

                // Kirpi konuşma balonu timer'ı
                if (hedgehog.showSpeechBubble && hedgehog.speechBubbleTimer > 0) {
                    hedgehog.speechBubbleTimer--;
                    if (hedgehog.speechBubbleTimer <= 0) {
                        hedgehog.showSpeechBubble = false;
                        hedgehog.speechText = '';
                    }
                }

                // Draw - Scene state'e göre farklı çizim
                if (game.sceneState === 'opening') {
                    // Açılış sahnesi: Siyah ekran + spotlight efekti
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Spotlight clip bölgelerini ayarla ve içine çiz
                ctx.save();
                createSpotlightClip();

                // Clip bölgesi içinde: Işık hüzmeleri ve karakterleri çiz
                drawSpotlightBeams();
                drawHedgehog();
                drawPlayer();

                ctx.restore();
                } else if (game.sceneState === 'island' || game.sceneState === 'islandReturn') {
                    // Ada sahnesi: Deniz ve ada (tekne hareket ederken)
                    // islandReturn: Adadan iskeleye dönüş (ters rota)
                    drawIsland();
                    // Karakterler ada sahnesinde görünmeyebilir veya tekne üzerinde olabilir
                    // Şimdilik sadece ada çiziyoruz
                } else if (game.sceneState === 'onIsland') {
                    // Ada üzerinde oyun sahnesi (karakterler adaya indikten sonra)
                    drawOnIsland();
                } else if (game.sceneState === 'returningHome') {
                    // Eve dönüş sahnesi (onIsland benzeri görsel düzen)
                    drawReturningHome();
                } else if (game.sceneState === 'istanbulDatca') {
                    // Istanbul-Datça yolculuk sahnesi
                    drawIstanbulDatca();
                } else if (game.sceneState === 'datcaIstanbul') {
                    // Datça-Istanbul yolculuk sahnesi
                    drawDatcaIstanbul();
                } else if (game.sceneState === 'datca') {
                    // Datça sahnesi (onIsland benzeri)
                    drawDatca();
                    drawDatcaCar();  // Araba çiz (evlerden sonra, karakterlerden önce)
                } else {
                    // Gameplay: Normal oyun ekranı
                    // Arka plan (gökyüzü gradient - daha zengin)
                    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                    gradient.addColorStop(0, '#B0E0E6');      // Açık mavi (üst)
                    gradient.addColorStop(0.6, '#87CEEB');    // Gökyüzü mavisi
                    gradient.addColorStop(1, '#E0F6FF');      // Çok açık mavi (alt - zemin üstü)
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // Oyun elemanlarını çiz (sıralama önemli - arkadan öne)
                    drawRoad();            // Yol en arkada (pavement)
                    drawBuildings();       // Binalar yolun üstünde (Caffè Nero "E" göstergesi içerir)
                    drawDock();            // İskele ve tekneler (binalardan sonra)
                    drawHedgehog();         // Kirpi karakteri
                    drawPlayer();           // Rakun karakteri (en önde)
                }

                drawHUD();       // HUD en üstte (kamera ile hareket etmez)
                drawDialog();    // Dialog en üstte olmalı
                
                // Game Over ekranı (en üstte)
                if (game.gameOver) {
                    drawGameOver();
                }
            }

            // Continue loop
            requestAnimationFrame(gameLoop);
        }
        
        // Game Over ekranı çizimi
        function drawGameOver() {
            // Koyu arka plan (yarı şeffaf siyah)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // "Game Over" yazısı (büyük ve kırmızı)
            ctx.save();
            ctx.fillStyle = '#FF0000';
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 6;
            ctx.font = 'bold 120px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Yazıyı canvas ortasına çiz
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            // Gölge efekti
            ctx.strokeText('GAME OVER', centerX + 3, centerY + 3);
            ctx.fillText('GAME OVER', centerX, centerY);
            
            ctx.restore();
        }

        // Oyun ana menüden başlar (intro state)

        // Start game
        gameLoop();
    </script>
</body>
</html>
