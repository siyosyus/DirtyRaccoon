                const playerIsStationary = Math.abs(player.velocityX) < 0.5;
                const islandXWorld = canvas.width / 2;
                
                // Evlerin pozisyonlarını hesapla (otel pozisyonu için) - drawOnIsland ile aynı mantık
                const houseStartX = islandXWorld - 400;
                const houseSpacing = 40;
                const houseScale = 1.35;
                
                // Evlerin sırası: home1, home2, home1, home2, hotel, home1
                const housesPattern = [
                    { sprite: sprites.island.home1, name: 'home1' },
                    { sprite: sprites.island.home2, name: 'home2' },
                    { sprite: sprites.island.home1, name: 'home1' },
                    { sprite: sprites.island.home2, name: 'home2' },
                    { sprite: sprites.island.hotel, name: 'hotel' },
                    { sprite: sprites.island.home1, name: 'home1' }
                ];
                
                // Otel pozisyonunu bul (5. sırada - index 4)
                let hotelWorldX = null;
                let hotelWidth = 96 * houseScale; // Varsayılan
                
                let currentHouseX = houseStartX;
                for (let i = 0; i < housesPattern.length; i++) {
                    const house = housesPattern[i];
                    if (house.sprite && house.sprite.complete) {
                        const houseWidth = house.sprite.width * houseScale;
                        
                        // Otel pozisyonunu kaydet (5. ev - index 4)
                        if (i === 4 && house.name === 'hotel') {
                            hotelWorldX = currentHouseX;
                            hotelWidth = houseWidth;
                            break;
                        }
                        
                        // Bir sonraki ev pozisyonu
                        currentHouseX += houseWidth + houseSpacing;
                    }
                }
                
                // Eğer otel pozisyonu hesaplanamadıysa, fallback kullan
                if (hotelWorldX === null) {
                    hotelWorldX = houseStartX;
                    // İlk 4 evin genişliklerini topla
                    if (sprites.island.home1 && sprites.island.home1.complete && 
                        sprites.island.home2 && sprites.island.home2.complete) {
                        const home1Width = sprites.island.home1.width * houseScale;
                        const home2Width = sprites.island.home2.width * houseScale;
                        hotelWorldX += (home1Width + houseSpacing) + (home2Width + houseSpacing) + 
                                        (home1Width + houseSpacing) + (home2Width + houseSpacing);
                    }
                }
                
                // Baloncuk ayarları (sadece otel etkileşimi olmadıysa)
                if (!game.innEntered) {
                    hedgehog.showSpeechBubble = true;
                    hedgehog.speechText = 'Birlikte kaldığımız ilk otele gidiyoruz. Heyecanlı mısın?';
                    hedgehog.canMoveWithBubble = true;
                }
                
                // Eğer rakunun hareket etmesini bekliyorsa ve rakun hareket etti, ekran hedefini iptal et
                if (hedgehog.waitingForPlayer && !playerIsStationary) {
                    hedgehog.waitingForPlayer = false;
                    hedgehog.screenTargetX = null;
                    // canMoveWithBubble true ise baloncuk gösterilmeye devam etsin
                    
                    // Otel hedefini her zaman güncelle (doğru pozisyon)
                    const correctTargetX = hotelWorldX + (hotelWidth / 2) - hedgehog.width - 30;
                    hedgehog.targetX = correctTargetX;
                hedgehog.isMoving = true;
                }
                
                // Eğer ekran hedefinde bekliyorsa, ekran hedefinde kal
                if (hedgehog.waitingForPlayer && hedgehog.screenTargetX !== null) {
                    // Ekran pozisyonunu her frame güncelle (kamera hareket edebilir)
                    const targetScreenX = canvas.width * 0.7;
                    const targetWorldX = camera.x + targetScreenX;
                    hedgehog.screenTargetX = targetWorldX; // Hedefi güncelle
                    
                    const distanceToScreenTarget = Math.abs(hedgehog.x - targetWorldX);
                    
                    if (distanceToScreenTarget > 10) {
                        // Ekran hedefine doğru hareket et
                        hedgehog.isMoving = true;
                        if (hedgehog.x < targetWorldX) {
                            hedgehog.x += hedgehog.speed;
                        } else {
                            hedgehog.x -= hedgehog.speed;
                        }
                    } else {
                        // Ekran hedefinde dur ve baloncuk göster
                        hedgehog.isMoving = false;
                        hedgehog.showSpeechBubble = true;
                    }
                    return;
                }
                
                // Eğer hedef yoksa veya hedef yanlışsa (otel hedefine uymuyorsa), oteli hedef olarak ayarla
                const expectedTargetX = hotelWorldX + (hotelWidth / 2) - hedgehog.width - 30;
                if (hedgehog.targetX === null || Math.abs(hedgehog.targetX - expectedTargetX) > 100) {
                    // Hedef yoksa veya yanlışsa, doğru hedefi ayarla
                    hedgehog.targetX = expectedTargetX;
                    hedgehog.isMoving = true;
                }
                
                // Otel hedefine gitme mantığı
                if (hedgehog.targetX !== null && hedgehog.isMoving) {
                    const hedgehogCenterX = hedgehog.x + hedgehog.width / 2;
                    const targetCenterX = hedgehog.targetX + hedgehog.width / 2;
                    const distance = Math.abs(hedgehogCenterX - targetCenterX);
                    
                    // Kirpi ekrandan çıkmamalı
                    const hedgehogScreenX = hedgehog.x - camera.x;
                    const hedgehogIsVisible = hedgehogScreenX >= 0 && hedgehogScreenX <= canvas.width - hedgehog.width;
                    
                    // Gelecekteki pozisyonu kontrol et
                    let nextX = hedgehog.x;
                    if (hedgehog.x < hedgehog.targetX) {
                        nextX = hedgehog.x + hedgehog.speed;
                    } else {
                        nextX = hedgehog.x - hedgehog.speed;
                    }
                    const nextScreenX = nextX - camera.x;
                    const willBeVisible = nextScreenX >= 0 && nextScreenX <= canvas.width - hedgehog.width;
                    
                    // Eğer kirpi ekrandan çıkacaksa, dur ve ekranda görünür bir noktaya gel
                    if (!willBeVisible || nextScreenX + hedgehog.width > canvas.width * 0.7) {
                        // Ekrandan çıkacak, dur ve ekran hedefine gel
                        hedgehog.isMoving = false;
                        hedgehog.waitingForPlayer = true;
                        const targetScreenX = canvas.width * 0.7;
                        hedgehog.screenTargetX = camera.x + targetScreenX;
                        return;
                    }

                // Hedefe doğru hareket et
                    if (distance > 10) {
                    if (hedgehog.x < hedgehog.targetX) {
                        hedgehog.x += hedgehog.speed;
                    } else {
                        hedgehog.x -= hedgehog.speed;
                    }
                } else {
                        // Otel hedefine ulaşıldı
                        hedgehog.isMoving = false;
                        hedgehog.targetX = null;
                    }
                }
                return;
            }
            
            // OnIsland sahnesi: Otel etkileşimi tamamlandıktan sonra diyalog baloncuğunu koru
            if (game.sceneState === 'onIsland' && game.innEntered) {
                // Diyalog baloncuğu zaten ayarlanmış (handleAnswer'da), burada sadece koru
                // Eğer baloncuk gösterilmiyorsa ve metin eski metinse, yeni metni ayarla
                if (!hedgehog.showSpeechBubble || hedgehog.speechText === 'Birlikte kaldığımız ilk otele gidiyoruz. Heyecanlı mısın?') {
                    hedgehog.showSpeechBubble = true;
                    hedgehog.speechText = 'Bu kadar saçma bir şey ancak bizim başımıza gelebilirdi 😂';
                }
                // Hareket etmesini engelle veya istediğin davranışı ekle
                return;
            }
            
            // Gameplay sahnesi: Kirpi Caffè Nero binasına doğru yürür
            if (game.sceneState === 'gameplay') {
                // Rakunun hareket etmediğini kontrol et
                const playerIsStationary = Math.abs(player.velocityX) < 0.5;
                
                // Eğer rakunun hareket etmesini bekliyorsa ve rakun hareket etti, ekran hedefini iptal et
                // canMoveWithBubble true ise, rakun hareket edince kirpi hareket etmeye devam etsin
                if (hedgehog.waitingForPlayer && !playerIsStationary) {
                    hedgehog.waitingForPlayer = false;
                    hedgehog.screenTargetX = null;
                    // canMoveWithBubble true ise baloncuk gösterilmeye devam etsin
                    if (!hedgehog.canMoveWithBubble) {
                        hedgehog.showSpeechBubble = false;
                    }
                    
                    // Eğer hedef yoksa ve canMoveWithBubble true ise, yeni hedef belirle
                    if (hedgehog.targetX === null && hedgehog.canMoveWithBubble) {
                        // İskele pozisyonunu hesapla (eğer henüz hesaplanmadıysa)
                        if (dockX === null) {
                            calculateBuildingPositions();
                        }
                        // Hedef: Son binanın sonu veya iskele önü
                        if (lastBuildingX !== null) {
                            hedgehog.targetX = lastBuildingX - hedgehog.width - 10;
                        } else if (dockX !== null) {
                            hedgehog.targetX = dockX - hedgehog.width - 10;
                        } else {
                            // Son çare: İleri doğru hareket et
                            hedgehog.targetX = hedgehog.x + 2000;
                        }
                    }
                    
                    // Eğer hedef varsa, tekrar hareket etmeye başla
                    if (hedgehog.targetX !== null) {
                hedgehog.isMoving = true;
                    }
                }
                
                // Eğer ekran hedefinde bekliyorsa, ekran hedefinde kal
                if (hedgehog.waitingForPlayer && hedgehog.screenTargetX !== null) {
                    // Ekran pozisyonunu her frame güncelle (kamera hareket edebilir)
                    // canMoveWithBubble true ise %85, değilse %70 (Caffè Nero'dan önce)
                    const targetScreenX = hedgehog.canMoveWithBubble ? canvas.width * 0.85 : canvas.width * 0.7;
                    const targetWorldX = camera.x + targetScreenX;
                    hedgehog.screenTargetX = targetWorldX; // Hedefi güncelle
                    
                    const distanceToScreenTarget = Math.abs(hedgehog.x - targetWorldX);
                    
                    if (distanceToScreenTarget > 10) {
                        // Ekran hedefine doğru hareket et
                hedgehog.isMoving = true;
                        if (hedgehog.x < targetWorldX) {
                            hedgehog.x += hedgehog.speed;
                        } else {
                            hedgehog.x -= hedgehog.speed;
                        }
                    } else {
                        // Ekran hedefinde dur
                        hedgehog.isMoving = false;
                        // canMoveWithBubble true ise baloncuk zaten gösteriliyor, false ise göster
                        if (!hedgehog.canMoveWithBubble) {
                            hedgehog.showSpeechBubble = true;
                        }
                    }
                    return;
                }
                
                // Eğer hedef yoksa ve Caffè Nero pozisyonu biliniyorsa, hedefi ayarla (öncelik)
                if (hedgehog.targetX === null && caffeNeroX !== null && caffeNeroWidth !== null && !hedgehog.showSpeechBubble && !hedgehog.waitingForPlayer) {
                    hedgehog.targetX = caffeNeroX + (caffeNeroWidth / 2) - hedgehog.width - 30;
                    hedgehog.isMoving = true;
                    hedgehog.showSpeechBubble = false; // Henüz baloncuk gösterme
                }
                
                // Caffè Nero binasına gitme mantığı (öncelikli - eğer hedef varsa)
                // Eğer baloncuk gösterilirken hareket edebiliyorsa, hareket etmeye devam et
                if (hedgehog.targetX !== null && hedgehog.isMoving && (!hedgehog.showSpeechBubble || hedgehog.canMoveWithBubble)) {
                    const hedgehogCenterX = hedgehog.x + hedgehog.width / 2;
                    const targetCenterX = hedgehog.targetX + hedgehog.width / 2;
                    const distance = Math.abs(hedgehogCenterX - targetCenterX);
                    
                    // Kirpi ekrandan çıkmamalı - her zaman kontrol et
                    // Rakun hareket etmiyorsa veya canMoveWithBubble false ise, ekrandan çıkma kontrolü yap
                    // canMoveWithBubble true olsa bile, ekrandan çıkma kontrolü yap (ama daha esnek)
                    if (playerIsStationary || !hedgehog.canMoveWithBubble) {
                        const hedgehogScreenX = hedgehog.x - camera.x;
                        const hedgehogIsVisible = hedgehogScreenX >= 0 && hedgehogScreenX <= canvas.width - hedgehog.width;
                        
                        // Gelecekteki pozisyonu kontrol et
                        let nextX = hedgehog.x;
                        if (hedgehog.x < hedgehog.targetX) {
                            nextX = hedgehog.x + hedgehog.speed;
                        } else {
                            nextX = hedgehog.x - hedgehog.speed;
                        }
                        const nextScreenX = nextX - camera.x;
                        const willBeVisible = nextScreenX >= 0 && nextScreenX <= canvas.width - hedgehog.width;
                        
                        // Eğer kirpi ekrandan çıkacaksa veya çıkmışsa, dur ve ekranda görünür bir noktaya gel
                        // Basit kontrol: gelecekteki pozisyon ekranın %80'inden sağda mı? Veya ekrandan çıkacak mı?
                        const threshold = canvas.width * 0.8; // %80 eşiği
                        const willBePastThreshold = nextScreenX > threshold || nextScreenX + hedgehog.width > canvas.width;
                        
                        if (willBePastThreshold) {
                            // Ekranın %70'lik kısmına gel
                            const targetScreenX = canvas.width * 0.7;
                            const targetWorldX = camera.x + targetScreenX;
                            
                            // Ekran hedefini kaydet
                            hedgehog.screenTargetX = targetWorldX;
                            hedgehog.waitingForPlayer = true;
                            
                            const distanceToTarget = Math.abs(hedgehog.x - targetWorldX);
                            
                            if (distanceToTarget > 10) {
                // Hedefe doğru hareket et
                                hedgehog.isMoving = true;
                                // Caffè Nero hedefini geçici olarak iptal et
                                hedgehog.targetX = null;
                                
                                if (hedgehog.x < targetWorldX) {
                                    hedgehog.x += hedgehog.speed;
                                } else {
                                    hedgehog.x -= hedgehog.speed;
                                }
                                
                                // Eğer hedefe yaklaşıldıysa, dur ama baloncuk gösterilmeye devam etsin
                                const newDistance = Math.abs(hedgehog.x - targetWorldX);
                                if (newDistance <= 10) {
                                    hedgehog.isMoving = false;
                                    // canMoveWithBubble true değilse baloncuk göster
                                    if (!hedgehog.canMoveWithBubble) {
                                        hedgehog.showSpeechBubble = true;
                                    }
                                }
                            } else {
                                // Hedefe ulaşıldı, dur ama baloncuk gösterilmeye devam etsin
                                hedgehog.isMoving = false;
                                // canMoveWithBubble true değilse baloncuk göster
                                if (!hedgehog.canMoveWithBubble) {
                                    hedgehog.showSpeechBubble = true;
                                }
                                hedgehog.targetX = null; // Caffè Nero hedefini iptal et
                            }
                            return;
                        }
                        // Eğer ekranda görünürse ve ekrandan çıkmayacaksa, hedefe gitmeye devam et
                    } else {
                        // Rakun hareket ediyor VE canMoveWithBubble true - yine de ekrandan çıkmamalı
                        // Gelecekteki pozisyonu kontrol et
                        let nextX = hedgehog.x;
                    if (hedgehog.x < hedgehog.targetX) {
                            nextX = hedgehog.x + hedgehog.speed;
                        } else {
                            nextX = hedgehog.x - hedgehog.speed;
                        }
                        const nextScreenX = nextX - camera.x;
                        
                        // Eğer kirpi ekrandan çıkacaksa, dur (ama baloncuk gösterilmeye devam etsin)
                        const threshold = canvas.width * 0.9; // %90 eşiği (rakun hareket ediyorsa daha esnek)
                        const willBePastThreshold = nextScreenX > threshold || nextScreenX + hedgehog.width > canvas.width;
                        
                        if (willBePastThreshold) {
                            // Ekranın %85'lik kısmına gel (rakun hareket ediyorsa daha ileri gelebilir)
                            const targetScreenX = canvas.width * 0.85;
                            const targetWorldX = camera.x + targetScreenX;
                            
                            if (Math.abs(hedgehog.x - targetWorldX) > 10) {
                                // Hedefe doğru hareket et
                                if (hedgehog.x < targetWorldX) {
                        hedgehog.x += hedgehog.speed;
                    } else {
                        hedgehog.x -= hedgehog.speed;
                    }
                } else {
                                // Hedefe ulaşıldı, dur (ama baloncuk gösterilmeye devam etsin)
                                hedgehog.isMoving = false;
                                // Rakunun hareket etmesini bekle (canMoveWithBubble true olsa bile)
                                hedgehog.waitingForPlayer = true;
                                hedgehog.screenTargetX = targetWorldX; // Ekran pozisyonunu sakla
                                hedgehog.targetX = hedgehog.x + 2000; // Yeni hedef belirle (rakun hareket edince devam etmek için)
                            }
                            return;
                        }
                    }
                    
                    // Hedefe ulaşıldı mı?
                    if (distance < 10) {
                        // Eğer canMoveWithBubble true ise ve hedef iskele ise, dur
                        if (hedgehog.canMoveWithBubble && dockX !== null && Math.abs(hedgehog.targetX - (dockX + 50)) < 10) {
                            // İskeleye ulaşıldı, dur
                            hedgehog.isMoving = false;
                            // Baloncuk gösterilmeye devam etsin
                        } else if (hedgehog.canMoveWithBubble && dockX !== null && hedgehog.targetX !== dockX + 50) {
                            // İskele henüz hedef değilse, iskeleye git
                            hedgehog.targetX = dockX + 50;
                        } else if (hedgehog.canMoveWithBubble) {
                            // İskele hedefi yoksa veya iskeleye ulaşıldıysa, ileri doğru yeni hedef belirle
                            if (dockX !== null && hedgehog.x >= dockX - 50) {
                                // İskeleye ulaşıldı, dur
                                hedgehog.isMoving = false;
                            } else {
                                hedgehog.targetX = hedgehog.x + 2000; // İleri doğru yeni hedef
                            }
                        } else {
                            hedgehog.isMoving = false;
                            hedgehog.showSpeechBubble = true; // Diyalog baloncuğunu göster
                        }
                    } else {
                        // Hedefe doğru hareket et
                        if (hedgehog.x < hedgehog.targetX) {
                            hedgehog.x += hedgehog.speed;
                        } else {
                            hedgehog.x -= hedgehog.speed;
                        }
                        
                        // Kirpi binanın sonundan ileriye gitmesin
                        if (lastBuildingX !== null && hedgehog.x + hedgehog.width > lastBuildingX) {
                            hedgehog.x = lastBuildingX - hedgehog.width;
                            hedgehog.isMoving = false; // Sınıra ulaştı, dur
                        }
                    }
                    return;
                }
                
                // Eğer Caffè Nero hedefi yoksa veya tamamlandıysa ve rakun duruyorsa, ekranda görünür bir noktaya gel
                // Bu sadece Caffè Nero hedefi olmadığında çalışmalı (henüz hedef verilmemişse)
                if (playerIsStationary && hedgehog.targetX === null && hedgehog.showSpeechBubble === false) {
                    const hedgehogScreenX = hedgehog.x - camera.x;
                    const hedgehogIsVisible = hedgehogScreenX >= 0 && hedgehogScreenX <= canvas.width - hedgehog.width;
                    
                    // Kirpi ekranda görünür mü ve uygun pozisyonda mı?
                    if (!hedgehogIsVisible || hedgehogScreenX > canvas.width * 0.7) {
                        // Ekranın %70'lik kısmına gel
                        const targetScreenX = canvas.width * 0.7;
                        const targetWorldX = camera.x + targetScreenX;
                        
                        if (Math.abs(hedgehog.x - targetWorldX) > 10) {
                            // Hedefe doğru hareket et
                            hedgehog.isMoving = true;
                            if (hedgehog.x < targetWorldX) {
                                hedgehog.x += hedgehog.speed;
                            } else {
                                hedgehog.x -= hedgehog.speed;
                            }
                        } else {
                            // Hedefe ulaşıldı, dur ve baloncuk göster
                            hedgehog.isMoving = false;
                            hedgehog.showSpeechBubble = true;
                        }
                    } else {
                        // Ekranda görünür ve uygun pozisyonda, dur ve baloncuk göster
                        hedgehog.isMoving = false;
                        hedgehog.showSpeechBubble = true;
                    }
                    return;
                }
                
                // Eğer buraya geldiyse, başka bir şey yapılmasına gerek yok
                return;
            }
            
            // Açılış sahnesi: Kirpi otomatik olarak rakun'a doğru yürür
            if (game.sceneState === 'opening') {
                // Merkez noktalarını hesapla
                const playerCenterX = player.x + player.width / 2;
                const hedgehogCenterX = hedgehog.x + hedgehog.width / 2;
                
                // Etkileşim mesafesi (checkInteraction ile aynı)
                const interactionDistance = 80;
                
                // Mevcut mesafeyi kontrol et
                const currentDistance = Math.abs(playerCenterX - hedgehogCenterX);
                
                // Eğer etkileşim mesafesindeyse, dur ve dialog aç
                if (currentDistance <= interactionDistance) {
                    hedgehog.isMoving = false;

                    // Dialog henüz gösterilmediyse, otomatik aç
                    if (!game.openingDialogShown && !dialog.isOpen) {
                        game.openingDialogShown = true;
                        openOpeningDialog();
                    }
                    return; // Hareket etme
                }
                
                // Kirpi rakunun hangi tarafında?
                // Eğer kirpi rakunun sağındaysa, rakunun sağına yaklaş
                // Eğer kirpi rakunun solundaysa, rakunun soluna yaklaş
                const targetDistance = interactionDistance - 10; // Etkileşim mesafesinden biraz önce dur
                
                if (hedgehogCenterX > playerCenterX) {
                    // Kirpi sağda, rakunun sağına yaklaş
                    // Hedef: rakun merkezinin sağında targetDistance kadar uzakta
                    hedgehog.targetX = playerCenterX + targetDistance - hedgehog.width / 2;
                } else {
                    // Kirpi solda, rakunun soluna yaklaş
                    // Hedef: rakun merkezinin solunda targetDistance kadar uzakta
                    hedgehog.targetX = playerCenterX - targetDistance - hedgehog.width / 2;
                }
                
                hedgehog.isMoving = true;

                // Hedefe doğru hareket et
                if (Math.abs(hedgehog.x - hedgehog.targetX) > 3) {
                    if (hedgehog.x < hedgehog.targetX) {
                        hedgehog.x += hedgehog.speed;
                    } else {
                        hedgehog.x -= hedgehog.speed;
                    }
                } else {
                    // Hedefe ulaştı, dur (ama dialog kontrolü yukarıda yapılıyor)
                    hedgehog.isMoving = false;
                }
            }
        }

        // Opening dialog (açılış sahnesi dialogu)
        function openOpeningDialog() {
            dialog.isOpen = true;
            dialog.isHedgehogDialog = true;
            dialog.text = 'Rakun merhaba! Bugün 5 Kasım 2023. Şimdi seninle zamanda yolculuğa çıkıyoruz!';
            dialog.text2 = 'Biraz hafızanı tazeleyelim. Hazır olduğunu düşünüyorum!';
            dialog.answers = ['Hazırım! 💕'];
            dialog.currentObject = null;
        }

        // Draw player (Sprite-based Raccoon) - Kamera offset ile
        function drawPlayer() {
            const screenX = player.x - camera.x;
            const screenY = player.y - camera.y;

            // Determine which animation to use
            let currentAnim = sprites.raccoon.idle;
            if (!player.isOnGround) {
                currentAnim = sprites.raccoon.jump;
            } else if (Math.abs(player.velocityX) > 0.5) {
                currentAnim = sprites.raccoon.walk;
            }

            // Get current frame
            const frame = currentAnim[sprites.raccoon.currentFrame % currentAnim.length];

            // Sprite offset - Ayakların zemine değmesi için sprite'ı aşağı kaydır
            const spriteYOffset = 30; // Sprite'ı 30 piksel aşağı çiz
            const spriteHeightExtension = 30; // Sprite yüksekliğini artır

            // Draw sprite if loaded
            if (frame && frame.complete) {
                // Sprite'ı aşağı kaydırarak çiz (collision box aynı yerde kalır)
                ctx.drawImage(
                    frame,
                    screenX,
                    screenY + spriteYOffset,
                    player.width,
                    player.height + spriteHeightExtension
                );
            } else {
                // Fallback rectangle while loading
                ctx.fillStyle = '#D2691E';
                ctx.fillRect(screenX, screenY, player.width, player.height);
            }

            // Debug: Collision box'ı göster (test için)
            // ctx.strokeStyle = 'red';
            // ctx.strokeRect(screenX, screenY, player.width, player.height);
        }

        // Draw hedgehog (Sprite-based) - Kamera offset ile
        function drawHedgehog() {
            const screenX = hedgehog.x - camera.x;
            const screenY = hedgehog.y - camera.y;

            // Idle sprite sheet kullan
            const spriteSheet = sprites.hedgehog.idle[0];
            if (spriteSheet && spriteSheet.complete) {
                // Sprite sheet'teki bir frame boyutu (yatay dizilmiş)
                const frameCount = sprites.hedgehog.idleFrameCount;
                const frameWidth = spriteSheet.width / frameCount;
                const frameHeight = spriteSheet.height;
                const currentFrame = Math.floor(sprites.hedgehog.currentFrame) % frameCount;

                // Sprite'ın aspect ratio'sunu koru ve collision box içine sığdır
                const spriteAspectRatio = frameWidth / frameHeight;
                const maxWidth = hedgehog.width;
                const maxHeight = hedgehog.height + hedgehog.spriteHeightExtension;
                
                // Sprite'ı collision box'a sığdır (aspect ratio korunarak)
                let drawWidth = maxWidth;
                let drawHeight = drawWidth / spriteAspectRatio;
                
                if (drawHeight > maxHeight) {
                    drawHeight = maxHeight;
                    drawWidth = drawHeight * spriteAspectRatio;
                }

                // Sprite'ı collision box'ın merkezine hizala (taşma olmasın)
                const drawX = screenX + (hedgehog.width - drawWidth) / 2;
                const drawY = screenY + hedgehog.spriteYOffset + (maxHeight - drawHeight) / 2;

                // Frame'i sprite sheet'ten çıkar ve çiz (collision box içinde, taşma olmadan)
                ctx.drawImage(
                    spriteSheet,
                    currentFrame * frameWidth, 0,  // Source x, y
                    frameWidth, frameHeight,        // Source width, height
                    drawX,                          // Dest x (merkeze hizalı)
                    drawY,                          // Dest y (merkeze hizalı)
                    drawWidth,                      // Dest width (collision box içinde)
                    drawHeight                      // Dest height (collision box içinde)
                );
            } else {
                // Fallback - sprite yüklenene kadar dikdörtgen
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(screenX, screenY, hedgehog.width, hedgehog.height);
            }

            // Debug: Collision box'ı göster (test için)
            // ctx.strokeStyle = 'blue';
            // ctx.strokeRect(screenX, screenY, hedgehog.width, hedgehog.height);

            // Diyalog baloncuğu çiz (gameplay ve onIsland sahnelerinde gösterilmesi gerekiyorsa)
            if ((game.sceneState === 'gameplay' || game.sceneState === 'onIsland') && hedgehog.showSpeechBubble) {
                const bubbleX = screenX + hedgehog.width / 2;
                const bubbleY = screenY - 50; // Kirpi'nin kafasının üstünde
                const text = hedgehog.speechText; // Dinamik metin
                const bubbleRadius = 10;
                
                ctx.save();
                
                // Metin boyutunu ve sarmasını hesapla
                ctx.font = 'bold 14px Arial';
                const textPadding = 15;
                const maxBubbleWidth = 420; // Maksimum baloncuk genişliği
                const maxTextWidth = maxBubbleWidth - (textPadding * 2);
                
                // Metni sarmala
                const textLines = wrapText(text, maxTextWidth, 'bold 14px Arial');
                const lineHeight = 18;
                const textHeight = textLines.length * lineHeight;
                
                // Baloncuk boyutlarını dinamik olarak ayarla
                const bubbleWidth = Math.min(maxBubbleWidth, Math.max(200, maxTextWidth + (textPadding * 2)));
                const bubbleHeight = textHeight + (textPadding * 2) + 10;
                
                // Baloncuğu çiz (yuvarlatılmış dikdörtgen)
                ctx.fillStyle = '#FFFFFF';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                
                // Baloncuk gövdesi
                ctx.beginPath();
                ctx.roundRect(bubbleX - bubbleWidth / 2, bubbleY - bubbleHeight, bubbleWidth, bubbleHeight, bubbleRadius);
                ctx.fill();
                ctx.stroke();
                
                // Baloncuk ucunu çiz (kirpi'nin kafasına işaret eden)
                ctx.beginPath();
                ctx.moveTo(bubbleX - 15, bubbleY);
                ctx.lineTo(bubbleX, bubbleY - 10);
                ctx.lineTo(bubbleX + 15, bubbleY);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                
                // Metni çiz (çok satırlı)
                ctx.fillStyle = '#000000';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                
                textLines.forEach((line, index) => {
                    const lineY = bubbleY - bubbleHeight + textPadding + 5 + (index * lineHeight);
                    ctx.fillText(line, bubbleX, lineY);
                });
                
                ctx.restore();
            }
        }

        // Draw clouds (bulutlar) - Arka plan - Paralax efekti
        function drawClouds() {
            // Bulutları gökyüzünde dağıt (paralax efekti için yavaş hareket)
            const cloudPositions = [
                { x: 100, y: 80, speed: 0.02 },
                { x: 400, y: 120, speed: 0.03 },
                { x: 700, y: 60, speed: 0.015 },
                { x: 50, y: 150, speed: 0.025 },
                { x: 500, y: 100, speed: 0.02 },
                { x: 750, y: 140, speed: 0.03 }
            ];
            
            sprites.clouds.forEach((cloud, index) => {
                if (!cloud.complete || cloud.width === 0) return;
                
                const posIndex = index % cloudPositions.length;
                const pos = cloudPositions[posIndex];
                
                // Paralax efekti: Bulutlar kameradan yavaş hareket eder
                const parallaxX = pos.x - (camera.x * pos.speed);
                
                // Bulut ekranın dışına çıktıysa tekrarla
                let drawX = parallaxX % (canvas.width + cloud.width * 2);
                if (drawX < -cloud.width) {
                    drawX += canvas.width + cloud.width * 2;
                }
                
                ctx.drawImage(cloud, drawX, pos.y, cloud.width, cloud.height);
            });
        }

        // Draw dock (iskele) and boats (tekneler)
        function drawDock() {
            if (dockX === null) return; // İskele pozisyonu henüz hesaplanmadı
            
            const groundLevel = GROUND_LEVEL;
            const waterLevel = groundLevel + 10; // Su seviyesi (zemin seviyesine yakın)
            const dockPlatformHeight = 25; // İskele platformu kalınlığı
            const dockPlatformY = waterLevel - dockPlatformHeight - 5; // İskele platformu su üstünde
            const dockPoleHeight = 60; // İskele kazığı yüksekliği (suya doğru)
            
            const screenX = dockX - camera.x;
            const dockScreenY = dockPlatformY - camera.y;
            
            // İskele'den sonraki tüm alanı deniz olarak çiz
            const seaStartX = dockX - camera.x;
            const seaEndX = game.mapWidth - camera.x;
            const seaStartY = waterLevel - camera.y; // Deniz başlangıç Y pozisyonu
            const seaHeight = canvas.height - seaStartY; // Deniz yüksekliği (ekranın altına kadar)
            
            // Deniz (iskele'den sonraki tüm alan, ekranın altına kadar)
            ctx.fillStyle = '#4169E1'; // Deniz mavisi
            ctx.fillRect(seaStartX, seaStartY, seaEndX - seaStartX, seaHeight);
            
            // Deniz dalga efekti (tüm deniz boyunca)
            ctx.strokeStyle = '#5B9BD5';
            ctx.lineWidth = 2;
            const waveCount = Math.floor(seaHeight / 15);
            for (let i = 0; i < waveCount; i++) {
                const waveY = seaStartY + i * 15;
                ctx.beginPath();
                ctx.moveTo(seaStartX, waveY);
                for (let x = seaStartX; x < seaEndX; x += 30) {
                    ctx.lineTo(x, waveY + Math.sin((x + camera.x) / 20) * 4);
                }
                ctx.stroke();
            }
            
            // Sadece ekranda görünen iskeleleri çiz
            if (screenX + dockWidth > 0 && screenX < canvas.width) {
                // İskele kazıkları (dikey çubuklar - suya doğru)
                ctx.fillStyle = '#654321'; // Koyu kahverengi
                const poleCount = 6;
                for (let i = 0; i < poleCount; i++) {
                    const poleX = screenX + (i * dockWidth / (poleCount - 1));
                    const poleScreenY = dockScreenY + dockPlatformHeight - camera.y; // Platform altından başla
                    ctx.fillRect(poleX - 4, poleScreenY, 8, dockPoleHeight);
                }
                
                // İskele platformu (ahşap) - su üstünde
                ctx.fillStyle = '#8B4513'; // Kahverengi ahşap
                ctx.fillRect(screenX, dockScreenY, dockWidth, dockPlatformHeight);
                
                // İskele platformu üst çizgisi (detay)
                ctx.strokeStyle = '#654321';
                ctx.lineWidth = 2;
                ctx.strokeRect(screenX, dockScreenY, dockWidth, dockPlatformHeight);
                
                // Tekne (iskeleye bağlı, denize paralel, iskelenin yakın ucundan halat)
                // İskele başlangıç pozisyonu (halat bağlantı noktası - yakın uç)
                const dockStartX = screenX; // İskele başlangıcı
                const dockStartY = dockScreenY + dockPlatformHeight / 2;
                
                // İskele sonu pozisyonu
                const dockEndX = screenX + dockWidth;
                const dockEndY = dockScreenY + dockPlatformHeight / 2;
                
                // Tekne pozisyonu: İskele sonundan sağa doğru, denize paralel (açı yok, yatay)
                const boatDistance = 90; // İskele sonundan uzaklık
                const boatAngle = 0; // 0 derece - denize paralel (yatay)
                const boatX = dockEndX + boatDistance - 63; // Tekne merkez X (2-3 pixel sola alındı)
                // Tekne Y pozisyonu: Su seviyesinde (denize paralel)
                const boatY = dockStartY - 30; // İskele seviyesinin biraz üstünde (görünür seviyede)
                const boatWidth = 120; // Daha büyük tekne
                const boatHeight = 50; // Daha yüksek tekne
                
                // Tekne gövdesi (yarım oval - denize paralel, yatay, daha koyu ve belirgin)
                ctx.fillStyle = '#654321'; // Koyu kahverengi
                ctx.beginPath();
                ctx.ellipse(boatX + boatWidth / 2, boatY + boatHeight, boatWidth / 2, boatHeight / 2, 0, 0, Math.PI, false);
                ctx.fill();
                
                // Tekne gövdesi üst kenarlığı (kalın)
                ctx.strokeStyle = '#4A3728';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.ellipse(boatX + boatWidth / 2, boatY + boatHeight, boatWidth / 2, boatHeight / 2, 0, 0, Math.PI, false);
                ctx.stroke();
                
                // Tekne iç kısmı (hafif açık renk - derinlik efekti)
                ctx.fillStyle = '#8B4513';
                ctx.beginPath();
                ctx.ellipse(boatX + boatWidth / 2, boatY + boatHeight - 2, boatWidth / 2 - 3, boatHeight / 2 - 3, 0, 0, Math.PI, false);
                ctx.fill();
                
                // Tekne iç kenarlığı
                ctx.strokeStyle = '#6B5439';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(boatX + boatWidth / 2, boatY + boatHeight - 2, boatWidth / 2 - 3, boatHeight / 2 - 3, 0, 0, Math.PI, false);
                ctx.stroke();
                
                // İskele üzerinde halat bağlantı noktası (halka/çıpa - iskele BAŞLANGICINDA/YAKIN UCUNDA)
                const ropeAnchorX = dockEndX - 5; // İskele başlangıcından 10px ileri
                const ropeAnchorY = dockStartY; // İskele ortası
                
                ctx.fillStyle = '#4A3728';
                ctx.beginPath();
                ctx.arc(ropeAnchorX, ropeAnchorY, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#2F1F14';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                // Halat bağlantı noktası iç halka (çıpa detayı)
                ctx.fillStyle = '#6B5439';
                ctx.beginPath();
                ctx.arc(ropeAnchorX, ropeAnchorY, 5, 0, Math.PI * 2);
                ctx.fill();
                
                // Tekne üzerinde halat bağlantı noktası (tekne başında/sol uç - ön kısım)
                // Tekne yatay (açı yok), bağlantı noktası teknenin sol ucunda (ön kısmında)
                const boatCenterX = boatX + boatWidth / 2;
                const boatCenterY = boatY + boatHeight;
                const boatRopeX = boatX + 15; // Teknenin sol ucundan 15px içeri (ön kısmı)
                const boatRopeY = boatCenterY - 2; // Teknenin üst kenarına yakın (gövde üstünde)
                
                ctx.fillStyle = '#4A3728';
                ctx.beginPath();
                ctx.arc(boatRopeX, boatRopeY, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#2F1F14';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                // Halat bağlantı noktası iç halka
                ctx.fillStyle = '#6B5439';
                ctx.beginPath();
                ctx.arc(boatRopeX, boatRopeY, 4, 0, Math.PI * 2);
                ctx.fill();
                
                // Halat (iskeleye bağlı - çok belirgin, kalın, doğru açıyla)
                // Halat gövdesi (ana çizgi - çok kalın)
                ctx.strokeStyle = '#8B7355';
                ctx.lineWidth = 8;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(ropeAnchorX, ropeAnchorY);
                ctx.lineTo(boatRopeX, boatRopeY);
                ctx.stroke();
                
                // Halat gölgesi (alt - üç boyutlu görünüm)
                ctx.strokeStyle = '#6B5B45';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(ropeAnchorX + 1, ropeAnchorY + 1);
                ctx.lineTo(boatRopeX + 1, boatRopeY + 1);
                ctx.stroke();
                
                // Halat highlight (üst - üç boyutlu görünüm)
                ctx.strokeStyle = '#AB9B85';
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(ropeAnchorX - 1, ropeAnchorY - 1);
                ctx.lineTo(boatRopeX - 1, boatRopeY - 1);
                ctx.stroke();
                
                // Tekne gölgesi (derinlik için)
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.beginPath();
                ctx.ellipse(boatX + boatWidth / 2, boatY + boatHeight + 5, boatWidth / 2, boatHeight / 2 - 5, 0, 0, Math.PI, false);
                ctx.fill();
            }

            // Show "E" prompt for dock if player is near
            if (game.sceneState === 'gameplay' && !dialog.isOpen && !game.dockDialogShown && dockX !== null) {
            const playerCenterX = player.x + player.width / 2;
                const dockCenterX = dockX + dockWidth / 2;
                const distanceX = Math.abs(playerCenterX - dockCenterX);

                if (distanceX < 120 && player.y + player.height >= groundLevel - 10) {
                    const dockScreenX = dockX + dockWidth / 2 - camera.x;
                    const dockScreenY = groundLevel - camera.y - 120; // İskele üstünde, görünür pozisyon

                    // Sadece ekranda görünürse çiz
                    if (dockScreenX >= 0 && dockScreenX <= canvas.width && dockScreenY >= 0 && dockScreenY <= canvas.height) {
                ctx.fillStyle = 'white';
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 3;
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.strokeText('E', dockScreenX, dockScreenY);
                        ctx.fillText('E', dockScreenX, dockScreenY);
                        ctx.textAlign = 'left'; // Reset
                        ctx.textBaseline = 'alphabetic'; // Reset
                    }
                }
            }
        }

        // Draw island scene (Ada sahnesi)
        function drawIsland() {
            // Deniz - tüm ekranı kaplayan
            ctx.fillStyle = '#4169E1'; // Deniz mavisi
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Deniz dalga efekti
            ctx.strokeStyle = '#5B9BD5';
            ctx.lineWidth = 2;
            const waveCount = Math.floor(canvas.height / 15);
            for (let i = 0; i < waveCount; i++) {
                const waveY = i * 15;
                ctx.beginPath();
                ctx.moveTo(0, waveY);
                for (let x = 0; x < canvas.width; x += 30) {
                    ctx.lineTo(x, waveY + Math.sin(x / 20) * 4);
                }
                ctx.stroke();
            }
            
            // İskele (sol alt köşe)
            const dockX = 2;
            const dockY = canvas.height - 50;
            const dockWidth = 120;
            const dockHeight = 25;
            
            // İskele platformu (su üstünde)
            ctx.fillStyle = '#8B4513'; // Kahverengi ahşap
            ctx.fillRect(dockX, dockY, dockWidth, dockHeight);
            
            // İskele kenarlığı
            ctx.strokeStyle = '#654321';
            ctx.lineWidth = 2;
            ctx.strokeRect(dockX, dockY, dockWidth, dockHeight);
            
            // İskele kazıkları (dikey çubuklar)
            ctx.fillStyle = '#654321';
            const poleCount = 4;
            for (let i = 0; i < poleCount; i++) {
                const poleX = dockX + (i * dockWidth / (poleCount - 1));
                const poleY = dockY + dockHeight;
                ctx.fillRect(poleX - 3, poleY, 6, 40);
            }
            
            // Ada - sağ üst köşede
            const islandX = canvas.width - 210; // Sağ tarafa yakın
            const islandY = 150; // Üst tarafa yakın
            const islandRadius = 200; // Ada yarıçapı

            
            // Ada ana gövdesi (yuvarlak, yeşil)
            ctx.fillStyle = '#228B22'; // Orman yeşili
            ctx.beginPath();
            ctx.ellipse(islandX, islandY, islandRadius, islandRadius * 0.6, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Ada kenar çizgisi
            ctx.strokeStyle = '#1F7A1F';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(islandX, islandY, islandRadius, islandRadius * 0.6, 0, 0, Math.PI * 2);
            ctx.stroke();
            
            // Ada iç detayları (kumsal şeridi)
            ctx.fillStyle = '#F4A460'; // Kum rengi
            ctx.beginPath();
            ctx.ellipse(islandX, islandY + islandRadius * 0.3, islandRadius * 0.75, islandRadius * 0.15, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Ada üzerinde ağaçlar (basit çizim) - sabit pozisyonlar
            const treePositions = [
                { x: -120, y: -40 },
                { x: -60, y: -60 },
                { x: 0, y: -50 },
                { x: 60, y: -55 },
                { x: 120, y: -45 }
            ];
            
            for (let i = 0; i < treePositions.length; i++) {
                const treeX = islandX + treePositions[i].x;
                const treeY = islandY + treePositions[i].y;
                
                // Ağaç gövdesi
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(treeX - 8, treeY, 16, 40);
                
                // Ağaç yaprakları (yuvarlak)
                ctx.fillStyle = '#2D5016';
                ctx.beginPath();
                ctx.arc(treeX, treeY - 10, 25, 0, Math.PI * 2);
                ctx.fill();
                
                // Ağaç yaprakları highlight
                ctx.fillStyle = '#3A6B1F';
                ctx.beginPath();
                ctx.arc(treeX - 8, treeY - 15, 15, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Ada üzerinde ev (sağ üst, ada'nın sağ tarafında)
            const houseX = islandX - 40;
            const houseY = islandY + 50;
            
            // Ev gövdesi
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(houseX - 20, houseY, 40, 30);
            
            // Ev çatısı (kırmızı)
            ctx.fillStyle = '#CC0000';
            ctx.beginPath();
            ctx.moveTo(houseX - 30, houseY);
            ctx.lineTo(houseX, houseY - 20);
            ctx.lineTo(houseX + 30, houseY);
            ctx.closePath();
            ctx.fill();
            
            // Ev kapısı
            ctx.fillStyle = '#654321';
            ctx.fillRect(houseX - 5, houseY + 15, 10, 15);
            
            // Ev penceresi
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(houseX - 18, houseY + 5, 8, 8);
            ctx.fillRect(houseX + 10, houseY + 5, 8, 8);
            
            // İkinci ev (ada üzerinde)
            const house2X = islandX + 40;
            const house2Y = islandY + 50;
            
            // İkinci ev gövdesi
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(house2X - 20, house2Y, 40, 30);
            
            // İkinci ev çatısı (kırmızı)
            ctx.fillStyle = '#CC0000';
            ctx.beginPath();
            ctx.moveTo(house2X - 30, house2Y);
            ctx.lineTo(house2X, house2Y - 20);
            ctx.lineTo(house2X + 30, house2Y);
            ctx.closePath();
            ctx.fill();
            
            // İkinci ev kapısı
            ctx.fillStyle = '#654321';
            ctx.fillRect(house2X - 5, house2Y + 15, 10, 15);
            
            // İkinci ev penceresi
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(house2X - 18, house2Y + 5, 8, 8);
            ctx.fillRect(house2X + 10, house2Y + 5, 8, 8);
            
            // Tekne çiz
            drawBoat();
        }

        function initializeBoat() {

        // Ada sahnesi başlatma (karakterler adaya indiğinde)
        function initializeOnIslandScene() {
            // Ada pozisyonu (dünya koordinatları - drawOnIsland ile aynı)
            const islandXWorld = canvas.width / 2; // Ada ekranın ortasında
            const islandY = GROUND_LEVEL; // TÜM SAHNELERDE AYNI ZEMİN SEVİYESİ
            
            // Ada zemin seviyesi (tile zemininin üstü)
            const islandGroundY = GROUND_LEVEL; // TÜM SAHNELERDE AYNI ZEMİN SEVİYESİ
            
            // Karakterler ekranın solundan başlamalı
            const startX = 50; // Ekranın solundan 50 piksel içeriden başla
            
            // Rakun pozisyonu: Ekranın solunda, zemin seviyesinde (dünya koordinatları)
            player.x = startX;
            player.y = islandGroundY - player.height;
            player.velocityX = 0;
            player.velocityY = 0;
            player.isOnGround = true;
            
            // Kirpi pozisyonu: Rakun'un solunda ama ekranın içinde kalmalı (dünya koordinatları)
            hedgehog.x = Math.max(20, player.x - 120); // En az 20 piksel soldan, yoksa ekranın dışına çıkar
            hedgehog.y = islandGroundY - hedgehog.height - 10; // Rakun'a göre biraz daha yukarı (görsel)
            
            // Otel pozisyonunu hesapla (kirpi otele gitmeli) - drawOnIsland ile aynı mantık
            const houseSpacing = 40;
            const houseScale = 1.35;
            
            // Evlerin sırası: home1, home2, home1, home2, hotel, home1
            const housesPattern = [
                { sprite: sprites.island.home1, name: 'home1' },
                { sprite: sprites.island.home2, name: 'home2' },
                { sprite: sprites.island.home1, name: 'home1' },
                { sprite: sprites.island.home2, name: 'home2' },
                { sprite: sprites.island.hotel, name: 'hotel' },
                { sprite: sprites.island.home1, name: 'home1' }
            ];
            
            // Otel pozisyonunu bul (5. sırada - index 4)
            let hotelWorldX = null;
            let hotelWidth = 96 * houseScale; // Varsayılan
            
            let currentHouseX = islandXWorld - 400;
            for (let i = 0; i < housesPattern.length; i++) {
                const house = housesPattern[i];
                if (house.sprite && house.sprite.complete) {
                    const houseWidth = house.sprite.width * houseScale;
                    
                    // Otel pozisyonunu kaydet (5. ev - index 4)
                    if (i === 4 && house.name === 'hotel') {
                        hotelWorldX = currentHouseX;
                        hotelWidth = houseWidth;
                        break;
                    }
                    
                    // Bir sonraki ev pozisyonu
                    currentHouseX += houseWidth + houseSpacing;
                }
            }
            
            // Eğer otel pozisyonu hesaplanamadıysa, fallback kullan
            if (hotelWorldX === null) {
                hotelWorldX = islandXWorld - 400;
                // İlk 4 evin genişliklerini topla
                if (sprites.island.home1 && sprites.island.home1.complete && 
                    sprites.island.home2 && sprites.island.home2.complete) {
                    const home1Width = sprites.island.home1.width * houseScale;
                    const home2Width = sprites.island.home2.width * houseScale;
                    hotelWorldX += (home1Width + houseSpacing) + (home2Width + houseSpacing) + 
                                    (home1Width + houseSpacing) + (home2Width + houseSpacing);
                }
            }
            
            // Kirpi otelin önüne gitmeli (otel merkezinin biraz solunda)
            // Sadece otel etkileşimi tamamlanmadıysa baloncuk ayarlarını yap
            if (!game.innEntered) {
                hedgehog.targetX = hotelWorldX + (hotelWidth / 2) - hedgehog.width - 30;
                hedgehog.isMoving = true;
                hedgehog.showSpeechBubble = true;
                hedgehog.speechText = 'Birlikte kaldığımız ilk otele gidiyoruz. Heyecanlı mısın?';
                hedgehog.canMoveWithBubble = true; // Baloncuk gösterilirken hareket edebilir
                hedgehog.waitingForPlayer = false;
            }
            
            // Kamera ayarı - karakterleri ekranın solunda göster
            camera.x = 0; // Ekranın solundan başla
            camera.y = 0; // Y ekseninde kamerayı hareket ettirmeyelim
            
            // Dekorasyonları sıfırla (yeniden hesaplanacak)
            // Sprite'lar asenkron yüklendiği için drawOnIsland() içinde tekrar kontrol edilecek
            game.islandDecorations = [];
            game.islandDecorationsInitialized = false;
        }

        // Ada üzerinde oyun sahnesi çizimi (karakterler adaya indikten sonra)
        function drawOnIsland() {
            // Gökyüzü gradient (arka plan - deniz yok, sadece gökyüzü)
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');      // Gökyüzü mavisi (üst)
            gradient.addColorStop(0.7, '#B0E0E6');   // Açık mavi
            gradient.addColorStop(1, '#E0F6FF');      // Çok açık mavi (alt)
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Ada pozisyonu (dünya koordinatları - kameraya göre offset uygulanacak)
            const islandXWorld = canvas.width / 2; // Ada ekranın ortasında (dünya koordinatı)
            const islandY = GROUND_LEVEL; // TÜM SAHNELERDE AYNI ZEMİN SEVİYESİ
            
            // Ada zemin merkezi (kameraya göre offset)
            const islandX = islandXWorld - camera.x;
            
            // Evleri çiz: home1, home2, home1, home2, hotel, home1
            const housesPattern = [
                { sprite: sprites.island.home1, name: 'home1' },
                { sprite: sprites.island.home2, name: 'home2' },
                { sprite: sprites.island.home1, name: 'home1' },
                { sprite: sprites.island.home2, name: 'home2' },
                { sprite: sprites.island.hotel, name: 'hotel' },
                { sprite: sprites.island.home1, name: 'home1' }
            ];
            
            let currentHouseX = islandXWorld - 400; // İlk ev pozisyonu (soldan başla)
            const houseSpacing = 40; // Evler arası boşluk (azaltıldı)
            const houseScale = 1.35;
            
            // Evlerin toplam genişliğini hesapla (zemin çizimi için)
            let totalHousesWidth = 0;
            for (let i = 0; i < housesPattern.length; i++) {
                const house = housesPattern[i];
                if (house.sprite && house.sprite.complete) {
                    const houseWidth = house.sprite.width * houseScale;
                    totalHousesWidth += houseWidth;
                    if (i < housesPattern.length - 1) {
                        totalHousesWidth += houseSpacing;
                    }
                }
            }
            
            // Zemin başlangıç ve bitiş pozisyonları (evlerin solundan sağına kadar + ekstra boşluk)
            // NOT: Zemin iskele'ye kadar uzanmalı, iskele alanı deniz olacak
            const houseStartX = islandXWorld - 400; // İlk ev pozisyonu
            const groundStartX = houseStartX - 100; // İlk evin solundan 100 piksel önce
            const lastHouseRight = houseStartX + totalHousesWidth;
            const islandDockX = lastHouseRight + 100; // Son evden 100 piksel sonra iskele (50 piksel sağa kaydırıldı)
            const islandDockWidth = 180;
            const groundEndX = islandDockX; // Zemin iskele başlangıcına kadar (iskele deniz alanında)
            
            // ÖNCE: Son evden sonra deniz çiz (zemin tile'larından önce, arka planda)
            const groundLevel = GROUND_LEVEL;
            const waterLevel = groundLevel + 10;
            const seaStartX = islandDockX - camera.x; // İskele başlangıcından itibaren deniz
            const seaEndX = islandDockX + islandDockWidth + 800 - camera.x; // İskele sonundan 800 piksel daha sağa kadar
            const seaStartY = waterLevel - camera.y;
            const seaHeight = canvas.height - seaStartY;
            
            // Deniz (iskele başlangıcından itibaren tüm alan)
            ctx.fillStyle = '#4169E1';
            ctx.fillRect(seaStartX, seaStartY, seaEndX - seaStartX, seaHeight);
            
            // Deniz dalga efekti
            ctx.strokeStyle = '#5B9BD5';
            ctx.lineWidth = 2;
            const waveCount = Math.floor(seaHeight / 15);
            for (let i = 0; i < waveCount; i++) {
                const waveY = seaStartY + i * 15;
                ctx.beginPath();
                ctx.moveTo(seaStartX, waveY);
                for (let x = seaStartX; x < seaEndX; x += 30) {
                    ctx.lineTo(x, waveY + Math.sin((x + camera.x) / 20) * 4);
                }
                ctx.stroke();
            }
            
            // Zemin tile'larını çiz (ground_pref.png kullanarak) - Karakterlerin yürüdüğü yollar
            if (sprites.island.groundPref && sprites.island.groundPref.complete) {
                const groundPrefImage = sprites.island.groundPref;
                const originalTileWidth = groundPrefImage.width;
                const originalTileHeight = groundPrefImage.height;
                
                // Tile'ı büyütmek için scale faktörü (2x, 3x vb. olabilir)
                const tileScale = 1.25; // 2x büyüklükte çiz (istediğiniz boyuta göre 3, 4 vb. yapabilirsiniz)
                const tileWidth = originalTileWidth * tileScale;
                const tileHeight = originalTileHeight * tileScale + 20; // Yüksekliği 10 piksel artır
                
                // Zemin tile'larını tekrar ederek çiz (tiled pattern)
                // Evlerin solundan sağına kadar + ekstra boşluk
                const tileStartX = Math.floor((groundStartX - camera.x) / tileWidth) * tileWidth;
                const tileEndX = Math.ceil((groundEndX - camera.x) / tileWidth) * tileWidth;
                
                for (let x = tileStartX; x <= tileEndX; x += tileWidth) {
                    const screenX = x;
                    const screenY = islandY;
                    
                    // Tile çiz (eğer ekranda görünüyorsa) - büyütülmüş boyutta
                    if (screenX + tileWidth > 0 && screenX < canvas.width) {
                        ctx.drawImage(
                            sprites.island.groundPref,
                            0, 0, originalTileWidth, originalTileHeight, // Kaynak (orijinal sprite)
                            screenX, screenY, tileWidth, tileHeight // Hedef (büyütülmüş boyut)
                        );
                    }
                }
            } else {
                // Fallback: Eğer tile set yüklenmediyse basit yeşil zemin
                ctx.fillStyle = '#90EE90';
                const groundScreenStartX = groundStartX - camera.x;
                const groundScreenEndX = groundEndX - camera.x;
                ctx.fillRect(groundScreenStartX, islandY, groundScreenEndX - groundScreenStartX, 100);
            }
            
            // Dekorasyonları hesapla (eğer henüz hesaplanmadıysa ve sprite'lar yüklendiyse)
            // Her frame kontrol et (sprite'lar asenkron yükleniyor olabilir)
            if (!game.islandDecorationsInitialized || game.islandDecorations.length === 0) {
                // Tüm dekorasyon sprite'larının yüklendiğini kontrol et
                let allDecorationsLoaded = true;
                const decorationTypes = ['lamp', 'sit', 'tree', 'wallHorizontal', 'wallVertical'];
                for (let d = 0; d < decorationTypes.length; d++) {
                    const decType = decorationTypes[d];
                    const decSprite = sprites.island.decoration[decType];
                    if (!decSprite || !decSprite.complete) {
                        allDecorationsLoaded = false;
                        break;
                    }
                }
                
                // Eğer tüm sprite'lar yüklendiyse ve henüz dekorasyonlar hesaplanmadıysa
                if (allDecorationsLoaded && game.islandDecorations.length === 0) {
                    game.islandDecorations = [];
                    
                    // Eğer dekorasyon sprite'ları yüklendiyse, dekorasyonları hesapla
                    const wallVerticalSprite = sprites.island.decoration.wallVertical;
                    const wallPadding = 10; // Ev ile çit arasındaki boşluk
                    const wallVWidth = wallVerticalSprite.width;
                    const decorationHouseSpacing = 40; // Evler arası boşluk (drawOnIsland ile aynı olmalı)
                    
                    let tempHouseX = islandXWorld - 400; // Geçici pozisyon hesaplama için
                    
                    // Tüm evlerin ve çitlerin sınırlarını hesapla (çakışma kontrolü için)
                    const houseBounds = [];
                    for (let i = 0; i < housesPattern.length; i++) {
                        const house = housesPattern[i];
                        if (house.sprite && house.sprite.complete) {
                            const houseWidth = house.sprite.width * houseScale;
                            const houseLeft = tempHouseX;
                            const houseRight = tempHouseX + houseWidth;
                            
                            // Çit sınırları
                            const fenceLeft = houseLeft - wallPadding - wallVWidth;
                            const fenceRight = houseRight + wallPadding + wallVWidth;
                            
                            houseBounds.push({
                                houseLeft: houseLeft,
                                houseRight: houseRight,
                                fenceLeft: fenceLeft,
                                fenceRight: fenceRight,
                                fenceLeftInner: fenceLeft + wallVWidth,  // Çitin sağ kenarı (iç kenar)
                                fenceRightInner: fenceRight - wallVWidth // Çitin sol kenarı (iç kenar)
                            });
                            
                            // Bir sonraki ev pozisyonu
                            tempHouseX = houseRight + decorationHouseSpacing;
                        }
                    }
                    
                    // Her evin SAĞ TARAFINDAKI ev-çit boşluğuna dekorasyon yerleştir
                    // Ev ile çit arası boşluk: houseRight ile (fenceRight - wallVWidth) arası
                    for (let i = 0; i < housesPattern.length; i++) {
                        const house = houseBounds[i];
                        
                        if (house) {
                            // Evin sağ tarafındaki ev-çit boşluğu
                            // Ev sağ kenarı: house.houseRight
                            // Sağ çit sol kenarı: house.fenceRight - wallVWidth
                            // Bu arasındaki boşluk: wallPadding (10 piksel)
                            const decorationZoneStart = house.houseRight; // Evin sağ kenarı
                            const decorationZoneEnd = house.fenceRight - wallVWidth; // Sağ çitin sol kenarı
                            const decorationZoneWidth = decorationZoneEnd - decorationZoneStart;
                            
                            // Eğer boşluk yeterince genişse dekorasyon ekle
                            if (decorationZoneWidth > 5) {
                                // Her ev için farklı dekorasyon seç (ev index'ine göre rotasyon)
                                const nonWallTypes = ['lamp', 'sit', 'tree'];
                                // Her ev için farklı bir dekorasyon: index'e göre rotasyon yap
                                // Bu sayede her ev farklı bir dekorasyona sahip olur
                                const decorationIndex = i % nonWallTypes.length;
                                const randomType = nonWallTypes[decorationIndex];
                                const decorationSprite = sprites.island.decoration[randomType];
                                
                                if (decorationSprite && decorationSprite.complete) {
                                    // Ev-çit boşluğunun ortasına yerleştir, sonra 100 piksel sola kaydır
                                    const zoneCenter = (decorationZoneStart + decorationZoneEnd) / 2;
                                    // Dekorasyonun sol kenarı = merkez - sprite genişliği/2 - 100 piksel
                                    const decorationX = zoneCenter - decorationSprite.width / 2 - 17;
                                    
                                    // Dekorasyonu kaydet (dünya koordinatı olarak)
                                    // Not: Dekorasyon boşluğun dışına taşsa bile ekliyoruz (görsel olarak iyi görünecek)
                                    game.islandDecorations.push({
                                        type: randomType,
                                        sprite: decorationSprite,
                                        worldX: decorationX,
                                        worldY: islandY
                                    });
                                }
                            }
                        }
                    }
                    
                    // Özel: 2. ev (index 1) ile 3. ev (index 2) arasına çiçek ekle
                    // Çiçek sprite'ı yüklenene kadar bekle (her frame kontrol et)
                    if (houseBounds.length >= 3 && sprites.island.decoration.cicek) {
                        // Sprite yüklendi mi ve hata durumunda değil mi kontrol et
                        if (sprites.island.decoration.cicek.complete && sprites.island.decoration.cicek.naturalWidth > 0) {
                            const ev2 = houseBounds[1];  // 2. ev (index 1)
                            const ev3 = houseBounds[2];  // 3. ev (index 2)
                            
                            // Evler arası boşluğun ortası
                            const ev2SağKenarı = ev2.houseRight;
                            const ev3SolKenarı = ev3.houseLeft;
                            const evlerArasıBoşluk = ev3SolKenarı - ev2SağKenarı;
                            const evlerArasıMerkez = ev2SağKenarı + evlerArasıBoşluk / 2;
                            
                            // Çiçeği evler arası boşluğun ortasına yerleştir
                            const cicekX = evlerArasıMerkez - sprites.island.decoration.cicek.width / 2 - 100;
                            
                            // Çiçek zaten eklenmiş mi kontrol et (tekrar eklememek için)
                            const cicekAlreadyAdded = game.islandDecorations.some(dec => dec.type === 'cicek');
                            
                            if (!cicekAlreadyAdded) {
                                game.islandDecorations.push({
                                    type: 'cicek',
                                    sprite: sprites.island.decoration.cicek,
                                    worldX: cicekX,
                                    worldY: islandY
                                });
                            }
                        }
                    }
                    
                    game.islandDecorationsInitialized = true;
                }
            }
            
            // Evleri çiz ve etraflarına çit ekle
            for (let i = 0; i < housesPattern.length; i++) {
                const house = housesPattern[i];
                
                // Sprite yüklenmiş mi kontrol et
                if (house.sprite && house.sprite.complete) {
                    const originalWidth = house.sprite.width;
                    const originalHeight = house.sprite.height;
                    
                    // Evlerin boyutunu 1.35 katına çıkar
                    const houseWidth = originalWidth * houseScale;
                    const houseHeight = originalHeight * houseScale;
                    
                    // Ekranda görünüyor mu kontrol et
                    const screenX = currentHouseX - camera.x;
                    // Evlerin alt kenarı zemine tam otursun
                    // Sprite'ların altındaki boşluğu kompanse etmek için pozitif offset (evi aşağı çeker)
                    let verticalOffset = 0;
                    if (house.name === 'home1') {
                        // home1 sprite'ının altında boşluk var, daha aşağı çek
                        verticalOffset = 23; // Pozitif değer evi daha aşağı çeker (zemine oturtur)
                    } else if (house.name === 'home2') {
                        // home2 sprite'ının altında az boşluk var
                        verticalOffset = 15; // Küçük offset
                    } else if (house.name === 'hotel') {
                        // Otel sprite'ının altında boşluk var
                        verticalOffset = 15; // Orta offset
                    }
                    // Evlerin alt kenarı zemin seviyesinde olmalı (islandY)
                    // Pozitif offset ekleyerek evi aşağı çekiyoruz
                    const screenY = islandY - houseHeight + verticalOffset;
                    
                    if (screenX + houseWidth > 0 && screenX < canvas.width) {
                        // Ev çitleri: Ev çizilmeden önce çitleri çiz (arkada kalması için)
                        const wallVerticalSprite = sprites.island.decoration.wallVertical;
                        const wallHorizontalSprite = sprites.island.decoration.wallHorizontal;
                        const wallPadding = 10; // Ev ile çit arasındaki boşluk
                        
                        if (wallVerticalSprite && wallVerticalSprite.complete && 
                            wallHorizontalSprite && wallHorizontalSprite.complete) {
                            
                            const wallVWidth = wallVerticalSprite.width;
                            const wallVHeight = wallVerticalSprite.height;
                            const wallHWidth = wallHorizontalSprite.width;
                            const wallHHeight = wallHorizontalSprite.height;
                            
                            // Çit pozisyonları (evin etrafına)
                            const fenceLeft = currentHouseX - wallPadding - wallVWidth; // Sol çit
                            const fenceRight = currentHouseX + houseWidth + wallPadding; // Sağ çit
                            const fenceBottom = islandY; // Alt çit (zemin seviyesinde)
                            const fenceTop = screenY - wallPadding; // Üst çit
                            
                            // Sol çit (dikey)
                            const fenceLeftScreenX = fenceLeft - camera.x;
                            if (fenceLeftScreenX + wallVWidth > 0 && fenceLeftScreenX < canvas.width) {
                                // Sol çit, evin solundan üstüne kadar
                                const fenceTopY = fenceTop;
                                const fenceBottomY = fenceBottom;
                                const fenceHeight = fenceBottomY - fenceTopY;
                                
                                // Çit yüksekliği boyunca dikey çitleri tekrarla
                                for (let y = fenceTopY; y < fenceBottomY; y += wallVHeight) {
                                    const currentFenceHeight = Math.min(wallVHeight, fenceBottomY - y);
                                    const fenceScreenY = y - camera.y;
                                    
                                    if (fenceScreenY + currentFenceHeight > 0 && fenceScreenY < canvas.height) {
                                        ctx.drawImage(
                                            wallVerticalSprite,
                                            0, 0, wallVWidth, currentFenceHeight, // Kaynak
                                            fenceLeftScreenX, fenceScreenY, wallVWidth, currentFenceHeight // Hedef
                                        );
                                    }
                                }
                            }
                            
                            // Sağ çit (dikey)
                            const fenceRightScreenX = fenceRight - camera.x;
                            if (fenceRightScreenX > 0 && fenceRightScreenX < canvas.width) {
                                // Sağ çit, evin sağından üstüne kadar
                                const fenceTopY = fenceTop;
                                const fenceBottomY = fenceBottom;
                                
                                // Çit yüksekliği boyunca dikey çitleri tekrarla
                                for (let y = fenceTopY; y < fenceBottomY; y += wallVHeight) {
                                    const currentFenceHeight = Math.min(wallVHeight, fenceBottomY - y);
                                    const fenceScreenY = y - camera.y;
                                    
                                    if (fenceScreenY + currentFenceHeight > 0 && fenceScreenY < canvas.height) {
                                        ctx.drawImage(
                                            wallVerticalSprite,
                                            0, 0, wallVWidth, currentFenceHeight, // Kaynak
                                            fenceRightScreenX, fenceScreenY, wallVWidth, currentFenceHeight // Hedef
                                        );
                                    }
                                }
                            }
                            
                            // Üst çit (yatay)
                            const fenceTopScreenY = fenceTop - camera.y;
                            if (fenceTopScreenY + wallHHeight > 0 && fenceTopScreenY < canvas.height) {
                                // Üst çit, sol çit ile sağ çit arasında
                                const fenceStartX = fenceLeft;
                                const fenceEndX = fenceRight + wallVWidth;
                                const fenceWidth = fenceEndX - fenceStartX;
                                
                                // Çit genişliği boyunca yatay çitleri tekrarla
                                for (let x = fenceStartX; x < fenceEndX; x += wallHWidth) {
                                    const currentFenceWidth = Math.min(wallHWidth, fenceEndX - x);
                                    const fenceScreenX = x - camera.x;
                                    
                                    if (fenceScreenX + currentFenceWidth > 0 && fenceScreenX < canvas.width) {
                                        ctx.drawImage(
                                            wallHorizontalSprite,
                                            0, 0, currentFenceWidth, wallHHeight, // Kaynak
                                            fenceScreenX, fenceTopScreenY, currentFenceWidth, wallHHeight // Hedef
                                        );
                                    }
                                }
                            }
                            
                            // Alt çit kaldırıldı - evlerin yola bakan tarafında çit olmamalı
                        }
                        
                        // Ev çiz
                        ctx.drawImage(
                            house.sprite,
                            0, 0, originalWidth, originalHeight, // Kaynak (orijinal sprite)
                            screenX, screenY, houseWidth, houseHeight // Hedef (büyütülmüş boyut)
                        );
                        
                        // Otel için tabela ve "E" etkileşim sembolü
                        if (house.name === 'hotel') {
                            // Pixel-art stilinde ahşap tabela çiz (her zaman görünür)
                            const signScreenX = screenX; // Otelin merkezi
                            const signScreenY = screenY + 125; // Otelin üstünde
