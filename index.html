<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rakun ve Kirpi - Platformer Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        #gameContainer {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #87CEEB 0%, #98D8E8 100%);
        }

        #instructions {
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 14px;
        }

        #instructions span {
            display: inline-block;
            margin: 0 10px;
            padding: 5px 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="instructions">
            <span>W,A,S,D Hareket</span>
            <span>SPACE Zıpla</span>
            <span>E Etkileşim</span>
        </div>
    </div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Load sprites
        const sprites = {
            raccoon: {
                idle: [],
                walk: [],
                jump: [],
                currentFrame: 0,
                frameDelay: 0,
                frameSpeed: 4
            },
            hedgehog: {
                idle: [],
                move: [],
                currentFrame: 0,
                frameDelay: 0,
                frameSpeed: 20,  // Daha yavaş animasyon için artırıldı (8'den 16'ya)
                idleFrameCount: 2,  // idle.png sprite sheet'teki frame sayısı (4'e değiştirildi)
                moveFrameCount: 6   // move.png sprite sheet'teki frame sayısı
            }
        };

        // Load Raccoon idle sprites (11 frames)
        for (let i = 1; i <= 11; i++) {
            const img = new Image();
            const frameNum = String(i * 2 - 1).padStart(4, '0');
            img.src = `raccoon/idle/${frameNum}.png`;
            sprites.raccoon.idle.push(img);
        }

        // Load Raccoon walk sprites (11 frames)
        for (let i = 1; i <= 11; i++) {
            const img = new Image();
            const frameNum = String(i * 2 - 1).padStart(4, '0');
            img.src = `raccoon/walk/walk${frameNum}.png`;
            sprites.raccoon.walk.push(img);
        }

        // Load Raccoon jump sprite (1 frame for simplicity)
        const raccoonJump = new Image();
        raccoonJump.src = 'raccoon/jump/jump0001.png';
        sprites.raccoon.jump.push(raccoonJump);

        // Load Hedgehog idle animation (sprite sheet)
        const hedgehogIdle = new Image();
        hedgehogIdle.src = 'hedgehog/idle/idle.png';
        sprites.hedgehog.idle.push(hedgehogIdle);

        // Load Hedgehog move animation (sprite sheet)
        const hedgehogMove = new Image();
        hedgehogMove.src = 'hedgehog/move/move.png';
        sprites.hedgehog.move.push(hedgehogMove);

        // Load building sprites (yeni yapı)
        sprites.buildings = {
            // Blank Shops (renkli boş mağazalar)
            blankShopBlack: new Image(),
            blankShopBlue: new Image(),
            blankShopBrown: new Image(),
            blankShopPurple: new Image(),
            blankShopRed: new Image(),
            blankShopYellow: new Image(),
            blankShopYellow2: new Image(),
            blankShop2D: new Image(),
            
            // Muted Colour (pastel/soluk renkli binalar)
            mutedBlue: new Image(),
            mutedBrown: new Image(),
            mutedGrayscale: new Image(),
            mutedGreen: new Image(),
            mutedPurple: new Image(),
            mutedPavement: new Image(),
            
            // Normal (normal renkli binalar)
            normalBlue: new Image(),
            normalGreen: new Image(),
            normalLightBlue: new Image(),
            normalPink: new Image(),
            normalPurple: new Image(),
            normalRed: new Image(),
            normalPavement: new Image(),
            
            // Themed Shops - Large
            largeBank: new Image(),
            largeBar: new Image(),
            largeCandyShop: new Image(),
            largeElectronicsShop: new Image(),
            largeFlorist: new Image(),
            largeGroceryShop: new Image(),
            largeGunShop: new Image(),
            largeIceCreamShop: new Image(),
            largeJewelleryShop: new Image(),
            
            // Themed Shops - Small
            smallBank: new Image(),
            smallBar: new Image(),
            smallCandyShop: new Image(),
            smallElectronicsShop: new Image(),
            smallFlorist: new Image(),
            smallGroceryShop: new Image(),
            smallGunShop: new Image(),
            smallIceCreamShop: new Image(),
            smallJewelleryShop: new Image()
        };
        
        // Blank Shops
        sprites.buildings.blankShopBlack.src = 'buildings/Blank Shops/Black.png';
        sprites.buildings.blankShopBlue.src = 'buildings/Blank Shops/blue.png';
        sprites.buildings.blankShopBrown.src = 'buildings/Blank Shops/Brown.png';
        sprites.buildings.blankShopPurple.src = 'buildings/Blank Shops/purple.png';
        sprites.buildings.blankShopRed.src = 'buildings/Blank Shops/red.png';
        sprites.buildings.blankShopYellow.src = 'buildings/Blank Shops/yellow.png';
        sprites.buildings.blankShopYellow2.src = 'buildings/Blank Shops/yellow 2.png';
        sprites.buildings.blankShop2D.src = 'buildings/Blank Shops/2D shop.png';
        
        // Muted Colour
        sprites.buildings.mutedBlue.src = 'buildings/Muted Colour/Blue.png';
        sprites.buildings.mutedBrown.src = 'buildings/Muted Colour/brown.png';
        sprites.buildings.mutedGrayscale.src = 'buildings/Muted Colour/Grayscale.png';
        sprites.buildings.mutedGreen.src = 'buildings/Muted Colour/green.png';
        sprites.buildings.mutedPurple.src = 'buildings/Muted Colour/purple.png';
        sprites.buildings.mutedPavement.src = 'buildings/Muted Colour/pavement.png';
        
        // Normal
        sprites.buildings.normalBlue.src = 'buildings/Normal/blue.png';
        sprites.buildings.normalGreen.src = 'buildings/Normal/green.png';
        sprites.buildings.normalLightBlue.src = 'buildings/Normal/light blue.png';
        sprites.buildings.normalPink.src = 'buildings/Normal/pink.png';
        sprites.buildings.normalPurple.src = 'buildings/Normal/purple.png';
        sprites.buildings.normalRed.src = 'buildings/Normal/Red.png';
        sprites.buildings.normalPavement.src = 'buildings/Normal/pavement.png';
        
        // Themed Shops - Large
        sprites.buildings.largeBank.src = 'buildings/Themed shops/Large/Bank.png';
        sprites.buildings.largeBar.src = 'buildings/Themed shops/Large/Bar.png';
        sprites.buildings.largeCandyShop.src = 'buildings/Themed shops/Large/Candy Shop.png';
        sprites.buildings.largeElectronicsShop.src = 'buildings/Themed shops/Large/Electronics Shop.png';
        sprites.buildings.largeFlorist.src = 'buildings/Themed shops/Large/Florist.png';
        sprites.buildings.largeGroceryShop.src = 'buildings/Themed shops/Large/Grocery shop.png';
        sprites.buildings.largeGunShop.src = 'buildings/Themed shops/Large/Gun Shop.png';
        sprites.buildings.largeIceCreamShop.src = 'buildings/Themed shops/Large/Ice Cream Shop.png';
        sprites.buildings.largeJewelleryShop.src = 'buildings/Themed shops/Large/Jewellery shop.png';
        
        // Themed Shops - Small
        sprites.buildings.smallBank.src = 'buildings/Themed shops/Small/Bank.png';
        sprites.buildings.smallBar.src = 'buildings/Themed shops/Small/Bar.png';
        sprites.buildings.smallCandyShop.src = 'buildings/Themed shops/Small/Candy Shop.png';
        sprites.buildings.smallElectronicsShop.src = 'buildings/Themed shops/Small/Electronics Shop.png';
        sprites.buildings.smallFlorist.src = 'buildings/Themed shops/Small/Florist.png';
        sprites.buildings.smallGroceryShop.src = 'buildings/Themed shops/Small/Grocery shop.png';
        sprites.buildings.smallGunShop.src = 'buildings/Themed shops/Small/Gun Shop.png';
        sprites.buildings.smallIceCreamShop.src = 'buildings/Themed shops/Small/Ice Cream Shop.png';
        sprites.buildings.smallJewelleryShop.src = 'buildings/Themed shops/Small/Jewellery shop.png';
        
        // Load island tile sets
        sprites.island = {
            ground: new Image(),
            groundPref: new Image(), // ground_pref.png için
            objects: new Image(),
            buildings: new Image(),
            wallsRoofsDoors: new Image(),
            home1: new Image(), // home1.png
            home2: new Image(), // home2.png
            hotel: new Image(),  // hotel.png
            // Dekorasyon malzemeleri (susleme klasöründen)
            decoration: {
                lamp: new Image(),
                sit: new Image(),
                tree: new Image(),
                wallHorizontal: new Image(),
                wallVertical: new Image(),
                cicek: new Image()  // Çiçek dekorasyonu
            }
        };
        
        sprites.island.ground.src = 'island/ground_demo.png';
        sprites.island.groundPref.src = 'island/ground_pref.png';
        sprites.island.objects.src = 'island/objects_demo.png';
        sprites.island.buildings.src = 'island/premade_buildings_demo.png';
        sprites.island.wallsRoofsDoors.src = 'island/walls_roofs_doors_demo.png';
        sprites.island.home1.src = 'island/home1.png';
        sprites.island.home2.src = 'island/home2.png';
        sprites.island.hotel.src = 'island/hotel.png';
        // Dekorasyon sprite'larını yükle
        sprites.island.decoration.lamp.src = 'island/susleme/lamp.png';
        sprites.island.decoration.sit.src = 'island/susleme/sit.png';
        sprites.island.decoration.tree.src = 'island/susleme/tree.png';
        sprites.island.decoration.wallHorizontal.src = 'island/susleme/wall_horizontal.png';
        sprites.island.decoration.wallVertical.src = 'island/susleme/wall_vertical.png';
        sprites.island.decoration.cicek.src = 'island/cicek.png';
        
        // Island sprite yükleme hatalarını yakala
        Object.keys(sprites.island).forEach(key => {
            const img = sprites.island[key];
            // decoration bir obje olduğu için kontrol et
            if (img instanceof Image) {
                img.onerror = function() {
                    // Hata sessizce göz ardı edilir
                };
                img.onload = function() {
                    // Sprite yüklendi
                };
            } else if (key === 'decoration' && typeof img === 'object') {
                // decoration objesindeki sprite'ları da işle
                Object.keys(img).forEach(decKey => {
                    const decImg = img[decKey];
                    if (decImg instanceof Image) {
                        decImg.onerror = function() {
                            // Hata sessizce göz ardı edilir
                        };
                        decImg.onload = function() {
                            // Sprite yüklendi
                        };
                    }
                });
            }
        });
        
        // Sprite yükleme hatalarını yakala
        Object.keys(sprites.buildings).forEach(key => {
            sprites.buildings[key].onerror = function() {
                // Hata sessizce göz ardı edilir
            };
        });

        // Animation update
        function updateAnimation(sprite) {
            sprite.frameDelay++;
            if (sprite.frameDelay >= sprite.frameSpeed) {
                sprite.frameDelay = 0;
                sprite.currentFrame++;
                if (sprite.currentFrame >= sprite.idle.length) {
                    sprite.currentFrame = 0;
                }
            }
        }

        // Hedgehog animation update (sprite sheet kullanıyor)
        function updateHedgehogAnimation() {
            sprites.hedgehog.frameDelay++;
            if (sprites.hedgehog.frameDelay >= sprites.hedgehog.frameSpeed) {
                sprites.hedgehog.frameDelay = 0;
                sprites.hedgehog.currentFrame++;
                if (sprites.hedgehog.currentFrame >= sprites.hedgehog.idleFrameCount) {
                    sprites.hedgehog.currentFrame = 0;
                }
            }
        }

        // Input handling
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === 'e' || e.key === 'E') {
                checkInteraction();
            }
        });
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        // TÜM SAHNELERDE KULLANILACAK ZEMİN SEVİYESİ (tek bir yerden yönetiliyor)
        const GROUND_LEVEL = 530; // Tüm sahnelerde aynı zemin seviyesi

        // Game state
        const game = {
            gravity: 0.6,
            friction: 0.8,
            mapWidth: 5500,  // Çok geniş harita (15 soru için)
            state: 'playing',  // 'intro', 'verification', 'playing', 'finished' - TEST: direkt 'playing'
            startButton: null,  // Başlat butonu referansı
            backButton: null,   // Ana menü butonu referansı
            sceneState: 'onIsland',  // 'opening', 'gameplay', 'island', 'onIsland' - TEST: direkt 'onIsland'
            openingDialogShown: false,  // Açılış dialogu gösterildi mi?
            caffeNeroDialogShown: false,  // Caffè Nero diyaloğu gösterildi mi? (tekrar açılmasın)
            dockDialogShown: false,  // İskele diyaloğu gösterildi mi? (tekrar açılmasın)
            innEntered: false,  // Otel'e girildi mi? (sahne bitişi için)
            islandDecorations: [],  // Ada sahnesindeki dekorasyonlar (bir kez hesaplanıp saklanır)
            islandDecorationsInitialized: false  // Dekorasyonlar hesaplandı mı?
        };

        // Tekne objesi (ada sahnesi için)
        const boat = {
            x: 0,
            y: 0,
            width: 80,
            height: 40,
            angle: 0, // Rota açısı (radyan)
            routeProgress: 0, // 0-1 arası rota ilerlemesi
            speed: 0.0015, // Rota ilerleme hızı (her frame)
            isMoving: false
        };

        // Verification quiz (giriş doğrulama sorusu)
        const verificationQuiz = {
            question: 'Ilk kahvemizi nereden içtik?',
            answers: ['Starbucks', 'Caffè Nero', 'EspressoLab'],
            correctAnswer: 1,  // Index 1 = 'Caffè Nero'
            errorMessage: ''   // Hata mesajı
        };

        // State değiştirme fonksiyonu
        function changeGameState(newState) {
            // Dialogları kapat
            if (dialog.isOpen) {
                closeDialog();
            }

            // State'i değiştir
            game.state = newState;
            
            // Buton referanslarını temizle
            if (newState === 'playing') {
                game.startButton = null;
                game.sceneState = 'opening';  // Açılış sahnesinden başla
                game.openingDialogShown = false;  // Dialog henüz gösterilmedi
            } else if (newState === 'intro') {
                game.backButton = null;
            } else if (newState === 'verification') {
                game.startButton = null;
                verificationQuiz.errorMessage = '';  // Hata mesajını temizle
            }

            // HTML instructions div'ini göster/gizle
            const instructionsDiv = document.getElementById('instructions');
            if (instructionsDiv) {
                if (newState === 'intro') {
                    instructionsDiv.style.display = 'block';
                } else {
                    instructionsDiv.style.display = 'none';
                }
            }

            // Canvas'ı hemen temizle (eski içeriği hemen kaldır)
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // NOT: Yeni ekranı ÇİZME - game loop bir sonraki frame'de çizecek
        }

        // Camera system
        const camera = {
            x: 0,
            y: 0
        };

        // Player (Rakun - Kız arkadaş)
        const player = {
            x: 100,
            y: 450,  // Zemin seviyesinde başlat
            width: 100,  // Daha büyük
            height: 100,
            velocityX: 0,
            velocityY: 0,
            speed: 5,
            jumpPower: 13,
            isOnGround: true,  // Başlangıçta zeminde
            animationState: 'idle' // idle, walk, jump
        };

        // NPC Kirpi (Erkek arkadaş - Yardımcı)
        const hedgehog = {
            x: 300,
            y: 510,  // Zemin seviyesi (550 - 40 = 510, collision box alt kenarı zemine değecek)
            width: 80,  // Sprite boyutu (10px arttırıldı)
            height: 40,
            spriteYOffset: 15,  // Sprite'ı aşağı kaydır (yarıya indirildi)
            spriteHeightExtension: 15,  // Sprite yüksekliğini artır (yarıya indirildi)
            type: 'helper',
            speed: 3.25,  // Yürüme hızı
            isMoving: false,  // Hareket ediyor mu?
            targetX: null,  // Hedef X pozisyonu
            showSpeechBubble: false,  // Diyalog baloncuğu gösterilsin mi?
            speechText: "Bir kahve mi içsek acaba?",  // Baloncuk metni
            canMoveWithBubble: false,  // Baloncuk gösterilirken hareket edebilir mi? (Caffè Nero'dan sonra)
            waitingForPlayer: false,  // Rakunun hareket etmesini bekliyor mu? (ekran pozisyonunda)
            screenTargetX: null  // Ekran pozisyon hedefi (rakun durduğunda)
        };
        
        // Caffè Nero binasının pozisyonu (başlangıçta hesaplanacak)
        let caffeNeroX = null;
        let caffeNeroWidth = null;
        
        // İskele pozisyonu (Caffè Nero'dan sonraki 2. büyük binadan sonra)
        let dockX = null;
        let dockWidth = 180; // İskele genişliği (piksel cinsinden) - kısaltıldı
        
        // Binaların son pozisyonu (karakterlerin sınırı)
        let lastBuildingX = null;
        let lastBuildingWidth = null;
        
        // Bina pozisyonlarını hesapla (sprite'lar yüklendikten sonra)
        function calculateBuildingPositions() {
            if (caffeNeroX !== null && dockX !== null && lastBuildingX !== null) return; // Zaten hesaplandı
            const smallBuildings = [
                'smallCandyShop', 'smallBar', 'smallFlorist', 'smallElectronicsShop',
                'smallGunShop', 'smallJewelleryShop', 'smallIceCreamShop', 'smallBank'
            ];
            
            const largeBuildings = [
                'largeBank', 'largeBar', 'largeCandyShop', 'largeElectronicsShop',
                'largeFlorist', 'largeGroceryShop', 'largeGunShop', 'largeIceCreamShop',
                'largeJewelleryShop', 'normalBlue', 'normalGreen', 'normalRed',
                'normalPurple', 'normalPink', 'normalLightBlue', 'blankShopBlack',
                'blankShopBlue', 'blankShopBrown', 'blankShopPurple', 'blankShopRed',
                'blankShopYellow', 'blankShopYellow2', 'blankShop2D', 'mutedBlue',
                'mutedBrown', 'mutedGrayscale', 'mutedGreen', 'mutedPurple'
            ];
            
            let currentX = 50;
            const minSpacing = 20;
            let smallIndex = 0;
            let largeIndex = 0;
            
            let caffeNeroFound = false;
            let largeBuildingsAfterCaffeNero = 0; // Caffè Nero'dan sonraki büyük bina sayacı
            
            for (let i = 0; i < 30; i++) {
                const patternPos = i % 3;
                let spriteKey;
                
                if (patternPos === 0 || patternPos === 1) {
                    spriteKey = smallBuildings[smallIndex % smallBuildings.length];
                    smallIndex++;
                } else {
                    spriteKey = largeBuildings[largeIndex % largeBuildings.length];
                    
                    // İlk largeBar binasını bul (Caffè Nero)
                    if (!caffeNeroFound && spriteKey === 'largeBar') {
                        const buildingSprite = sprites.buildings[spriteKey];
                        const buildingWidth = (buildingSprite && buildingSprite.complete) ? buildingSprite.width : 180;
                        caffeNeroX = currentX;
                        caffeNeroWidth = buildingWidth;
                        caffeNeroFound = true;
                    }
                    
                    // Caffè Nero bulunduktan sonra, 2. büyük binadan sonra iskeleyi yerleştir
                    if (caffeNeroFound && spriteKey !== 'largeBar') {
                        largeBuildingsAfterCaffeNero++;
                        if (largeBuildingsAfterCaffeNero === 2) {
                            // 2. büyük bina bulundu, bu binadan sonra iskele olacak
                            const buildingSprite = sprites.buildings[spriteKey];
                            const buildingWidth = (buildingSprite && buildingSprite.complete) ? buildingSprite.width : 180;
                            dockX = currentX + buildingWidth + minSpacing;
                        }
                    }
                    
                    largeIndex++;
                }
                
                const buildingSprite = sprites.buildings[spriteKey];
                const buildingWidth = (buildingSprite && buildingSprite.complete) ? buildingSprite.width : 180;
                currentX += buildingWidth + minSpacing;
            }
        }


        // Dialog system
        let dialog = {
            isOpen: false,
            text: '',
            answers: [],
            currentObject: null,
            isHedgehogDialog: false, // Kirpi konuşması mı?
            step: 0 // Otel diyalogu için adım sayacı
        };


        // Check if player is near an interactive object
        function checkInteraction() {
            if (dialog.isOpen) {
                return;
            }

            const playerCenterX = player.x + player.width / 2;
            const playerCenterY = player.y + player.height / 2;

            // Check Caffè Nero binası etkileşimi (öncelikli)
            if (caffeNeroX !== null && caffeNeroWidth !== null && game.sceneState === 'gameplay') {
                // Eğer diyalog daha önce açıldıysa tekrar açma
                if (game.caffeNeroDialogShown) {
                    // Caffè Nero kontrolünü atla, iskele kontrolüne geç
                } else {
                    // Bina merkezi ve pozisyonu
                    const buildingCenterX = caffeNeroX + caffeNeroWidth / 2;
                    const buildingY = 550; // Ground level
                    
                    // Rakun binanın önünde mi? (X pozisyonu kontrolü)
                    const distanceX = Math.abs(playerCenterX - buildingCenterX);
                    const distanceToBuilding = distanceX;
                    
                    // Etkileşim mesafesi: binanın önünde, merkezden 100px içinde
                    if (distanceToBuilding < 100 && player.y + player.height >= buildingY - 10) {
                        openCaffeNeroDialog();
                return;
                    }
                }
            }

            // Check İskele etkileşimi
            // İskele pozisyonunu hesapla (eğer henüz hesaplanmadıysa)
            if (dockX === null && game.sceneState === 'gameplay') {
                calculateBuildingPositions();
            }
            
            if (dockX !== null && game.sceneState === 'gameplay') {
                // Eğer diyalog daha önce açıldıysa tekrar açma
                if (game.dockDialogShown) {
                    return;
                }

                // İskele merkezi ve pozisyonu
                const dockCenterX = dockX + dockWidth / 2;
                const dockY = 550; // Ground level
                
                // Rakun iskelenin önünde mi? (X pozisyonu kontrolü)
                const distanceX = Math.abs(playerCenterX - dockCenterX);
                const distanceToDock = distanceX;
                
                // İskele başlangıcı ve bitişi kontrolü
                const dockStartX = dockX;
                const dockEndX = dockX + dockWidth;
                
                // Rakun iskelenin önünde veya üzerinde mi? (daha geniş kontrol)
                const isNearDock = (playerCenterX >= dockStartX - 150 && playerCenterX <= dockEndX + 150);
                const playerOnGround = player.y + player.height >= dockY - 10;
                
                // Etkileşim mesafesi: iskelenin önünde, merkezden 150px içinde veya iskele alanında
                if (isNearDock && playerOnGround) {
                    openDockDialog();
                    return;
                }
            }

            // Otel etkileşimi (onIsland sahnesi)
            if (game.sceneState === 'onIsland' && !game.innEntered) {
                const islandXWorld = canvas.width / 2;
                
                // Evlerin sırası: home1, home2, home1, home2, hotel, home1
                // Hotel pozisyonunu hesapla (5. sırada)
                let hotelWorldX = islandXWorld - 400; // İlk ev pozisyonu (drawOnIsland ile aynı)
                const houseSpacing = 40; // Evler arası boşluk (azaltıldı)
                
                // İlk 4 evin genişliklerini topla (home1, home2, home1, home2) - 1.35x scale ile

        }

        // Metin sarma yardımcı fonksiyonu
        function wrapText(text, maxWidth, font) {
            const words = text.split(' ');
            const lines = [];
            let currentLine = words[0];

            ctx.font = font;
            
            for (let i = 1; i < words.length; i++) {
                const word = words[i];
                const width = ctx.measureText(currentLine + ' ' + word).width;
                if (width < maxWidth) {
                    currentLine += ' ' + word;
                } else {
                    lines.push(currentLine);
                    currentLine = word;
                }
            }
            lines.push(currentLine);
            return lines;
        }

        canvas.addEventListener('click', (e) => {

            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Check start button (intro screen)
            if (game.state === 'intro' && game.startButton) {
                const btn = game.startButton;
                if (mouseX > btn.x && mouseX < btn.x + btn.width &&
                    mouseY > btn.y && mouseY < btn.y + btn.height) {
                    changeGameState('verification');  // Önce doğrulama sorusu
                    return;
                }
            }

            // Check verification quiz answers
            if (game.state === 'verification') {
                const answerBoxY = 350;
                const answerHeight = 50;
                const answerSpacing = 60;

                verificationQuiz.answers.forEach((answer, index) => {
                    const y = answerBoxY + index * answerSpacing;
                    if (mouseX > 250 && mouseX < 550 && mouseY > y && mouseY < y + answerHeight) {
                        if (index === verificationQuiz.correctAnswer) {
                            // Doğru cevap - oyuna geç
                            verificationQuiz.errorMessage = '';
                            changeGameState('playing');
                        } else {
                            // Yanlış cevap - hata mesajını göster
                            verificationQuiz.errorMessage = 'Püh senin kalıbına!!';
                        }
                    }
                });
                return;
            }

            // Check back button (playing screen) - Ana menü butonu
            if (game.state === 'playing' && game.backButton) {
                const btn = game.backButton;
                // Daire şeklinde buton için merkez noktası ve yarıçap kontrolü
                const centerX = btn.x + btn.width / 2;
                const centerY = btn.y + btn.height / 2;
                const radius = btn.width / 2;
                const distance = Math.sqrt(Math.pow(mouseX - centerX, 2) + Math.pow(mouseY - centerY, 2));

                if (distance <= radius) {
                    changeGameState('intro');
                    return;
                }
            }

            // Check dialog answers
            if (!dialog.isOpen) return;

            // Dialog box pozisyonları (drawDialog ile aynı hesaplamalar)
            const dialogX = 150;
            const dialogY = 200;
            const dialogWidth = 500;
            const textPadding = 40;
            const maxTextWidth = dialogWidth - (textPadding * 2);
            const lineHeight = 28;
            
            // Metinleri sarmala (tıklama kontrolü için)

            const textLines = wrapText(dialog.text, maxTextWidth, 'bold 20px Arial');

            if (dialog.text2) {
                text2Lines = wrapText(dialog.text2, maxTextWidth, 'bold 20px Arial');
            }
            
            const textHeight = textLines.length * lineHeight;
            const text2Height = text2Lines.length * lineHeight;
            const textGap = text2Lines.length > 0 ? 15 : 0;
            const totalTextHeight = textHeight + text2Height + textGap;
            
            // Cevaplar için alan (dinamik hesaplama - tıklama kontrolü için)
            const clickAnswerHeight = 40;
            const clickAnswerBoxWidth = dialogWidth - 100;
            const clickAnswerTextWidth = clickAnswerBoxWidth - 40;
            ctx.font = '16px Arial';
            let clickTotalAnswerHeight = 0;
            dialog.answers.forEach((answer, index) => {
                const answerText = answer;
                const answerLines = wrapText(answerText, clickAnswerTextWidth, '16px Arial');
                const answerBoxHeight = Math.max(clickAnswerHeight, answerLines.length * 22 + 16);
                clickTotalAnswerHeight += answerBoxHeight + 10; // 10px boşluk
            });
            const clickAnswerAreaHeight = clickTotalAnswerHeight;
            
            const dialogHeight = Math.max(300, totalTextHeight + clickAnswerAreaHeight + 100);
            const dialogBoxY = dialogY + (300 - dialogHeight) / 2;
            
            let currentY = dialogBoxY + 50;
            currentY += textHeight + textGap;
            if (text2Lines.length > 0) {
                currentY += text2Height + 20;

            ctx.font = '16px Arial';

            dialog.answers.forEach((answer, index) => {
                const answerText = answer;
                const answerLines = wrapText(answerText, clickAnswerTextWidth, '16px Arial');
                const answerBoxHeight = Math.max(clickAnswerHeight, answerLines.length * 22 + 16);
                const answerY = currentY + clickAnswerOffsetY;
                const answerX = dialogX + 50;
                const answerWidth = clickAnswerBoxWidth;
                
                if (mouseX > answerX && mouseX < answerX + answerWidth && 
                    mouseY > answerY && mouseY < answerY + answerBoxHeight) {
                    handleAnswer(index);

                clickAnswerOffsetY += answerBoxHeight + 10; // 10px boşluk

        // Update player
        function updatePlayer() {
            // Horizontal movement
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                player.velocityX = -player.speed;
            } else if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                player.velocityX = player.speed;
            } else {
                player.velocityX *= game.friction;
            }

            // Jumping
            if ((keys[' '] || keys['ArrowUp'] || keys['w'] || keys['W']) && player.isOnGround) {
                player.velocityY = -player.jumpPower;
                player.isOnGround = false;
            }

            // Apply gravity
            player.velocityY += game.gravity;

            // Update position
            player.x += player.velocityX;
            player.y += player.velocityY;

            // Keep player in bounds (harita sınırları içinde)
            if (player.x < 0) player.x = 0;
            // İskele başlangıcına kadar gidebilir (gameplay sahnesi)
            if (game.sceneState === 'gameplay') {
                if (dockX !== null) {
                    // İskele başlangıcına kadar git, daha ileriye gidemesin
                    if (player.x + player.width > dockX) {
                        player.x = dockX - player.width;
                        player.velocityX = 0; // Sınıra ulaştı, dur
                    }
                } else if (lastBuildingX !== null) {
                    // İskele henüz hesaplanmadıysa, binaların sonuna kadar
                    const maxX = lastBuildingX;
                    if (player.x + player.width > maxX) {
                        player.x = maxX - player.width;
                        player.velocityX = 0;
                    }
                } else if (player.x + player.width > game.mapWidth) {
                    player.x = game.mapWidth - player.width;
                }
            } else if (player.x + player.width > game.mapWidth) {
                player.x = game.mapWidth - player.width;
            }

            // Ground collision - TÜM SAHNELERDE AYNI ZEMİN SEVİYESİ
            let groundLevel = GROUND_LEVEL;
            
            // Ada sınırları kontrolü (sadece onIsland sahnesi için)
            if (game.sceneState === 'onIsland') {
                const islandXWorld = canvas.width / 2; // Ada merkezi
                
                // Evlerin pozisyonlarını hesapla (karakter sınırları için)
                const houseStartX = islandXWorld - 400; // İlk ev pozisyonu
                const houseSpacing = 40;
                const houseScale = 1.35;
                
                // Tüm evlerin toplam genişliğini hesapla
                let totalHousesWidth = 0;
                const housesPattern = [
                    { sprite: sprites.island.home1, name: 'home1' },
                    { sprite: sprites.island.home2, name: 'home2' },
                    { sprite: sprites.island.home1, name: 'home1' },
                    { sprite: sprites.island.home2, name: 'home2' },
                    { sprite: sprites.island.hotel, name: 'hotel' },
                    { sprite: sprites.island.home1, name: 'home1' }
                ];
                
                for (let i = 0; i < housesPattern.length; i++) {
                    const house = housesPattern[i];
                    if (house.sprite && house.sprite.complete) {
                        const houseWidth = house.sprite.width * houseScale;
                        totalHousesWidth += houseWidth;
                        if (i < housesPattern.length - 1) {
                            totalHousesWidth += houseSpacing;
                        }
                    }
                }
                
                // Karakter sınırları: İlk evin solundan iskele başlangıcına kadar
                const islandLeft = houseStartX - 50; // Biraz sol taraftan boşluk
                const lastHouseRight = houseStartX + totalHousesWidth;
                const islandDockX = lastHouseRight + 100; // İskele başlangıcı
                const islandDockWidth = 180;
                const islandRight = islandDockX; // İskele başlangıcına kadar (daha ileriye gidemez)
                
                if (player.x < islandLeft) {
                    player.x = islandLeft;
                    player.velocityX = 0;
                }
                if (player.x + player.width > islandRight) {
                    player.x = islandRight - player.width;
                    player.velocityX = 0;
                }
            }
            
            if (player.y + player.height >= groundLevel) {
                player.y = groundLevel - player.height;
                    player.velocityY = 0;
                    player.isOnGround = true;
            } else {
                player.isOnGround = false;
                }
        }

            if (camera.x < 0) camera.x = 0;
            if (camera.x > game.mapWidth - canvas.width) {
                camera.x = game.mapWidth - canvas.width;

            // Y ekseninde kamera sabit (istersek yukarı-aşağı da takip edebilir)
