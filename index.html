        // Eve dönüş sahnesi başlatma (iskeleden eve yürüme)
        function initializeReturningHomeScene() {
            // İskele pozisyonu (sahnenin en solunda)
            const returningDockX = 0;
            const returningDockWidth = 180;
            const dockStartX = returningDockX + returningDockWidth + 135; // İskele başlangıcı (15px sola kaydırıldı)
            const dockWidth = 180;
            
            // Sağdan 2. bacağın x koordinatını hesapla (yol başlangıcı)
            const poleCount = 6;
            const poleSpacing = dockWidth / (poleCount - 1);
            const rightSecondPoleX = dockStartX + (4 * poleSpacing); // Sağdan 2. bacak (index 4, yol başlangıcı)
            
            // Evlerin sırası (onIsland ile aynı pattern: home1, home2, home1, home2, hotel, home1)
            const housesPattern = [
                { sprite: sprites.island.home1, name: 'home1' },
                { sprite: sprites.island.home2, name: 'home2' },
                { sprite: sprites.island.home1, name: 'home1' },
                { sprite: sprites.island.home2, name: 'home2' },
                { sprite: sprites.island.hotel, name: 'hotel' },
                { sprite: sprites.island.home1, name: 'home1' }
            ];
            
            // İlk ev pozisyonu: Sağdan 2. bacağın x koordinatından başla
            const houseStartX = rightSecondPoleX + 50 + 100; // Sağdan 2. bacağın x koordinatından 150px sonra
            const houseSpacing = 40;
            const houseScale = 1.35;
            
            // Evlerin toplam genişliğini hesapla
            let totalHousesWidth = 0;
            for (let i = 0; i < housesPattern.length; i++) {
                const house = housesPattern[i];
                if (house.sprite && house.sprite.complete) {
                    const houseWidth = house.sprite.width * houseScale;
                    totalHousesWidth += houseWidth;
                    if (i < housesPattern.length - 1) {
                        totalHousesWidth += houseSpacing;
                    }
                }
            }
            
            // Son ev pozisyonunu kaydet (hotel oyuncunun evi, son ev değil)
            // Hotel pozisyonunu bul (5. ev - index 4)
            let hotelWorldX = null;
            let hotelWidth = 96 * houseScale; // Varsayılan
            let currentHouseX = houseStartX;
            for (let i = 0; i < housesPattern.length; i++) {
                const house = housesPattern[i];
                if (house.sprite && house.sprite.complete) {
                    const houseWidth = house.sprite.width * houseScale;
                    
                    // Hotel pozisyonunu kaydet (5. ev - index 4)
                    if (i === 4 && house.name === 'hotel') {
                        hotelWorldX = currentHouseX;
                        hotelWidth = houseWidth;
                        break;
                    }
                    
                    currentHouseX += houseWidth + houseSpacing;
                }
            }
            
            const lastHouseRight = houseStartX + totalHousesWidth;
            // homeX = hotel pozisyonu (oyuncunun evi)
            if (hotelWorldX !== null) {
                homeX = hotelWorldX; // Hotel oyuncunun evi
            } else {
                homeX = lastHouseRight; // Fallback: Son evin sağ kenarı
            }
            
            // Karakterleri sağdan 2. bacağın x koordinatından (yolun başlangıcından) yerleştir
            player.x = rightSecondPoleX + 20; // Sağdan 2. bacağın x koordinatından 20px sonra
            hedgehog.x = rightSecondPoleX + 20 - hedgehog.width - 20; // Rakun'un biraz gerisinde
            
            // Karakterleri zemine yerleştir
            player.y = GROUND_LEVEL - player.height;
            hedgehog.y = GROUND_LEVEL - hedgehog.height;
            player.velocityX = 0;
            player.velocityY = 0;
            player.isOnGround = true;
            hedgehog.isMoving = false;
            hedgehog.targetX = null;
            // showSpeechBubble aşağıda ayarlanacak
            
            // Dekorasyonları sıfırla (yeniden hesaplanacak)
            game.islandDecorations = [];
            game.islandDecorationsInitialized = false;
            
            // Debug flag'i sıfırla
            game.carPositionLogged = false;
            
            // Araba pozisyonunu sıfırla ve hotel önünde hesapla
            carX = null;
            if (hotelWorldX !== null) {
                    // Hotel önünde, merkezden biraz sola hizalı
                    carX = hotelWorldX + (hotelWidth / 2) - 80; // Arabanın genişliği 160px, merkezden 80px sola
            }
            
            // Kirpi'nin hedefi: Araba (hotel önü)
            if (carX !== null) {
                hedgehog.targetX = carX + 40; // Arabanın sol tarafına yakın (araç kapısı gibi)
            } else if (hotelWorldX !== null) {
                hedgehog.targetX = hotelWorldX + (hotelWidth / 2) - hedgehog.width - 30;
            } else {
                hedgehog.targetX = homeX - hedgehog.width - 30;
            }
            hedgehog.isMoving = true;
            hedgehog.showSpeechBubble = true;
            hedgehog.speechText = 'Hadi doğru arabaya! Ama sen sür olur mu ben biraz uyuyacağım. :)';
            hedgehog.canMoveWithBubble = true;
            
            // Kamerayı karakterlere odakla (iskele görünür olsun)
            camera.x = Math.max(0, player.x - canvas.width / 2 + player.width / 2);
            
            // Dekorasyonları sıfırla (yeniden hesaplanacak)
            game.islandDecorations = [];
            game.islandDecorationsInitialized = false;
        }

        // Ada sahnesi başlatma (karakterler adaya indiğinde)
        function initializeOnIslandScene() {
            // Ada pozisyonu (dünya koordinatları - drawOnIsland ile aynı)
            const islandXWorld = canvas.width / 2; // Ada ekranın ortasında
            const islandY = GROUND_LEVEL; // TÜM SAHNELERDE AYNI ZEMİN SEVİYESİ
            
            // Ada zemin seviyesi (tile zemininin üstü)
            const islandGroundY = GROUND_LEVEL; // TÜM SAHNELERDE AYNI ZEMİN SEVİYESİ
            
            // Karakterler ekranın solundan başlamalı
            const startX = 50; // Ekranın solundan 50 piksel içeriden başla
            
            // Rakun pozisyonu: Ekranın solunda, zemin seviyesinde (dünya koordinatları)
            player.x = startX;
            player.y = islandGroundY - player.height;
            player.velocityX = 0;
            player.velocityY = 0;
            player.isOnGround = true;
            
            // Kirpi pozisyonu: Rakun'un solunda ama ekranın içinde kalmalı (dünya koordinatları)
            hedgehog.x = Math.max(20, player.x - 120); // En az 20 piksel soldan, yoksa ekranın dışına çıkar
            hedgehog.y = islandGroundY - hedgehog.height - 10; // Rakun'a göre biraz daha yukarı (görsel)
            
            // Otel pozisyonunu hesapla (kirpi otele gitmeli) - drawOnIsland ile aynı mantık
            const houseSpacing = 40;
            const houseScale = 1.35;
            
            // Evlerin sırası: home1, home2, home1, home2, hotel, home1
            const housesPattern = [
                { sprite: sprites.island.home1, name: 'home1' },
                { sprite: sprites.island.home2, name: 'home2' },
                { sprite: sprites.island.home1, name: 'home1' },
                { sprite: sprites.island.home2, name: 'home2' },
                { sprite: sprites.island.hotel, name: 'hotel' },
                { sprite: sprites.island.home1, name: 'home1' }
            ];
            
            // Otel pozisyonunu bul (5. sırada - index 4)
            let hotelWorldX = null;
            let hotelWidth = 96 * houseScale; // Varsayılan
            
            let currentHouseX = islandXWorld - 400;
            for (let i = 0; i < housesPattern.length; i++) {
                const house = housesPattern[i];
                if (house.sprite && house.sprite.complete) {
                    const houseWidth = house.sprite.width * houseScale;
                    
                    // Otel pozisyonunu kaydet (5. ev - index 4)
                    if (i === 4 && house.name === 'hotel') {
                        hotelWorldX = currentHouseX;
                        hotelWidth = houseWidth;
                        break;
                    }
                    
                    // Bir sonraki ev pozisyonu
                    currentHouseX += houseWidth + houseSpacing;
                }
            }
            
            // Eğer otel pozisyonu hesaplanamadıysa, fallback kullan
            if (hotelWorldX === null) {
                hotelWorldX = islandXWorld - 400;
                // İlk 4 evin genişliklerini topla
                if (sprites.island.home1 && sprites.island.home1.complete && 
                    sprites.island.home2 && sprites.island.home2.complete) {
                    const home1Width = sprites.island.home1.width * houseScale;
                    const home2Width = sprites.island.home2.width * houseScale;
                    hotelWorldX += (home1Width + houseSpacing) + (home2Width + houseSpacing) + 
                                    (home1Width + houseSpacing) + (home2Width + houseSpacing);
                }
            }
            
            // Kirpi otelin önüne gitmeli (otel merkezinin biraz solunda)
            // Sadece otel etkileşimi tamamlanmadıysa baloncuk ayarlarını yap
            if (!game.innEntered) {
                hedgehog.targetX = hotelWorldX + (hotelWidth / 2) - hedgehog.width - 30;
                hedgehog.isMoving = true;
                hedgehog.showSpeechBubble = true;
                hedgehog.speechText = 'Birlikte kaldığımız ilk otele gidiyoruz. Heyecanlı mısın?';
                hedgehog.canMoveWithBubble = true; // Baloncuk gösterilirken hareket edebilir
                hedgehog.waitingForPlayer = false;
            }
            
            // Kamera ayarı - karakterleri ekranın solunda göster
            camera.x = 0; // Ekranın solundan başla
            camera.y = 0; // Y ekseninde kamerayı hareket ettirmeyelim
            
            // Dekorasyonları sıfırla (yeniden hesaplanacak)
            // Sprite'lar asenkron yüklendiği için drawOnIsland() içinde tekrar kontrol edilecek
            game.islandDecorations = [];
            game.islandDecorationsInitialized = false;
        }

        // Datça sahnesi başlatma fonksiyonu
        function initializeDatcaScene() {
            // Datça pozisyonu (dünya koordinatları - drawDatca ile aynı)
            const datcaXWorld = canvas.width / 2; // Datça ekranın ortasında
            const datcaGroundOffset = 250; // Deniz kenarı kasaba için 250 piksel yukarı
            const datcaY = GROUND_LEVEL - datcaGroundOffset; // Zemin 250 piksel yukarı
            
            // Hotel pozisyonunu hesapla (araç hotel'in önüne kadar gitmeli)
            const houseStartX = datcaXWorld - 400;
            const houseSpacing = 40;
            const houseScale = 1.35;
            const housesPattern = [
                { sprite: sprites.island.home1, name: 'home1' },
                { sprite: sprites.island.home2, name: 'home2' },
                { sprite: sprites.island.home1, name: 'home1' },
                { sprite: sprites.island.home2, name: 'home2' },
                { sprite: sprites.island.hotel, name: 'hotel' },
                { sprite: sprites.island.home1, name: 'home1' },
                { sprite: sprites.island.home2, name: 'home2' },
                { sprite: sprites.island.home1, name: 'home1' },
                { sprite: sprites.island.home2, name: 'home2' },
                { sprite: sprites.island.home1, name: 'home1' },
                { sprite: sprites.island.home2, name: 'home2' }
            ];
            
            let hotelX = houseStartX;
            let hotelWidth = 96 * houseScale; // Varsayılan hotel genişliği
            let currentHouseX = houseStartX;

            // Hotel pozisyonunu hesapla (5. ev - index 4)
            // ÖNEMLI: Sprite'lar yüklenmediyse gerçek genişlikleri kullan
            for (let i = 0; i < housesPattern.length; i++) {
                const house = housesPattern[i];
                let houseWidth = 0;

                if (house.sprite && house.sprite.complete && house.sprite.width > 0) {
                    houseWidth = house.sprite.width * houseScale;
                } else {
                    // Sprite henüz yüklenmemişse GERÇEK sprite boyutlarını kullan
                    // (Bu değerler sprite dosyalarının gerçek boyutları - Python ile ölçüldü)
                    if (house.name === 'hotel') {
                        houseWidth = 204 * houseScale; // Hotel'in gerçek genişliği (204x158)
                    } else if (house.name === 'home1') {
                        houseWidth = 150 * houseScale; // home1'in gerçek genişliği (150x163)
                    } else if (house.name === 'home2') {
                        houseWidth = 196 * houseScale; // home2'nin gerçek genişliği (196x155)
                    }
                }

                // Hotel bulundu mu? (5. sırada - index 4)
                if (i === 4 && house.name === 'hotel') {
                    hotelX = currentHouseX; // Hotel'in sol kenarı
                    hotelWidth = houseWidth; // Hotel'in gerçek genişliği
                    break;
                }

                // Bir sonraki ev pozisyonu
                currentHouseX += houseWidth + houseSpacing;
            }
            
            // Araba başlangıç pozisyonu (sahnenin solundan)
            game.datcaCarX = -200; // Ekranın dışından başla

            // Araba hotel'in sol çitinin başladığı yerde durmalı
            // Sol çit pozisyonu: hotelX - wallPadding - wallVWidth
            const wallPadding = 10;
            const wallVWidth = sprites.island.decoration.wallVertical && sprites.island.decoration.wallVertical.complete
                ? sprites.island.decoration.wallVertical.width
                : 8; // Varsayılan çit genişliği

            // Araba sol çitin 200 piksel önünde dursun (güvenli mesafe)
            const hotelFenceLeft = hotelX - wallPadding - wallVWidth;
            game.datcaCarTargetX = hotelFenceLeft - 200;
            game.datcaCarMoving = true;
            game.datcaCarArrived = false;
            
            // Karakterler başlangıçta arabada (görünmez)
            game.datcaCharactersInCar = true;
            player.x = game.datcaCarX;
            player.y = datcaY - player.height;
            player.velocityX = 0;
            player.velocityY = 0;
            player.isOnGround = true;
            
            hedgehog.x = game.datcaCarX - 50;
            hedgehog.y = datcaY - hedgehog.height - 10;
            hedgehog.showSpeechBubble = false;
            hedgehog.isMoving = false;
            hedgehog.targetX = null;
            hedgehog.waitingForPlayer = false;
            hedgehog.canMoveWithBubble = false;
            
            // Kamera ayarı - arabayı takip et
            camera.x = Math.max(0, game.datcaCarX - canvas.width / 2);
            camera.y = 0;
            
            // Dekorasyonları sıfırla (yeniden hesaplanacak)
            game.datcaDecorations = [];
            game.datcaDecorationsInitialized = false;
        }

        // Ada üzerinde oyun sahnesi çizimi (karakterler adaya indikten sonra)
        function drawOnIsland() {
            // Gökyüzü gradient (arka plan - deniz yok, sadece gökyüzü)
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');      // Gökyüzü mavisi (üst)
            gradient.addColorStop(0.7, '#B0E0E6');   // Açık mavi
            gradient.addColorStop(1, '#E0F6FF');      // Çok açık mavi (alt)
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Ada pozisyonu (dünya koordinatları - kameraya göre offset uygulanacak)
            const islandXWorld = canvas.width / 2; // Ada ekranın ortasında (dünya koordinatı)
            const islandY = GROUND_LEVEL; // TÜM SAHNELERDE AYNI ZEMİN SEVİYESİ
            
            // Ada zemin merkezi (kameraya göre offset)
            const islandX = islandXWorld - camera.x;
            
            // Evleri çiz: home1, home2, home1, home2, hotel, home1
            const housesPattern = [
                { sprite: sprites.island.home1, name: 'home1' },
                { sprite: sprites.island.home2, name: 'home2' },
                { sprite: sprites.island.home1, name: 'home1' },
                { sprite: sprites.island.home2, name: 'home2' },
                { sprite: sprites.island.hotel, name: 'hotel' },
                { sprite: sprites.island.home1, name: 'home1' }
            ];
            
            let currentHouseX = islandXWorld - 400; // İlk ev pozisyonu (soldan başla)
            const houseSpacing = 40; // Evler arası boşluk (azaltıldı)
            const houseScale = 1.35;
            
            // Evlerin toplam genişliğini hesapla (zemin çizimi için)
            let totalHousesWidth = 0;
            for (let i = 0; i < housesPattern.length; i++) {
                const house = housesPattern[i];
                if (house.sprite && house.sprite.complete) {
                    const houseWidth = house.sprite.width * houseScale;
                    totalHousesWidth += houseWidth;
                    if (i < housesPattern.length - 1) {
                        totalHousesWidth += houseSpacing;
                    }
                }
            }
            
            // Zemin başlangıç ve bitiş pozisyonları (evlerin solundan sağına kadar + ekstra boşluk)
            // NOT: Zemin iskele'ye kadar uzanmalı, iskele alanı deniz olacak
            const houseStartX = islandXWorld - 400; // İlk ev pozisyonu
            const groundStartX = houseStartX - 100; // İlk evin solundan 100 piksel önce
            const lastHouseRight = houseStartX + totalHousesWidth;
            const islandDockX = lastHouseRight + 100; // Son evden 100 piksel sonra iskele (50 piksel sağa kaydırıldı)
            const islandDockWidth = 180;
            const groundEndX = islandDockX; // Zemin iskele başlangıcına kadar (iskele deniz alanında)
            
            // ÖNCE: Son evden sonra deniz çiz (zemin tile'larından önce, arka planda)
            const groundLevel = GROUND_LEVEL;
            const waterLevel = groundLevel + 10;
            const seaStartX = islandDockX - camera.x; // İskele başlangıcından itibaren deniz
            const seaEndX = islandDockX + islandDockWidth + 800 - camera.x; // İskele sonundan 800 piksel daha sağa kadar
            const seaStartY = waterLevel - camera.y;
            const seaHeight = canvas.height - seaStartY;
            
            // Deniz (iskele başlangıcından itibaren tüm alan)
            ctx.fillStyle = '#4169E1';
            ctx.fillRect(seaStartX, seaStartY, seaEndX - seaStartX, seaHeight);
            
            // Deniz dalga efekti
            ctx.strokeStyle = '#5B9BD5';
            ctx.lineWidth = 2;
            const waveCount = Math.floor(seaHeight / 15);
            for (let i = 0; i < waveCount; i++) {
                const waveY = seaStartY + i * 15;
                ctx.beginPath();
                ctx.moveTo(seaStartX, waveY);
                for (let x = seaStartX; x < seaEndX; x += 30) {
                    ctx.lineTo(x, waveY + Math.sin((x + camera.x) / 20) * 4);
                }
                ctx.stroke();
            }
            
            // Zemin çiz (ilk sahnedeki gibi kaldırım - pavement stili)
            const roadHeight = 70;
            const screenY = groundLevel - camera.y;
            const groundScreenStartX = groundStartX - camera.x;
            const groundScreenEndX = groundEndX - camera.x;
            
            // Basit düz gri kaldırım çiz (ilk sahnedeki gibi - aşağıya doğru)
            ctx.fillStyle = '#C0C0C0'; // Açık gri kaldırım
            ctx.fillRect(groundScreenStartX, screenY, groundScreenEndX - groundScreenStartX, roadHeight);
            
            // Üst kısmına hafif bir gölge/kenarlık ekle (derinlik için)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(groundScreenStartX, screenY, groundScreenEndX - groundScreenStartX, 2);
            
            // Alt kısmına da hafif bir gölge ekle
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(groundScreenStartX, screenY + roadHeight - 2, groundScreenEndX - groundScreenStartX, 2);
            
            // Dekorasyonları hesapla (eğer henüz hesaplanmadıysa ve sprite'lar yüklendiyse)
            // Her frame kontrol et (sprite'lar asenkron yükleniyor olabilir)
            if (!game.islandDecorationsInitialized || game.islandDecorations.length === 0) {
                // Tüm dekorasyon sprite'larının yüklendiğini kontrol et
                let allDecorationsLoaded = true;
                const decorationTypes = ['lamp', 'sit', 'tree', 'wallHorizontal', 'wallVertical'];
                for (let d = 0; d < decorationTypes.length; d++) {
                    const decType = decorationTypes[d];
                    const decSprite = sprites.island.decoration[decType];
                    if (!decSprite || !decSprite.complete) {
                        allDecorationsLoaded = false;
                        break;
                    }
                }
                
                // Eğer tüm sprite'lar yüklendiyse ve henüz dekorasyonlar hesaplanmadıysa
                if (allDecorationsLoaded && game.islandDecorations.length === 0) {
                    game.islandDecorations = [];
                    
                    // Eğer dekorasyon sprite'ları yüklendiyse, dekorasyonları hesapla
                    const wallVerticalSprite = sprites.island.decoration.wallVertical;
                    const wallPadding = 10; // Ev ile çit arasındaki boşluk
                    const wallVWidth = wallVerticalSprite.width;
                    const decorationHouseSpacing = 40; // Evler arası boşluk (drawOnIsland ile aynı olmalı)
                    
                    let tempHouseX = islandXWorld - 400; // Geçici pozisyon hesaplama için
                    
                    // Tüm evlerin ve çitlerin sınırlarını hesapla (çakışma kontrolü için)
                    const houseBounds = [];
                    for (let i = 0; i < housesPattern.length; i++) {
                        const house = housesPattern[i];
                        if (house.sprite && house.sprite.complete) {
                            const houseWidth = house.sprite.width * houseScale;
                            const houseLeft = tempHouseX;
                            const houseRight = tempHouseX + houseWidth;
                            
                            // Çit sınırları
                            const fenceLeft = houseLeft - wallPadding - wallVWidth;
                            const fenceRight = houseRight + wallPadding + wallVWidth;
                            
                            houseBounds.push({
                                houseLeft: houseLeft,
                                houseRight: houseRight,
                                fenceLeft: fenceLeft,
                                fenceRight: fenceRight,
                                fenceLeftInner: fenceLeft + wallVWidth,  // Çitin sağ kenarı (iç kenar)
                                fenceRightInner: fenceRight - wallVWidth // Çitin sol kenarı (iç kenar)
                            });
                            
                            // Bir sonraki ev pozisyonu
                            tempHouseX = houseRight + decorationHouseSpacing;
                        }
                    }
                    
                    // Her evin SAĞ TARAFINDAKI ev-çit boşluğuna dekorasyon yerleştir
                    // Ev ile çit arası boşluk: houseRight ile (fenceRight - wallVWidth) arası
                    for (let i = 0; i < housesPattern.length; i++) {
                        const house = houseBounds[i];
                        
                        if (house) {
                            // Evin sağ tarafındaki ev-çit boşluğu
                            // Ev sağ kenarı: house.houseRight
                            // Sağ çit sol kenarı: house.fenceRight - wallVWidth
                            // Bu arasındaki boşluk: wallPadding (10 piksel)
                            const decorationZoneStart = house.houseRight; // Evin sağ kenarı
                            const decorationZoneEnd = house.fenceRight - wallVWidth; // Sağ çitin sol kenarı
                            const decorationZoneWidth = decorationZoneEnd - decorationZoneStart;
                            
                            // Eğer boşluk yeterince genişse dekorasyon ekle
                            if (decorationZoneWidth > 5) {
                                // Her ev için farklı dekorasyon seç (ev index'ine göre rotasyon)
                                const nonWallTypes = ['lamp', 'sit', 'tree'];
                                // Her ev için farklı bir dekorasyon: index'e göre rotasyon yap
                                // Bu sayede her ev farklı bir dekorasyona sahip olur
                                const decorationIndex = i % nonWallTypes.length;
                                const randomType = nonWallTypes[decorationIndex];
                                const decorationSprite = sprites.island.decoration[randomType];
                                
                                if (decorationSprite && decorationSprite.complete) {
                                    // Ev-çit boşluğunun ortasına yerleştir, sonra 100 piksel sola kaydır
                                    const zoneCenter = (decorationZoneStart + decorationZoneEnd) / 2;
                                    // Dekorasyonun sol kenarı = merkez - sprite genişliği/2 - 100 piksel
                                    const decorationX = zoneCenter - decorationSprite.width / 2 - 17;
                                    
                                    // Dekorasyonu kaydet (dünya koordinatı olarak)
                                    // Not: Dekorasyon boşluğun dışına taşsa bile ekliyoruz (görsel olarak iyi görünecek)
                                    game.islandDecorations.push({
                                        type: randomType,
                                        sprite: decorationSprite,
                                        worldX: decorationX,
                                        worldY: islandY
                                    });
                                }
                            }
                        }
                    }
                    
                    // Özel: 2. ev (index 1) ile 3. ev (index 2) arasına çiçek ekle
                    // Çiçek sprite'ı yüklenene kadar bekle (her frame kontrol et)
                    if (houseBounds.length >= 3 && sprites.island.decoration.cicek) {
                        // Sprite yüklendi mi ve hata durumunda değil mi kontrol et
                        if (sprites.island.decoration.cicek.complete && sprites.island.decoration.cicek.naturalWidth > 0) {
                            const ev2 = houseBounds[1];  // 2. ev (index 1)
                            const ev3 = houseBounds[2];  // 3. ev (index 2)
                            
                            // Evler arası boşluğun ortası
                            const ev2SağKenarı = ev2.houseRight;
                            const ev3SolKenarı = ev3.houseLeft;
                            const evlerArasıBoşluk = ev3SolKenarı - ev2SağKenarı;
                            const evlerArasıMerkez = ev2SağKenarı + evlerArasıBoşluk / 2;
                            
                            // Çiçeği evler arası boşluğun ortasına yerleştir
                            const cicekX = evlerArasıMerkez - sprites.island.decoration.cicek.width / 2 - 100;
                            
                            // Çiçek zaten eklenmiş mi kontrol et (tekrar eklememek için)
                            const cicekAlreadyAdded = game.islandDecorations.some(dec => dec.type === 'cicek');
                            
                            if (!cicekAlreadyAdded) {
                                game.islandDecorations.push({
                                    type: 'cicek',
                                    sprite: sprites.island.decoration.cicek,
                                    worldX: cicekX,
                                    worldY: islandY
                                });
                            }
                        }
                    }
                    
                    game.islandDecorationsInitialized = true;
                }
            }
            
            // Evleri çiz ve etraflarına çit ekle
            for (let i = 0; i < housesPattern.length; i++) {
                const house = housesPattern[i];
                
                // Sprite yüklenmiş mi kontrol et
                if (house.sprite && house.sprite.complete) {
                    const originalWidth = house.sprite.width;
                    const originalHeight = house.sprite.height;
                    
                    // Evlerin boyutunu 1.35 katına çıkar
                    const houseWidth = originalWidth * houseScale;
                    const houseHeight = originalHeight * houseScale;
                    
                    // Ekranda görünüyor mu kontrol et
                    const screenX = currentHouseX - camera.x;
                    // Evlerin alt kenarı zemine tam otursun
                    // Sprite'ların altındaki boşluğu kompanse etmek için pozitif offset (evi aşağı çeker)
                    let verticalOffset = 0;
                    if (house.name === 'home1') {
                        // home1 sprite'ının altında boşluk var, daha aşağı çek
                        verticalOffset = 23; // Pozitif değer evi daha aşağı çeker (zemine oturtur)
                    } else if (house.name === 'home2') {
                        // home2 sprite'ının altında az boşluk var
                        verticalOffset = 15; // Küçük offset
                    } else if (house.name === 'hotel') {
                        // Otel sprite'ının altında boşluk var
                        verticalOffset = 15; // Orta offset
                    }
                    // Evlerin alt kenarı zemin seviyesinde olmalı (islandY)
                    // Pozitif offset ekleyerek evi aşağı çekiyoruz
                    const screenY = islandY - houseHeight + verticalOffset;
                    
                    if (screenX + houseWidth > 0 && screenX < canvas.width) {
                        // Ev çitleri: Ev çizilmeden önce çitleri çiz (arkada kalması için)
                        const wallVerticalSprite = sprites.island.decoration.wallVertical;
                        const wallHorizontalSprite = sprites.island.decoration.wallHorizontal;
                        const wallPadding = 10; // Ev ile çit arasındaki boşluk
                        
                        if (wallVerticalSprite && wallVerticalSprite.complete && 
                            wallHorizontalSprite && wallHorizontalSprite.complete) {
                            
                            const wallVWidth = wallVerticalSprite.width;
                            const wallVHeight = wallVerticalSprite.height;
                            const wallHWidth = wallHorizontalSprite.width;
                            const wallHHeight = wallHorizontalSprite.height;
                            
                            // Çit pozisyonları (evin etrafına)
                            const fenceLeft = currentHouseX - wallPadding - wallVWidth; // Sol çit
                            const fenceRight = currentHouseX + houseWidth + wallPadding; // Sağ çit
                            const fenceBottom = islandY; // Alt çit (zemin seviyesinde)
                            const fenceTop = screenY - wallPadding; // Üst çit
                            
                            // Sol çit (dikey)
                            const fenceLeftScreenX = fenceLeft - camera.x;
                            if (fenceLeftScreenX + wallVWidth > 0 && fenceLeftScreenX < canvas.width) {
                                // Sol çit, evin solundan üstüne kadar
                                const fenceTopY = fenceTop;
                                const fenceBottomY = fenceBottom;
                                const fenceHeight = fenceBottomY - fenceTopY;
                                
                                // Çit yüksekliği boyunca dikey çitleri tekrarla
                                for (let y = fenceTopY; y < fenceBottomY; y += wallVHeight) {
                                    const currentFenceHeight = Math.min(wallVHeight, fenceBottomY - y);
                                    const fenceScreenY = y - camera.y;
                                    
                                    if (fenceScreenY + currentFenceHeight > 0 && fenceScreenY < canvas.height) {
                                        ctx.drawImage(
                                            wallVerticalSprite,
                                            0, 0, wallVWidth, currentFenceHeight, // Kaynak
                                            fenceLeftScreenX, fenceScreenY, wallVWidth, currentFenceHeight // Hedef
                                        );
                                    }
                                }
                            }
                            
                            // Sağ çit (dikey)
                            const fenceRightScreenX = fenceRight - camera.x;
                            if (fenceRightScreenX > 0 && fenceRightScreenX < canvas.width) {
                                // Sağ çit, evin sağından üstüne kadar
                                const fenceTopY = fenceTop;
                                const fenceBottomY = fenceBottom;
                                
                                // Çit yüksekliği boyunca dikey çitleri tekrarla
                                for (let y = fenceTopY; y < fenceBottomY; y += wallVHeight) {
                                    const currentFenceHeight = Math.min(wallVHeight, fenceBottomY - y);
                                    const fenceScreenY = y - camera.y;
                                    
                                    if (fenceScreenY + currentFenceHeight > 0 && fenceScreenY < canvas.height) {
                                        ctx.drawImage(
                                            wallVerticalSprite,
                                            0, 0, wallVWidth, currentFenceHeight, // Kaynak
                                            fenceRightScreenX, fenceScreenY, wallVWidth, currentFenceHeight // Hedef
                                        );
                                    }
                                }
                            }
                            
                            // Üst çit (yatay)
                            const fenceTopScreenY = fenceTop - camera.y;
                            if (fenceTopScreenY + wallHHeight > 0 && fenceTopScreenY < canvas.height) {
                                // Üst çit, sol çit ile sağ çit arasında
                                const fenceStartX = fenceLeft;
                                const fenceEndX = fenceRight + wallVWidth;
                                const fenceWidth = fenceEndX - fenceStartX;
                                
                                // Çit genişliği boyunca yatay çitleri tekrarla
                                for (let x = fenceStartX; x < fenceEndX; x += wallHWidth) {
                                    const currentFenceWidth = Math.min(wallHWidth, fenceEndX - x);
                                    const fenceScreenX = x - camera.x;
                                    
                                    if (fenceScreenX + currentFenceWidth > 0 && fenceScreenX < canvas.width) {
                                        ctx.drawImage(
                                            wallHorizontalSprite,
                                            0, 0, currentFenceWidth, wallHHeight, // Kaynak
                                            fenceScreenX, fenceTopScreenY, currentFenceWidth, wallHHeight // Hedef
                                        );
                                    }
                                }
                            }
                            
                            // Alt çit kaldırıldı - evlerin yola bakan tarafında çit olmamalı
                        }
                        
                        // Ev çiz
                        ctx.drawImage(
                            house.sprite,
                            0, 0, originalWidth, originalHeight, // Kaynak (orijinal sprite)
                            screenX, screenY, houseWidth, houseHeight // Hedef (büyütülmüş boyut)
                        );
                        
                        // Otel için tabela ve "E" etkileşim sembolü
                        if (house.name === 'hotel') {
                            // Pixel-art stilinde ahşap tabela çiz (her zaman görünür)
                            const signScreenX = screenX; // Otelin merkezi
                            const signScreenY = screenY + 125; // Otelin üstünde
                            const signWidth = 120; // Genişlik azaltıldı
                            const signHeight = 42; // Yükseklik artırıldı (iki satır için)
                            const poleHeight = 25; // Tabela direği yüksekliği
                            
                            ctx.save();
                            // Pixel-art için image smoothing'i kapat
                            ctx.imageSmoothingEnabled = false;
                            
                            // Tabela direği (otelin çatısına bağlı)
                            ctx.fillStyle = '#8B4513'; // Kahverengi
                            ctx.fillRect(signScreenX - 4, signScreenY + signHeight - 1, 8, poleHeight);
                            // Direk gölgesi
                            ctx.fillStyle = '#654321';
                            ctx.fillRect(signScreenX - 3, signScreenY + signHeight, 6, poleHeight);
                            
                            // Tabela arka planı (ahşap görünümlü)
                            // Ana arka plan - açık kahverengi
                            ctx.fillStyle = '#D2691E';
                            ctx.fillRect(signScreenX - signWidth / 2, signScreenY, signWidth, signHeight);
                            
                            // Ahşap dokusu - dikey çizgiler
                            ctx.fillStyle = '#CD853F';
                            for (let i = 0; i < signWidth; i += 4) {
                                ctx.fillRect(signScreenX - signWidth / 2 + i, signScreenY, 1, signHeight);
                            }
                            
                            // Tabela kenarları (kalın çerçeve)
                            ctx.fillStyle = '#8B4513'; // Koyu kahverengi çerçeve
                            ctx.fillRect(signScreenX - signWidth / 2, signScreenY, signWidth, 3); // Üst
                            ctx.fillRect(signScreenX - signWidth / 2, signScreenY + signHeight - 3, signWidth, 3); // Alt
                            ctx.fillRect(signScreenX - signWidth / 2, signScreenY, 3, signHeight); // Sol
                            ctx.fillRect(signScreenX + signWidth / 2 - 3, signScreenY, 3, signHeight); // Sağ
                            
                            // Tabela gölgesi (derinlik için)
                            ctx.fillStyle = '#654321';
                            ctx.fillRect(signScreenX - signWidth / 2 + 2, signScreenY + 2, signWidth - 4, signHeight - 4);
                            
                            // Tabela metni (pixel-art stili - iki satır)
                            ctx.fillStyle = '#FFFFFF';
                            ctx.strokeStyle = '#000000';
                            ctx.lineWidth = 1;
                            ctx.font = 'bold 12px "Courier New", monospace'; // Pixel-art için monospace font
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            
                            // İlk satır: "Triada Hotel" (üst satır)
                            const line1Y = signScreenY + signHeight / 2 - 7;
                            ctx.fillStyle = '#000000';
                            ctx.fillText('Triada Hotel', signScreenX + 1, line1Y + 1);
                            ctx.fillStyle = '#FFFFFF';
                            ctx.fillText('Triada Hotel', signScreenX, line1Y);
                            
                            // İkinci satır: "Büyükada" (alt satır)
                            const line2Y = signScreenY + signHeight / 2 + 7;
                            ctx.fillStyle = '#000000';
                            ctx.fillText('Büyükada', signScreenX + 1, line2Y + 1);
                            ctx.fillStyle = '#FFFFFF';
                            ctx.fillText('Büyükada', signScreenX, line2Y);
                            
                            ctx.restore();
                            
                            // "E" etkileşim sembolü (sadece etkileşim mümkünken göster)
                            if (!game.innEntered) {
                                const playerCenterX = player.x + player.width / 2;
                                const houseCenterX = currentHouseX + houseWidth / 2;
                                const distanceToHouse = Math.abs(playerCenterX - houseCenterX);
                                
                                if (distanceToHouse < 100 && playerCenterX >= currentHouseX - 20 && playerCenterX <= currentHouseX + houseWidth + 20) {
                                    // "E" sembolü çiz
                                    ctx.save();
                                    ctx.fillStyle = '#FFFFFF';
                                    ctx.strokeStyle = '#000000';
                                    ctx.lineWidth = 2;
                                    ctx.font = 'bold 20px Arial';
                                    ctx.textAlign = 'center';
                                    ctx.strokeText('E', screenX + houseWidth / 2, screenY - 30);
                                    ctx.fillText('E', screenX + houseWidth / 2, screenY - 30);
                                    ctx.restore();
                                }
                            }
                        }
                    }
                    
                    // Bir sonraki ev pozisyonu (büyütülmüş genişlik kullan)
                    currentHouseX += houseWidth + houseSpacing;
                }
            }
            
            // Saklanmış dekorasyonları çiz (bir kez hesaplanmış, sabit)
            if (game.islandDecorations && game.islandDecorations.length > 0) {
                for (let i = 0; i < game.islandDecorations.length; i++) {
                    const decoration = game.islandDecorations[i];
                    
                    // Sprite'ın yüklenmiş ve hata durumunda olmadığını kontrol et
                    if (decoration.sprite && decoration.sprite.complete && decoration.sprite.naturalWidth > 0) {
                        // Dünya koordinatını ekran koordinatına çevir
                        // Not: worldX zaten 1 piksel sola kaydırılmış olarak kaydedilmiş
                        const decorationScreenX = decoration.worldX - camera.x;
                        const decorationScreenY = decoration.worldY - decoration.sprite.height; // Zemine oturt
                        
                        // Ekranda görünüyor mu kontrol et
                        if (decorationScreenX + decoration.sprite.width > 0 && decorationScreenX < canvas.width) {
                            ctx.drawImage(
                                decoration.sprite,
                                decorationScreenX, decorationScreenY
                            );
                        }
                    }
                }
            }
            
            // Son evden sonra iskele ve tekne çiz (ilk sahne gibi)
            // Not: islandDockX, islandDockWidth, groundLevel, waterLevel ve deniz zaten yukarıda tanımlandı/çizildi
            const dockPlatformHeight = 25; // İskele platformu kalınlığı
            const dockPlatformY = waterLevel - dockPlatformHeight - 5; // İskele platformu su üstünde
            const dockPoleHeight = 60; // İskele kazığı yüksekliği
            
            const dockScreenX = islandDockX - camera.x;
            const dockScreenY = dockPlatformY - camera.y;
            
            // İskele çiz (ekranda görünüyorsa) - deniz üzerinde
            if (dockScreenX + islandDockWidth > 0 && dockScreenX < canvas.width) {
                // İskele kazıkları (dikey çubuklar) - ilk üç bacak çizilmiyor
                ctx.fillStyle = '#654321';
                const poleCount = 6;
                for (let i = 0; i < poleCount; i++) {
                    if (i < 3) continue; // İlk üç bacak çizilmiyor
                    const poleX = dockScreenX + (i * islandDockWidth / (poleCount - 1));
                    const poleScreenY = dockScreenY + dockPlatformHeight;
                    ctx.fillRect(poleX - 4, poleScreenY, 8, dockPoleHeight);
                }
                
                // İskele platformu (ahşap)
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(dockScreenX, dockScreenY, islandDockWidth, dockPlatformHeight);
                
                // İskele platformu üst çizgisi
                ctx.strokeStyle = '#654321';
                ctx.lineWidth = 2;
                ctx.strokeRect(dockScreenX, dockScreenY, islandDockWidth, dockPlatformHeight);
                
                // "E" etkileşim sembolü (sadece otel etkileşimi tamamlandıysa ve diyalog açık değilse)
                if (game.innEntered && !dialog.isOpen) {
                    const playerCenterX = player.x + player.width / 2;
                    const dockStartX = islandDockX;
                    const dockEndX = islandDockX + islandDockWidth;
                    const isNearDock = (playerCenterX >= dockStartX - 150 && playerCenterX <= dockEndX + 150);
                    const playerOnGround = player.y + player.height >= GROUND_LEVEL - 10;
                    
                    if (isNearDock && playerOnGround) {
                        const dockCenterX = islandDockX + islandDockWidth / 2;
                        const dockTextY = dockScreenY - 30; // İskele üstünde

                    ctx.fillStyle = 'white';
                    ctx.strokeStyle = 'black';
                    ctx.lineWidth = 3;
                    ctx.font = 'bold 20px Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.strokeText('E', dockCenterX - camera.x, dockTextY);
                        ctx.fillText('E', dockCenterX - camera.x, dockTextY);
                        ctx.textAlign = 'left'; // Reset
                        ctx.textBaseline = 'alphabetic'; // Reset
                    }
                }
                
                // Tekne (iskeleye bağlı)
                const dockEndX = dockScreenX + islandDockWidth;
                const dockEndY = dockScreenY + dockPlatformHeight / 2;
                const boatDistance = 90;
                const boatX = dockEndX + boatDistance - 63;
                const boatY = dockEndY - 30;
                const boatWidth = 120;
                const boatHeight = 50;
                
                // Tekne gövdesi (yarım oval)
                ctx.fillStyle = '#654321';
                ctx.beginPath();
                ctx.ellipse(boatX + boatWidth / 2, boatY + boatHeight, boatWidth / 2, boatHeight / 2, 0, 0, Math.PI, false);
                ctx.fill();
                
                // Tekne gövdesi üst kenarlığı
                ctx.strokeStyle = '#4A3728';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.ellipse(boatX + boatWidth / 2, boatY + boatHeight, boatWidth / 2, boatHeight / 2, 0, 0, Math.PI, false);
                ctx.stroke();
                
                // Tekne iç kısmı
                ctx.fillStyle = '#8B4513';
                ctx.beginPath();
                ctx.ellipse(boatX + boatWidth / 2, boatY + boatHeight - 2, boatWidth / 2 - 3, boatHeight / 2 - 3, 0, 0, Math.PI, false);
                ctx.fill();
                
                // Tekne iç kenarlığı
                ctx.strokeStyle = '#6B5439';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(boatX + boatWidth / 2, boatY + boatHeight - 2, boatWidth / 2 - 3, boatHeight / 2 - 3, 0, 0, Math.PI, false);
                ctx.stroke();
                
                // İskele üzerinde halat bağlantı noktası
                const ropeAnchorX = dockEndX - 5;
                const ropeAnchorY = dockEndY;
                
                ctx.fillStyle = '#4A3728';
                ctx.beginPath();
                ctx.arc(ropeAnchorX, ropeAnchorY, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#2F1F14';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                ctx.fillStyle = '#6B5439';
                ctx.beginPath();
                ctx.arc(ropeAnchorX, ropeAnchorY, 5, 0, Math.PI * 2);
                ctx.fill();
                
                // Tekne üzerinde halat bağlantı noktası
                const boatCenterX = boatX + boatWidth / 2;
                const boatCenterY = boatY + boatHeight;
                const boatRopeX = boatX + 15;
                const boatRopeY = boatCenterY - 2;
                
                ctx.fillStyle = '#4A3728';
                ctx.beginPath();
                ctx.arc(boatRopeX, boatRopeY, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#2F1F14';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                ctx.fillStyle = '#6B5439';
                ctx.beginPath();
                ctx.arc(boatRopeX, boatRopeY, 4, 0, Math.PI * 2);
                ctx.fill();
                
                // Halat
                ctx.strokeStyle = '#8B7355';
                ctx.lineWidth = 8;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(ropeAnchorX, ropeAnchorY);
                ctx.lineTo(boatRopeX, boatRopeY);
                ctx.stroke();
                
                // Halat gölgesi
                ctx.strokeStyle = '#6B5B45';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(ropeAnchorX + 1, ropeAnchorY + 1);
                ctx.lineTo(boatRopeX + 1, boatRopeY + 1);
                ctx.stroke();
                
                // Halat highlight
                ctx.strokeStyle = '#AB9B85';
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(ropeAnchorX - 1, ropeAnchorY - 1);
                ctx.lineTo(boatRopeX - 1, boatRopeY - 1);
                ctx.stroke();
                
                // Tekne gölgesi
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.beginPath();
                ctx.ellipse(boatX + boatWidth / 2, boatY + boatHeight + 5, boatWidth / 2, boatHeight / 2 - 5, 0, 0, Math.PI, false);
                ctx.fill();
                
                // Tekne bayrağı (tekneye bitişik)
                ctx.fillStyle = '#FF0000';
                ctx.fillRect(boatX + boatWidth - 10, boatY - 15, 8, 15);
                
                // Bayrak detayı
                ctx.strokeStyle = '#8B0000';
                ctx.lineWidth = 1;
                ctx.strokeRect(boatX + boatWidth - 10, boatY - 15, 8, 15);
            }
            
            // Karakterleri çiz (ada üzerinde)
            drawHedgehog();
            drawPlayer();
        }

        // Datça sahnesi çizimi (onIsland benzeri, ancak iskele ve tekne yok)
        function drawDatca() {
            // Gökyüzü gradient (arka plan - deniz yok, sadece gökyüzü)
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');      // Gökyüzü mavisi (üst)
            gradient.addColorStop(0.7, '#B0E0E6');   // Açık mavi
            gradient.addColorStop(1, '#E0F6FF');      // Çok açık mavi (alt)
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Datça pozisyonu (dünya koordinatları - kameraya göre offset uygulanacak)
            const datcaXWorld = canvas.width / 2; // Datça ekranın ortasında (dünya koordinatı)
            const datcaGroundOffset = 250; // Deniz kenarı kasaba için 250 piksel yukarı
            const datcaY = GROUND_LEVEL - datcaGroundOffset; // Zemin 250 piksel yukarı
            
            // Datça zemin merkezi (kameraya göre offset)
            const datcaX = datcaXWorld - camera.x;

            // Evleri çiz: home1, home2, home1, home2, hotel, home1, home2, home1, home2, home1, home2
            const housesPattern = [
                { sprite: sprites.island.home1, name: 'home1' },
                { sprite: sprites.island.home2, name: 'home2' },
                { sprite: sprites.island.home1, name: 'home1' },
                { sprite: sprites.island.home2, name: 'home2' },
                { sprite: sprites.island.hotel, name: 'hotel' },
                { sprite: sprites.island.home1, name: 'home1' },
                { sprite: sprites.island.home2, name: 'home2' },
                { sprite: sprites.island.home1, name: 'home1' },
                { sprite: sprites.island.home2, name: 'home2' },
                { sprite: sprites.island.home1, name: 'home1' },
                { sprite: sprites.island.home2, name: 'home2' }
            ];

            let currentHouseX = datcaXWorld - 400; // İlk ev pozisyonu (soldan başla)
            const houseSpacing = 40; // Evler arası boşluk
            const houseScale = 1.35;
            
            // Evlerin toplam genişliğini hesapla (zemin çizimi için)
            let totalHousesWidth = 0;
            for (let i = 0; i < housesPattern.length; i++) {
                const house = housesPattern[i];
                if (house.sprite && house.sprite.complete) {
                    const houseWidth = house.sprite.width * houseScale;
                    totalHousesWidth += houseWidth;
                    if (i < housesPattern.length - 1) {
                        totalHousesWidth += houseSpacing;
                    }
                }
            }
            
            // Zemin başlangıç ve bitiş pozisyonları (evlerin solundan sağına kadar + ekstra boşluk)
            const houseStartX = datcaXWorld - 400; // İlk ev pozisyonu
            const groundStartX = houseStartX - 100; // İlk evin solundan 100 piksel önce
            const lastHouseRight = houseStartX + totalHousesWidth;
            const groundEndX = lastHouseRight + 300; // Son evden 300 piksel sonra
            
            // Zemin çiz (ilk sahnedeki gibi kaldırım - pavement stili)
            const roadHeight = 70;
            const screenY = datcaY - camera.y;
            const groundScreenStartX = groundStartX - camera.x;
            const groundScreenEndX = groundEndX - camera.x;

            // Yolun altına deniz çiz (tüm ekran genişliğinde) - önce çiz ki yol üstte olsun
            const seaStartY = screenY + roadHeight;
            const seaHeight = canvas.height - seaStartY;
            if (seaHeight > 0) {
                // Deniz gradient (üstten açık mavi, alta doğru koyu mavi)
                const seaGradient = ctx.createLinearGradient(0, seaStartY, 0, canvas.height);
                seaGradient.addColorStop(0, '#4A90E2');   // Açık deniz mavisi
                seaGradient.addColorStop(0.5, '#357ABD'); // Orta mavi
                seaGradient.addColorStop(1, '#2E5F8F');   // Koyu deniz mavisi
                ctx.fillStyle = seaGradient;
                ctx.fillRect(0, seaStartY, canvas.width, seaHeight);

                // Deniz dalgaları efekti (basit yatay çizgiler)
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.lineWidth = 1;
                for (let y = seaStartY + 10; y < canvas.height; y += 20) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
            }

            // Basit düz gri kaldırım çiz (ilk sahnedeki gibi - aşağıya doğru)
            ctx.fillStyle = '#C0C0C0'; // Açık gri kaldırım
            ctx.fillRect(groundScreenStartX, screenY, groundScreenEndX - groundScreenStartX, roadHeight);

            // Üst kısmına hafif bir gölge/kenarlık ekle (derinlik için)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(groundScreenStartX, screenY, groundScreenEndX - groundScreenStartX, 2);

            // Alt kısmına da hafif bir gölge ekle
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(groundScreenStartX, screenY + roadHeight - 2, groundScreenEndX - groundScreenStartX, 2);

            // Dekorasyonları hesapla (eğer henüz hesaplanmadıysa ve sprite'lar yüklendiyse)
            if (!game.datcaDecorationsInitialized || game.datcaDecorations.length === 0) {
                // Tüm dekorasyon sprite'larının yüklendiğini kontrol et
                let allDecorationsLoaded = true;
                const decorationTypes = ['lamp', 'sit', 'tree', 'wallHorizontal', 'wallVertical'];
                for (let d = 0; d < decorationTypes.length; d++) {
                    const decType = decorationTypes[d];
                    const decSprite = sprites.island.decoration[decType];
                    if (!decSprite || !decSprite.complete) {
                        allDecorationsLoaded = false;
                        break;
                    }
                }
                
                // Eğer tüm sprite'lar yüklendiyse ve henüz dekorasyonlar hesaplanmadıysa
                if (allDecorationsLoaded && game.datcaDecorations.length === 0) {
                    game.datcaDecorations = [];
                    
                    const wallVerticalSprite = sprites.island.decoration.wallVertical;
                    const wallPadding = 10;
                    const wallVWidth = wallVerticalSprite.width;
                    const decorationHouseSpacing = 40;
                    
                    let tempHouseX = datcaXWorld - 400;
                    
                    // Tüm evlerin ve çitlerin sınırlarını hesapla
                    const houseBounds = [];
                    for (let i = 0; i < housesPattern.length; i++) {
                        const house = housesPattern[i];
                        if (house.sprite && house.sprite.complete) {
                            const houseWidth = house.sprite.width * houseScale;
                            const houseLeft = tempHouseX;
                            const houseRight = tempHouseX + houseWidth;
                            
                            const fenceLeft = houseLeft - wallPadding - wallVWidth;
                            const fenceRight = houseRight + wallPadding + wallVWidth;
                            
                            houseBounds.push({
                                houseLeft: houseLeft,
                                houseRight: houseRight,
                                fenceLeft: fenceLeft,
                                fenceRight: fenceRight,
                                fenceLeftInner: fenceLeft + wallVWidth,
                                fenceRightInner: fenceRight - wallVWidth
                            });
                            
                            tempHouseX = houseRight + decorationHouseSpacing;
                        }
                    }
                    
                    // Her evin sağ tarafındaki ev-çit boşluğuna dekorasyon yerleştir
                    for (let i = 0; i < housesPattern.length; i++) {
                        const house = houseBounds[i];
                        
                        if (house) {
                            const decorationZoneStart = house.houseRight;
                            const decorationZoneEnd = house.fenceRight - wallVWidth;
                            const decorationZoneWidth = decorationZoneEnd - decorationZoneStart;
                            
                            if (decorationZoneWidth > 5) {
                                const nonWallTypes = ['lamp', 'sit', 'tree'];
                                const decorationIndex = i % nonWallTypes.length;
                                const randomType = nonWallTypes[decorationIndex];
                                const decorationSprite = sprites.island.decoration[randomType];
                                
                                if (decorationSprite && decorationSprite.complete) {
                                    const zoneCenter = (decorationZoneStart + decorationZoneEnd) / 2;
                                    const decorationX = zoneCenter - decorationSprite.width / 2 - 17;
                                    
                                    game.datcaDecorations.push({
                                        type: randomType,
                                        sprite: decorationSprite,
                                        worldX: decorationX,
                                        worldY: datcaY
                                    });
                                }
                            }
                        }
                    }
                    
                    // Özel: 2. ev ile 3. ev arasına çiçek ekle
                    if (houseBounds.length >= 3 && sprites.island.decoration.cicek) {
                        if (sprites.island.decoration.cicek.complete && sprites.island.decoration.cicek.naturalWidth > 0) {
                            const ev2 = houseBounds[1];
                            const ev3 = houseBounds[2];
                            
                            const ev2SağKenarı = ev2.houseRight;
                            const ev3SolKenarı = ev3.houseLeft;
                            const evlerArasıBoşluk = ev3SolKenarı - ev2SağKenarı;
                            const evlerArasıMerkez = ev2SağKenarı + evlerArasıBoşluk / 2;
                            
                            const cicekX = evlerArasıMerkez - sprites.island.decoration.cicek.width / 2 - 100;
                            
                            const cicekAlreadyAdded = game.datcaDecorations.some(dec => dec.type === 'cicek');
                            
                            if (!cicekAlreadyAdded) {
                                game.datcaDecorations.push({
                                    type: 'cicek',
                                    sprite: sprites.island.decoration.cicek,
                                    worldX: cicekX,
                                    worldY: datcaY
                                });
                            }
                        }
                    }
                    
                    game.datcaDecorationsInitialized = true;
                }
            }
            
            // Evleri çiz ve etraflarına çit ekle
            for (let i = 0; i < housesPattern.length; i++) {
                const house = housesPattern[i];

                if (house.sprite && house.sprite.complete) {

            // Saklanmış dekorasyonları çiz

                        const decorationScreenY = decoration.worldY - decoration.sprite.height;
                        
                        if (decorationScreenX + decoration.sprite.width > 0 && decorationScreenX < canvas.width) {

            // Karakterleri çiz (eğer arabada değillerse)

            // Tekne rotası hesaplama (kıvrımlı bezier curve)
        function getBoatPosition(progress) {
            // Ada pozisyonu (sağ üst köşe - drawIsland ile aynı)
            const islandX = canvas.width - 210; // drawIsland ile eşleştir
            const islandY = 150; // drawIsland ile eşleştir
            const islandRadius = 200; // Ada yarıçapı (drawIsland ile aynı)
            const islandRadiusY = islandRadius * 0.6; // Dikey yarıçap (120)
            
            // Ada sınırları (adanın üzerine çıkmamak için)
            const islandMinX = islandX - islandRadius; // Ada sol kenarı
            const islandMaxX = islandX + islandRadius; // Ada sağ kenarı
            const islandMinY = islandY - islandRadiusY; // Ada üst kenarı
            const islandMaxY = islandY + islandRadiusY; // Ada alt kenarı
            
            // Ada kontrolü: Bir nokta adanın üzerinde mi?
            function isPointOnIsland(px, py) {
                // Ada elips şeklinde, elips içinde mi kontrol et
                const dx = (px - islandX) / islandRadius;
                const dy = (py - islandY) / islandRadiusY;
                return (dx * dx + dy * dy) <= 1;
            }
            
            // İskele başlangıç pozisyonu (sol alt - iskelenin sonu)
            const dockX = 2;
            const dockY = canvas.height - 50;
            const dockWidth = 120;
            const startX = dockX + dockWidth + 3; // İskele sonundan biraz önce
            const startY = dockY - 30; // İskele seviyesinin biraz üstü
            
            // Ada hedef pozisyonu (adanın alt kenarı, sol tarafından yaklaş - ADA KENARINDA AMA DIŞINDA)
            // Ada sol kenarının hemen dışından, alt kenarına yakın
            const endX = islandMinX - 8; // Ada sol kenarından sadece 8px sola (kenara çok yakın)
            const endY = islandMaxY + 5; // Ada alt kenarından sadece 5px aşağı (kenara çok yakın)
            
            // Kontrol noktaları (kıvrımlı rota için - ada kenarına yakın ama üzerine çıkmadan)
            // İlk bölüm: İskeleden aşağı ve sağa
            const cp1X = 150;
            const cp1Y = canvas.height - 40; // Aşağı doğru
            
            const cp2X = 250;
            const cp2Y = canvas.height - 30; // Sağa doğru
            
            // Ada'nın sol tarafına yaklaş
            const cp3X = islandMinX - 80; // Ada sol kenarından 80px sola
            const cp3Y = canvas.height - 50; // Deniz seviyesinde
            
            // İkinci bölüm: Ada'nın sol tarafından geçerek altına doğru
            const cp4X = islandMinX - 60; // Ada'nın soluna yaklaş
            const cp4Y = islandMaxY + 30; // Ada'nın alt seviyesine yaklaş
            
            const cp5X = islandMinX - 40; // Ada'nın sol tarafına daha yakın
            const cp5Y = islandMaxY + 20; // Ada'nın alt seviyesine yaklaş
            
            // Ada'nın sol alt köşesine yaklaş (kenara çok yakın ama üzerine çıkma)
            const cp6X = islandMinX - 15; // Ada sol kenarına çok yakın ama dışında
            const cp6Y = islandMaxY + 15; // Ada'nın alt kenarına yakın
            
            // Üçüncü bölüm: Ada'nın altından hedefe (kenara yakın)
            const cp7X = islandMinX - 12; // Ada'nın sol tarafından, kenara çok yakın
            const cp7Y = islandMaxY + 10; // Ada'nın alt kenarına çok yakın
            
            // Bezier curve ile kıvrımlı rota (3 bezier curve birleştiriyoruz)
            let t = progress;
            let x, y;
            
            if (t < 0.33) {
                // İlk bölüm: İskeleden sağa doğru
                t = t / 0.33;
                const t1 = 1 - t;
                x = startX * t1 * t1 * t1 + 
                    cp1X * 3 * t1 * t1 * t + 
                    cp2X * 3 * t1 * t * t + 
                    cp3X * t * t * t;
                y = startY * t1 * t1 * t1 + 
                    cp1Y * 3 * t1 * t1 * t + 
                    cp2Y * 3 * t1 * t * t + 
                    cp3Y * t * t * t;
            } else if (t < 0.66) {
                // İkinci bölüm: Sağa, ada'nın altına
                t = (t - 0.33) / 0.33;
                const t1 = 1 - t;
                x = cp3X * t1 * t1 * t1 + 
                    cp4X * 3 * t1 * t1 * t + 
                    cp5X * 3 * t1 * t * t + 
                    cp6X * t * t * t;
                y = cp3Y * t1 * t1 * t1 + 
                    cp4Y * 3 * t1 * t1 * t + 
                    cp5Y * 3 * t1 * t * t + 
                    cp6Y * t * t * t;
            } else {
                // Üçüncü bölüm: Ada'nın altından hedefe (adanın dışından)
                t = (t - 0.66) / 0.34;
                const t1 = 1 - t;
                
                x = cp6X * t1 * t1 * t1 + 
                    cp7X * 3 * t1 * t1 * t + 
                    endX * 3 * t1 * t * t + 
                    endX * t * t * t;
                y = cp6Y * t1 * t1 * t1 + 
                    cp7Y * 3 * t1 * t1 * t + 
                    endY * 3 * t1 * t * t + 
                    endY * t * t * t;
            }
            
            // Son kontrol: Eğer hesaplanan pozisyon ada'nın üzerindeyse, ada kenarının hemen dışına çıkar
            if (isPointOnIsland(x, y)) {
                // Ada'nın üzerindeyse, kenarın hemen dışına taşı (5-10px kadar dışında)
                // Y pozisyonu: Eğer ada'nın üstündeyse alt kenarına, altındaysa alt kenarının biraz aşağısına
                if (y < islandMaxY) {
                    // Ada'nın üstünde veya içindeyse, alt kenarının 5px aşağısına
                    y = islandMaxY + 5;
                } else {
                    // Zaten altında ama kontrol gerekli
                    y = islandMaxY + 5;
                }
                // X pozisyonunu ada'nın dışında tut (sol kenara yakın)
                if (x >= islandMinX && x <= islandMaxX) {
                    // Ada'nın içindeyse, sol kenarın 8px dışına çıkar
                    x = islandMinX - 8;
                } else if (x < islandMinX) {
                    // Zaten solunda, ama çok uzaksa yaklaştır
                    if (x < islandMinX - 20) {
                        x = islandMinX - 8;
                    }
                }
            }
            
            return { x, y };
        }
        
        // Tekne rotası hesaplama (TERS - Adadan iskeleye)
        function getBoatPositionReturn(progress) {
            // Ada pozisyonu (onIsland sahnesindeki iskele pozisyonu yakınında)
            const islandXWorld = canvas.width / 2;
            const houseStartX = islandXWorld - 400;
            const houseSpacing = 40;
            const houseScale = 1.35;
            
            // Tüm evlerin toplam genişliğini hesapla
            const housesPattern = [
                { sprite: sprites.island.home1, name: 'home1' },
                { sprite: sprites.island.home2, name: 'home2' },
                { sprite: sprites.island.home1, name: 'home1' },
                { sprite: sprites.island.home2, name: 'home2' },
                { sprite: sprites.island.hotel, name: 'hotel' },
                { sprite: sprites.island.home1, name: 'home1' }
            ];
            
            let totalHousesWidth = 0;
            for (let i = 0; i < housesPattern.length; i++) {
                const house = housesPattern[i];
                if (house.sprite && house.sprite.complete) {
                    const houseWidth = house.sprite.width * houseScale;
                    totalHousesWidth += houseWidth;
                    if (i < housesPattern.length - 1) {
                        totalHousesWidth += houseSpacing;
                    }
                }
            }
            
            const lastHouseRight = houseStartX + totalHousesWidth;
            
            // Ada başlangıç pozisyonu (adanın sol kenarı)
            const islandX = canvas.width - 210; // Ada merkezi
            const islandY = 150;
            const islandRadius = 200;
            const islandRadiusY = islandRadius * 0.6;
            const islandMinX = islandX - islandRadius;
            const islandMaxY = islandY + islandRadiusY;
            
            // Ada'dan başla (ilk sahnedeki rotanın tersi)
            const startX = islandMinX - 8; // Ada sol kenarından 8px sola
            const startY = islandMaxY + 5; // Ada alt kenarından 5px aşağı
            
            // İskele hedef pozisyonu (ilk sahnedeki iskele)
            const dockX = 2;
            const dockY = canvas.height - 50;
            const dockWidth = 120;
            const endX = dockX + dockWidth + 3; // İskele sonundan biraz önce
            const endY = dockY - 30; // İskele seviyesinin biraz üstü
            
            // TERS KONTROL NOKTALARI (orijinal rotanın tersi)
            // Üçüncü bölümün tersi (adanın altından başla, sola git)
            const cp7X = islandMinX - 12;
            const cp7Y = islandMaxY + 10;
            const cp6X = islandMinX - 15;
            const cp6Y = islandMaxY + 15;
            
            // İkinci bölümün tersi (ada'nın sol tarafından geçerek)
            const cp5X = islandMinX - 40;
            const cp5Y = islandMaxY + 20;
            const cp4X = islandMinX - 60;
            const cp4Y = islandMaxY + 30;
            const cp3X = islandMinX - 80;
            const cp3Y = canvas.height - 50;
            
            // İlk bölümün tersi (sağdan sola, iskeleye doğru)
            const cp2X = 250;
            const cp2Y = canvas.height - 30;
            const cp1X = 150;
            const cp1Y = canvas.height - 40;
            
            // Bezier curve ile TERS kıvrımlı rota (3 bezier curve birleştiriyoruz)
            let t = progress;
            let x, y;
            
            if (t < 0.34) {
                // İlk bölüm: Ada'dan sola doğru (ters üçüncü bölüm)
                t = t / 0.34;
                const t1 = 1 - t;
                x = startX * t1 * t1 * t1 + 
                    cp7X * 3 * t1 * t1 * t + 
                    cp6X * 3 * t1 * t * t + 
                    cp5X * t * t * t;
                y = startY * t1 * t1 * t1 + 
                    cp7Y * 3 * t1 * t1 * t + 
                    cp6Y * 3 * t1 * t * t + 
                    cp5Y * t * t * t;
            } else if (t < 0.67) {
                // İkinci bölüm: Sola, ada'nın solundan geçerek (ters ikinci bölüm)
                t = (t - 0.34) / 0.33;
                const t1 = 1 - t;
                x = cp5X * t1 * t1 * t1 + 
                    cp4X * 3 * t1 * t1 * t + 
                    cp3X * 3 * t1 * t * t + 
                    cp2X * t * t * t;
                y = cp5Y * t1 * t1 * t1 + 
                    cp4Y * 3 * t1 * t1 * t + 
                    cp3Y * 3 * t1 * t * t + 
                    cp2Y * t * t * t;
            } else {
                // Üçüncü bölüm: Sola doğru, iskeleye yaklaşma (ters ilk bölüm)
                t = (t - 0.67) / 0.33;
                const t1 = 1 - t;
                x = cp2X * t1 * t1 * t1 + 
                    cp1X * 3 * t1 * t1 * t + 
                    endX * 3 * t1 * t * t + 
                    endX * t * t * t;
                y = cp2Y * t1 * t1 * t1 + 
                    cp1Y * 3 * t1 * t1 * t + 
                    endY * 3 * t1 * t * t + 
                    endY * t * t * t;
            }
            
            return { x, y };
        }

        // Araba güncelleme (returningHome sahnesi - arabaya binme sonrası)
        function updateCar() {
