                        // Kirpi binanın sonundan ileriye gitmesin
                        if (lastBuildingX !== null && hedgehog.x + hedgehog.width > lastBuildingX) {
                            hedgehog.x = lastBuildingX - hedgehog.width;
                            hedgehog.isMoving = false; // Sınıra ulaştı, dur
                        }
                    }
                    return;
                }
                
                // Eğer Caffè Nero hedefi yoksa veya tamamlandıysa ve rakun duruyorsa, ekranda görünür bir noktaya gel
                // Bu sadece Caffè Nero hedefi olmadığında çalışmalı (henüz hedef verilmemişse)
                if (playerIsStationary && hedgehog.targetX === null && hedgehog.showSpeechBubble === false) {
                    const hedgehogScreenX = hedgehog.x - camera.x;
                    const hedgehogIsVisible = hedgehogScreenX >= 0 && hedgehogScreenX <= canvas.width - hedgehog.width;
                    
                    // Kirpi ekranda görünür mü ve uygun pozisyonda mı?
                    if (!hedgehogIsVisible || hedgehogScreenX > canvas.width * 0.7) {
                        // Ekranın %70'lik kısmına gel
                        const targetScreenX = canvas.width * 0.7;
                        const targetWorldX = camera.x + targetScreenX;
                        
                        if (Math.abs(hedgehog.x - targetWorldX) > 10) {
                            // Hedefe doğru hareket et
                            hedgehog.isMoving = true;
                            if (hedgehog.x < targetWorldX) {
                                hedgehog.x += hedgehog.speed;
                            } else {
                                hedgehog.x -= hedgehog.speed;
                            }
                        } else {
                            // Hedefe ulaşıldı, dur ve baloncuk göster
                            hedgehog.isMoving = false;
                            hedgehog.showSpeechBubble = true;
                        }
                    } else {
                        // Ekranda görünür ve uygun pozisyonda, dur ve baloncuk göster
                        hedgehog.isMoving = false;
                        hedgehog.showSpeechBubble = true;
                    }
                    return;
                }
                
                // Eğer buraya geldiyse, başka bir şey yapılmasına gerek yok
                return;
            }
            
            // Açılış sahnesi: Kirpi otomatik olarak rakun'a doğru yürür
            if (game.sceneState === 'opening') {
                // Merkez noktalarını hesapla
                const playerCenterX = player.x + player.width / 2;
                const hedgehogCenterX = hedgehog.x + hedgehog.width / 2;
                
                // Etkileşim mesafesi (checkInteraction ile aynı)
                const interactionDistance = 80;
                
                // Mevcut mesafeyi kontrol et
                const currentDistance = Math.abs(playerCenterX - hedgehogCenterX);
                
                // Eğer etkileşim mesafesindeyse, dur ve dialog aç
                if (currentDistance <= interactionDistance) {
                    hedgehog.isMoving = false;

                    // Dialog henüz gösterilmediyse, otomatik aç
                    if (!game.openingDialogShown && !dialog.isOpen) {
                        game.openingDialogShown = true;
                        openOpeningDialog();
                    }
                    return; // Hareket etme
                }
                
                // Kirpi rakunun hangi tarafında?
                // Eğer kirpi rakunun sağındaysa, rakunun sağına yaklaş
                // Eğer kirpi rakunun solundaysa, rakunun soluna yaklaş
                const targetDistance = interactionDistance - 10; // Etkileşim mesafesinden biraz önce dur
                
                if (hedgehogCenterX > playerCenterX) {
                    // Kirpi sağda, rakunun sağına yaklaş
                    // Hedef: rakun merkezinin sağında targetDistance kadar uzakta
                    hedgehog.targetX = playerCenterX + targetDistance - hedgehog.width / 2;
                } else {
                    // Kirpi solda, rakunun soluna yaklaş
                    // Hedef: rakun merkezinin solunda targetDistance kadar uzakta
                    hedgehog.targetX = playerCenterX - targetDistance - hedgehog.width / 2;
                }
                
                hedgehog.isMoving = true;

                // Hedefe doğru hareket et
                if (Math.abs(hedgehog.x - hedgehog.targetX) > 3) {
                    if (hedgehog.x < hedgehog.targetX) {
                        hedgehog.x += hedgehog.speed;
                    } else {
                        hedgehog.x -= hedgehog.speed;
                    }
                } else {
                    // Hedefe ulaştı, dur (ama dialog kontrolü yukarıda yapılıyor)
                    hedgehog.isMoving = false;
                }
            }

            // Datça sahnesi: Kirpi targetX'e doğru hareket eder (otele gitme / son eve gitme)
            if (game.sceneState === 'datca' && hedgehog.targetX !== null) {
                const playerIsStationary = Math.abs(player.velocityX) < 0.5;
                
                // Eğer bekliyorsa ve rakun hareket ediyorsa, tekrar hareket et
                if (hedgehog.waitingForPlayer && !playerIsStationary) {
                    hedgehog.waitingForPlayer = false;
                    hedgehog.isMoving = true;
                }
                
                if (hedgehog.isMoving) {
                    // Ekran kontrolü - kirpi ekrandan çıkmamalı
                    const hedgehogScreenX = hedgehog.x - camera.x;
                    const nextX = hedgehog.x < hedgehog.targetX ? hedgehog.x + hedgehog.speed : hedgehog.x - hedgehog.speed;
                    const nextScreenX = nextX - camera.x;
                    const willBeOffScreen = nextScreenX < 0 || nextScreenX > canvas.width - hedgehog.width;

                    // Eğer bir sonraki adımda ekrandan çıkacaksa ve rakun duruyorsa, dur
                    if (willBeOffScreen && playerIsStationary) {
                        // Kirpi ekranın %70'inde beklemeye geçsin
                        const targetScreenX = canvas.width * 0.7;
                        const targetWorldX = camera.x + targetScreenX;

                        if (Math.abs(hedgehog.x - targetWorldX) > 10) {
                            // Ekran hedefine git
                            if (hedgehog.x < targetWorldX) {
                                hedgehog.x += hedgehog.speed;
                            } else {
                                hedgehog.x -= hedgehog.speed;
                            }
                        } else {
                            // Ekran pozisyonunda dur, rakun hareket edene kadar bekle
                            hedgehog.isMoving = false;
                            hedgehog.waitingForPlayer = true;
                        }
                    } else if (willBeOffScreen && !playerIsStationary) {
                        // Rakun hareket ediyor ama kirpi hala ekrandan çıkacak - beklemeye geç
                        const targetScreenX = canvas.width * 0.7;
                        const targetWorldX = camera.x + targetScreenX;
                        
                        if (Math.abs(hedgehog.x - targetWorldX) > 10) {
                            if (hedgehog.x < targetWorldX) {
                                hedgehog.x += hedgehog.speed;
                            } else {
                                hedgehog.x -= hedgehog.speed;
                            }
                        } else {
                            hedgehog.isMoving = false;
                            hedgehog.waitingForPlayer = true;
                        }
                    } else {
                        // Rakun hareket ediyorsa ve kirpi ekranda görünürse, hedefe git
                        hedgehog.waitingForPlayer = false; // Hareket ediyor, bekleme durumunu iptal et
                        const distance = Math.abs(hedgehog.x - hedgehog.targetX);

                        if (distance > 5) {
                            if (hedgehog.x < hedgehog.targetX) {
                                hedgehog.x += hedgehog.speed;
                            } else {
                                hedgehog.x -= hedgehog.speed;
                            }
                        } else {
                            // Hedefe ulaştı (game loop'ta kontrol edilecek)
                            hedgehog.x = hedgehog.targetX;
                            hedgehog.isMoving = false;
                        }
                    }
                } else if (hedgehog.waitingForPlayer) {
                    // Bekliyor - ekran pozisyonunda kal, ama rakun hareket ettiyse yukarıda kontrol edildi
                    // Burada sadece ekran pozisyonunu koru
                    const targetScreenX = canvas.width * 0.7;
                    const targetWorldX = camera.x + targetScreenX;
                    
                    // Kamera hareket ettiyse kirpi pozisyonunu güncelle (sadece ekran pozisyonunu koru)
                    if (Math.abs((hedgehog.x - camera.x) - targetScreenX) > 5) {
                        hedgehog.x = targetWorldX;
                    }
                }
            }
        }

        // Opening dialog (açılış sahnesi dialogu)
        function openOpeningDialog() {
            dialog.isOpen = true;
            dialog.isHedgehogDialog = true;
            dialog.text = 'Rakun merhaba! Bugün 5 Kasım 2023. Şimdi seninle zamanda yolculuğa çıkıyoruz!';
            dialog.text2 = 'Biraz hafızanı tazeleyelim. Hazır olduğunu düşünüyorum!';
            dialog.answers = ['Hazırım! 💕'];
            dialog.currentObject = null;
        }

        // Draw player (Sprite-based Raccoon) - Kamera offset ile
        function drawPlayer() {
            const screenX = player.x - camera.x;
            const screenY = player.y - camera.y;

            // Determine which animation to use
            let currentAnim = sprites.raccoon.idle;
            if (!player.isOnGround) {
                currentAnim = sprites.raccoon.jump;
            } else if (Math.abs(player.velocityX) > 0.5) {
                currentAnim = sprites.raccoon.walk;
            }

            // Get current frame
            const frame = currentAnim[sprites.raccoon.currentFrame % currentAnim.length];

            // Sprite offset - Ayakların zemine değmesi için sprite'ı aşağı kaydır
            const spriteYOffset = 30; // Sprite'ı 30 piksel aşağı çiz
            const spriteHeightExtension = 30; // Sprite yüksekliğini artır

            // Draw sprite if loaded
            if (frame && frame.complete) {
                ctx.save();

                // Sola bakıyorsa sprite'ı flip et
                if (player.facingDirection === -1) {
                    ctx.translate(screenX + player.width, 0);
                    ctx.scale(-1, 1);
                    ctx.drawImage(
                        frame,
                        0,
                        screenY + spriteYOffset,
                        player.width,
                        player.height + spriteHeightExtension
                    );
                } else {
                    // Normal (sağa bakıyor)
                ctx.drawImage(
                    frame,
                    screenX,
                    screenY + spriteYOffset,
                    player.width,
                    player.height + spriteHeightExtension
                );
                }

                ctx.restore();
            } else {
                // Fallback rectangle while loading
                ctx.fillStyle = '#D2691E';
                ctx.fillRect(screenX, screenY, player.width, player.height);
            }

            // Debug: Collision box'ı göster (test için)
            // ctx.strokeStyle = 'red';
            // ctx.strokeRect(screenX, screenY, player.width, player.height);
        }

        // Draw hedgehog (Sprite-based) - Kamera offset ile
        function drawHedgehog() {
            const screenX = hedgehog.x - camera.x;
            const screenY = hedgehog.y - camera.y;

            // Idle sprite sheet kullan
            const spriteSheet = sprites.hedgehog.idle[0];
            if (spriteSheet && spriteSheet.complete) {
                // Sprite sheet'teki bir frame boyutu (yatay dizilmiş)
                const frameCount = sprites.hedgehog.idleFrameCount;
                const frameWidth = spriteSheet.width / frameCount;
                const frameHeight = spriteSheet.height;
                const currentFrame = Math.floor(sprites.hedgehog.currentFrame) % frameCount;

                // Sprite'ın aspect ratio'sunu koru ve collision box içine sığdır
                const spriteAspectRatio = frameWidth / frameHeight;
                const maxWidth = hedgehog.width;
                const maxHeight = hedgehog.height + hedgehog.spriteHeightExtension;
                
                // Sprite'ı collision box'a sığdır (aspect ratio korunarak)
                let drawWidth = maxWidth;
                let drawHeight = drawWidth / spriteAspectRatio;
                
                if (drawHeight > maxHeight) {
                    drawHeight = maxHeight;
                    drawWidth = drawHeight * spriteAspectRatio;
                }

                // Sprite'ı collision box'ın merkezine hizala (taşma olmasın)
                const drawX = screenX + (hedgehog.width - drawWidth) / 2;
                const drawY = screenY + hedgehog.spriteYOffset + (maxHeight - drawHeight) / 2;

                // Frame'i sprite sheet'ten çıkar ve çiz (collision box içinde, taşma olmadan)
                ctx.save();
                if (hedgehog.facingDirection === -1) {
                    // Sola bakıyorsa sprite'ı yatay çevir
                    ctx.translate(drawX + drawWidth, 0);
                    ctx.scale(-1, 1);
                    ctx.drawImage(
                        spriteSheet,
                        currentFrame * frameWidth, 0,  // Source x, y
                        frameWidth, frameHeight,        // Source width, height
                        0,                              // Dest x (çevrilmiş koordinat)
                        drawY,                          // Dest y (merkeze hizalı)
                        drawWidth,                      // Dest width (collision box içinde)
                        drawHeight                      // Dest height (collision box içinde)
                    );
                } else {
                    // Sağa bakıyorsa normal çiz
                ctx.drawImage(
                    spriteSheet,
                    currentFrame * frameWidth, 0,  // Source x, y
                    frameWidth, frameHeight,        // Source width, height
                    drawX,                          // Dest x (merkeze hizalı)
                    drawY,                          // Dest y (merkeze hizalı)
                    drawWidth,                      // Dest width (collision box içinde)
                    drawHeight                      // Dest height (collision box içinde)
                );
                }
                ctx.restore();
            } else {
                // Fallback - sprite yüklenene kadar dikdörtgen
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(screenX, screenY, hedgehog.width, hedgehog.height);
            }

            // Debug: Collision box'ı göster (test için)
            // ctx.strokeStyle = 'blue';
            // ctx.strokeRect(screenX, screenY, hedgehog.width, hedgehog.height);

            // Diyalog baloncuğu çiz (gameplay, onIsland ve returningHome sahnelerinde gösterilmesi gerekiyorsa)
            if ((game.sceneState === 'gameplay' || game.sceneState === 'onIsland' || game.sceneState === 'returningHome' || game.sceneState === 'datca') && hedgehog.showSpeechBubble) {
                const bubbleX = screenX + hedgehog.width / 2;
                const bubbleY = screenY - 50; // Kirpi'nin kafasının üstünde
                const text = hedgehog.speechText; // Dinamik metin
                const bubbleRadius = 10;
                
                ctx.save();
                
                // Metin boyutunu ve sarmasını hesapla
                ctx.font = 'bold 14px Arial';
                const textPadding = 15;
                const maxBubbleWidth = 420; // Maksimum baloncuk genişliği
                const maxTextWidth = maxBubbleWidth - (textPadding * 2);
                
                // Metni sarmala
                const textLines = wrapText(text, maxTextWidth, 'bold 14px Arial');
                const lineHeight = 18;
                const textHeight = textLines.length * lineHeight;
                
                // Baloncuk boyutlarını dinamik olarak ayarla
                const bubbleWidth = Math.min(maxBubbleWidth, Math.max(200, maxTextWidth + (textPadding * 2)));
                const bubbleHeight = textHeight + (textPadding * 2) + 10;
                
                // Baloncuğu çiz (yuvarlatılmış dikdörtgen)
                ctx.fillStyle = '#FFFFFF';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                
                // Baloncuk gövdesi
                ctx.beginPath();
                ctx.roundRect(bubbleX - bubbleWidth / 2, bubbleY - bubbleHeight, bubbleWidth, bubbleHeight, bubbleRadius);
                ctx.fill();
                ctx.stroke();
                
                // Baloncuk ucunu çiz (kirpi'nin kafasına işaret eden)
                ctx.beginPath();
                ctx.moveTo(bubbleX - 15, bubbleY);
                ctx.lineTo(bubbleX, bubbleY - 10);
                ctx.lineTo(bubbleX + 15, bubbleY);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                
                // Metni çiz (çok satırlı)
                ctx.fillStyle = '#000000';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                
                textLines.forEach((line, index) => {
                    const lineY = bubbleY - bubbleHeight + textPadding + 5 + (index * lineHeight);
                    ctx.fillText(line, bubbleX, lineY);
                });
                
                ctx.restore();
            }
        }

        // Draw clouds (bulutlar) - Arka plan - Paralax efekti
        function drawClouds() {
            // sprites.clouds tanımlı değilse veya boşsa, fonksiyondan çık
            if (!sprites.clouds || !Array.isArray(sprites.clouds) || sprites.clouds.length === 0) {
                return;
            }
            
            // Bulutları gökyüzünde dağıt (paralax efekti için yavaş hareket)
            const cloudPositions = [
                { x: 100, y: 80, speed: 0.02 },
                { x: 400, y: 120, speed: 0.03 },
                { x: 700, y: 60, speed: 0.015 },
                { x: 50, y: 150, speed: 0.025 },
                { x: 500, y: 100, speed: 0.02 },
                { x: 750, y: 140, speed: 0.03 }
            ];
            
            sprites.clouds.forEach((cloud, index) => {
                if (!cloud || !cloud.complete || cloud.width === 0) return;
                
                const posIndex = index % cloudPositions.length;
                const pos = cloudPositions[posIndex];
                
                // Paralax efekti: Bulutlar kameradan yavaş hareket eder
                const parallaxX = pos.x - (camera.x * pos.speed);
                
                // Bulut ekranın dışına çıktıysa tekrarla
                let drawX = parallaxX % (canvas.width + cloud.width * 2);
                if (drawX < -cloud.width) {
                    drawX += canvas.width + cloud.width * 2;
                }
                
                ctx.drawImage(cloud, drawX, pos.y, cloud.width, cloud.height);
            });
        }

        // Draw dock (iskele) and boats (tekneler)
        function drawDock() {
            if (dockX === null) return; // İskele pozisyonu henüz hesaplanmadı
            
            const groundLevel = GROUND_LEVEL;
            const waterLevel = groundLevel + 10; // Su seviyesi (zemin seviyesine yakın)
            const dockPlatformHeight = 25; // İskele platformu kalınlığı
            const dockPlatformY = waterLevel - dockPlatformHeight - 5; // İskele platformu su üstünde
            const dockPoleHeight = 60; // İskele kazığı yüksekliği (suya doğru)
            
            const screenX = dockX - camera.x;
            const dockScreenY = dockPlatformY - camera.y;
            
            // İskele'den sonraki tüm alanı deniz olarak çiz
            const seaStartX = dockX - camera.x;
            const seaEndX = game.mapWidth - camera.x;
            const seaStartY = waterLevel - camera.y; // Deniz başlangıç Y pozisyonu
            const seaHeight = canvas.height - seaStartY; // Deniz yüksekliği (ekranın altına kadar)
            
            // Deniz (iskele'den sonraki tüm alan, ekranın altına kadar)
            ctx.fillStyle = '#4169E1'; // Deniz mavisi
            ctx.fillRect(seaStartX, seaStartY, seaEndX - seaStartX, seaHeight);
            
            // Deniz dalga efekti (tüm deniz boyunca)
            ctx.strokeStyle = '#5B9BD5';
            ctx.lineWidth = 2;
            const waveCount = Math.floor(seaHeight / 15);
            for (let i = 0; i < waveCount; i++) {
                const waveY = seaStartY + i * 15;
                ctx.beginPath();
                ctx.moveTo(seaStartX, waveY);
                for (let x = seaStartX; x < seaEndX; x += 30) {
                    ctx.lineTo(x, waveY + Math.sin((x + camera.x) / 20) * 4);
                }
                ctx.stroke();
            }
            
            // Sadece ekranda görünen iskeleleri çiz
            if (screenX + dockWidth > 0 && screenX < canvas.width) {
                // İskele kazıkları (dikey çubuklar - suya doğru)
                ctx.fillStyle = '#654321'; // Koyu kahverengi
                const poleCount = 6;
                for (let i = 0; i < poleCount; i++) {
                    const poleX = screenX + (i * dockWidth / (poleCount - 1));
                    const poleScreenY = dockScreenY + dockPlatformHeight - camera.y; // Platform altından başla
                    ctx.fillRect(poleX - 4, poleScreenY, 8, dockPoleHeight);
                }
                
                // İskele platformu (ahşap) - su üstünde
                ctx.fillStyle = '#8B4513'; // Kahverengi ahşap
                ctx.fillRect(screenX, dockScreenY, dockWidth, dockPlatformHeight);
                
                // İskele platformu üst çizgisi (detay)
                ctx.strokeStyle = '#654321';
                ctx.lineWidth = 2;
                ctx.strokeRect(screenX, dockScreenY, dockWidth, dockPlatformHeight);
                
                // Tekne (iskeleye bağlı, denize paralel, iskelenin yakın ucundan halat)
                // İskele başlangıç pozisyonu (halat bağlantı noktası - yakın uç)
                const dockStartX = screenX; // İskele başlangıcı
                const dockStartY = dockScreenY + dockPlatformHeight / 2;
                
                // İskele sonu pozisyonu
                const dockEndX = screenX + dockWidth;
                const dockEndY = dockScreenY + dockPlatformHeight / 2;
                
                // Tekne pozisyonu: İskele sonundan sağa doğru, denize paralel (açı yok, yatay)
                const boatDistance = 90; // İskele sonundan uzaklık
                const boatAngle = 0; // 0 derece - denize paralel (yatay)
                const boatX = dockEndX + boatDistance - 63; // Tekne merkez X (2-3 pixel sola alındı)
                // Tekne Y pozisyonu: Su seviyesinde (denize paralel)
                const boatY = dockStartY - 30; // İskele seviyesinin biraz üstünde (görünür seviyede)
                const boatWidth = 120; // Daha büyük tekne
                const boatHeight = 50; // Daha yüksek tekne
                
                // Tekne gövdesi (yarım oval - denize paralel, yatay, daha koyu ve belirgin)
                ctx.fillStyle = '#654321'; // Koyu kahverengi
                ctx.beginPath();
                ctx.ellipse(boatX + boatWidth / 2, boatY + boatHeight, boatWidth / 2, boatHeight / 2, 0, 0, Math.PI, false);
                ctx.fill();
                
                // Tekne gövdesi üst kenarlığı (kalın)
                ctx.strokeStyle = '#4A3728';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.ellipse(boatX + boatWidth / 2, boatY + boatHeight, boatWidth / 2, boatHeight / 2, 0, 0, Math.PI, false);
                ctx.stroke();
                
                // Tekne iç kısmı (hafif açık renk - derinlik efekti)
                ctx.fillStyle = '#8B4513';
                ctx.beginPath();
                ctx.ellipse(boatX + boatWidth / 2, boatY + boatHeight - 2, boatWidth / 2 - 3, boatHeight / 2 - 3, 0, 0, Math.PI, false);
                ctx.fill();
                
                // Tekne iç kenarlığı
                ctx.strokeStyle = '#6B5439';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(boatX + boatWidth / 2, boatY + boatHeight - 2, boatWidth / 2 - 3, boatHeight / 2 - 3, 0, 0, Math.PI, false);
                ctx.stroke();
                
                // İskele üzerinde halat bağlantı noktası (halka/çıpa - iskele BAŞLANGICINDA/YAKIN UCUNDA)
                const ropeAnchorX = dockEndX - 5; // İskele başlangıcından 10px ileri
                const ropeAnchorY = dockStartY; // İskele ortası
                
                ctx.fillStyle = '#4A3728';
                ctx.beginPath();
                ctx.arc(ropeAnchorX, ropeAnchorY, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#2F1F14';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                // Halat bağlantı noktası iç halka (çıpa detayı)
                ctx.fillStyle = '#6B5439';
                ctx.beginPath();
                ctx.arc(ropeAnchorX, ropeAnchorY, 5, 0, Math.PI * 2);
                ctx.fill();
                
                // Tekne üzerinde halat bağlantı noktası (tekne başında/sol uç - ön kısım)
                // Tekne yatay (açı yok), bağlantı noktası teknenin sol ucunda (ön kısmında)
                const boatCenterX = boatX + boatWidth / 2;
                const boatCenterY = boatY + boatHeight;
                const boatRopeX = boatX + 15; // Teknenin sol ucundan 15px içeri (ön kısmı)
                const boatRopeY = boatCenterY - 2; // Teknenin üst kenarına yakın (gövde üstünde)
                
                ctx.fillStyle = '#4A3728';
                ctx.beginPath();
                ctx.arc(boatRopeX, boatRopeY, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#2F1F14';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                // Halat bağlantı noktası iç halka
                ctx.fillStyle = '#6B5439';
                ctx.beginPath();
                ctx.arc(boatRopeX, boatRopeY, 4, 0, Math.PI * 2);
                ctx.fill();
                
                // Halat (iskeleye bağlı - çok belirgin, kalın, doğru açıyla)
                // Halat gövdesi (ana çizgi - çok kalın)
                ctx.strokeStyle = '#8B7355';
                ctx.lineWidth = 8;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(ropeAnchorX, ropeAnchorY);
                ctx.lineTo(boatRopeX, boatRopeY);
                ctx.stroke();
                
                // Halat gölgesi (alt - üç boyutlu görünüm)
                ctx.strokeStyle = '#6B5B45';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(ropeAnchorX + 1, ropeAnchorY + 1);
                ctx.lineTo(boatRopeX + 1, boatRopeY + 1);
                ctx.stroke();
                
                // Halat highlight (üst - üç boyutlu görünüm)
                ctx.strokeStyle = '#AB9B85';
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(ropeAnchorX - 1, ropeAnchorY - 1);
                ctx.lineTo(boatRopeX - 1, boatRopeY - 1);
                ctx.stroke();
                
                // Tekne gölgesi (derinlik için)
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.beginPath();
                ctx.ellipse(boatX + boatWidth / 2, boatY + boatHeight + 5, boatWidth / 2, boatHeight / 2 - 5, 0, 0, Math.PI, false);
                ctx.fill();
            }

            // Show "E" prompt for dock if player is near
            if (game.sceneState === 'gameplay' && !dialog.isOpen && !game.dockDialogShown && dockX !== null) {
            const playerCenterX = player.x + player.width / 2;
                const dockStartX = dockX;
                const dockEndX = dockX + dockWidth;
                const dockY = GROUND_LEVEL;
                
                // Rakun iskelenin önünde veya üzerinde mi? (checkInteraction ile aynı geniş kontrol)
                const isNearDock = (playerCenterX >= dockStartX - 150 && playerCenterX <= dockEndX + 150);
                const playerOnGround = player.y + player.height >= dockY - 10;
                
                if (isNearDock && playerOnGround) {
                    const dockScreenX = dockX + dockWidth / 2 - camera.x;
                    const dockScreenY = GROUND_LEVEL - camera.y - 120; // İskele üstünde, görünür pozisyon

                    // Sadece ekranda görünürse çiz
                    if (dockScreenX >= 0 && dockScreenX <= canvas.width && dockScreenY >= 0 && dockScreenY <= canvas.height) {
                ctx.fillStyle = 'white';
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 3;
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.strokeText('E', dockScreenX, dockScreenY);
                        ctx.fillText('E', dockScreenX, dockScreenY);
                        ctx.textAlign = 'left'; // Reset
                        ctx.textBaseline = 'alphabetic'; // Reset
                    }
                }
            }
        }

        // Draw returning home scene (eve dönüş sahnesi - onIsland benzeri, iskele solda)
        function drawReturningHome() {
            // Gökyüzü gradient (arka plan - deniz yok, sadece gökyüzü)
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');      // Gökyüzü mavisi (üst)
            gradient.addColorStop(0.7, '#B0E0E6');   // Açık mavi
            gradient.addColorStop(1, '#E0F6FF');      // Çok açık mavi (alt)
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // İskele pozisyonu (sahnenin en solunda)
            const returningDockX = 0; // İskele en solda başlıyor
            const returningDockWidth = 180;
            const returningDockY = GROUND_LEVEL;
            const groundLevel = GROUND_LEVEL;
            
            // İskele başlangıcı ve sağdan 2. bacağın x koordinatını hesapla (yol başlangıcı)
            const dockStartX = returningDockX + returningDockWidth + 135; // İskele başlangıcı
            const dockWidth = 180;
            const poleCount = 6;
            const poleSpacing = dockWidth / (poleCount - 1);
            const firstPoleX = dockStartX + (0 * poleSpacing); // Soldan 1. bacağın x koordinatı (index 0)
            const rightSecondPoleX = dockStartX + (4 * poleSpacing); // Sağdan 2. bacağın x koordinatı (index 4, yol başlangıcı)
            
            // Deniz çiz (iskele alanında ve solunda) - yol başlangıcına kadar
            const waterLevel = groundLevel + 10;
            const seaStartX = -camera.x; // Ekranın en solundan başla
            const seaEndX = rightSecondPoleX - camera.x; // Deniz alanı sonu = yol başlangıcı (sağdan 2. bacağın x koordinatı)
            const seaStartY = waterLevel - camera.y;
            const seaHeight = canvas.height - seaStartY;
            
            // Deniz (sol taraftan iskele sonuna kadar)
            ctx.fillStyle = '#4169E1';
            ctx.fillRect(seaStartX, seaStartY, seaEndX - seaStartX, seaHeight);
            
            // Deniz dalga efekti
            ctx.strokeStyle = '#5B9BD5';
            ctx.lineWidth = 2;
            const waveCount = Math.floor(seaHeight / 15);
            for (let i = 0; i < waveCount; i++) {
                const waveY = seaStartY + i * 15;
                ctx.beginPath();
                ctx.moveTo(seaStartX, waveY);
                for (let x = seaStartX; x < seaEndX; x += 30) {
                    ctx.lineTo(x, waveY + Math.sin((x + camera.x) / 20) * 4);
                }
                ctx.stroke();
            }
            
            // Tekne çiz (soldan 1. bacağa yakın, detaylı çizim)
            const boatWidth = 120; // Daha büyük tekne
            const boatHeight = 50; // Daha yüksek tekne
            const boatX = firstPoleX - boatWidth - 30; // Soldan 1. bacağın 30px solunda
            const boatY = returningDockY - 30; // İskele seviyesinin biraz üstünde
            
            const boatScreenX = boatX - camera.x;
            const boatScreenY = boatY - camera.y;
            
            if (boatScreenX + boatWidth > -boatWidth && boatScreenX < canvas.width + boatWidth) {
                // Tekne gövdesi (yarım oval - denize paralel, yatay, daha koyu ve belirgin)
                ctx.fillStyle = '#654321'; // Koyu kahverengi
                ctx.beginPath();
                ctx.ellipse(boatScreenX + boatWidth / 2, boatScreenY + boatHeight, boatWidth / 2, boatHeight / 2, 0, 0, Math.PI, false);
                ctx.fill();
                
                // Tekne gövdesi üst kenarlığı (kalın)
                ctx.strokeStyle = '#4A3728';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.ellipse(boatScreenX + boatWidth / 2, boatScreenY + boatHeight, boatWidth / 2, boatHeight / 2, 0, 0, Math.PI, false);
                ctx.stroke();
                
                // Tekne iç kısmı (hafif açık renk - derinlik efekti)
                ctx.fillStyle = '#8B4513';
                ctx.beginPath();
                ctx.ellipse(boatScreenX + boatWidth / 2, boatScreenY + boatHeight - 2, boatWidth / 2 - 3, boatHeight / 2 - 3, 0, 0, Math.PI, false);
                ctx.fill();
                
                // Tekne iç kenarlığı
                ctx.strokeStyle = '#6B5439';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(boatScreenX + boatWidth / 2, boatScreenY + boatHeight - 2, boatWidth / 2 - 3, boatHeight / 2 - 3, 0, 0, Math.PI, false);
                ctx.stroke();
                
                // İskele sol ucuna halat bağlantı noktası (halka/çıpa)
                const ropeAnchorX = dockStartX - camera.x + 5; // İskele sol ucu
                const ropeAnchorY = returningDockY - camera.y - 10;
                
                ctx.fillStyle = '#4A3728';
                ctx.beginPath();
                ctx.arc(ropeAnchorX, ropeAnchorY, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#2F1F14';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                // Halat bağlantı noktası iç halka (çıpa detayı)
                ctx.fillStyle = '#6B5439';
                ctx.beginPath();
                ctx.arc(ropeAnchorX, ropeAnchorY, 5, 0, Math.PI * 2);
                ctx.fill();
                
                // Tekne üzerinde halat bağlantı noktası (tekne sağ ucunda)
                const boatCenterX = boatScreenX + boatWidth / 2;
                const boatCenterY = boatScreenY + boatHeight;
                const boatRopeX = boatScreenX + boatWidth - 15; // Teknenin sağ ucundan 15px içeri
                const boatRopeY = boatCenterY - 2; // Teknenin üst kenarına yakın (gövde üstünde)
                
                ctx.fillStyle = '#4A3728';
                ctx.beginPath();
                ctx.arc(boatRopeX, boatRopeY, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#2F1F14';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                // Halat bağlantı noktası iç halka
                ctx.fillStyle = '#6B5439';
                ctx.beginPath();
                ctx.arc(boatRopeX, boatRopeY, 4, 0, Math.PI * 2);
                ctx.fill();
                
                // Halat çiz (iskele sol ucundan tekne sağ ucuna)
                ctx.strokeStyle = '#654321';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(ropeAnchorX, ropeAnchorY); // İskele sol ucu
                ctx.lineTo(boatRopeX, boatRopeY); // Tekne sağ ucu
                ctx.stroke();
                
                // Halat gölge efekti (alt çizgi)
                ctx.strokeStyle = '#4A3728';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(ropeAnchorX, ropeAnchorY + 1); // İskele sol ucu
                ctx.lineTo(boatRopeX, boatRopeY + 1); // Tekne sağ ucu
                ctx.stroke();
            }
            
            // İskele çiz (halattan sonra, sağda)
            const dockScreenX = dockStartX - camera.x;
            const dockScreenY = returningDockY - camera.y;
            const dockHeight = 25;
            
            // İskele platformu
            ctx.fillStyle = '#8B4513'; // Kahverengi ahşap
            ctx.fillRect(dockScreenX, dockScreenY - dockHeight, dockWidth, dockHeight);
            
            // İskele kenarlığı
            ctx.strokeStyle = '#654321';
            ctx.lineWidth = 2;
            ctx.strokeRect(dockScreenX, dockScreenY - dockHeight, dockWidth, dockHeight);
            
            // İskele kazıkları (bacaklar) - soldan çizmeye başla, sağdan 2. bacağı çizme
            ctx.fillStyle = '#654321';
            for (let i = 0; i < poleCount; i++) {
                if (i >= 4) continue; // Sağdan 2. bacağı (index 4) ve en sağdaki bacağı (index 5) çizme
                const poleX = dockScreenX + (i * poleSpacing);
                const poleY = dockScreenY;
                ctx.fillRect(poleX - 3, poleY, 6, 40);
            }
            
            // Evleri çiz: home1, home2, home1, home2, hotel, home1 (onIsland'deki gibi, hotel oyuncunun evi)
            const housesPattern = [
                { sprite: sprites.island.home1, name: 'home1' },
                { sprite: sprites.island.home2, name: 'home2' },
                { sprite: sprites.island.home1, name: 'home1' },
                { sprite: sprites.island.home2, name: 'home2' },
                { sprite: sprites.island.hotel, name: 'hotel' },
                { sprite: sprites.island.home1, name: 'home1' }
            ];
            
            // İlk ev pozisyonu: Sağdan 2. bacağın x koordinatından başla
            const houseStartX = rightSecondPoleX + 50 + 100; // Sağdan 2. bacağın x koordinatından 150px sonra
            let currentHouseX = houseStartX;
            const houseSpacing = 40;
            const houseScale = 1.35;
            
            // Evlerin toplam genişliğini hesapla (zemin çizimi için)
            let totalHousesWidth = 0;
            for (let i = 0; i < housesPattern.length; i++) {
                const house = housesPattern[i];
                if (house.sprite && house.sprite.complete) {
                    const houseWidth = house.sprite.width * houseScale;
                    totalHousesWidth += houseWidth;
                    if (i < housesPattern.length - 1) {
                        totalHousesWidth += houseSpacing;
                    }
                }
            }
            
            // Zemin başlangıç ve bitiş pozisyonları - sağdan 2. bacağın x koordinatından başla
            const groundStartX = rightSecondPoleX; // Sağdan 2. bacağın x koordinatından başla
            const lastHouseRight = houseStartX + totalHousesWidth;
            
            // Yolu ekranın sonuna kadar uzat (kamera maksimum pozisyonu + ekran genişliği)
            // Maksimum kamera pozisyonu hesapla (son evden 300px sonra)
            const maxCameraX = lastHouseRight + 300 - canvas.width;
            // Yolu ekranın görünür alanından biraz daha fazla uzat
            const groundEndX = camera.x + canvas.width + 500; // Ekranın sonundan 500px daha fazla
            
            // Zemin çiz (onIsland benzeri - düz gri kaldırım)
            const roadHeight = 70;
            const screenY = groundLevel - camera.y;
            const groundScreenStartX = groundStartX - camera.x;
            const groundScreenEndX = groundEndX - camera.x;
            
            // Basit düz gri kaldırım çiz
            ctx.fillStyle = '#C0C0C0'; // Açık gri kaldırım
            ctx.fillRect(groundScreenStartX, screenY, groundScreenEndX - groundScreenStartX, roadHeight);
            
            // Üst kısmına hafif bir gölge/kenarlık ekle
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(groundScreenStartX, screenY, groundScreenEndX - groundScreenStartX, 2);
            
            // Alt kısmına da hafif bir gölge ekle
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(groundScreenStartX, screenY + roadHeight - 2, groundScreenEndX - groundScreenStartX, 2);
            
            // Evleri çiz (onIsland'deki kodun kopyası)
            for (let i = 0; i < housesPattern.length; i++) {
                const house = housesPattern[i];
                
                // Sprite yüklenmiş mi kontrol et
                if (house.sprite && house.sprite.complete) {
                    const originalWidth = house.sprite.width;
                    const originalHeight = house.sprite.height;
                    
                    // Evlerin boyutunu 1.35 katına çıkar
                    const houseWidth = originalWidth * houseScale;
                    const houseHeight = originalHeight * houseScale;
                    
                    // Ekranda görünüyor mu kontrol et
                    const screenX = currentHouseX - camera.x;
                    // Evlerin alt kenarı zemine tam otursun
                    let verticalOffset = 0;
                    if (house.name === 'home1') {
                        verticalOffset = 23;
                    } else if (house.name === 'home2') {
                        verticalOffset = 15;
                    }
                    // Evlerin alt kenarı zemin seviyesinde olmalı
                    const screenYHouse = groundLevel - houseHeight + verticalOffset;
                    
                    if (screenX + houseWidth > 0 && screenX < canvas.width) {
                        // Ev çitleri: Ev çizilmeden önce çitleri çiz (arkada kalması için)
                        const wallVerticalSprite = sprites.island.decoration.wallVertical;
                        const wallHorizontalSprite = sprites.island.decoration.wallHorizontal;
                        const wallPadding = 10;
                        
                        if (wallVerticalSprite && wallVerticalSprite.complete && 
                            wallHorizontalSprite && wallHorizontalSprite.complete) {
                            
                            const wallVWidth = wallVerticalSprite.width;
                            const wallVHeight = wallVerticalSprite.height;
                            const wallHWidth = wallHorizontalSprite.width;
                            const wallHHeight = wallHorizontalSprite.height;
                            
                            // Zemin seviyesi (yolun üst kenarı)
                            const roadTop = groundLevel;
                            
                            // Sol çit - sadece evin arkasında (yolun üstüne gelmemeli)
                            // Çit evin üstünden başlayıp yolun üst kenarına kadar
                            const fenceTop = screenYHouse; // Evin üst kenarı
                            const fenceBottom = roadTop - camera.y; // Yolun üst kenarı (çit buraya kadar)
                            const fenceHeight = fenceBottom - fenceTop;
                            
                            if (fenceHeight > 0) {
                                const wallScreenX = screenX - wallPadding - wallVWidth;
                                // Çit yüksekliği boyunca dikey çitleri tekrarla
                                for (let y = fenceTop; y < fenceBottom; y += wallVHeight) {
                                    const currentFenceHeight = Math.min(wallVHeight, fenceBottom - y);
                                    ctx.drawImage(
                                        wallVerticalSprite,
                                        0, 0, wallVWidth, currentFenceHeight, // Kaynak
                                        wallScreenX, y, wallVWidth, currentFenceHeight // Hedef
                                    );
                                }
                            }
                            
                            // Sağ çit - sadece evin arkasında (yolun üstüne gelmemeli)
                            if (fenceHeight > 0) {
                                const wallScreenX = screenX + houseWidth + wallPadding;
                                // Çit yüksekliği boyunca dikey çitleri tekrarla
                                for (let y = fenceTop; y < fenceBottom; y += wallVHeight) {
                                    const currentFenceHeight = Math.min(wallVHeight, fenceBottom - y);
                                    ctx.drawImage(
                                        wallVerticalSprite,
                                        0, 0, wallVWidth, currentFenceHeight, // Kaynak
                                        wallScreenX, y, wallVWidth, currentFenceHeight // Hedef
                                    );
                                }
                            }
                            
                            // Üst çit (sol)
                            const topWallLeft = screenX - wallPadding - wallVWidth;
                            const topWallRight = screenX + houseWidth / 2;
                            const topWallY = screenYHouse;
                            let topWallX = topWallLeft;
                            while (topWallX < topWallRight) {
                                ctx.drawImage(wallHorizontalSprite, topWallX, topWallY, wallHWidth, wallHHeight);
                                topWallX += wallHWidth;
                            }
                            
                            // Üst çit (sağ)
                            const topWallLeft2 = screenX + houseWidth / 2;
                            const topWallRight2 = screenX + houseWidth + wallPadding + wallVWidth;
                            topWallX = topWallLeft2;
                            while (topWallX < topWallRight2) {
                                ctx.drawImage(wallHorizontalSprite, topWallX, topWallY, wallHWidth, wallHHeight);
                                topWallX += wallHWidth;
                            }
                        }
                        
                        // Ev gölgesi
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                        ctx.fillRect(screenX + 3, screenYHouse + houseHeight, houseWidth - 2, 5);
                        
                        // Ev sprite'ı
                        ctx.drawImage(house.sprite, screenX, screenYHouse, houseWidth, houseHeight);
                    }
                    
                    // Bir sonraki ev pozisyonu
                    currentHouseX += houseWidth + houseSpacing;
                }
            }
            
            // Dekorasyonları hesapla (eğer henüz hesaplanmadıysa ve sprite'lar yüklendiyse)
            if (!game.islandDecorationsInitialized || game.islandDecorations.length === 0) {
                // Tüm dekorasyon sprite'larının yüklendiğini kontrol et
                let allDecorationsLoaded = true;
                const decorationTypes = ['lamp', 'sit', 'tree', 'wallHorizontal', 'wallVertical'];
                for (let d = 0; d < decorationTypes.length; d++) {
                    const decType = decorationTypes[d];
                    const decSprite = sprites.island.decoration[decType];
                    if (!decSprite || !decSprite.complete) {
                        allDecorationsLoaded = false;
                        break;
                    }
                }
                
                // Eğer tüm sprite'lar yüklendiyse ve henüz dekorasyonlar hesaplanmadıysa
                if (allDecorationsLoaded && game.islandDecorations.length === 0) {
                    game.islandDecorations = [];
                    
                    // Dekorasyon sprite'ları yüklendiyse, dekorasyonları hesapla
                    const wallVerticalSprite = sprites.island.decoration.wallVertical;
                    const wallPadding = 10; // Ev ile çit arasındaki boşluk
                    const wallVWidth = wallVerticalSprite.width;
                    
                    // Tüm evlerin ve çitlerin sınırlarını hesapla (çakışma kontrolü için)
                    const houseBounds = [];
                    let tempHouseX = houseStartX; // Geçici pozisyon hesaplama için
                    
                    for (let i = 0; i < housesPattern.length; i++) {
                        const house = housesPattern[i];
                        if (house.sprite && house.sprite.complete) {
                            const houseWidth = house.sprite.width * houseScale;
                            const houseLeft = tempHouseX;
                            const houseRight = tempHouseX + houseWidth;
                            
                            // Çit sınırları
                            const fenceLeft = houseLeft - wallPadding - wallVWidth;
                            const fenceRight = houseRight + wallPadding + wallVWidth;
                            
                            houseBounds.push({
                                houseLeft: houseLeft,
                                houseRight: houseRight,
                                fenceLeft: fenceLeft,
                                fenceRight: fenceRight,
                                fenceLeftInner: fenceLeft + wallVWidth,
                                fenceRightInner: fenceRight - wallVWidth
                            });
                            
                            // Bir sonraki ev pozisyonu
                            tempHouseX = houseRight + houseSpacing;
                        }
                    }
                    
                    // Her evin sağ tarafındaki ev-çit boşluğuna dekorasyon yerleştir
                    for (let i = 0; i < housesPattern.length; i++) {
                        const house = houseBounds[i];
                        
                        if (house) {
                            const decorationZoneStart = house.houseRight;
                            const decorationZoneEnd = house.fenceRight - wallVWidth;
                            const decorationZoneWidth = decorationZoneEnd - decorationZoneStart;
                            
                            // Eğer boşluk yeterince genişse dekorasyon ekle
                            if (decorationZoneWidth > 5) {
                                // Her ev için farklı dekorasyon seç (ev index'ine göre rotasyon)
                                const nonWallTypes = ['lamp', 'sit', 'tree'];
                                const decorationIndex = i % nonWallTypes.length;
                                const randomType = nonWallTypes[decorationIndex];
                                const decorationSprite = sprites.island.decoration[randomType];
                                
                                if (decorationSprite && decorationSprite.complete) {
                                    const zoneCenter = (decorationZoneStart + decorationZoneEnd) / 2;
                                    const decorationX = zoneCenter - decorationSprite.width / 2 - 17;
                                    
                                    // Dekorasyonu kaydet (dünya koordinatı olarak)
                                    game.islandDecorations.push({
                                        type: randomType,
                                        sprite: decorationSprite,
                                        worldX: decorationX,
                                        worldY: groundLevel
                                    });
                                }
                            }
                        }
                    }
                    
                    // Özel: 2. ev (index 1) ile 3. ev (index 2) arasına çiçek ekle
                    if (houseBounds.length >= 3 && sprites.island.decoration.cicek && 
                        sprites.island.decoration.cicek.complete) {
                        const house1Right = houseBounds[1].houseRight;
                        const house2Left = houseBounds[2].houseLeft;
                        const gapCenter = (house1Right + house2Left) / 2;
                        const cicekX = gapCenter - sprites.island.decoration.cicek.width / 2 - 17;
                        
                        game.islandDecorations.push({
                            type: 'cicek',
                            sprite: sprites.island.decoration.cicek,
                            worldX: cicekX,
                            worldY: groundLevel
                        });
                    }
                    
                    game.islandDecorationsInitialized = true;
                }
            }
            
            // Dekorasyonları çiz (evlerin üzerinde görünmemeleri için evlerden sonra)
            if (game.islandDecorations && game.islandDecorations.length > 0) {
                for (let i = 0; i < game.islandDecorations.length; i++) {
                    const decoration = game.islandDecorations[i];
                    
                    // Sprite'ın yüklenmiş ve hata durumunda olmadığını kontrol et
                    if (decoration.sprite && decoration.sprite.complete && decoration.sprite.naturalWidth > 0) {
                        // Dünya koordinatını ekran koordinatına çevir
                        const decorationScreenX = decoration.worldX - camera.x;
                        const decorationScreenY = (decoration.worldY - decoration.sprite.height) - camera.y; // Zemine oturt
                        
                        // Ekranda görünüyor mu kontrol et
                        if (decorationScreenX + decoration.sprite.width > 0 && decorationScreenX < canvas.width) {
                            ctx.drawImage(
                                decoration.sprite,
                                decorationScreenX, decorationScreenY
                            );
                        }
                    }
                }
            }
            
            // Hotel pozisyonunu kaydet (homeX = hotel pozisyonu, oyuncunun evi)
            let hotelWorldX = null;
            let hotelWidth = 96 * houseScale; // Varsayılan
            let tempCurrentHouseX = houseStartX;
            for (let i = 0; i < housesPattern.length; i++) {
                const house = housesPattern[i];
                if (house.sprite && house.sprite.complete) {
                    const houseWidth = house.sprite.width * houseScale;
                    
                    // Hotel pozisyonunu kaydet (5. ev - index 4)
                    if (i === 4 && house.name === 'hotel') {
                        hotelWorldX = tempCurrentHouseX;
                        hotelWidth = houseWidth;
                        break;
                    }
                    
                    tempCurrentHouseX += houseWidth + houseSpacing;
                }
            }
            
            if (homeX === null) {
                if (hotelWorldX !== null) {
                    homeX = hotelWorldX; // Hotel oyuncunun evi
                } else {
                    const lastHouseRightWorld = houseStartX + totalHousesWidth;
                    homeX = lastHouseRightWorld; // Fallback: Son evin sağ kenarı
                }
            }
            
            // Araba pozisyonu: Hotel önünde (sadece arabaya binilmediyse yeniden hesapla)
            if (!game.carEntered) {
                if (hotelWorldX !== null) {
                        // Hotel önünde, merkezden biraz sola hizalı

                    ctx.closePath();
                    
                    // Pattern ile yol sprite'ını doldur
                    const pattern = ctx.createPattern(roadSprite, 'repeat');
                    if (pattern) {
                        ctx.fillStyle = pattern;
                        ctx.fill();
                    } else {
                        // Pattern oluşturulamazsa düz renk
                        ctx.fillStyle = '#808080';
                        ctx.fill();
                    }
                    
                    // Yol kenarları (beyaz çizgiler)
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    
                    // Yol orta çizgisi (kesikli sarı)
                    ctx.setLineDash([15, 10]);
                    ctx.strokeStyle = '#FFFF00';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(screenSegments[0].x, screenSegments[0].y);
                    for (let i = 1; i < screenSegments.length; i++) {
                        ctx.lineTo(screenSegments[i].x, screenSegments[i].y);
                    }
                    ctx.stroke();
                    ctx.setLineDash([]);
                } else {
                    // Fallback: Yol sprite yoksa asfalt görünümlü yol çiz
                    // Yol yüzeyi (asfalt)
                    ctx.strokeStyle = '#505050'; // Koyu gri asfalt
                    ctx.lineWidth = roadWidth;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.beginPath();
                    ctx.moveTo(screenSegments[0].x, screenSegments[0].y);
                    for (let i = 1; i < screenSegments.length; i++) {
                        ctx.lineTo(screenSegments[i].x, screenSegments[i].y);
                    }
                    ctx.stroke();
                    
                    // Yol kenarları (beyaz çizgiler)
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 3;
                    
                    // Sol kenar çizgisi
                    ctx.beginPath();
                    for (let i = 0; i < roadSegments.length; i++) {
                        if (i === 0) {
                            const dx = roadSegments[1].x - roadSegments[0].x;
                            const dy = roadSegments[1].y - roadSegments[0].y;
                            const length = Math.sqrt(dx * dx + dy * dy);
                            if (length > 0) {
                                const perpX = -dy / length;
                                const perpY = dx / length;
                                ctx.moveTo(roadSegments[0].x + perpX * (roadWidth / 2), roadSegments[0].y + perpY * (roadWidth / 2));
                            }
                        }
                        if (i < roadSegments.length - 1) {
                            const dx = roadSegments[i + 1].x - roadSegments[i].x;
                            const dy = roadSegments[i + 1].y - roadSegments[i].y;
                            const length = Math.sqrt(dx * dx + dy * dy);
                            if (length > 0) {
                                const perpX = -dy / length;
                                const perpY = dx / length;
                                ctx.lineTo(roadSegments[i].x + perpX * (roadWidth / 2), roadSegments[i].y + perpY * (roadWidth / 2));
                            }
                        } else {
                            const dx = roadSegments[i].x - roadSegments[i - 1].x;
                            const dy = roadSegments[i].y - roadSegments[i - 1].y;
                            const length = Math.sqrt(dx * dx + dy * dy);
                            if (length > 0) {
                                const perpX = -dy / length;
                                const perpY = dx / length;
                                ctx.lineTo(roadSegments[i].x + perpX * (roadWidth / 2), roadSegments[i].y + perpY * (roadWidth / 2));
                            }
                        }
                    }
                    ctx.stroke();
                    
                    // Sağ kenar çizgisi
                    ctx.beginPath();
                    for (let i = 0; i < roadSegments.length; i++) {
                        if (i === 0) {
                            const dx = roadSegments[1].x - roadSegments[0].x;
                            const dy = roadSegments[1].y - roadSegments[0].y;
                            const length = Math.sqrt(dx * dx + dy * dy);
                            if (length > 0) {
                                const perpX = dy / length;
                                const perpY = -dx / length;
                                ctx.moveTo(roadSegments[0].x + perpX * (roadWidth / 2), roadSegments[0].y + perpY * (roadWidth / 2));
                            }
                        }
                        if (i < roadSegments.length - 1) {
                            const dx = roadSegments[i + 1].x - roadSegments[i].x;
                            const dy = roadSegments[i + 1].y - roadSegments[i].y;
                            const length = Math.sqrt(dx * dx + dy * dy);
                            if (length > 0) {
                                const perpX = dy / length;
                                const perpY = -dx / length;
                                ctx.lineTo(roadSegments[i].x + perpX * (roadWidth / 2), roadSegments[i].y + perpY * (roadWidth / 2));
                            }
                        } else {
                            const dx = roadSegments[i].x - roadSegments[i - 1].x;
                            const dy = roadSegments[i].y - roadSegments[i - 1].y;
                            const length = Math.sqrt(dx * dx + dy * dy);
                            if (length > 0) {
                                const perpX = dy / length;
                                const perpY = -dx / length;
                                ctx.lineTo(roadSegments[i].x + perpX * (roadWidth / 2), roadSegments[i].y + perpY * (roadWidth / 2));
                            }
                        }
                    }
                    ctx.stroke();
                    
                    // Yol orta çizgisi (kesikli sarı)
                    ctx.setLineDash([15, 10]);
                    ctx.strokeStyle = '#FFFF00';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(screenSegments[0].x, screenSegments[0].y);
                    for (let i = 1; i < screenSegments.length; i++) {
                        ctx.lineTo(screenSegments[i].x, screenSegments[i].y);
                    }
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }
            
            // Araba çizimi
            if (roadTripCar.x !== null && roadTripCar.y !== null) {
                const carScreenX = roadTripCar.x - camera.x;
                const carScreenY = roadTripCar.y - camera.y;
                
                ctx.save();
                ctx.translate(carScreenX, carScreenY);
                ctx.rotate(roadTripCar.angle);
                
                // Modern beyaz araba (drawIstanbulDatca ile aynı stil)
                ctx.imageSmoothingEnabled = true;
                
                const carWidth = roadTripCar.width;
                const carHeight = roadTripCar.height;
                
                // Araba gövdesi - yuvarlatılmış köşeler (beyaz gradient)
                const bodyGradient = ctx.createLinearGradient(-carWidth/2, -carHeight/2, -carWidth/2, carHeight/2);
                bodyGradient.addColorStop(0, '#FFFFFF');
                bodyGradient.addColorStop(0.5, '#F8F8F8');
                bodyGradient.addColorStop(1, '#E8E8E8');
                ctx.fillStyle = bodyGradient;
                const radius = 8;
                ctx.beginPath();
                ctx.moveTo(-carWidth/2 + radius, -carHeight/2);
                ctx.lineTo(carWidth/2 - radius, -carHeight/2);
                ctx.quadraticCurveTo(carWidth/2, -carHeight/2, carWidth/2, -carHeight/2 + radius);
                ctx.lineTo(carWidth/2, carHeight/2 - radius);
                ctx.quadraticCurveTo(carWidth/2, carHeight/2, carWidth/2 - radius, carHeight/2);
                ctx.lineTo(-carWidth/2 + radius, carHeight/2);
                ctx.quadraticCurveTo(-carWidth/2, carHeight/2, -carWidth/2, carHeight/2 - radius);
                ctx.lineTo(-carWidth/2, -carHeight/2 + radius);
                ctx.quadraticCurveTo(-carWidth/2, -carHeight/2, -carWidth/2 + radius, -carHeight/2);
                ctx.closePath();
                ctx.fill();
                
                // Araba gölgesi
                ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
                ctx.fillRect(-carWidth/2 + 3, carHeight/2 - 3, carWidth - 6, 6);
                
                // Araba üst highlight
                const highlightGradient = ctx.createLinearGradient(-carWidth/2, -carHeight/2, -carWidth/2, -carHeight/2 + 15);
                highlightGradient.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
                highlightGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = highlightGradient;
                ctx.fillRect(-carWidth/2, -carHeight/2, carWidth, 15);
                
                // Ön cam (mavi gradient)
                const windowGradient = ctx.createLinearGradient(-carWidth/2 + 20, -carHeight/2 + 10, -carWidth/2 + 20, -carHeight/2 + 32);
                windowGradient.addColorStop(0, '#B8E6FF');
                windowGradient.addColorStop(1, '#7FB8D9');
                ctx.fillStyle = windowGradient;
                ctx.fillRect(-carWidth/2 + 20, -carHeight/2 + 10, 38, 22);
                
                // Arka cam (mavi gradient)
                ctx.fillStyle = windowGradient;
                ctx.fillRect(carWidth/2 - 58, -carHeight/2 + 10, 38, 22);
                
                // Ön farlar (sarı)
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(carWidth/2 - 5, -carHeight/2 + 15, 5, 0, Math.PI * 2);
                ctx.fill();
                
                // Arka lambalar
                ctx.fillStyle = '#FF0000';
                ctx.beginPath();
                ctx.arc(-carWidth/2 + 5, -carHeight/2 + 15, 5, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
            
            // Tabelaları EN SON çiz (yolun ve arabanın üstünde görünmeleri için)
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0); // Transform'u sıfırla
            
            // Datça tabelası (sağ alt köşe - başlangıç)
            const datcaX = canvas.width - 160;
            const datcaY = canvas.height - 120;
            const tabelaWidth = 140;
            const tabelaHeight = 50;

            // Tabela arka planı (beyaz dikdörtgen)
            ctx.fillStyle = '#FFFFFF';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(datcaX, datcaY, tabelaWidth, tabelaHeight, 5);
            ctx.fill();
            ctx.stroke();
            
            // Datça yazısı
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('Datça', datcaX + tabelaWidth / 2, datcaY + tabelaHeight / 2);
            
            // Tabela direği (Datça tabelasının altında)
            ctx.fillStyle = '#8B4513'; // Kahverengi direk
            ctx.fillRect(datcaX + tabelaWidth / 2 - 3, datcaY + tabelaHeight, 6, 30);
            
            // Istanbul tabelası (sol üst köşe - hedef)
            const istanbulX = 20;
            const istanbulY = 20;

            // Tabela arka planı (beyaz dikdörtgen)
            ctx.fillStyle = '#FFFFFF';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(istanbulX, istanbulY, tabelaWidth, tabelaHeight, 5);
            ctx.fill();
            ctx.stroke();
            
            // Istanbul yazısı
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('Istanbul', istanbulX + tabelaWidth / 2, istanbulY + tabelaHeight / 2);
            
            // Tabela direği (Istanbul tabelasının altında)
            ctx.fillStyle = '#8B4513'; // Kahverengi direk
            ctx.fillRect(istanbulX + tabelaWidth / 2 - 3, istanbulY + tabelaHeight, 6, 30);
            
            ctx.restore(); // Canvas state'i geri yükle
        }
        
        // Datça sahnesi arabası güncelleme
        function updateDatcaCar() {
            if (game.sceneState !== 'datca') return;

            const carSpeed = 5; // Arabanın hızı (pixel/frame)

            // Araba ekrandan çıkıyor mu? (karakterler bindikten sonra)
            if (game.datcaCarDrivingAway) {
                game.datcaCarX += carSpeed;

                // Karakterleri arabayla birlikte hareket ettir (ama görünmezler)
                if (game.datcaCharactersInCar) {
                    player.x = game.datcaCarX;
                    hedgehog.x = game.datcaCarX - 50;
                }
                
                // Araba ekrandan çıktı mı kontrol et
                const carScreenX = game.datcaCarX - camera.x;
                if (carScreenX > canvas.width + 100) {
                    // Araba ekrandan çıktı, Datça-Istanbul yolculuk sahnesine geç
                    game.datcaCarDrivingAway = false;
                    game.sceneState = 'datcaIstanbul';
                    initializeDatcaIstanbulScene();
                }

                return;
            }

            // Normal araba hareketi (sahne başlangıcında)
            if (!game.datcaCarMoving) return;
            if (game.datcaCarX === undefined || game.datcaCarTargetX === undefined) return;

            // Araba hedefe ulaşmadıysa hareket et
            if (game.datcaCarX < game.datcaCarTargetX) {
                game.datcaCarX += carSpeed;

                // Karakterleri arabayla birlikte hareket ettir
                if (game.datcaCharactersInCar) {
                    player.x = game.datcaCarX;
                    hedgehog.x = game.datcaCarX - 50;
                }

                // Araba hedefe ulaştı mı?
                if (game.datcaCarX >= game.datcaCarTargetX) {
                    game.datcaCarX = game.datcaCarTargetX;
                    game.datcaCarMoving = false;
                    game.datcaCarArrived = true;

                    // Karakterler arabadan in
                    game.datcaCharactersInCar = false;
                    const datcaGroundOffset = 250;
                    const datcaY = GROUND_LEVEL - datcaGroundOffset;

                    // Karakterleri arabadan indir
                    player.x = game.datcaCarX + 100;
                    player.y = datcaY - player.height;
                    hedgehog.x = game.datcaCarX + 50;
                    hedgehog.y = datcaY - hedgehog.height - 10;

                    // Kirpi otele yürümeye başlasın
                    // Hotel pozisyonunu hesapla (initializeDatcaScene'deki gibi)
                    const datcaXWorld = canvas.width / 2;
                    const houseStartX = datcaXWorld - 400;
                    const houseSpacing = 40;
                    const houseScale = 1.35;

                    // Hotel pozisyonunu hesapla (5. ev)
                    let hotelX = houseStartX;
                    hotelX += 150 * houseScale + houseSpacing; // home1
                    hotelX += 196 * houseScale + houseSpacing; // home2
                    hotelX += 150 * houseScale + houseSpacing; // home1
                    hotelX += 196 * houseScale + houseSpacing; // home2
                    // Hotel sol kenarı = hotelX

                    // Kirpi hotel kapısının önüne gitsin (hotel merkezine)
                    const hotelWidth = 204 * houseScale;
                    hedgehog.targetX = hotelX + hotelWidth / 2;
                    hedgehog.isMoving = true;
                    hedgehog.waitingForPlayer = false;
                    game.datcaHedgehogMovingToHotel = true;
                    game.datcaHedgehogReachedHotel = false;
                }
            }

            // Kamera arabayı takip et
            camera.x = Math.max(0, game.datcaCarX - canvas.width / 2);
        }

                ctx.quadraticCurveTo(carScreenX, carScreenY, carScreenX + radius, carScreenY);
