<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rakun ve Kirpi - Platformer Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        #gameContainer {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #87CEEB 0%, #98D8E8 100%);
        }

        #instructions {
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 14px;
        }

        #instructions span {
            display: inline-block;
            margin: 0 10px;
            padding: 5px 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="instructions">
            <span>W,A,S,D Hareket</span>
            <span>SPACE Zıpla</span>
            <span>E Etkileşim</span>
        </div>
    </div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Load sprites
        const sprites = {
            raccoon: {
                idle: [],
                walk: [],
                jump: [],
                currentFrame: 0,
                frameDelay: 0,
                frameSpeed: 4
            },
            hedgehog: {
                idle: [],
                move: [],
                currentFrame: 0,
                frameDelay: 0,
                frameSpeed: 20,  // Daha yavaş animasyon için artırıldı (8'den 16'ya)
                idleFrameCount: 2,  // idle.png sprite sheet'teki frame sayısı (4'e değiştirildi)
                moveFrameCount: 6   // move.png sprite sheet'teki frame sayısı
            }
        };

        // Load Raccoon idle sprites (11 frames)
        for (let i = 1; i <= 11; i++) {
            const img = new Image();
            const frameNum = String(i * 2 - 1).padStart(4, '0');
            img.src = `raccoon/idle/${frameNum}.png`;
            sprites.raccoon.idle.push(img);
        }

        // Load Raccoon walk sprites (11 frames)
        for (let i = 1; i <= 11; i++) {
            const img = new Image();
            const frameNum = String(i * 2 - 1).padStart(4, '0');
            img.src = `raccoon/walk/walk${frameNum}.png`;
            sprites.raccoon.walk.push(img);
        }

        // Load Raccoon jump sprite (1 frame for simplicity)
        const raccoonJump = new Image();
        raccoonJump.src = 'raccoon/jump/jump0001.png';
        sprites.raccoon.jump.push(raccoonJump);

        // Load Hedgehog idle animation (sprite sheet)
        const hedgehogIdle = new Image();
        hedgehogIdle.src = 'hedgehog/idle/idle.png';
        sprites.hedgehog.idle.push(hedgehogIdle);

        // Load Hedgehog move animation (sprite sheet)
        const hedgehogMove = new Image();
        hedgehogMove.src = 'hedgehog/move/move.png';
        sprites.hedgehog.move.push(hedgehogMove);

        // Animation update
        function updateAnimation(sprite) {
            sprite.frameDelay++;
            if (sprite.frameDelay >= sprite.frameSpeed) {
                sprite.frameDelay = 0;
                sprite.currentFrame++;
                if (sprite.currentFrame >= sprite.idle.length) {
                    sprite.currentFrame = 0;
                }
            }
        }

        // Hedgehog animation update (sprite sheet kullanıyor)
        function updateHedgehogAnimation() {
            sprites.hedgehog.frameDelay++;
            if (sprites.hedgehog.frameDelay >= sprites.hedgehog.frameSpeed) {
                sprites.hedgehog.frameDelay = 0;
                sprites.hedgehog.currentFrame++;
                if (sprites.hedgehog.currentFrame >= sprites.hedgehog.idleFrameCount) {
                    sprites.hedgehog.currentFrame = 0;
                }
            }
        }

        // Input handling
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === 'e' || e.key === 'E') {
                checkInteraction();
            }
        });
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        // Game state
        const game = {
            gravity: 0.6,
            friction: 0.8,
            mapWidth: 5500,  // Çok geniş harita (15 soru için)
            state: 'intro',  // 'intro', 'verification', 'playing', 'finished'
            startButton: null,  // Başlat butonu referansı
            backButton: null    // Ana menü butonu referansı
        };

        // Verification quiz (giriş doğrulama sorusu)
        const verificationQuiz = {
            question: 'Ilk kahvemizi nereden içtik?',
            answers: ['Starbucks', 'Caffè Nero', 'EspressoLab'],
            correctAnswer: 1,  // Index 1 = 'Caffè Nero'
            errorMessage: ''   // Hata mesajı
        };

        // State değiştirme fonksiyonu
        function changeGameState(newState) {
            // Dialogları kapat
            if (dialog.isOpen) {
                closeDialog();
            }

            // State'i değiştir
            game.state = newState;
            
            // Buton referanslarını temizle
            if (newState === 'playing') {
                game.startButton = null;
            } else if (newState === 'intro') {
                game.backButton = null;
            } else if (newState === 'verification') {
                game.startButton = null;
                verificationQuiz.errorMessage = '';  // Hata mesajını temizle
            }

            // HTML instructions div'ini göster/gizle
            const instructionsDiv = document.getElementById('instructions');
            if (instructionsDiv) {
                if (newState === 'intro') {
                    instructionsDiv.style.display = 'block';
                } else {
                    instructionsDiv.style.display = 'none';
                }
            }

            // Canvas'ı hemen temizle (eski içeriği hemen kaldır)
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // NOT: Yeni ekranı ÇİZME - game loop bir sonraki frame'de çizecek
        }

        // Camera system
        const camera = {
            x: 0,
            y: 0
        };

        // Player (Rakun - Kız arkadaş)
        const player = {
            x: 100,
            y: 450,  // Zemin seviyesinde başlat
            width: 100,  // Daha büyük
            height: 100,
            velocityX: 0,
            velocityY: 0,
            speed: 5,
            jumpPower: 13,
            isOnGround: true,  // Başlangıçta zeminde
            animationState: 'idle' // idle, walk, jump
        };

        // NPC Kirpi (Erkek arkadaş - Yardımcı)
        const hedgehog = {
            x: 300,
            y: 510,  // Zemin seviyesi (550 - 40 = 510, collision box alt kenarı zemine değecek)
            width: 80,  // Sprite boyutu (10px arttırıldı)
            height: 40,
            spriteYOffset: 15,  // Sprite'ı aşağı kaydır (yarıya indirildi)
            spriteHeightExtension: 15,  // Sprite yüksekliğini artır (yarıya indirildi)
            type: 'helper'
        };

        // Platforms (genişletilmiş harita - 15 soru için)
        const platforms = [
            // Ground - Çok uzun zemin
            { x: 0, y: 550, width: 5500, height: 50, color: '#228B22' },

            // Bölüm 1 - Başlangıç (Soru 1-3)
            { x: 200, y: 450, width: 200, height: 20, color: '#8B4513' },
            { x: 450, y: 350, width: 150, height: 20, color: '#8B4513' },
            { x: 650, y: 450, width: 140, height: 20, color: '#8B4513' },
            { x: 900, y: 400, width: 180, height: 20, color: '#8B4513' },

            // Bölüm 2 (Soru 4-6)
            { x: 1150, y: 350, width: 150, height: 20, color: '#8B4513' },
            { x: 1350, y: 450, width: 200, height: 20, color: '#8B4513' },
            { x: 1600, y: 380, width: 160, height: 20, color: '#8B4513' },
            { x: 1850, y: 480, width: 180, height: 20, color: '#8B4513' },

            // Bölüm 3 (Soru 7-9)
            { x: 2100, y: 400, width: 150, height: 20, color: '#8B4513' },
            { x: 2350, y: 350, width: 200, height: 20, color: '#8B4513' },
            { x: 2600, y: 450, width: 180, height: 20, color: '#8B4513' },
            { x: 2850, y: 420, width: 200, height: 20, color: '#8B4513' },

            // Bölüm 4 (Soru 10-12)
            { x: 3100, y: 380, width: 180, height: 20, color: '#8B4513' },
            { x: 3350, y: 480, width: 200, height: 20, color: '#8B4513' },
            { x: 3600, y: 360, width: 160, height: 20, color: '#8B4513' },
            { x: 3850, y: 440, width: 180, height: 20, color: '#8B4513' },

            // Bölüm 5 - Final (Soru 13-15)
            { x: 4100, y: 390, width: 200, height: 20, color: '#8B4513' },
            { x: 4350, y: 460, width: 180, height: 20, color: '#8B4513' },
            { x: 4600, y: 380, width: 200, height: 20, color: '#8B4513' },
            { x: 4850, y: 450, width: 180, height: 20, color: '#8B4513' },
            { x: 5100, y: 400, width: 200, height: 20, color: '#8B4513' }
        ];

        // Interactive objects (quiz kutular) - 15 soru - Harita boyunca dağıtılmış
        const interactiveObjects = [
            // Bölüm 1 (Test soruları - gerçek soruları sonra ekleyeceğiz)
            { x: 700, y: 400, width: 40, height: 40, color: '#FFD700', type: 'quiz',
              question: 'Test Soru 1: İlk buluştuğumuz yer?',
              answers: ['Park', 'Kafe', 'Okul'], correctAnswer: 1, isAnswered: false },

            { x: 1000, y: 350, width: 40, height: 40, color: '#FFD700', type: 'quiz',
              question: 'Test Soru 2: En sevdiğim renk?',
              answers: ['Mavi', 'Kırmızı', 'Yeşil'], correctAnswer: 0, isAnswered: false },

            { x: 1200, y: 300, width: 40, height: 40, color: '#FFD700', type: 'quiz',
              question: 'Test Soru 3: İlk öpüşmemiz neredeydi?',
              answers: ['Park', 'Arabada', 'Evde'], correctAnswer: 0, isAnswered: false },

            // Bölüm 2
            { x: 1550, y: 330, width: 40, height: 40, color: '#FFD700', type: 'quiz',
              question: 'Test Soru 4: En sevdiğim yemek?',
              answers: ['Pizza', 'Pasta', 'Burger'], correctAnswer: 1, isAnswered: false },

            { x: 1750, y: 430, width: 40, height: 40, color: '#FFD700', type: 'quiz',
              question: 'Test Soru 5: İlk sinema filmimiz?',
              answers: ['Aksiyon', 'Komedi', 'Romantik'], correctAnswer: 2, isAnswered: false },

            { x: 2000, y: 350, width: 40, height: 40, color: '#FFD700', type: 'quiz',
              question: 'Test Soru 6: Birlikte ilk gittiğimiz şehir?',
              answers: ['İstanbul', 'Ankara', 'İzmir'], correctAnswer: 0, isAnswered: false },

            // Bölüm 3
            { x: 2500, y: 400, width: 40, height: 40, color: '#FFD700', type: 'quiz',
              question: 'Test Soru 7: En çok sevdiğim özelliğin?',
              answers: ['Gülüşün', 'Zekân', 'Nazın'], correctAnswer: 0, isAnswered: false },

            { x: 2750, y: 370, width: 40, height: 40, color: '#FFD700', type: 'quiz',
              question: 'Test Soru 8: İlk yıldönümümüzde ne yaptık?',
              answers: ['Yemek', 'Sinema', 'Gezi'], correctAnswer: 0, isAnswered: false },

            { x: 2950, y: 300, width: 40, height: 40, color: '#FFD700', type: 'quiz',
              question: 'Test Soru 9: En sevdiğim müzik türü?',
              answers: ['Pop', 'Rock', 'Klasik'], correctAnswer: 1, isAnswered: false },

            // Bölüm 4
            { x: 3250, y: 330, width: 40, height: 40, color: '#FFD700', type: 'quiz',
              question: 'Test Soru 10: Sana ilk hediyem?',
              answers: ['Çiçek', 'Kitap', 'Kolye'], correctAnswer: 2, isAnswered: false },

            { x: 3550, y: 310, width: 40, height: 40, color: '#FFD700', type: 'quiz',
              question: 'Test Soru 11: En sevdiğim mevsim?',
              answers: ['İlkbahar', 'Yaz', 'Sonbahar'], correctAnswer: 1, isAnswered: false },

            { x: 3750, y: 390, width: 40, height: 40, color: '#FFD700', type: 'quiz',
              question: 'Test Soru 12: Tatilde en çok nereyi sevdim?',
              answers: ['Deniz', 'Dağ', 'Şehir'], correctAnswer: 0, isAnswered: false },

            // Bölüm 5 - Final
            { x: 4200, y: 340, width: 40, height: 40, color: '#FFD700', type: 'quiz',
              question: 'Test Soru 13: İlk tanıştığımızda saçların nasıldı?',
              answers: ['Kısa', 'Uzun', 'Orta'], correctAnswer: 1, isAnswered: false },

            { x: 4500, y: 330, width: 40, height: 40, color: '#FFD700', type: 'quiz',
              question: 'Test Soru 14: En sevdiğim hayvan?',
              answers: ['Kedi', 'Köpek', 'Kuş'], correctAnswer: 0, isAnswered: false },

            { x: 4950, y: 400, width: 40, height: 40, color: '#FFD700', type: 'quiz',
              question: 'Test Soru 15: Seni en çok ne mutlu eder?',
              answers: ['Hediyeler', 'Vakit geçirmek', 'Sürprizler'], correctAnswer: 1, isAnswered: false }
        ];

        // Dialog system
        let dialog = {
            isOpen: false,
            text: '',
            answers: [],
            currentObject: null,
            isHedgehogDialog: false // Kirpi konuşması mı?
        };

        // Game progress
        function getProgress() {
            const answered = interactiveObjects.filter(obj => obj.isAnswered).length;
            const total = interactiveObjects.length;
            return { answered, total };
        }

        // Check if player is near an interactive object
        function checkInteraction() {
            if (dialog.isOpen) {
                return;
            }

            // Check Kirpi (hedgehog) interaction - merkez noktalarını kullan
            const playerCenterX = player.x + player.width / 2;
            const playerCenterY = player.y + player.height / 2;
            const hedgehogCenterX = hedgehog.x + hedgehog.width / 2;
            const hedgehogCenterY = hedgehog.y + hedgehog.height / 2;

            const distanceX = Math.abs(playerCenterX - hedgehogCenterX);
            const distanceY = Math.abs(playerCenterY - hedgehogCenterY);

            if (distanceX < 80 && distanceY < 80) {
                openHedgehogDialog();
                return;
            }

            // Check quiz objects
            for (let obj of interactiveObjects) {
                if (!obj.isAnswered &&
                    Math.abs(player.x - obj.x) < 60 &&
                    Math.abs(player.y - obj.y) < 60) {
                    openDialog(obj);
                    break;
                }
            }
        }

        // Open hedgehog dialog (helper messages)
        function openHedgehogDialog() {
            dialog.isOpen = true;
            dialog.isHedgehogDialog = true;
            dialog.text = 'Merhaba canım! 🦔 Altın rengi kutulara yaklaş ve E tuşuna bas. Sana özel sorular hazırladım!';
            dialog.answers = ['Teşekkürler! 💕'];
            dialog.currentObject = null;
        }

        // Open dialog
        function openDialog(obj) {
            dialog.isOpen = true;
            dialog.isHedgehogDialog = false;
            dialog.text = obj.question;
            dialog.answers = obj.answers;
            dialog.currentObject = obj;
        }

        // Close dialog
        function closeDialog() {
            dialog.isOpen = false;
            dialog.isHedgehogDialog = false;
            dialog.text = '';
            dialog.answers = [];
            dialog.currentObject = null;
        }

        // Handle answer click
        function handleAnswer(answerIndex) {
            // Kirpi diyaloğu ise sadece kapat
            if (dialog.isHedgehogDialog) {
                closeDialog();
                return;
            }

            // Quiz sorusu ise cevap kontrol et
            if (!dialog.currentObject) return;

            if (answerIndex === dialog.currentObject.correctAnswer) {
                dialog.currentObject.isAnswered = true;
                dialog.currentObject.color = '#00FF00'; // Green for correct
                alert('Doğru cevap! 💚');
            } else {
                alert('Tekrar dene! 💛');
            }
            closeDialog();
        }

        // Add mouse click for answers and start button
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Check start button (intro screen)
            if (game.state === 'intro' && game.startButton) {
                const btn = game.startButton;
                if (mouseX > btn.x && mouseX < btn.x + btn.width &&
                    mouseY > btn.y && mouseY < btn.y + btn.height) {
                    changeGameState('verification');  // Önce doğrulama sorusu
                    return;
                }
            }

            // Check verification quiz answers
            if (game.state === 'verification') {
                const answerBoxY = 350;
                const answerHeight = 50;
                const answerSpacing = 60;

                verificationQuiz.answers.forEach((answer, index) => {
                    const y = answerBoxY + index * answerSpacing;
                    if (mouseX > 250 && mouseX < 550 && mouseY > y && mouseY < y + answerHeight) {
                        if (index === verificationQuiz.correctAnswer) {
                            // Doğru cevap - oyuna geç
                            verificationQuiz.errorMessage = '';
                            changeGameState('playing');
                        } else {
                            // Yanlış cevap - hata mesajını göster
                            verificationQuiz.errorMessage = 'Püh senin kalıbına!!';
                        }
                    }
                });
                return;
            }

            // Check back button (playing screen) - Ana menü butonu
            if (game.state === 'playing' && game.backButton) {
                const btn = game.backButton;
                // Daire şeklinde buton için merkez noktası ve yarıçap kontrolü
                const centerX = btn.x + btn.width / 2;
                const centerY = btn.y + btn.height / 2;
                const radius = btn.width / 2;
                const distance = Math.sqrt(Math.pow(mouseX - centerX, 2) + Math.pow(mouseY - centerY, 2));

                if (distance <= radius) {
                    changeGameState('intro');
                    return;
                }
            }

            // Check dialog answers
            if (!dialog.isOpen) return;

            // Check if clicked on an answer
            const answerBoxY = 300;
            const answerHeight = 40;
            const answerSpacing = 50;

            dialog.answers.forEach((answer, index) => {
                const y = answerBoxY + index * answerSpacing;
                if (mouseX > 200 && mouseX < 600 && mouseY > y && mouseY < y + answerHeight) {
                    handleAnswer(index);
                }
            });
        });

        // Update player
        function updatePlayer() {
            // Horizontal movement
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                player.velocityX = -player.speed;
            } else if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                player.velocityX = player.speed;
            } else {
                player.velocityX *= game.friction;
            }

            // Jumping
            if ((keys[' '] || keys['ArrowUp'] || keys['w'] || keys['W']) && player.isOnGround) {
                player.velocityY = -player.jumpPower;
                player.isOnGround = false;
            }

            // Apply gravity
            player.velocityY += game.gravity;

            // Update position
            player.x += player.velocityX;
            player.y += player.velocityY;

            // Keep player in bounds (harita sınırları içinde)
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > game.mapWidth) player.x = game.mapWidth - player.width;

            // Platform collision
            player.isOnGround = false;
            platforms.forEach(platform => {
                if (player.x + player.width > platform.x &&
                    player.x < platform.x + platform.width &&
                    player.y + player.height > platform.y &&
                    player.y + player.height < platform.y + platform.height + 10 &&
                    player.velocityY >= 0) {

                    player.y = platform.y - player.height;
                    player.velocityY = 0;
                    player.isOnGround = true;
                }
            });
        }

        // Update camera (kamera oyuncuyu takip eder)
        function updateCamera() {
            // Kamera oyuncunun etrafında ortalanır
            camera.x = player.x - canvas.width / 2 + player.width / 2;

            // Kamera sınırları (harita dışına çıkmasın)
            if (camera.x < 0) camera.x = 0;
            if (camera.x > game.mapWidth - canvas.width) {
                camera.x = game.mapWidth - canvas.width;
            }

            // Y ekseninde kamera sabit (istersek yukarı-aşağı da takip edebilir)
            camera.y = 0;
        }

        // Draw player (Sprite-based Raccoon) - Kamera offset ile
        function drawPlayer() {
            const screenX = player.x - camera.x;
            const screenY = player.y - camera.y;

            // Determine which animation to use
            let currentAnim = sprites.raccoon.idle;
            if (!player.isOnGround) {
                currentAnim = sprites.raccoon.jump;
            } else if (Math.abs(player.velocityX) > 0.5) {
                currentAnim = sprites.raccoon.walk;
            }

            // Get current frame
            const frame = currentAnim[sprites.raccoon.currentFrame % currentAnim.length];

            // Sprite offset - Ayakların zemine değmesi için sprite'ı aşağı kaydır
            const spriteYOffset = 30; // Sprite'ı 30 piksel aşağı çiz
            const spriteHeightExtension = 30; // Sprite yüksekliğini artır

            // Draw sprite if loaded
            if (frame && frame.complete) {
                // Sprite'ı aşağı kaydırarak çiz (collision box aynı yerde kalır)
                ctx.drawImage(
                    frame,
                    screenX,
                    screenY + spriteYOffset,
                    player.width,
                    player.height + spriteHeightExtension
                );
            } else {
                // Fallback rectangle while loading
                ctx.fillStyle = '#D2691E';
                ctx.fillRect(screenX, screenY, player.width, player.height);
            }

            // Debug: Collision box'ı göster (test için)
            // ctx.strokeStyle = 'red';
            // ctx.strokeRect(screenX, screenY, player.width, player.height);
        }

        // Draw hedgehog (Sprite-based) - Kamera offset ile
        function drawHedgehog() {
            const screenX = hedgehog.x - camera.x;
            const screenY = hedgehog.y - camera.y;

            // Idle sprite sheet kullan
            const spriteSheet = sprites.hedgehog.idle[0];
            if (spriteSheet && spriteSheet.complete) {
                // Sprite sheet'teki bir frame boyutu (yatay dizilmiş)
                const frameCount = sprites.hedgehog.idleFrameCount;
                const frameWidth = spriteSheet.width / frameCount;
                const frameHeight = spriteSheet.height;
                const currentFrame = Math.floor(sprites.hedgehog.currentFrame) % frameCount;

                // Sprite'ın aspect ratio'sunu koru ve collision box içine sığdır
                const spriteAspectRatio = frameWidth / frameHeight;
                const maxWidth = hedgehog.width;
                const maxHeight = hedgehog.height + hedgehog.spriteHeightExtension;
                
                // Sprite'ı collision box'a sığdır (aspect ratio korunarak)
                let drawWidth = maxWidth;
                let drawHeight = drawWidth / spriteAspectRatio;
                
                if (drawHeight > maxHeight) {
                    drawHeight = maxHeight;
                    drawWidth = drawHeight * spriteAspectRatio;
                }

                // Sprite'ı collision box'ın merkezine hizala (taşma olmasın)
                const drawX = screenX + (hedgehog.width - drawWidth) / 2;
                const drawY = screenY + hedgehog.spriteYOffset + (maxHeight - drawHeight) / 2;

                // Frame'i sprite sheet'ten çıkar ve çiz (collision box içinde, taşma olmadan)
                ctx.drawImage(
                    spriteSheet,
                    currentFrame * frameWidth, 0,  // Source x, y
                    frameWidth, frameHeight,        // Source width, height
                    drawX,                          // Dest x (merkeze hizalı)
                    drawY,                          // Dest y (merkeze hizalı)
                    drawWidth,                      // Dest width (collision box içinde)
                    drawHeight                      // Dest height (collision box içinde)
                );
            } else {
                // Fallback - sprite yüklenene kadar dikdörtgen
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(screenX, screenY, hedgehog.width, hedgehog.height);
            }

            // Debug: Collision box'ı göster (test için)
            // ctx.strokeStyle = 'blue';
            // ctx.strokeRect(screenX, screenY, hedgehog.width, hedgehog.height);

            // Show "E" prompt if player is near - merkez bazlı kontrol
            const playerCenterX = player.x + player.width / 2;
            const playerCenterY = player.y + player.height / 2;
            const hedgehogCenterX = hedgehog.x + hedgehog.width / 2;
            const hedgehogCenterY = hedgehog.y + hedgehog.height / 2;

            const distanceX = Math.abs(playerCenterX - hedgehogCenterX);
            const distanceY = Math.abs(playerCenterY - hedgehogCenterY);

            if (distanceX < 80 && distanceY < 80) {
                ctx.fillStyle = 'white';
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 3;
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.strokeText('E', screenX + hedgehog.width/2, screenY - 10);
                ctx.fillText('E', screenX + hedgehog.width/2, screenY - 10);
            }
        }

        // Draw platforms - Kamera offset ile
        function drawPlatforms() {
            platforms.forEach(platform => {
                const screenX = platform.x - camera.x;
                const screenY = platform.y - camera.y;

                ctx.fillStyle = platform.color;
                ctx.fillRect(screenX, screenY, platform.width, platform.height);

                // Add some grass texture to ground (zeminin üstünde görünmeli)
                if (platform.y === 550) {
                    ctx.fillStyle = '#32CD32';
                    for (let i = 0; i < platform.width; i += 20) {
                        ctx.fillRect(screenX + i, screenY - 5, 2, 5);
                        ctx.fillRect(screenX + i + 5, screenY - 5, 2, 5);
                        ctx.fillRect(screenX + i + 10, screenY - 5, 2, 5);
                    }
                }
            });
        }

        // Draw interactive objects - Kamera offset ile
        function drawInteractiveObjects() {
            interactiveObjects.forEach(obj => {
                const screenX = obj.x - camera.x;
                const screenY = obj.y - camera.y;

                // Object
                ctx.fillStyle = obj.color;
                ctx.fillRect(screenX, screenY, obj.width, obj.height);

                // Border
                ctx.strokeStyle = obj.isAnswered ? '#00AA00' : '#FFA500';
                ctx.lineWidth = 3;
                ctx.strokeRect(screenX, screenY, obj.width, obj.height);

                // Show "E" prompt if player is near
                if (!obj.isAnswered &&
                    Math.abs(player.x - obj.x) < 60 &&
                    Math.abs(player.y - obj.y) < 60) {

                    ctx.fillStyle = 'white';
                    ctx.strokeStyle = 'black';
                    ctx.lineWidth = 3;
                    ctx.font = 'bold 20px Arial';
                    ctx.strokeText('E', screenX + 12, screenY - 10);
                    ctx.fillText('E', screenX + 12, screenY - 10);
                }
            });
        }

        // Draw dialog
        function drawDialog() {
            if (!dialog.isOpen) return;

            // Darken background
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dialog box
            ctx.fillStyle = 'white';
            ctx.roundRect(150, 200, 500, 300, 10);
            ctx.fill();

            // Question
            ctx.fillStyle = 'black';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(dialog.text, 400, 250);

            // Answers
            ctx.textAlign = 'left';
            ctx.font = '16px Arial';
            dialog.answers.forEach((answer, index) => {
                const y = 300 + index * 50;

                // Answer box
                ctx.fillStyle = '#f0f0f0';
                ctx.fillRect(200, y, 400, 40);

                // Answer border
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.strokeRect(200, y, 400, 40);

                // Answer text
                ctx.fillStyle = 'black';
                ctx.fillText(`${index + 1}. ${answer}`, 220, y + 25);
            });

            ctx.textAlign = 'left';
        }

        // Draw HUD (Ana menü butonu - kamera ile hareket etmez)
        function drawHUD() {
            // Sadece playing state'inde HUD çiz
            if (game.state !== 'playing') {
                return;
            }

            // Ana menü butonu (sağ üst köşe) - kamera offset'siz, sabit pozisyon
            const buttonX = canvas.width - 60;
            const buttonY = 10;
            const buttonSize = 50;

            // Button background (daire)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.beginPath();
            ctx.arc(buttonX + buttonSize/2, buttonY + buttonSize/2, buttonSize/2, 0, Math.PI * 2);
            ctx.fill();

            // Button border (altın renk)
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(buttonX + buttonSize/2, buttonY + buttonSize/2, buttonSize/2, 0, Math.PI * 2);
            ctx.stroke();

            // Ev ikonu
            ctx.fillStyle = 'white';
            ctx.font = '28px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🏠', buttonX + buttonSize/2, buttonY + buttonSize/2);

            // Buton pozisyonunu kaydet (tıklama kontrolü için)
            game.backButton = { x: buttonX, y: buttonY, width: buttonSize, height: buttonSize };

            // Reset text alignment
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
        }

        // Create spotlight clip regions (sadece ışık bölgelerinde çizim yapılsın)
        function createSpotlightClip() {
            const lightTopY = 0;
            const topWidth = 40;
            const bottomWidth = 140;

            // Rakun spotlight bölgesi
            const raccoonScreenX = player.x - camera.x + player.width / 2;
            const raccoonScreenY = player.y - camera.y + player.height / 2;
            const raccoonBottomY = raccoonScreenY + 100;

            ctx.beginPath();
            ctx.moveTo(raccoonScreenX - topWidth/2, lightTopY);
            ctx.lineTo(raccoonScreenX + topWidth/2, lightTopY);
            ctx.lineTo(raccoonScreenX + bottomWidth/2, raccoonBottomY);
            ctx.lineTo(raccoonScreenX - bottomWidth/2, raccoonBottomY);
            ctx.closePath();

            // Kirpi spotlight bölgesi
            const hedgehogScreenX = hedgehog.x - camera.x + hedgehog.width / 2;
            const hedgehogScreenY = hedgehog.y - camera.y + hedgehog.height / 2;
            const hedgehogBottomY = hedgehogScreenY + 100;

            ctx.moveTo(hedgehogScreenX - topWidth/2, lightTopY);
            ctx.lineTo(hedgehogScreenX + topWidth/2, lightTopY);
            ctx.lineTo(hedgehogScreenX + bottomWidth/2, hedgehogBottomY);
            ctx.lineTo(hedgehogScreenX - bottomWidth/2, hedgehogBottomY);
            ctx.closePath();

            // Clip uygula
            ctx.clip();
        }

        // Draw spotlight beams (ışık hüzmelerini çiz)
        function drawSpotlightBeams() {
            const lightTopY = 0;
            const topWidth = 40;
            const bottomWidth = 140;

            // Rakun için ışık hüzmesi
            const raccoonScreenX = player.x - camera.x + player.width / 2;
            const raccoonScreenY = player.y - camera.y + player.height / 2;
            const raccoonBottomY = raccoonScreenY + 100;

            const raccoonGradient = ctx.createLinearGradient(
                raccoonScreenX, lightTopY,
                raccoonScreenX, raccoonBottomY
            );
            raccoonGradient.addColorStop(0, 'rgba(200, 220, 255, 0.15)');
            raccoonGradient.addColorStop(0.5, 'rgba(200, 220, 255, 0.2)');
            raccoonGradient.addColorStop(1, 'rgba(200, 220, 255, 0.25)');

            ctx.fillStyle = raccoonGradient;
            ctx.beginPath();
            ctx.moveTo(raccoonScreenX - topWidth/2, lightTopY);
            ctx.lineTo(raccoonScreenX + topWidth/2, lightTopY);
            ctx.lineTo(raccoonScreenX + bottomWidth/2, raccoonBottomY);
            ctx.lineTo(raccoonScreenX - bottomWidth/2, raccoonBottomY);
            ctx.closePath();
            ctx.fill();

            // Kirpi için ışık hüzmesi
            const hedgehogScreenX = hedgehog.x - camera.x + hedgehog.width / 2;
            const hedgehogScreenY = hedgehog.y - camera.y + hedgehog.height / 2;
            const hedgehogBottomY = hedgehogScreenY + 100;

            const hedgehogGradient = ctx.createLinearGradient(
                hedgehogScreenX, lightTopY,
                hedgehogScreenX, hedgehogBottomY
            );
            hedgehogGradient.addColorStop(0, 'rgba(200, 220, 255, 0.15)');
            hedgehogGradient.addColorStop(0.5, 'rgba(200, 220, 255, 0.2)');
            hedgehogGradient.addColorStop(1, 'rgba(200, 220, 255, 0.25)');

            ctx.fillStyle = hedgehogGradient;
            ctx.beginPath();
            ctx.moveTo(hedgehogScreenX - topWidth/2, lightTopY);
            ctx.lineTo(hedgehogScreenX + topWidth/2, lightTopY);
            ctx.lineTo(hedgehogScreenX + bottomWidth/2, hedgehogBottomY);
            ctx.lineTo(hedgehogScreenX - bottomWidth/2, hedgehogBottomY);
            ctx.closePath();
            ctx.fill();
        }

        // Draw intro screen
        function drawIntroScreen() {
            // Sadece intro state'inde intro ekranını çiz
            if (game.state !== 'intro') {
                return;
            }

            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0bd6a6');
            gradient.addColorStop(1, '#052b22');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Title
            ctx.fillStyle = 'white';
            ctx.strokeStyle = '#14100e';
            ctx.lineWidth = 4;
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.strokeText('Fakat Rakun, bu derin bi Tutku!', canvas.width/2, 100);
            ctx.fillText('Fakat Rakun, bu derin bi Tutku!', canvas.width/2, 100);

            // Characters
            ctx.font = '80px Arial';
            ctx.fillText('🦝', canvas.width/2 - 80, 200);
            ctx.fillText('🦔', canvas.width/2 + 80, 200);

            // Description - çok satırlı
            ctx.font = '16px Arial';
            ctx.fillStyle = 'white';
            const lineHeight = 22;
            let startY = 320;

            ctx.fillText("Kirpi uzun zaman karanlıkta yürüdü. Hayat yorucuydu, her gün ağırdı,", canvas.width/2, startY);
            ctx.fillText("kimse yoktu yanında. Sonra Rakun geldi...Ve her şey değişti.", canvas.width/2, startY + lineHeight);
            ctx.fillText("Rakun, Kirpi'ye dünyayı yeniden sevmeyi öğretti.", canvas.width/2, startY + lineHeight * 2);
            ctx.fillText("Şimdi birlikte yaşadıkları maceraların, güldükleri anların ve", canvas.width/2, startY + lineHeight * 3);
            ctx.fillText("birbirlerine verdikleri mutluluğun hikayesini keşfet!", canvas.width/2, startY + lineHeight * 4);

            ctx.font = '14px Arial';
            ctx.fillText('Yolculukta sorulara doğru cevap vererek ilerle.', canvas.width/2, startY + lineHeight * 5 + 10);

            // Start button - SADECE intro state'inde çiz ve kaydet
            if (game.state === 'intro') {
                const buttonX = canvas.width/2 - 100;
                const buttonY = 460;
                const buttonWidth = 200;
                const buttonHeight = 50;

                // Button background
                ctx.fillStyle = '#401507';
                ctx.roundRect(buttonX, buttonY, buttonWidth, buttonHeight, 10);
                ctx.fill();

                // Button border (glow effect)
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 3;
                ctx.roundRect(buttonX, buttonY, buttonWidth, buttonHeight, 10);
                ctx.stroke();

                // Button text
                ctx.fillStyle = 'white';
                ctx.font = 'bold 24px Arial';
                ctx.fillText('BAŞLAT', canvas.width/2, buttonY + 33);

                // Store button position for click detection
                game.startButton = { x: buttonX, y: buttonY, width: buttonWidth, height: buttonHeight };
            } else {
                // Intro state'inde değilse start butonunu temizle
                game.startButton = null;
            }
        }

        // Draw verification screen (doğrulama quiz ekranı)
        function drawVerificationScreen() {
            if (game.state !== 'verification') {
                return;
            }

            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0bd6a6');
            gradient.addColorStop(1, '#052b22');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Title
            ctx.fillStyle = 'white';
            ctx.strokeStyle = '#14100e';
            ctx.lineWidth = 3;
            ctx.font = 'bold 22px Arial';
            ctx.textAlign = 'center';
            ctx.strokeText('Öyle bedava oyun oynamak yok. Sen de biraz efor göster..', canvas.width/2, 150);
            ctx.fillText('Öyle bedava oyun oynamak yok. Sen de biraz efor göster..', canvas.width/2, 150);

            // Question
            ctx.font = 'bold 48px Arial';
            ctx.fillStyle = 'white';
            ctx.fillText(verificationQuiz.question, canvas.width/2, 250);

            // Answer options
            const answerBoxY = 350;
            const answerHeight = 50;
            const answerSpacing = 60;

            verificationQuiz.answers.forEach((answer, index) => {
                const y = answerBoxY + index * answerSpacing;

                // Answer box background
                ctx.fillStyle = '#401507';
                ctx.beginPath();
                ctx.roundRect(250, y, 300, answerHeight, 10);
                ctx.fill();

                // Answer border
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.roundRect(250, y, 300, answerHeight, 10);
                ctx.stroke();

                // Answer text
                ctx.fillStyle = 'white';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(answer, canvas.width/2, y + answerHeight/2);
            });

            // Reset text alignment
            ctx.textAlign = 'center';
            ctx.textBaseline = 'alphabetic';

            // Error message (yanlış cevap uyarısı)
            if (verificationQuiz.errorMessage) {
                ctx.fillStyle = '#FF0000';
                ctx.strokeStyle = '#8B0000';
                ctx.lineWidth = 2;
                ctx.font = 'bold 28px Arial';
                ctx.strokeText(verificationQuiz.errorMessage, canvas.width/2, 560);
                ctx.fillText(verificationQuiz.errorMessage, canvas.width/2, 560);
            }

            // Reset text alignment
            ctx.textAlign = 'left';
        }

        // Helper for rounded rectangles
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
            };
        }

        // Game loop
        function gameLoop() {
            // Canvas'ı TAMAMEN temizle
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (game.state === 'intro') {
                // Intro screen - SADECE intro state'inde
                drawIntroScreen();
            } else if (game.state === 'verification') {
                // Verification screen - doğrulama sorusu
                drawVerificationScreen();
            } else if (game.state === 'playing') {
                // Playing screen - SADECE playing state'inde

                // Update
                if (!dialog.isOpen) {
                    updatePlayer();
                }
                updateCamera();  // Kamerayı her zaman güncelle
                updateAnimation(sprites.raccoon);  // Rakun animasyonu güncelle
                updateHedgehogAnimation();  // Kirpi animasyonu güncelle

                // Draw - Tamamen siyah arka plan
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Spotlight clip bölgelerini ayarla ve içine çiz
                ctx.save();
                createSpotlightClip();

                // Clip bölgesi içinde: Işık hüzmeleri ve karakterleri çiz
                drawSpotlightBeams();
                drawHedgehog();
                drawPlayer();

                ctx.restore();

                drawHUD();       // HUD en üstte (kamera ile hareket etmez)
                drawDialog();    // Dialog en üstte olmalı
            }

            // Continue loop
            requestAnimationFrame(gameLoop);
        }

        // Start game
        gameLoop();
    </script>
</body>
