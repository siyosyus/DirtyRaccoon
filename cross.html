<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>DirtyRaccoon - Mobile</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        #stage {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #gameWrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #gameFrame {
            width: 800px;
            height: 600px;
            border: 0;
            background: #000;
            transform-origin: center center;
            display: block;
        }
        #errorMessage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            max-width: 90%;
            z-index: 100;
            display: none;
        }
        #errorMessage.show {
            display: block;
        }
        #errorMessage a {
            color: #4CAF50;
            text-decoration: underline;
            display: block;
            margin-top: 15px;
            font-size: 18px;
        }
        #controls {
            position: relative;
            height: 28vh;
            max-height: 220px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 10px 14px 16px;
            box-sizing: border-box;
            background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 25%, rgba(0,0,0,0.75) 100%);
            z-index: 10;
        }
        #gameWrapper {
            z-index: 1;
        }
        .pad {
            display: grid;
            place-items: center;
            gap: 10px;
        }
        .row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }
        button.ctrl {
            width: 84px;
            height: 84px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font: 600 16px system-ui, -apple-system, Segoe UI, Roboto, Arial;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            touch-action: none;
        }
        button.ctrl:active { background: rgba(255,255,255,0.2); }
        .wide { width: 120px; }
        .tall { height: 120px; }
        .hint {
            position: absolute;
            top: -26px;
            right: 16px;
            color: rgba(255,255,255,0.7);
            font: 500 12px system-ui, -apple-system, Segoe UI, Roboto, Arial;
            z-index: 20;
            pointer-events: none;
        }
        @media (min-width: 800px) and (min-height: 480px) {
            button.ctrl { width: 92px; height: 92px; }
            .wide { width: 140px; }
            .tall { height: 140px; }
        }
    </style>
</head>
<body>
    <div id="stage">
        <div id="gameWrapper">
            <iframe id="gameFrame" src="index.html" allow="gamepad *"></iframe>
            <div id="errorMessage">
                <p>Oyun yüklenemedi.</p>
                <p>Lütfen dosyayı tarayıcıda açın veya web sunucusundan çalıştırın.</p>
                <a href="index.html" target="_top">Oyunu Doğrudan Aç</a>
            </div>
        </div>
        <div id="controls">
            <div class="pad" aria-label="movement pad">
                <div class="row">
                    <button class="ctrl wide" data-key="ArrowLeft" aria-label="sol">←</button>
                    <button class="ctrl wide" data-key="ArrowRight" aria-label="sağ">→</button>
                </div>
            </div>
            <div class="pad" aria-label="actions pad">
                <div class="row">
                    <button class="ctrl tall" data-key=" " aria-label="zıpla">⤴</button>
                    <button class="ctrl tall" data-key="e" aria-label="etkileşim">E</button>
                </div>
            </div>
            <div class="hint">Dokunmatik Kontroller</div>
        </div>
    </div>

    <script>
    (function () {
        // Prevent scrolling/zooming gestures
        const prevent = (e) => { e.preventDefault(); };
        ['touchstart','touchmove','touchend','gesturestart','gesturechange','gestureend'].forEach(evt => {
            document.addEventListener(evt, prevent, { passive: false });
        });

        const frame = document.getElementById('gameFrame');
        function sendKey(key, type) {
            const w = frame.contentWindow;
            if (!w) return;
            try {
                const event = new KeyboardEvent(type, {
                    key: key,
                    code: key.length === 1 ? key.toUpperCase() : key,
                    bubbles: true,
                    cancelable: true
                });
                w.dispatchEvent(event);
                // Try also to send to document focus target inside iframe
                if (w.document && w.document.activeElement) {
                    w.document.activeElement.dispatchEvent(event);
                }
            } catch (_) {
                // noop
            }
        }

        function bindButton(btn) {
            const key = btn.getAttribute('data-key');
            let pressed = false;

            const press = (e) => {
                pressed = true;
                sendKey(key, 'keydown');
            };
            const release = (e) => {
                if (!pressed) return;
                pressed = false;
                sendKey(key, 'keyup');
            };

            btn.addEventListener('touchstart', press, { passive: false });
            btn.addEventListener('touchend', release, { passive: false });
            btn.addEventListener('touchcancel', release, { passive: false });
            btn.addEventListener('mousedown', press);
            btn.addEventListener('mouseup', release);
            btn.addEventListener('mouseleave', release);
        }

        document.querySelectorAll('button.ctrl').forEach(bindButton);

        // Scale iframe to fit viewport
        const fit = () => {
            const el = document.getElementById('gameFrame');
            const wrapper = document.getElementById('gameWrapper');
            if (!el || !wrapper) return;
            
            const gameWidth = 800;
            const gameHeight = 600;
            const controlsHeight = Math.min(window.innerHeight * 0.28, 220);
            const availableHeight = window.innerHeight - controlsHeight;
            const availableWidth = wrapper.clientWidth || window.innerWidth;
            
            // Calculate scale to fit both width and height
            const scaleX = availableWidth / gameWidth;
            const scaleY = availableHeight / gameHeight;
            const scale = Math.min(scaleX, scaleY, 1); // Don't scale up, only down
            
            el.style.transform = `scale(${scale})`;
            el.style.width = gameWidth + 'px';
            el.style.height = gameHeight + 'px';
        };
        window.addEventListener('resize', fit);
        window.addEventListener('orientationchange', () => {
            setTimeout(fit, 100); // Wait for orientation change to complete
        });
        
        // Check if iframe loaded successfully
        const errorMsg = document.getElementById('errorMessage');
        let loadTimeout;
        let errorDetected = false;
        
        const checkLoad = () => {
            try {
                const iframeWindow = frame.contentWindow;
                if (iframeWindow && iframeWindow.document && iframeWindow.document.readyState === 'complete') {
                    clearTimeout(loadTimeout);
                    errorMsg.classList.remove('show');
                    iframeWindow.focus();
                    setTimeout(fit, 50);
                }
            } catch (e) {
                // Cross-origin or access denied
                if (!errorDetected) {
                    errorDetected = true;
                    setTimeout(() => {
                        // Check if iframe actually has content
                        try {
                            const hasContent = frame.contentWindow.document.body.children.length > 0;
                            if (!hasContent) {
                                errorMsg.classList.add('show');
                            }
                        } catch {
                            // Can't access - might be cross-origin, assume it loaded
                            // Don't show error for cross-origin cases
                        }
                    }, 2000);
                }
            }
        };
        
        frame.addEventListener('load', () => {
            setTimeout(checkLoad, 100);
        });
        
        // Timeout fallback - if not loaded in 5 seconds, show error
        loadTimeout = setTimeout(() => {
            try {
                const iframeWindow = frame.contentWindow;
                const hasContent = iframeWindow && iframeWindow.document && iframeWindow.document.body && iframeWindow.document.body.innerHTML.trim().length > 100;
                if (!hasContent) {
                    errorMsg.classList.add('show');
                }
            } catch (e) {
                // Can't check - might be okay (cross-origin), don't show error
                console.log('Cannot verify iframe load status (may be cross-origin)');
            }
        }, 5000);
        
        // Initial fit after DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', fit);
        } else {
            fit();
        }
    })();
    </script>
</body>
</html>
